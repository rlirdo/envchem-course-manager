  /* ---------- 教室日誌 ---------- */
  gotoLogWeek: function (v) { VIEWS.logWeek = parseInt(v, 10) || 1; ROUTER.render(); },
  // 五態循環：出席 → 遲到≤20 → 遲到>20 → 缺席 → 請假 → 出席
  cycle: function (sid) {
    var L = STORE.logOf(VIEWS.logWeek);
    var cur = L.att[sid];
    var idx = CONFIG.ATT_CYCLE.indexOf(cur);
    var next = (idx < 0) ? CONFIG.ATT_CYCLE[0] : CONFIG.ATT_CYCLE[(idx + 1) % CONFIG.ATT_CYCLE.length];
    L.att[sid] = next;
    if (next !== 'leave') delete L.leaveKind[sid];    // 離開請假狀態時一併清掉假別註記
    L.init = true;
    STORE.save(true);
    ROUTER.render();
  },
  setLeaveKind: function (sid, v) {
    var L = STORE.logOf(VIEWS.logWeek);
    if (v) L.leaveKind[sid] = v; else delete L.leaveKind[sid];
    STORE.save(true);
  },
  allPresent: function () {
    var L = STORE.logOf(VIEWS.logWeek);
    STORE.d.students.forEach(function (s) { L.att[s.id] = 'present'; });
    L.init = true;
    STORE.save(); ROUTER.render();
  },
  clearWeek: function () {
    if (!confirm('確定清除第 ' + VIEWS.logWeek + ' 週的點名紀錄？清除後全部回到「未點名」狀態。')) return;
    var L = STORE.logOf(VIEWS.logWeek);
    L.att = {}; L.init = true;      // 保持 init=true，避免重新進入時又自動全到
    STORE.save(); ROUTER.render();
  },
  setRecord: function (key, val) {
    STORE.logOf(VIEWS.logWeek).record[key] = val;
    STORE.save(true);
  },
  // 列印課程紀錄（參）：有照片的週把縮圖與圖說一併印出（需先自 IndexedDB 取回）
  printRecords: function () {
    var rows = [], keys = [];
    STORE.d.plan.forEach(function (r) {
      var L = STORE.d.log[String(r.week)];
      if (!L || !L.record) return;
      var rec = L.record, ph = L.photos || [];
      if (!(rec.text || rec.photo || rec.caption || ph.length)) return;
      ph.forEach(function (p) { keys.push(p.k); });
      rows.push({ week: r.week, date: r.date, topic: r.topic, rec: rec, photos: ph });
    });
    if (!rows.length) { alert('目前沒有任何已填寫的課程紀錄。'); return; }
    var draw = function (map) {
      var body = '<h1>參　課程紀錄</h1><div class="meta">' +
        U.esc(STORE.d.course.courseName + '（' + STORE.d.course.courseCode + '）　' + STORE.d.course.term) + '</div>' +
        '<table><thead><tr><th style="width:7%">週次</th><th style="width:13%">日期</th><th style="width:22%">主題</th>' +
        '<th>課程紀錄</th><th style="width:22%">照片檔名／圖說</th></tr></thead><tbody>' +
        rows.map(function (x) {
          return '<tr><td class="c">' + x.week + '</td><td class="c">' + U.esc(x.date) + '</td><td>' + U.esc(x.topic) +
            '</td><td>' + U.esc(x.rec.text).replace(/\n/g, '<br>') + '</td><td>' +
            U.esc(x.rec.photo) + (x.rec.caption ? '<br>' + U.esc(x.rec.caption) : '') +
            (x.photos.length ? '<br>照片 ' + x.photos.length + ' 張（見後）' : '') + '</td></tr>';
        }).join('') + '</tbody></table>';
      var withPh = rows.filter(function (x) { return x.photos.length; });
      if (withPh.length) {
        body += '<h2>課程紀錄照片</h2>' + withPh.map(function (x) {
          return '<div class="nb" style="margin-bottom:6mm">' +
            '<div style="font-size:11pt;font-weight:700">第 ' + x.week + ' 週　' + U.esc(x.date) + '　' + U.esc(x.topic) + '</div>' +
            '<div style="display:flex;flex-wrap:wrap;gap:3mm;margin-top:2mm">' +
            x.photos.map(function (p, i) {
              var url = map[p.k] || '';
              return '<div style="width:47%;break-inside:avoid">' +
                (url ? '<img src="' + url + '" style="width:100%;border:1px solid #666">'
                     : '<div style="border:1px solid #666;padding:8mm;text-align:center;font-size:9pt">（影像遺失）</div>') +
                '<div style="font-size:9.5pt;margin-top:1mm">圖 ' + x.week + '-' + (i + 1) + '　' +
                U.esc(p.cap || '（未填圖說）') + '</div></div>';
            }).join('') + '</div></div>';
        }).join('');
      }
      U.print('參　課程紀錄', body);
    };
    if (!keys.length) { draw({}); return; }
    U.toast('照片載入中…');
    PHOTO.getMany(keys).then(function (arr) {
      var map = {};
      arr.forEach(function (o) { map[o.k] = o.v; });
      draw(map);
    }, function () { draw({}); });
  },

  /* ---------- 教室日誌照片（IndexedDB） ---------- */
  reloadPhotos: function () { VIEWS.renderPhotos(); },
  addPhotos: function (el) {
    var files = Array.prototype.slice.call(el.files || []);
    el.value = '';
    if (!files.length) return;
    var w = VIEWS.logWeek || 1, L = STORE.logOf(w);
    var room = CONFIG.PHOTO.MAX_PER_WEEK - L.photos.length;
    if (room <= 0) { alert('第 ' + w + ' 週的照片已達上限 ' + CONFIG.PHOTO.MAX_PER_WEEK + ' 張，請先刪除再新增。'); return; }
    var over = 0;
    if (files.length > room) { over = files.length - room; files = files.slice(0, room); }
    U.toast('壓縮中…共 ' + files.length + ' 張');
    var used = L.photos.map(function (p) { return p.k; });
    var chain = Promise.resolve(), ok = 0, fail = [];
    files.forEach(function (f) {
      chain = chain.then(function () {
        return PHOTO.compress(f).then(function (r) {
          var key = PHOTO.nextKey(w, used);
          used.push(key);
          return PHOTO.put(key, r.url).then(function () {
            L.photos.push({ k: key, cap: '', name: f.name || '', px: r.w + '×' + r.h, kb: Math.round(PHOTO.bytesOf(r.url) / 1024) });
            ok++;
          });
        }).catch(function (e) { fail.push((f.name || '檔案') + '：' + (e && e.message ? e.message : e)); });
      });
    });
    chain.then(function () {
      STORE.save(true);
      ROUTER.render();
      var msg = '已加入 ' + ok + ' 張照片';
      if (over) msg += '；超出每週上限，' + over + ' 張未加入';
      U.toast(msg);
      if (fail.length) alert('以下檔案未能加入：\n' + fail.join('\n'));
      if (over) alert('第 ' + w + ' 週每週最多 ' + CONFIG.PHOTO.MAX_PER_WEEK + ' 張，超出的 ' + over + ' 張已被擋下。');
    });
  },
  setPhotoCap: function (i, v) {
    var L = STORE.logOf(VIEWS.logWeek || 1);
    if (!L.photos[i]) return;
    L.photos[i].cap = v;
    STORE.save(true);
  },
  delPhoto: function (i) {
    var w = VIEWS.logWeek || 1, L = STORE.logOf(w), p = L.photos[i];
    if (!p) return;
    if (!confirm('確定刪除這張照片（' + p.k + '）？影像會從 IndexedDB 移除，無法復原。')) return;
    PHOTO.del(p.k).then(function () {}, function () {}).then(function () {
      L.photos.splice(i, 1);
      STORE.save(true);
      ROUTER.render();
      U.toast('已刪除照片');
    });
  },
  exportPhotos: function () {
    var items = [];
    Object.keys(STORE.d.log).forEach(function (k) {
      (STORE.d.log[k].photos || []).forEach(function (p) { items.push({ week: parseInt(k, 10), k: p.k, cap: p.cap || '' }); });
    });
    if (!items.length) { alert('目前沒有任何照片可以匯出。'); return; }
    U.toast('打包中…共 ' + items.length + ' 張');
    PHOTO.getMany(items.map(function (x) { return x.k; })).then(function (arr) {
      var map = {};
      arr.forEach(function (o) { map[o.k] = o.v; });
      var out = {
        _type: 'ecm_photos', schemaVersion: CONFIG.SCHEMA_VERSION, exportedAt: U.nowStamp(),
        term: STORE.d.course.term,
        items: items.map(function (x) { return { week: x.week, k: x.k, cap: x.cap, data: map[x.k] || '' }; })
      };
      U.download('ecm_photos_' + STORE.d.course.term + '_' + U.today().replace(/\//g, '') + '.json',
        JSON.stringify(out), 'application/json');
      U.toast('已匯出 ' + items.length + ' 張照片備份');
    });
  },
  importPhotoFile: function (el) {
    var f = el.files && el.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      el.value = '';
      var obj;
      try { obj = JSON.parse(r.result); } catch (e) { alert('JSON 解析失敗：' + e.message); return; }
      if (!obj || obj._type !== 'ecm_photos' || !Array.isArray(obj.items)) { alert('這不是照片備份檔（_type 應為 ecm_photos）。'); return; }
      if (!confirm('將匯入 ' + obj.items.length + ' 張照片，同 key 的既有照片會被覆蓋。要繼續嗎？')) return;
      var chain = Promise.resolve(), ok = 0, skip = 0;
      obj.items.forEach(function (it) {
        chain = chain.then(function () {
          if (!it.data) { skip++; return; }
          var L = STORE.logOf(it.week);
          if (L.photos.length >= CONFIG.PHOTO.MAX_PER_WEEK &&
              !L.photos.some(function (p) { return p.k === it.k; })) { skip++; return; }
          return PHOTO.put(it.k, it.data).then(function () {
            var ex = L.photos.filter(function (p) { return p.k === it.k; })[0];
            if (ex) { ex.cap = it.cap || ex.cap; }
            else { L.photos.push({ k: it.k, cap: it.cap || '', kb: Math.round(PHOTO.bytesOf(it.data) / 1024) }); }
            ok++;
          });
        });
      });
      chain.then(function () {
        STORE.save(true); ROUTER.render();
        alert('照片匯入完成：成功 ' + ok + ' 張' + (skip ? '、略過 ' + skip + ' 張（無影像或該週已達上限）' : '') + '。');
      });
    };
    r.readAsText(f, 'utf-8');
  },
  clearPhotos: function () {
    if (!confirm('第 1 次確認：要清除「全部週次」的照片嗎？建議先按「匯出照片備份」。')) return;
    if (!confirm('第 2 次確認：此操作無法復原，確定清除全部照片？')) return;
    var keys = [];
    Object.keys(STORE.d.log).forEach(function (k) {
      (STORE.d.log[k].photos || []).forEach(function (p) { keys.push(p.k); });
    });
    var chain = Promise.resolve();
    keys.forEach(function (k) { chain = chain.then(function () { return PHOTO.del(k).catch(function () {}); }); });
    chain.then(function () {
      Object.keys(STORE.d.log).forEach(function (k) { STORE.d.log[k].photos = []; });
      STORE.save(true); ROUTER.render();
      U.toast('已清除 ' + keys.length + ' 張照片');
    });
  },
  // 備份頁的 IndexedDB 用量（非同步填入）
  showPhotoUsage: function () {
    var el = document.getElementById('photoUsage');
    if (!el) return;
    var keys = [];
    Object.keys(STORE.d.log).forEach(function (k) {

      var s = String(val == null ? '' : val).trim();

        var v = parseFloat(s);
        if (isNaN(v)) { g[key] = null; }

  importScores: function () {

    lines.forEach(function (line) {
      var obj = null;
      try { obj = JSON.parse(U.b64dec(line)); } catch (e) { obj = null; }
      if (!obj || typeof obj.week === 'undefined' || typeof obj.score === 'undefined') { bad++; return; }
      var rec = {
        week: parseInt(obj.week, 10), seat: String(obj.seat || ''), name: String(obj.name || ''),
        score: parseInt(obj.score, 10) || 0, ts: obj.ts || '', detail: obj.detail || [], src: 'code'
      };
      STORE.addScore(rec);
      if (STORE.matchStudent(rec.seat, rec.name)) { ok++; }
      else { STORE.d.pending.push(rec); pend++; }

    STORE.save();
    var msgHtml = '<div class="alert ' + (ok ? 'ok' : 'warn') + '">匯入完成：成功對應 ' + ok + ' 筆' +

    if (m) m.innerHTML = msgHtml;

  /* ---------- 練習 ---------- */
  pick: function (i, j) { VIEWS.practiceState.answers[i] = j; },
  submitQuiz: function (n) {
    var C = CONTENT[n], P = VIEWS.practiceState;
    var seat = (document.getElementById('pSeat') || {}).value || '';
    var name = (document.getElementById('pName') || {}).value || '';
    seat = seat.trim(); name = name.trim();
    var msg = document.getElementById('quizMsg');
    if (!seat || !name) {
      if (msg) msg.innerHTML = '<div class="alert red">請先填寫座號與姓名，才能交卷。</div>';
      return;
    }
    var unanswered = [];
    C.quiz.forEach(function (q, i) { if (typeof P.answers[i] === 'undefined') unanswered.push(i + 1); });
    if (unanswered.length && !confirm('還有 ' + unanswered.length + ' 題未作答（第 ' + unanswered.join('、') + ' 題），未作答以答錯計。確定交卷嗎？')) return;

    var right = 0, detail = [];
    C.quiz.forEach(function (q, i) {
      var ok = P.answers[i] === q.a;
      if (ok) right++;
      detail.push(ok ? 1 : 0);
    });
    var score = Math.round(right / C.quiz.length * 100);
    var ts = U.nowStamp();
    var payload = { v: 1, week: n, seat: seat, name: name, score: score, detail: detail, ts: ts };
    var code = U.b64enc(JSON.stringify(payload));
    var msgTxt = score >= 90 ? '非常好！觀念很扎實，繼續保持。' :
      score >= 75 ? '不錯！把錯題的解析讀完就更完整了。' :
        score >= 60 ? '有基礎了，建議回教材重點再看一次，然後重做一次。' :
          '別氣餒，先把本週的教材重點卡讀完，再重做一次一定會進步。';

    // 同機瀏覽器亦寫入 localStorage（同機情境自動進總覽）
    STORE.addScore({ week: n, seat: seat, name: name, score: score, ts: ts, detail: detail, src: 'local' });
    STORE.save(true);

    P.seat = seat; P.name = name; P.done = true;
    P.result = { score: score, right: right, code: code, msg: msgTxt };
    ROUTER.render();
    window.scrollTo(0, 0);
  },
  retry: function (n) {
    VIEWS.practiceState = { week: n, answers: {}, done: false, result: null,
      seat: VIEWS.practiceState.seat, name: VIEWS.practiceState.name };
    ROUTER.render();
    window.scrollTo(0, 0);
  }
};

/* =========================================================================
 * ROUTER — hash 路由
 *   （無 hash）／#/admin／#/admin/<tab>  → 老師模式（6 分頁）
 *   #/week/N     → 學生：第 N 週課程內容
 *   #/practice/N → 學生：第 N 週練習
 *   #/student    → 學生入口
 * 學生路由不顯示管理分頁。
 * ========================================================================= */
var ROUTER = {
  parse: function () {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/').filter(function (x) { return x !== ''; });
    if (!p.length) return { mode: 'admin', tab: 'overview' };
    if (p[0] === 'admin') {
      var tab = p[1] || 'overview';
      if (!CONFIG.TABS.some(function (t) { return t.id === tab; })) tab = 'overview';
      return { mode: 'admin', tab: tab };
    }
    if (p[0] === 'week') return { mode: 'week', n: Math.max(1, parseInt(p[1], 10) || 1) };
    if (p[0] === 'practice') return { mode: 'practice', n: Math.max(1, parseInt(p[1], 10) || 1) };
    if (p[0] === 'student') return { mode: 'student' };
    return { mode: 'admin', tab: 'overview' };
  },

  render: function () {
    var r = ROUTER.parse(), app = document.getElementById('app'), h = '';

    if (r.mode === 'admin') {
      /* --- 老師模式：頁首＋六分頁導覽 --- */
      h = VIEWS.header() + VIEWS.nav(r.tab) + '<div class="wrap">';
      switch (r.tab) {
        case 'students': h += VIEWS.students(); break;
        case 'plan': h += VIEWS.plan(); break;
        case 'content': h += VIEWS.contentTab(); break;
        case 'log': h += VIEWS.log(); break;
        case 'grades': h += VIEWS.grades(); break;
        case 'backup': h += VIEWS.backup(); break;
        default: h += VIEWS.overview();
      }
      h += VIEWS.footer() + '</div>';
      app.innerHTML = h;
      // 需要非同步從 IndexedDB 取資料的區塊，畫面掛上去之後再補
      if (r.tab === 'log') VIEWS.renderPhotos();
      if (r.tab === 'backup') ACT.showPhotoUsage();
      return;
    }

    /* --- 學生模式：不顯示管理分頁 --- */
    var c = STORE.d.course;
    var studentHeader = VIEWS.header('學生頁面', [
      '<span class="chip">' + U.esc(c.teacher) + '</span>',
      '<span class="chip">助教：' + U.esc(c.ta) + '</span>',
      '<span class="chip gold">學生專用頁面</span>'
    ].join(''));

    if (r.mode === 'week') {
      VIEWS.deck = { week: r.n, i: 0, notes: true };
      app.innerHTML = studentHeader + VIEWS.week(r.n) + '<div class="wrap">' + VIEWS.footer() + '</div>';
      VIEWS.renderDeck();
      return;
    }
    if (r.mode === 'practice') {
      app.innerHTML = studentHeader + VIEWS.practice(r.n) + '<div class="wrap">' + VIEWS.footer() + '</div>';
      return;
    }
    app.innerHTML = studentHeader + VIEWS.student() + '<div class="wrap">' + VIEWS.footer() + '</div>';
  },

  init: function () {
    window.addEventListener('hashchange', function () { ROUTER.render(); window.scrollTo(0, 0); });
    // 簡報：左右方向鍵翻頁
    document.addEventListener('keydown', function (e) {
      if (!document.getElementById('deck')) return;
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if (e.key === 'ArrowLeft') { ACT.slide(-1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { ACT.slide(1); e.preventDefault(); }
    });
    ROUTER.render();
  }
};

/* ---------- 啟動 ---------- */
(function boot() {
  STORE.load();
  STORE.syncPlanLength();
  ROUTER.init();
})();

</script>
</body>
</html>
