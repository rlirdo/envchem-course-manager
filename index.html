    { h: '環境資料的三個特殊性質', b: '環境時序資料不能當成一般統計樣本，因為它有三個特性：<br>① <b>自相關（autocorrelation）</b>：這小時的 PM<sub>2.5</sub> 與上小時高度相關。若忽略它而直接做顯著性檢定，會嚴重高估自由度、把雜訊當成顯著。<br>② <b>強烈的週期性</b>：日循環（交通尖峰、光化學）、週循環（週末效應）、季節循環（東北季風、逆溫）。分析前應先移除或明確納入這些週期。<br>③ <b>低於偵測極限（&lt; MDL）的資料</b>：常見錯誤是填 0 或直接刪除。慣用做法是填 MDL/2 或 MDL/√2，並<b>在報告中明講你用了哪一種</b>。<br>這三點是環境資料分析與一般資料科學最大的差異，也是 AI 最容易忽略的地方——<b>因為它不知道你的資料是環境資料</b>。' },
    { h: '選圖表：先問「你要回答什麼問題」', b: '不要先想「用什麼圖好看」，而要問「我要回答什麼問題」：<br>• <b>隨時間怎麼變</b> → 折線圖（時序）、熱圖（日×小時）。<br>• <b>分布長什麼樣</b> → 直方圖、箱形圖、小提琴圖。<br>• <b>兩個變數有沒有關係</b> → 散布圖（＋趨勢線與 R²），必要時取對數。<br>• <b>組間比較</b> → 箱形圖優於長條圖（長條圖只顯示平均，會隱藏變異）。<br>• <b>方向性來源</b> → 污染玫瑰圖（風向 × 濃度），這是空品分析非常有力的工具。<br>• <b>組成比例</b> → 堆疊長條圖優於圓餅圖（圓餅圖難以比較相近的比例）。<br><b>共同原則</b>：軸標題要有單位、圖說要能獨立讀懂、色彩要對色盲友善、不要用 3D 效果。' },
    { h: '誤導性圖表的五種常見手法', b: '學會辨識，才不會不小心自己做出來：<br>① <b>Y 軸不從零開始</b>（長條圖尤其嚴重）：把 2% 的差異畫成兩倍高。折線圖可以不從零，但必須明確標示。<br>② <b>雙 Y 軸</b>：藉由調整兩軸刻度，可以讓任意兩條曲線看起來「高度相關」。<br>③ <b>選擇性時間範圍</b>：只取對自己有利的年份。<br>④ <b>把相關當因果</b>：兩者同時上升不代表有因果，可能有共同驅動因子（例如溫度）。<br>⑤ <b>平均值掩蓋分布</b>：年平均達標，不代表沒有嚴重的小時級暴露。<br><b>AI 生成的圖表特別容易犯 ①②⑤</b>，因為它只看到數字，看不到情境。<b>圖表是論證，不是裝飾——每一張圖都要能被質問。</b>' },
    { h: '用 AI 做 EDA 的正確姿勢', b: '本次活動的重點不是「讓 AI 幫你做完」，而是<b>學會指揮與驗收</b>：<br>① <b>給脈絡</b>：告訴 AI 這是什麼資料、單位、缺值代碼、你關心的問題。<b>沒有脈絡的 prompt 得到的一定是通用答案</b>。<br>② <b>要求先列假設</b>：請 AI 在寫程式前先列出它假設了什麼（時間欄格式、缺值處理方式、時區）。<br>③ <b>小步驟迭代</b>：一次只做一件事（先讀檔、再檢查、再畫圖），不要一次要它產出完整報告。<br>④ <b>要求它自我檢查</b>：「請列出這段程式可能出錯的三種情況」。<br>⑤ <b>你來驗收</b>：核對筆數、抽樣比對原始值、確認圖上的數字與表格一致。<br><b>驗收不能外包</b>——這是本課程 AI 倫理規範的核心，也是本次學習單的評分重點。' },
    { h: '牛皮製漿的化學（行前知識）', b: '木材約含 40–50% 纖維素、20–30% 半纖維素、20–30% 木質素。製漿的目的是<b>把木質素移除而盡量保留纖維素</b>。<br><b>牛皮法（kraft process）</b>使用白液（NaOH + Na<sub>2</sub>S）在高溫高壓下蒸煮：<div class="eq">木質素 + HS<sup>−</sup>／OH<sup>−</sup> <span class="fx">→</span> 可溶性木質素碎片（進入黑液）</div>HS<sup>−</sup> 的親核攻擊使木質素的 <span class="fx">β</span>-O-4 醚鍵斷裂，這是牛皮法比其他方法更有效的關鍵。<br><b>黑液回收循環</b>是牛皮法的靈魂，也是工業生態的經典：<div class="eq">濃縮 → 回收鍋爐（燒木質素產蒸汽＋還原成 Na<sub>2</sub>S）→ 綠液<br>苛化：Na<sub>2</sub>CO<sub>3</sub> + Ca(OH)<sub>2</sub> <span class="fx">→</span> 2NaOH + CaCO<sub>3</sub>(s)<br>石灰窯：CaCO<sub>3</sub> <span class="fx">→</span> CaO + CO<sub>2</sub></div>木質素當燃料、化學品循環使用——<b>一座現代紙廠的蒸汽與大部分電力，都來自燒自己的黑液</b>。' },
    { h: '漂白與環境議題', b: '<b>漂白</b>的目的是移除殘餘木質素與發色團。歷史演進正是綠色化學的教科書案例：<br>• <b>元素氯（Cl<sub>2</sub>）漂白</b>：會與木質素殘餘物生成<b>戴奧辛與呋喃</b>（多氯二苯戴奧辛／呋喃），1980 年代成為全球環保爭議焦點。<br>• <b>ECF（Elemental Chlorine Free）</b>：改用 ClO<sub>2</sub>，可降低戴奧辛生成達數個數量級，是目前主流。<br>• <b>TCF（Totally Chlorine Free）</b>：用 O<sub>2</sub>、O<sub>3</sub>、H<sub>2</sub>O<sub>2</sub> 完全不用氯，副產物最少，但對纖維強度與成本有影響。<br>其他關鍵環境議題：<br>① <b>廢水</b>：高 COD、色度（木質素衍生物）、AOX（可吸附有機鹵化物）。<br>② <b>空氣</b>：TRS（總還原硫，如 CH<sub>3</sub>SH、(CH<sub>3</sub>)<sub>2</sub>S）——紙廠特有氣味的來源，臭味閾值極低（ppb 等級）。<br>③ <b>固體</b>：石灰泥、綠液渣、樹皮與污泥（多作能源或土壤改良）。', local: '花蓮連結：中華紙漿花蓮廠是台灣少數仍運作的整合型紙漿廠，其黑液回收與 TRS 管理是本次參訪的核心觀察點。' },
    { h: '參訪行前準備：中華紙漿花蓮廠', b: '<b>時間</b>：W15（12/14）13:20–17:30，遊覽車統一接送，13:00 校門集合（請提早 10 分鐘）。<br><b>安全</b>：長褲、包鞋（不可涼鞋、拖鞋、高跟鞋）、綁長髮、不可穿寬鬆外套。全程配戴安全帽與識別證，跟隨導覽動線，<b>不得脫隊、不得跨越黃線、不得觸摸任何閥門與管線</b>。廠區有高溫管線與高噪音區，聽從人員指示配戴耳塞。攝影須先取得同意。<br><b>觀察清單</b>：<br>① 原料場：木片來源、樹種、含水率如何影響能耗。<br>② 蒸煮與洗滌：白液／黑液的顏色與流向。<br>③ 回收鍋爐：蒸汽產量、發電量、廠內能源自給比例。<br>④ 漂白線：使用 ECF 或 TCF？藥劑種類？<br>⑤ 廢水處理：處理流程、色度與 COD 去除、放流去處。<br>⑥ 空污防制：TRS 如何收集與處理？有無異味投訴管理機制？<br><b>提問準備</b>：每人至少準備兩個具體問題（要有數字或化學名詞），現場擇優提問。' },
    { h: '本週學習單與交件', b: '<b>學習單</b>：「AI 模組活動 II 學習單」（見本頁下方連結）。內容包含：<br>① 你的資料集與問題敘述。<br>② 四步驟 EDA 的結果（結構、缺值、分布、異常），須附數字。<br>③ 至少兩張圖：一張時序或熱圖、一張分布或關係圖，每張附 30 字以內圖說。<br>④ 一段「我如何驗收 AI 產出」的說明（至少寫出一項你發現並修正的錯誤）。<br>⑤ AI 使用聲明。<br><b>交件</b>：課後 7 日內上傳 PDF 與程式碼至 Zuvio（不得含任何金鑰）。<br><b>評分</b>：EDA 完整性 30%、圖表適切性 25%、驗收與除錯說明 25%、AI 聲明與可查證性 20%。' }
  ],
  slides: [
    { t: '環境化學　第 14 週', s: '封面', cover: true, b: ['AI 模組活動 II：AI 輔助 EDA 與視覺化', '中華紙漿花蓮廠行前演講', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n上週我們拿到了資料，也做了基本檢查。\n今天要往前走一步，做探索性資料分析跟視覺化。\n第一節談探索性分析的四個必做步驟，還有環境資料的三個特殊性質。\n第二節談怎麼選圖表，以及怎麼辨識誤導性圖表。\n第三節是下週中華紙漿花蓮廠參訪的行前演講。\n這次是校外參訪，安全事項特別重要，請務必專心聽。' },
    { t: 'EDA 四個必做步驟', s: '第一節', b: ['① 結構：幾筆、幾欄、時間範圍與間隔是否一致', '② 缺值：缺多少、缺在哪（隨機還是集中）', '③ 分布：畫直方圖看偏態', '④ 異常：先解釋，不要先刪'],
      n: '拿到一份環境資料，先做這四件事，順序不能顛倒。\n第一步看結構，幾筆、幾欄、時間範圍，還有時間間隔是不是一致。\n小時值有沒有跳號，這件事一定要檢查。\n第二步看缺值，缺多少、缺在哪裡。\n如果缺值集中在某一段時間，通常代表儀器故障或校正期，不是隨機缺。\n第三步看分布，畫直方圖。\n第四步看異常值。\n請注意，不要先刪再說，要先解釋。\n那可能是沙塵、火災或跨年煙火，是真實事件。' },
    { t: '環境濃度多半是右偏的', s: '第一節', b: ['右偏 → 平均值 > 中位數', '用平均值描述「典型狀況」會誤導', '常用對數轉換後再做統計', '報告中應同時給中位數與百分位數'],
      n: '這一頁講第三步的重點。\n環境濃度資料多半是右偏的。\n因為濃度有下界零，卻沒有上界。\n偶爾出現的高值會把平均值往上拉。\n所以平均值通常大於中位數。\n如果你用平均值去描述典型狀況，就會誤導。\n處理方式通常是取對數之後再做統計。\n報告裡建議同時給中位數跟百分位數，例如第五十、第九十五百分位。\n這樣讀者才看得出真實的分布形狀。' },
    { t: '環境資料的三個特殊性質', s: '第一節', b: ['① 自相關：這小時與上小時高度相關', '忽略它會高估自由度，把雜訊當顯著', '② 週期性：日循環、週末效應、季節循環', '③ 低於偵測極限：填 MDL/2 或 MDL/√2，並明講'],
      n: '這一頁非常重要，是環境資料跟一般統計最大的差異。\n第一個特性是自相關。\n這一小時的細懸浮微粒濃度，跟上一小時高度相關。\n如果忽略它直接做顯著性檢定，會嚴重高估自由度。\n本來只有幾十個獨立樣本，你當成幾千個，什麼都會顯著。\n第二個特性是強烈的週期性，日循環、週末效應、季節循環。\n分析前要先移除或明確納入。\n第三個是低於偵測極限的資料。\n常見錯誤是填零或直接刪除。\n慣用做法是填偵測極限的一半，而且要在報告裡明講。' },
    { t: '為什麼 AI 特別容易錯過這三點', s: '第一節', b: ['因為它不知道你的資料是環境資料', '它會套用一般統計的預設做法', '所以你必須在 prompt 裡給脈絡', '驗收不能外包'],
      n: '接續上一頁，我要特別提醒一件事。\n人工智慧特別容易錯過剛才那三點。\n為什麼？\n因為它不知道你的資料是環境資料。\n它看到的只是一堆數字跟欄位名稱。\n所以它會套用一般統計的預設做法。\n直接刪缺值、直接做皮爾森相關、直接畫平均長條圖。\n這就是為什麼你必須在提示裡給脈絡。\n也是為什麼驗收不能外包。' },
    { t: '選圖表：先問你要回答什麼', s: '第二節', b: ['隨時間怎麼變 → 折線圖、熱圖（日×小時）', '分布長什麼樣 → 直方圖、箱形圖', '兩變數有無關係 → 散布圖 + 趨勢線 + R²', '組間比較 → 箱形圖優於長條圖', '方向性來源 → 污染玫瑰圖'],
      n: '第二節談視覺化。\n請不要先想用什麼圖好看，要先問我要回答什麼問題。\n想看隨時間怎麼變，用折線圖，或是用日對小時的熱圖。\n想看分布長什麼樣，用直方圖或箱形圖。\n想看兩個變數有沒有關係，用散布圖加趨勢線，附上判定係數。\n組間比較請用箱形圖，不要用長條圖。\n因為長條圖只顯示平均，會把變異藏起來。\n想找方向性來源，用污染玫瑰圖，把風向跟濃度疊在一起。\n這在空品分析裡非常有力。' },
    { t: '圖表的共同原則', s: '第二節', b: ['軸標題要有單位', '圖說要能獨立讀懂（不看內文也知道在講什麼）', '色彩要對色盲友善（避免紅綠對比）', '不要用 3D 效果與陰影', '堆疊長條圖優於圓餅圖'],
      n: '這一頁是所有圖表的共同原則。\n第一，軸標題一定要有單位。\n沒有單位的圖等於沒有資訊。\n第二，圖說要能獨立讀懂。\n讀者不看內文，光看圖說也要知道這張圖在講什麼。\n第三，色彩要對色盲友善，避免紅綠對比。\n大約百分之八的男性有紅綠色覺辨識困難。\n第四，不要用三維效果跟陰影，那會扭曲面積判讀。\n第五，比較組成比例時，堆疊長條圖優於圓餅圖。' },
    { t: '誤導性圖表的五種手法', s: '第二節', b: ['① Y 軸不從零開始（長條圖尤其嚴重）', '② 雙 Y 軸：調刻度就能製造「高度相關」', '③ 選擇性時間範圍', '④ 把相關當因果', '⑤ 平均值掩蓋分布'],
      n: '這一頁請大家學會辨識，才不會不小心自己做出來。\n第一種是 Y 軸不從零開始。\n長條圖特別嚴重，可以把百分之二的差異畫成兩倍高。\n折線圖可以不從零，但必須明確標示。\n第二種是雙 Y 軸。\n只要調整兩邊的刻度，任意兩條曲線都能看起來高度相關。\n第三種是選擇性時間範圍，只取對自己有利的年份。\n第四種是把相關當因果。\n兩者同時上升可能只是有共同的驅動因子，比如溫度。\n第五種是用平均值掩蓋分布，年平均達標不代表沒有嚴重的小時級暴露。' },
    { t: '用 AI 做 EDA 的正確姿勢', s: '第二節', b: ['① 給脈絡：資料是什麼、單位、缺值代碼、你的問題', '② 要求先列假設再寫程式', '③ 小步驟迭代，一次只做一件事', '④ 要求它列出「這段程式可能出錯的三種情況」', '⑤ 你來驗收：核對筆數、抽樣比對、圖表數字一致'],
      n: '這一頁是本次活動的核心。\n重點不是讓人工智慧幫你做完，而是學會指揮跟驗收。\n第一，給脈絡。\n告訴它這是什麼資料、單位是什麼、缺值代碼是什麼、你關心什麼問題。\n沒有脈絡的提示，得到的一定是通用答案。\n第二，要求它先列出假設再寫程式。\n第三，小步驟迭代，一次只做一件事。\n第四，要求它自我檢查，列出這段程式可能出錯的三種情況。\n第五，你來驗收。\n核對筆數、抽樣比對原始值、確認圖上的數字跟表格一致。' },
    { t: '牛皮製漿的化學', s: '第三節', b: ['木材：纖維素 40–50%、半纖維素 20–30%、木質素 20–30%', '目標：移除木質素、保留纖維素', '白液 NaOH + Na₂S 高溫蒸煮', 'HS⁻ 親核攻擊使木質素 β-O-4 醚鍵斷裂'],
      n: '第三節進入下週參訪的行前知識。\n木材大致由纖維素、半纖維素跟木質素組成。\n製漿的目的是把木質素移除，盡量保留纖維素。\n因為木質素是把纖維黏在一起的天然膠。\n牛皮法使用白液，成分是氫氧化鈉加硫化鈉，在高溫高壓下蒸煮。\n關鍵在硫氫根離子。\n它的親核攻擊會使木質素的貝他氧四醚鍵斷裂。\n這就是牛皮法比其他方法更有效的化學原因。' },
    { t: '黑液回收：工業生態的經典', s: '第三節', b: ['濃縮 → 回收鍋爐（燒木質素產蒸汽 + 還原成 Na₂S）', '苛化：Na₂CO₃ + Ca(OH)₂ → 2NaOH + CaCO₃(s)', '石灰窯：CaCO₃ → CaO + CO₂', '木質素當燃料、化學品循環使用'],
      n: '這一頁是牛皮法的靈魂，也是工業生態的經典案例。\n蒸煮後的黑液含有溶出的木質素跟用過的化學品。\n先濃縮，再送進回收鍋爐。\n鍋爐裡發生兩件事，木質素被燒掉產生蒸汽，硫酸鈉被還原成硫化鈉。\n熔融物溶解後叫綠液。\n綠液加石灰乳進行苛化，把碳酸鈉變回氫氧化鈉，同時沉澱碳酸鈣。\n碳酸鈣送進石灰窯煅燒，變回氧化鈣再用。\n所以化學品是循環的，木質素則變成燃料。\n一座現代紙廠的蒸汽跟大部分電力，都來自燒自己的黑液。' },
    { t: '漂白：綠色化學的教科書案例', s: '第三節', b: ['元素氯漂白 → 生成戴奧辛與呋喃（1980 年代爭議焦點）', 'ECF：改用 ClO₂，戴奧辛降低數個數量級（目前主流）', 'TCF：用 O₂、O₃、H₂O₂，完全不用氯', '取捨：纖維強度與成本'],
      n: '漂白的目的是移除殘餘木質素跟發色團。\n它的歷史演進正好是綠色化學的教科書案例。\n早期用元素氯漂白，效果好但會跟木質素殘餘物生成戴奧辛與呋喃。\n這在一九八零年代成為全球環保爭議的焦點。\n後來發展出無元素氯製程，改用二氧化氯。\n戴奧辛生成可以降低好幾個數量級，這是目前的主流。\n更進一步是全無氯製程，用氧氣、臭氧、雙氧水，完全不用氯。\n副產物最少，但對纖維強度跟成本有影響。\n這就是典型的取捨，沒有免費的午餐。' },
    { t: '紙廠的三大環境議題', s: '第三節', b: ['廢水：高 COD、色度（木質素衍生物）、AOX', '空氣：TRS 總還原硫（CH₃SH、(CH₃)₂S）', 'TRS 臭味閾值極低（ppb 等級）', '固體：石灰泥、綠液渣、樹皮與污泥'],
      n: '紙廠有三大環境議題。\n第一是廢水，特徵是高化學需氧量、高色度，還有可吸附有機鹵化物。\n色度來自木質素衍生物，用一般生物處理很難去除。\n第二是空氣，最特別的是總還原硫。\n包含甲硫醇、二甲硫醚這類物質。\n它們就是紙廠特有氣味的來源。\n請注意，它們的臭味閾值極低，在十億分之一的等級。\n所以濃度遠低於毒性標準，還是會有明顯氣味。\n第三是固體廢棄物，石灰泥、綠液渣、樹皮跟污泥。' },
    { t: '下週參訪：安全與觀察清單', s: '第三節', b: ['12/14 13:20–17:30，13:00 校門集合，遊覽車接送', '長褲包鞋、綁長髮、配戴安全帽與識別證', '不得脫隊、不得跨越黃線、不得觸摸閥門管線', '觀察六點：原料場、蒸煮、回收鍋爐、漂白、廢水、空污', '每人準備兩個具體問題（要有數字或化學名詞）'],
      n: '最後是下週參訪的安全與觀察清單，請務必記下來。\n時間是十二月十四號下午一點二十到五點半。\n一點鐘在校門口集合，遊覽車統一接送，請提早十分鐘到。\n服裝是長褲包鞋，不可以穿涼鞋拖鞋高跟鞋，長髮要綁起來。\n全程配戴安全帽跟識別證，跟著導覽動線走。\n不得脫隊、不得跨越黃線、不得觸摸任何閥門跟管線。\n廠區有高溫管線跟高噪音區，請聽從人員指示配戴耳塞。\n觀察六個點，從原料場一路看到空污防制。\n每人至少準備兩個具體問題，要有數字或化學名詞。' },
    { t: '本週小結與作業', s: '小結', b: ['EDA 四步驟：結構、缺值、分布、異常', '環境資料三特性：自相關、週期性、低於偵測極限', '圖表是論證不是裝飾，每張圖都要能被質問', '作業：AI 模組活動 II 學習單，課後 7 日內上傳'],
      n: '今天的重點收攏成三句話。\n第一，探索性分析四步驟，結構、缺值、分布、異常，順序不能顛倒。\n第二，環境資料有三個特性：自相關、強烈週期性、還有低於偵測極限的資料。\n這三點人工智慧最容易錯過，因為它不知道你的資料是環境資料。\n第三，圖表是論證不是裝飾，每一張圖都要能被質問。\n作業是人工智慧模組活動第二份學習單，課後七日內上傳。\n下週我們在校門口集合，記得長褲包鞋。\n以上是本週報告，謝謝老師，謝謝同學。' }

  quiz: [
    { q: '環境濃度資料多呈右偏分布，因此以「平均值」描述典型狀況的問題是？', o: ['平均值一定小於中位數，會低估', '少數高值會把平均值拉高，使其大於中位數而高估典型狀況', '平均值與分布無關', '右偏資料不能計算平均值'], a: 1, e: '濃度有下界 0 而無上界，偶發高值使分布右偏，平均值大於中位數。報告應同時提供中位數與百分位數（如 P50、P95），必要時取對數後再統計。' },
    { q: '忽略環境時序資料的「自相關」而直接做顯著性檢定，最主要的後果是？', o: ['低估變異，使結果不顯著', '高估有效自由度，容易把雜訊誤判為顯著', '不影響結論', '無法畫圖'], a: 1, e: '相鄰時間點高度相關代表獨立資訊量遠少於樣本數。若當成獨立樣本，等於虛增自由度，p 值被低估，容易得到假陽性結論。' },
    { q: '處理「低於方法偵測極限（< MDL）」的資料，較合理的做法為？', o: ['一律填 0', '直接刪除該筆資料', '以 MDL/2 或 MDL/√2 替代並在報告中明確說明所用方法', '填入 MDL 的十倍'], a: 2, e: '填 0 會低估、直接刪除會產生選擇偏誤。慣用替代法為 MDL/2 或 MDL/√2（後者適用於偏態較大者），關鍵是必須揭露所用方法以利他人重現。' },
    { q: '比較五個測站的 PM₂.₅ 濃度分布，下列何種圖表<b>最合適</b>？', o: ['圓餅圖', '只顯示平均值的長條圖', '箱形圖（可同時顯示中位數、四分位與離群值）', '3D 立體長條圖'], a: 2, e: '長條圖僅呈現集中趨勢而隱藏變異；箱形圖同時顯示中位數、四分位距與離群值，最適合組間分布比較。圓餅圖用於組成、3D 效果會扭曲判讀。' },
    { q: '下列何者<b>不是</b>常見的誤導性圖表手法？', o: ['長條圖 Y 軸不從零開始', '使用雙 Y 軸並調整刻度製造相關假象', '在軸標題標明單位並提供完整時間範圍', '只擷取對結論有利的年份'], a: 2, e: '標明單位與提供完整時間範圍正是良好圖表實務。其餘三項皆為典型誤導手法，其中 AI 生成圖表尤其容易出現前兩項。' },
    { q: '以 AI 協助 EDA 時，最能提升結果品質的做法是？', o: ['直接要求它一次產出完整分析報告', '在 prompt 中提供資料脈絡（單位、缺值代碼、問題），並要求它先列出假設再寫程式', '不給任何背景以測試其能力', '完全信任其輸出以節省時間'], a: 1, e: '沒有脈絡的 prompt 只能得到通用答案；要求先列假設可讓錯誤在寫程式前就被發現。小步驟迭代並由人工驗收，是本課程 AI 倫理規範的核心。' },
    { q: '牛皮製漿法（kraft）中，使木質素 β-O-4 醚鍵斷裂的關鍵物種為？', o: ['Cl₂', 'HS⁻（來自 Na₂S）的親核攻擊', 'CaCO₃', 'O₃'], a: 1, e: '白液中的 Na₂S 提供 HS⁻，其強親核性攻擊木質素的 β-O-4 醚鍵使之裂解並溶出。這是牛皮法脫木質素效率高於鹼法（soda）的關鍵。' },
    { q: '黑液回收系統中「苛化」步驟的反應為？', o: ['Na₂CO₃ + Ca(OH)₂ → 2NaOH + CaCO₃(s)', 'CaCO₃ → CaO + CO₂', 'Na₂SO₄ + 2C → Na₂S + 2CO₂', 'NaOH + CO₂ → NaHCO₃'], a: 0, e: '綠液中的 Na₂CO₃ 與石灰乳反應再生 NaOH（白液），同時沉澱 CaCO₃；後者送石灰窯煅燒成 CaO 循環使用。整套循環使化學品得以回收、木質素成為燃料。' },
    { q: '製漿漂白由元素氯改為 ECF（以 ClO₂ 取代 Cl₂）的主要環境效益是？', o: ['完全不產生任何廢水', '大幅降低多氯戴奧辛／呋喃的生成', '可提高紙漿產量一倍', '不再需要廢水處理'], a: 1, e: 'Cl₂ 與殘餘木質素反應易生成多氯芳香化合物（含戴奧辛／呋喃）。ClO₂ 主要以氧化方式作用、取代反應少，可使戴奧辛生成降低數個數量級。TCF 則完全不用氯。' },
    { q: '紙廠特有氣味的主要來源 TRS（總還原硫）之特徵為？', o: ['濃度必須很高才聞得到', '包含 CH₃SH、(CH₃)₂S 等，臭味閾值極低（ppb 等級），濃度遠低於毒性標準仍有明顯氣味', '屬於惰性氣體不參與反應', '只在漂白段產生'], a: 1, e: '甲硫醇、二甲硫醚、二甲二硫等還原態硫化物的嗅覺閾值可低至 ppb 甚至 sub-ppb，因此氣味投訴往往發生在濃度遠低於健康標準時，需以收集焚化等方式處理。' }

  type: 'teach',
  title: '參訪 II：中華紙漿股份有限公司花蓮廠（13:20–17:30）',
  chapters: '11E Ch16 工業生態與綠色化學（無中譯）；Ch7 工業廢水（中譯 Ch7）；Ch10 還原態含硫氣體（中譯 Ch10）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 16 章、第 7 章 7.4 節、第 10 章 10.10 節',
  goals: [

  cards: [
    { h: '參訪的核心提問：追蹤一根木片', b: '整場參訪請帶著同一個問題走：<b>一根木片進廠之後，它的每個原子最後去了哪裡？</b><br>木材的三大成分有三種命運：<br>• <b>纖維素</b>（40–50%）→ 產品（紙漿、紙）。<br>• <b>木質素</b>（20–30%）→ 溶入黑液 → 回收鍋爐燃燒 → <b>能源</b>。<br>• <b>半纖維素</b>（20–30%）→ 部分降解為有機酸進入黑液，部分留在漿中。<br>加上樹皮、細屑、無機灰分。<br>這個「追蹤物質」的習慣，就是<b>物質流分析</b>的入門，也是第 2 週工業生態學的實作。請在筆記本上畫出你的物質流圖，現場逐一確認。' },
    { h: '單元一：原料場與備料', b: '<b>看什麼</b>：木片堆的樹種（相思樹、桉樹或進口針葉木片）、含水率、儲存時間。<br><b>化學意義</b>：含水率直接影響蒸煮與燃燒的能耗——每公斤水汽化需約 2260 kJ。木片若堆置過久會發生微生物分解與自熱，除了損失得漿率，還可能產生揮發性有機物與異味。<br><b>剝皮</b>：樹皮的木質素含量高、纖維短，不適合製漿，多送鍋爐當燃料（樹皮鍋爐）。<br><b>可問的問題</b>：「木片的平均含水率是多少？儲存時間如何管理？樹皮的熱值與用途？」' },
    { h: '單元二：蒸煮與洗滌', b: '<b>看什麼</b>：連續蒸煮器或批次蒸煮鍋、白液加藥點、噴放與洗滌段。<br><b>化學</b>：白液（NaOH＋Na<sub>2</sub>S）在約 160–170 °C 蒸煮，HS<sup>−</sup> 親核裂解木質素的 <span class="fx">β</span>-O-4 醚鍵。<b>卡伯值（Kappa number）</b>是衡量殘餘木質素的指標——卡伯值愈低表示脫木質素愈徹底，但纖維損傷也愈大，且蒸煮能耗更高。<br><b>洗滌</b>的目的是把黑液盡量洗出來。洗滌效率直接決定兩件事：① 漂白藥劑用量（帶入的木質素愈多，漂白成本愈高）；② 化學品回收率。<br><b>可問的問題</b>：「目標卡伯值是多少？洗滌後的溶出固形物損失率？」' },
    { h: '單元三：黑液回收鍋爐（全廠核心）', b: '這是整座廠最值得看的地方，也是工業生態的心臟。<br><b>三個同時發生的功能</b>：<br>① <b>產能</b>：燒木質素產生高壓蒸汽 → 汽輪機發電＋製程蒸汽。<br>② <b>還原</b>：爐床還原區把 Na<sub>2</sub>SO<sub>4</sub> 還原成 Na<sub>2</sub>S（硫的循環）。<div class="eq">Na<sub>2</sub>SO<sub>4</sub> + 2C <span class="fx">→</span> Na<sub>2</sub>S + 2CO<sub>2</sub></div>③ <b>減量</b>：把有機負荷從廢水端轉移到能源端。<br><b>關鍵指標</b>：黑液固形物濃度（愈高熱值愈好，現代廠常做到 75–80%）、還原率、蒸汽產量、發電量。<br><b>可問的問題</b>：「黑液進爐固形物濃度？全廠電力自給率大約多少？」<b>如果一座廠的自給率能到七、八成以上，那它在能源上已經非常接近一個閉環系統。</b>' },
    { h: '單元四：苛化與石灰窯', b: '<b>化學循環</b>：<div class="eq">綠液：Na<sub>2</sub>S + Na<sub>2</sub>CO<sub>3</sub>（溶解熔融物）<br>苛化：Na<sub>2</sub>CO<sub>3</sub> + Ca(OH)<sub>2</sub> <span class="fx">→</span> 2NaOH + CaCO<sub>3</sub>(s)<br>石灰窯：CaCO<sub>3</sub> <span class="fx">--900–1100 °C--&gt;</span> CaO + CO<sub>2</sub><br>消化：CaO + H<sub>2</sub>O <span class="fx">→</span> Ca(OH)<sub>2</sub></div>看起來繞了一圈回到原點，但這正是重點：<b>鈉與鈣都在循環，只有能量是外加的</b>。<br><b>石灰窯是全廠少數必須燒化石燃料的單元</b>（需要高溫火焰與精確溫控），因此也是減碳的難點與觀察重點：有沒有改用生質燃料、木質素燃料或電熱？<br><b>可問的問題</b>：「石灰窯用什麼燃料？有沒有替代方案的評估？」' },
    { h: '單元五：漂白與廢水處理', b: '<b>漂白</b>：確認採用 ECF（ClO<sub>2</sub>）或 TCF（O<sub>2</sub>／O<sub>3</sub>／H<sub>2</sub>O<sub>2</sub>）。若為 ECF，ClO<sub>2</sub> 多在廠內現場製備（不穩定、不宜運輸），這本身就是有趣的製程安全議題。<br><b>廢水特徵</b>：高 COD、高色度（木質素衍生物，生物處理難以去除）、AOX。<br><b>處理流程</b>：初沉 → 冷卻／中和 → 生物處理（活性污泥或曝氣塘）→ 二沉 → 視需要加混凝或臭氧脫色。<br><b>觀察重點</b>：放流水的顏色（色度是最直觀的指標）、水回收率、冷卻水如何管理（熱污染）。<br><b>可問的問題</b>：「每噸漿的用水量是多少？水回收率多少？色度用什麼方法去除？」<br>提醒：<b>每噸漿用水量是紙業最常被比較的環境指標之一</b>，現代廠已能從數十立方公尺降到十幾立方公尺等級。' },
    { h: '單元六：空污防制與異味管理', b: '<b>TRS（總還原硫）</b>是紙廠最具識別度的環境議題：H<sub>2</sub>S、CH<sub>3</sub>SH、(CH<sub>3</sub>)<sub>2</sub>S、(CH<sub>3</sub>)<sub>2</sub>S<sub>2</sub>。它們的嗅覺閾值可低到 ppb 甚至 sub-ppb，因此<b>「符合法規」與「聞不到味道」是兩件事</b>。<br>處理策略：把高濃度不凝結氣體（CNCG）與低濃度氣體（DNCG）收集起來，送回收鍋爐或石灰窯焚化，轉成 SO<sub>2</sub> 再進脫硫。<br>其他項目：回收鍋爐的粒狀物（靜電集塵器）、NO<sub>x</sub>、SO<sub>2</sub>。<br><b>可問的問題</b>：「異味氣體如何收集？有沒有連續監測？周界異味投訴如何處理？」<br><b>觀察社會面向</b>：一座工廠與鄰近社區的關係，往往就寫在異味管理的細節裡。', local: '花蓮連結：紙廠與周邊社區、觀光產業的共存，是花蓮在地環境治理最真實的一課，請務必用心觀察。' },
    { h: '參訪後的作業與 W16 報告', b: '<b>個人心得</b>（48 小時內，Zuvio，200 字）：須包含一項現場觀察與其化學解釋。<br><b>小組口頭報告</b>（W16 第三節，每組 8 分鐘＋2 分鐘問答）：<br>① 一張<b>自己畫</b>的物質流圖（追蹤一根木片，標出產品／能源／廢棄物三個出口）。<br>② 一項估算：能源自給率、每噸漿用水量或化學品回收率擇一，寫出假設與依據。<br>③ 一個「工業生態學觀點下可改善的循環節點」，附化學論證。<br>④ 一項與 NDHU 污水廠的<b>對比</b>（規模、能源、物質循環的差異）。<br>⑤ 資料來源與 AI 使用聲明。<br><b>提醒</b>：涉及廠方營運數字者，僅使用導覽人員公開說明或公開報告的內容，<b>不得散布未經同意的照片與資料</b>。' }
  ],
  slides: [
    { t: '環境化學　第 15 週', s: '封面', cover: true, b: ['參訪 II：中華紙漿股份有限公司花蓮廠', '13:20–17:30｜13:00 校門集合', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n今天是本學期的第二次參訪，也是規模最大的一次。\n我們要去中華紙漿花蓮廠。\n出發前這一節，我先把觀察的主軸跟六個單元講清楚。\n請大家再確認一次服裝，長褲、包鞋、長髮綁好。\n手機請調靜音，攝影要先取得同意。\n現在請各組長清點人數。' },
    { t: '核心提問：追蹤一根木片', s: '第一節', b: ['一根木片進廠後，每個原子最後去了哪裡？', '纖維素 → 產品（紙漿、紙）', '木質素 → 黑液 → 回收鍋爐 → 能源', '半纖維素 → 部分入黑液、部分留在漿中', '這就是物質流分析的入門'],
      n: '整場參訪請帶著同一個問題走。\n一根木片進廠之後，它的每一個原子最後去了哪裡。\n木材的三大成分有三種命運。\n纖維素變成產品，也就是紙漿跟紙。\n木質素溶進黑液，送到回收鍋爐燒掉，變成能源。\n半纖維素有一部分降解成有機酸進入黑液，一部分留在漿裡。\n再加上樹皮、細屑跟無機灰分。\n這個追蹤物質的習慣，就是物質流分析的入門。\n請在筆記本上畫出你的物質流圖，現場逐一確認。' },
    { t: '單元一：原料場與備料', s: '第一節', b: ['看樹種、含水率、儲存時間', '每公斤水汽化需約 2260 kJ → 含水率直接影響能耗', '堆置過久：微生物分解自熱、損失得漿率、產生異味', '樹皮多送鍋爐當燃料'],
      n: '第一個單元是原料場。\n請看木片堆的樹種、含水率跟儲存時間。\n含水率為什麼重要？\n因為每公斤水汽化就要兩千兩百六十千焦耳。\n含水率高，蒸煮跟燃燒的能耗就直接上升。\n木片如果堆置太久，會發生微生物分解跟自熱。\n除了損失得漿率，還會產生揮發性有機物跟異味。\n樹皮的木質素含量高、纖維又短，不適合製漿，多半送鍋爐當燃料。' },
    { t: '單元二：蒸煮與卡伯值', s: '第一節', b: ['白液 NaOH + Na₂S，約 160–170 °C', 'HS⁻ 裂解木質素 β-O-4 醚鍵', '卡伯值：殘餘木質素指標', '愈低脫木質素愈徹底，但纖維損傷大、能耗高'],
      n: '第二個單元是蒸煮。\n白液是氫氧化鈉加硫化鈉，在大約一百六十到一百七十度蒸煮。\n硫氫根離子親核攻擊，裂解木質素的醚鍵。\n這裡有一個關鍵指標叫卡伯值。\n它衡量的是漿中殘餘的木質素量。\n卡伯值愈低，代表脫木質素愈徹底。\n但纖維損傷也愈大，能耗更高。\n所以不是愈低愈好，而是一個取捨。\n請現場問問看，他們的目標卡伯值是多少。' },
    { t: '洗滌效率決定兩件事', s: '第一節', b: ['① 漂白藥劑用量：帶入木質素愈多，漂白成本愈高', '② 化學品回收率：洗不出來就流失', '洗滌是最不起眼但最關鍵的單元之一', '可問：洗滌後的溶出固形物損失率？'],
      n: '蒸煮之後是洗滌。\n這個單元看起來不起眼，其實非常關鍵。\n洗滌的目的是把黑液盡量洗出來。\n它的效率直接決定兩件事。\n第一，漂白藥劑的用量。\n帶進漂白段的木質素愈多，漂白成本就愈高。\n第二，化學品的回收率。\n洗不出來的化學品就流失掉了，既是成本也是污染。\n所以請問問看，洗滌後的溶出固形物損失率是多少。' },
    { t: '單元三：回收鍋爐是全廠核心', s: '第二節', b: ['① 產能：燒木質素產高壓蒸汽 → 發電 + 製程蒸汽', '② 還原：Na₂SO₄ + 2C → Na₂S + 2CO₂', '③ 減量：把有機負荷從廢水端移到能源端', '指標：黑液固形物濃度（現代廠 75–80%）、還原率、自給率'],
      n: '第三個單元是黑液回收鍋爐，這是整座廠最值得看的地方。\n它同時做三件事。\n第一是產能，燒木質素產生高壓蒸汽，去推汽輪機發電，同時供應製程蒸汽。\n第二是還原，爐床的還原區把硫酸鈉還原成硫化鈉，完成硫的循環。\n第三是減量，把有機負荷從廢水端轉移到能源端。\n如果沒有這個鍋爐，那些木質素全部都會變成廢水的化學需氧量。\n關鍵指標是黑液進爐的固形物濃度，現代廠可以做到七成五到八成。\n還有還原率跟全廠電力自給率。' },
    { t: '一座廠可以接近閉環', s: '第二節', b: ['自給率七、八成以上 → 能源上非常接近閉環', '這正是第二週講的工業生態學', '木質素從廢棄物變成燃料', '請現場確認這座廠在光譜的哪個位置'],
      n: '接續上一頁，我想給大家一個判斷的標尺。\n如果一座廠的電力自給率能到七成、八成以上。\n那它在能源上已經非常接近一個閉環系統。\n這正是我們第二週講的工業生態學。\n木質素原本是製漿的廢棄物，現在變成了燃料。\n化學品原本用完就丟，現在整套循環回收。\n請大家現場確認，這座廠在這個光譜的哪個位置。\n並且問問看，還有哪些節點還沒有循環起來。' },
    { t: '單元四：苛化與石灰窯', s: '第二節', b: ['綠液 → 苛化：Na₂CO₃ + Ca(OH)₂ → 2NaOH + CaCO₃(s)', '石灰窯：CaCO₃ → CaO + CO₂（900–1100 °C）', '消化：CaO + H₂O → Ca(OH)₂', '鈉與鈣都在循環，只有能量是外加的'],
      n: '第四個單元是苛化與石灰窯。\n熔融物溶解之後叫綠液，主要成分是硫化鈉跟碳酸鈉。\n加入石灰乳進行苛化，把碳酸鈉變回氫氧化鈉，同時沉澱碳酸鈣。\n碳酸鈣送進石灰窯，在九百到一千一百度煅燒成氧化鈣。\n氧化鈣加水消化，又變回石灰乳。\n看起來繞了一圈回到原點。\n但這正是重點。\n鈉跟鈣都在循環，只有能量是外加的。' },
    { t: '石灰窯是減碳的難點', s: '第二節', b: ['全廠少數必須燒化石燃料的單元', '需要高溫火焰與精確溫控', '替代方案：生質燃料、木質素燃料、電熱', '可問：石灰窯用什麼燃料？有無替代評估？'],
      n: '這一頁請大家特別注意，因為它是一個很好的期末討論題材。\n石灰窯是全廠少數必須燒化石燃料的單元。\n為什麼？\n因為它需要很高溫的火焰，而且要精確控溫。\n用生質燃料或木質素燃料在技術上有挑戰，燃燒特性不一樣。\n電熱則面臨成本跟電力來源的問題。\n所以石灰窯是紙業減碳的難點之一。\n請現場問問看，這座廠的石灰窯用什麼燃料，有沒有做過替代方案的評估。' },
    { t: '單元五：漂白與廢水', s: '第三節', b: ['確認 ECF（ClO₂）或 TCF（O₂/O₃/H₂O₂）', 'ClO₂ 不穩定，多在廠內現場製備', '廢水：高 COD、高色度、AOX', '關鍵指標：每噸漿用水量、水回收率'],
      n: '第五個單元是漂白跟廢水處理。\n請先確認採用的是無元素氯還是全無氯製程。\n如果是無元素氯，二氧化氯多半在廠內現場製備。\n因為它不穩定，不適合長途運輸。\n這本身就是一個有趣的製程安全議題。\n廢水的特徵是高化學需氧量、高色度，還有可吸附有機鹵化物。\n色度來自木質素衍生物，生物處理很難去除。\n最常被比較的指標是每噸漿的用水量。\n現代廠已經可以從數十立方公尺降到十幾立方公尺的等級。' },
    { t: '單元六：TRS 與異味管理', s: '第三節', b: ['TRS：H₂S、CH₃SH、(CH₃)₂S、(CH₃)₂S₂', '嗅覺閾值可低到 ppb 甚至 sub-ppb', '「符合法規」與「聞不到味道」是兩件事', '策略：收集 CNCG／DNCG 送焚化 → SO₂ → 脫硫'],
      n: '第六個單元是空污防制，重點是總還原硫。\n包含硫化氫、甲硫醇、二甲硫醚跟二甲二硫。\n它們的嗅覺閾值可以低到十億分之一，甚至更低。\n所以請大家記住這句話。\n符合法規跟聞不到味道，是兩件不同的事。\n處理策略是把高濃度跟低濃度的不凝結氣體分別收集起來。\n送到回收鍋爐或石灰窯焚化，轉成二氧化硫再進脫硫。\n請現場問問看，異味氣體怎麼收集，有沒有連續監測。' },
    { t: '別忘了社會面向', s: '第三節', b: ['一座工廠與社區的關係，寫在異味管理的細節裡', '花蓮：紙廠、社區與觀光產業的共存', '環境治理不只是技術問題', '請用心觀察，這是化學課本上沒有的一課'],
      n: '這一頁我想跟大家講一件課本上沒有的事。\n一座工廠跟鄰近社區的關係，往往就寫在異味管理的細節裡。\n有沒有主動監測、有沒有投訴回應機制、有沒有跟社區溝通。\n這些都不是化學問題，但它們決定了化學方案能不能落地。\n花蓮的情況特別有意思。\n紙廠、社區跟觀光產業要在同一塊土地上共存。\n這是花蓮在地環境治理最真實的一課。\n請大家用心觀察，這會是你們期末行動很好的養分。' },
    { t: '參訪後作業與 W16 報告', s: '第三節', b: ['個人心得 48 小時內上傳（200 字，含觀察＋化學解釋）', '小組報告 W16 第三節，8 分鐘 + 2 分鐘問答', '必備：自畫物質流圖、一項估算、一個可改善節點', '必備：與 NDHU 污水廠的對比', '不得散布未經同意的照片與資料'],
      n: '最後說明作業。\n個人心得四十八小時內上傳，兩百字，要包含一項現場觀察跟它的化學解釋。\n小組口頭報告在第十六週第三節，每組八分鐘加兩分鐘問答。\n必備內容有五項。\n第一，自己畫的物質流圖，追蹤一根木片，標出產品、能源、廢棄物三個出口。\n第二，一項估算，能源自給率、每噸漿用水量或化學品回收率擇一。\n第三，一個工業生態學觀點下可改善的循環節點。\n第四，跟東華污水廠的對比。\n最後提醒，涉及廠方營運數字的，只能用導覽人員公開說明或公開報告的內容。\n不得散布未經同意的照片與資料。' },
    { t: '出發前最後提醒', s: '小結', b: ['13:00 校門集合，遊覽車統一接送', '長褲包鞋、綁長髮、配戴安全帽與識別證', '不脫隊、不跨黃線、不觸摸閥門管線', '高噪音區配戴耳塞；攝影先取得同意', '帶著「追蹤一根木片」這個問題進廠'],
      n: '出發前最後提醒。\n下午一點在校門口集合，遊覽車統一接送，請提早十分鐘到。\n服裝是長褲包鞋，長髮綁好，全程配戴安全帽跟識別證。\n不脫隊、不跨越黃線、不觸摸任何閥門跟管線。\n高噪音區請配戴耳塞，攝影一定要先取得同意。\n最後，請帶著今天講的那個核心問題進廠。\n一根木片進去之後，每個原子最後去了哪裡。\n現在請各組長帶隊，我們出發。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '在製漿廠中，木材三大成分的<b>典型去向</b>為？', o: ['纖維素→能源、木質素→產品、半纖維素→廢水', '纖維素→產品、木質素→黑液後燃燒供能、半纖維素部分入黑液部分留漿', '三者全部進入產品', '三者全部進入廢水'], a: 1, e: '製漿的目的是保留纖維素成為紙漿，木質素溶入黑液後於回收鍋爐燃燒轉為蒸汽與電力，半纖維素部分降解為有機酸進入黑液、部分留於漿中影響得率與強度。' },
    { q: '木片含水率高為何顯著提高能耗？', o: ['水會催化木質素聚合', '每公斤水汽化約需 2260 kJ，蒸煮與燃燒皆須付出此潛熱', '水會腐蝕蒸煮器', '水會降低白液的 pH'], a: 1, e: '水的汽化熱極大（約 2260 kJ/kg）。含水率高不僅稀釋燃料熱值，也提高蒸發與乾燥的能耗，因此原料場的含水率管理直接影響全廠能源效率。' },
    { q: '卡伯值（Kappa number）代表什麼？愈低愈好嗎？', o: ['代表紙漿白度，愈低愈白愈好', '代表殘餘木質素量；愈低脫木質素愈徹底，但纖維損傷與能耗增加，須取捨', '代表纖維長度，愈低愈強', '代表黑液固形物濃度'], a: 1, e: '卡伯值反映漿中殘餘木質素。過度蒸煮雖降低漂白負擔，卻損傷纖維、降低得率並提高能耗，因此實務上須在漂白成本與纖維品質間取得平衡。' },
    { q: '黑液回收鍋爐同時具備的三項功能<b>不包括</b>？', o: ['燃燒木質素產生蒸汽與電力', '將 Na₂SO₄ 還原為 Na₂S 完成硫循環', '將有機負荷從廢水端轉移至能源端', '直接生產二氧化氯漂白劑'], a: 3, e: 'ClO₂ 由專用製備裝置現場生產，與回收鍋爐無關。回收鍋爐的三大功能為產能、化學品還原與有機負荷減量，是牛皮法工業生態的核心。' },
    { q: '苛化反應 Na₂CO₃ + Ca(OH)₂ → 2NaOH + CaCO₃(s) 在回收循環中的作用是？', o: ['產生漂白劑', '由綠液再生白液所需的 NaOH，並產出送往石灰窯的 CaCO₃', '去除廢水色度', '生成沼氣'], a: 1, e: '苛化把綠液中的 Na₂CO₃ 轉回可用的 NaOH（白液），沉澱的 CaCO₃ 送石灰窯煅燒為 CaO 再消化成 Ca(OH)₂，使鈉與鈣皆得以循環。' },
    { q: '石灰窯被視為製漿廠減碳難點的原因是？', o: ['它產生大量廢水', '它需要高溫火焰與精確溫控，是全廠少數仍須燒化石燃料的單元', '它會排放 TRS', '它耗用大量新鮮水'], a: 1, e: '石灰窯需 900–1100 °C 的穩定高溫火焰，生質燃料燃燒特性與雜質（如鹼金屬）帶來結垢與品質風險，電熱則受成本與電力碳強度限制，故成為減碳瓶頸。' },
    { q: '製漿廢水「色度」難以用一般生物處理去除的原因是？', o: ['色度來自無機鹽', '色度主要來自木質素衍生的高分子發色團，可生物降解性低', '色度來自懸浮固體，沉澱即可去除', '色度會自行褪去'], a: 1, e: '木質素衍生物具高分子量、芳香族與共軛結構，生物可降解性差，常需混凝、臭氧或活性碳等物化程序輔助脫色。' },
    { q: '關於製漿廠的 TRS，下列敘述何者<b>正確</b>？', o: ['濃度符合法規即代表周界不會有異味', '嗅覺閾值可低至 ppb 或更低，故「符合法規」與「聞不到味道」是兩件事', 'TRS 為惰性氣體', 'TRS 只能以水洗處理'], a: 1, e: '甲硫醇等還原態硫化物的嗅覺閾值極低，常在遠低於健康標準的濃度即可察覺。實務上以收集 CNCG／DNCG 送焚化轉為 SO₂ 再脫硫為主要對策。' },
    { q: '以工業生態學觀點評估一座製漿廠時，最核心的判準是？', o: ['廠區面積大小', '物質與能量是否形成循環（副產物是否成為他處原料、能源自給率）', '員工人數', '產品售價'], a: 1, e: '工業生態學關注物質流是否由線性轉為網狀：黑液回收、化學品循環、樹皮與污泥的能源化、脫硫石膏的再利用，以及能源自給率，都是判斷閉環程度的指標。' }
  ],
  hw: '參訪後 48 小時內上傳個人心得 200 字（含一項觀察與化學解釋）；各組準備 W16 口頭報告（自畫物質流圖、一項估算、一個可改善節點、與 NDHU 污水廠對比）；完成本週線上練習。'
};

CONTENT[16] = {
  type: 'teach',
  title: 'AI 模組活動 III：環境化學解讀與 AI 查證｜參訪口頭報告｜Exam 2 複習',
  chapters: '11E Ch7–Ch11、Ch16 綜合應用（中譯 Ch7–Ch11；Ch16 無中譯）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 7–11、16 章；Exam 2 範圍請一併複習兩次參訪內容',
  goals: [
    '能設計查證流程，辨識 AI 產出中的事實錯誤、幻覺與單位陷阱。',
    '能以化學知識判斷一段環境敘述是否合理（合理性檢查）。',
    '能完成 Exam 2 範圍的自我檢核並指出弱項。',
    '能以工業生態學觀點完成參訪比較報告。'
  ],
  cards: [
    { h: '為什麼要學「查證」而不是「不用」', b: '禁止 AI 在教學上是無效的，因為它已經內建在搜尋、辦公軟體與手機裡。真正該教的能力是<b>判斷輸出是否可信</b>。<br>本課程主張的三層防線：<br>① <b>知識防線</b>：你自己的化學直覺。看到「pH 為 15 的雨水」「CO<sub>2</sub> 的氧化態為 −4」就該立刻警覺。<b>這是本學期十五週的價值所在</b>。<br>② <b>來源防線</b>：所有事實回到一手來源。<br>③ <b>一致性防線</b>：同一份輸出中，數字彼此是否自洽（總和是否等於各項之和、單位換算是否對得起來）。<br><b>三層都通過，才可以寫進報告。</b>' },
    { h: '常見錯誤型態一：單位與數量級', b: '這是環境領域最常見、也最容易查出的錯誤：<br>• 把空氣中的 ppm（體積比）當成 mg/L 直接用。<br>• 把「以 N 計」與「以 NO<sub>3</sub><sup>−</sup> 計」混用（差 4.43 倍）。<br>• 把 µg/m³ 與 mg/m³ 差一千倍。<br>• 把 BOD 與 COD 的數值互換。<br><b>查證技巧：做量級檢查（order-of-magnitude check）</b>。例如若 AI 說某河川氨氮為「500 mg/L」，你應該立刻想：這是原生污水的濃度等級，一般河川不可能。再例如「某測站 PM<sub>2.5</sub> 年均 800 µg/m³」也明顯不合理。<br><b>數量級對不上，比小數點錯更嚴重</b>，而且更容易被發現。' },
    { h: '常見錯誤型態二：化學不成立', b: '比單位錯誤更隱蔽的是<b>化學上根本不成立</b>的敘述：<br>• 反應式未配平，或電荷不守恆。<br>• 氧化態算錯（例如說 S 在 SO<sub>4</sub><sup>2−</sup> 中是 +4）。<br>• 把觸媒寫成反應物被消耗。<br>• 熱力學不可行的方向（例如宣稱在好氧環境中大量產生 CH<sub>4</sub>）。<br>• pE–pH 圖上出現在水穩定區外的物種。<br>• 把平流層臭氧與對流層臭氧的化學混為一談。<br><b>查證技巧</b>：對每一個反應式做三檢——<b>原子守恆、電荷守恆、方向合理</b>。這三檢只要 30 秒，卻能攔下絕大多數的化學幻覺。' },
    { h: '常見錯誤型態三：來源幻覺與過時資訊', b: '<b>幻覺文獻</b>的典型特徵：作者名字很像但期刊卷期對不上、DOI 格式正確但連不上、標題完美貼合你的需求（太完美就要懷疑）。<br><b>過時資訊</b>則更常見也更難察覺：法規標準會修正、排放清冊會更新、模式參數會改版。AI 的訓練資料有時間截點，且它<u>不會主動告訴你這件事</u>。<br><b>查證技巧</b>：<br>① 任何法規、標準、限值，一律到主管機關網站確認現行版本與修正日期。<br>② 任何統計數據，寫明年份與資料來源機構。<br>③ 若 AI 給的是「近年」「目前」這類模糊時間詞，一律視為未查證。<br><b>在報告中寫明「擷取日期」，是專業與業餘的分界線之一。</b>' },
    { h: '本週實作：三段式查證演練', b: '本次活動請完成三段練習（詳見學習單）：<br><b>第一段｜找錯</b>：老師提供一段關於「某溪流水質改善」的 AI 生成文字（含 5 處刻意錯誤：單位、數量級、化學不成立、幻覺來源、因果誤植各一）。請逐一標出並說明理由。<br><b>第二段｜改寫</b>：把該段文字改寫成可查證的版本，每個事實附來源與擷取日期。<br><b>第三段｜自問自答</b>：針對你自己的期末行動題目，設計三個「最容易被 AI 誤導」的提問，實際去問，並記錄查證過程與結果。<br><b>評分</b>：找錯正確性 30%、改寫品質 30%、自問自答的深度 25%、AI 聲明 15%。<br><b>學習單沿用 AI 模組活動 I／II 的格式</b>（見下方連結），本次以查證紀錄表為主。' },
    { h: 'Exam 2 複習地圖', b: '<b>範圍</b>：Ch7（水處理，與 Exam 1 重疊部分以應用題為主）、Ch8（大氣結構與光化學）、Ch9（粒狀物）、Ch10（無機空氣污染物、酸雨）、Ch11（有機空氣污染物、SOA）、Ch16（綠色化學與工業生態）、兩次參訪場域。<br><b>建議權重</b>：大氣化學（光化學、臭氧、•OH、酸雨）約 35%；粒狀物與 SOA 約 20%；水處理應用與工業廢水約 20%；綠色化學與工業生態（含參訪）約 25%。<br><b>題型</b>：單選、簡答、反應式書寫、以及一題「工廠情境分析」（給一組製程與排放資料，請指出主要環境議題並提出改善優先序）。' },
    { h: 'Exam 2 必背清單', b: '<b>大氣</b>：對流層遞減率約 6.5 °C/km；乾淨雨水理論 pH ≒ 5.6；我國酸雨定義 pH &lt; 5.0；NO<sub>2</sub> 光解＋O+O<sub>2</sub>+M；•OH 由 O(<sup>1</sup>D)+H<sub>2</sub>O 生成；Chapman 機制；Cl 觸媒循環淨反應 O<sub>3</sub>+O→2O<sub>2</sub>。<br><b>粒狀物</b>：核／累積／粗三模態界線 0.1 與 2.5 µm；累積模態壽命最長；二次氣膠三類（硫酸鹽、硝酸鹽、SOA）。<br><b>控制設備</b>：旋風 5–50 µm、ESP 與袋式對次微米有效。<br><b>SCR</b>：4NO+4NH<sub>3</sub>+O<sub>2</sub>→4N<sub>2</sub>+6H<sub>2</sub>O；<b>FGD</b>：CaCO<sub>3</sub>+SO<sub>2</sub>+½O<sub>2</sub>+2H<sub>2</sub>O→CaSO<sub>4</sub>·2H<sub>2</sub>O+CO<sub>2</sub>。<br><b>製漿</b>：白液 NaOH+Na<sub>2</sub>S；苛化式；石灰窯式；TRS 種類；ECF vs TCF。' },
    { h: '參訪口頭報告（本週第三節）', b: '<b>形式</b>：每組 8 分鐘＋2 分鐘問答，投影片不超過 10 張。<br><b>必備</b>：自畫物質流圖、一項估算（含假設）、一個可改善的循環節點（附化學論證）、與 NDHU 污水廠的對比、資料來源與 AI 使用聲明。<br><b>對比的思考角度建議</b>：<br>• <b>規模</b>：處理量與能源使用的數量級差異。<br>• <b>物質流</b>：污水廠是「移除」導向，紙廠是「循環」導向，兩者的邊界條件為何不同？<br>• <b>能源</b>：一個以曝氣耗能為主，一個以自產蒸汽為主。<br>• <b>社會介面</b>：一個在校園內幾乎無感，一個必須面對社區異味議題。<br><b>評分</b>：化學正確性 40%、觀察與對比深度 25%、可執行性 20%、表達 15%。' }
  ],
  slides: [
    { t: '環境化學　第 16 週', s: '封面', cover: true, b: ['AI 模組活動 III：環境化學解讀與 AI 查證', '參訪口頭報告｜Exam 2 複習', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n今天是本學期最後一次上新內容的一週。\n第一節談為什麼要學查證，還有三種常見的錯誤型態。\n第二節做三段式的查證演練，這是今天的實作。\n第三節做期末考複習，然後進行第二次參訪的口頭報告。\n這一週的內容看起來是關於人工智慧，其實是關於你自己的化學判斷力。\n請把整學期的筆記帶在身邊。' },
    { t: '為什麼學查證，不是學不用', s: '第一節', b: ['禁止 AI 在教學上是無效的，它已內建在各種工具裡', '真正該教的是判斷輸出是否可信', '三層防線：知識、來源、一致性', '三層都通過，才可以寫進報告'],
      n: '第一節先講清楚立場。\n禁止人工智慧在教學上是無效的。\n因為它已經內建在搜尋、辦公軟體跟手機裡。\n真正該教的能力是判斷輸出是否可信。\n我提出三層防線。\n第一層是知識防線，就是你自己的化學直覺。\n第二層是來源防線，所有事實回到一手來源。\n第三層是一致性防線，看同一份輸出裡的數字彼此是否自洽。\n三層都通過，才可以寫進報告。' },
    { t: '知識防線就是這學期的價值', s: '第一節', b: ['看到「pH 為 15 的雨水」就該警覺', '看到「CO₂ 中碳的氧化態為 −4」就該警覺', '看到「好氧環境大量產生 CH₄」就該警覺', '沒有這層防線，其他兩層也守不住'],
      n: '我要特別強調第一層防線。\n看到酸鹼值十五的雨水，你就該立刻警覺。\n因為在常溫水溶液中這幾乎不可能。\n看到說二氧化碳中碳的氧化態是負四，你也該警覺。\n那是甲烷，不是二氧化碳。\n看到說好氧環境大量產生甲烷，一樣要警覺。\n產甲烷菌是嚴格厭氧的。\n這一層就是這學期十五週的價值所在。\n沒有這層防線，其他兩層你根本不知道要去查什麼。' },
    { t: '錯誤型態一：單位與數量級', s: '第一節', b: ['空氣 ppm（體積比）當成 mg/L', '「以 N 計」與「以 NO₃⁻ 計」混用（差 4.43 倍）', 'µg/m³ 與 mg/m³ 差一千倍', '技巧：做量級檢查'],
      n: '第一種常見錯誤是單位與數量級。\n這是環境領域最常見，但也最容易查出來的。\n把空氣中的百萬分之一當成毫克每公升直接用。\n把以氮計跟以硝酸根計混用，這兩個差四點四三倍。\n微克每立方公尺跟毫克每立方公尺差一千倍。\n查證技巧是做量級檢查。\n如果有人跟你說某條河川的氨氮是五百毫克每公升。\n你應該立刻想，那是原生污水的等級，一般河川不可能。\n數量級對不上，比小數點錯更嚴重，也更容易被發現。' },
    { t: '錯誤型態二：化學不成立', s: '第一節', b: ['反應式未配平、電荷不守恆', '氧化態算錯（如說 SO₄²⁻ 中 S 是 +4）', '把觸媒寫成被消耗的反應物', 'pE–pH 圖上出現水穩定區外的物種', '三檢：原子守恆、電荷守恆、方向合理'],
      n: '第二種錯誤比較隱蔽，是化學上根本不成立。\n反應式沒配平，或是電荷不守恆。\n氧化態算錯，例如說硫酸根裡的硫是正四價，其實是正六價。\n把觸媒寫成反應物被消耗掉。\n或是在 pE 對 pH 圖上出現水穩定區以外的物種。\n查證技巧很簡單，對每個反應式做三檢。\n原子守恆、電荷守恆、方向合理。\n這三檢只要三十秒，卻能攔下絕大多數的化學幻覺。' },
    { t: '錯誤型態三：來源幻覺與過時資訊', s: '第一節', b: ['幻覺文獻特徵：卷期對不上、DOI 連不上、標題太完美', '過時資訊：法規會修正、清冊會更新', 'AI 有訓練截點，而且不會主動告訴你', '對策：法規查主管機關現行版本；數據寫明年份'],
      n: '第三種錯誤是來源幻覺跟過時資訊。\n幻覺文獻有幾個典型特徵。\n作者名字很像但卷期對不上。\n數位物件識別碼格式正確但連不上。\n還有標題完美貼合你的需求，太完美就要懷疑。\n過時資訊更常見也更難察覺。\n法規標準會修正，排放清冊會更新，模式參數會改版。\n人工智慧的訓練資料有時間截點，而且它不會主動告訴你這件事。\n所以請養成習慣，在報告中寫明擷取日期。' },
    { t: '三段式查證演練', s: '第二節', b: ['第一段｜找錯：五處刻意錯誤，逐一標出並說明理由', '第二段｜改寫：改成可查證版本，每個事實附來源與日期', '第三段｜自問自答：針對自己的期末題目設計三個易被誤導的提問', '評分：找錯 30%、改寫 30%、自問自答 25%、AI 聲明 15%'],
      n: '第二節是今天的實作，三段式查證演練。\n第一段是找錯。\n我會提供一段關於某溪流水質改善的人工智慧生成文字。\n裡面有五處刻意的錯誤，分別是單位、數量級、化學不成立、幻覺來源、因果誤植各一處。\n請逐一標出並說明理由。\n第二段是改寫，把它改成可查證的版本，每個事實都附來源跟擷取日期。\n第三段是自問自答。\n針對你自己的期末行動題目，設計三個最容易被人工智慧誤導的提問。\n實際去問，並記錄查證過程跟結果。' },
    { t: '查證紀錄表怎麼寫', s: '第二節', b: ['欄位：原句 → 疑點 → 查證方式 → 一手來源 → 結論', '結論三選一：確認正確／修正後採用／刪除', '不確定就寫不確定，不要硬掰', '這張表本身就是你的學術誠信證明'],
      n: '這一頁教大家查證紀錄表的寫法。\n欄位有五個。\n原句、疑點、查證方式、一手來源、結論。\n結論只有三種選項。\n確認正確、修正後採用、或是刪除。\n如果查不到，請誠實寫不確定，不要硬掰。\n我要強調一件事。\n這張表本身就是你的學術誠信證明。\n將來你寫論文、做報告，這個習慣會一直用得上。' },
    { t: 'Exam 2 複習地圖', s: '第三節', b: ['範圍：Ch7–Ch11、Ch16、兩次參訪場域', '大氣化學約 35%（光化學、臭氧、•OH、酸雨）', '粒狀物與 SOA 約 20%', '水處理應用與工業廢水約 20%', '綠色化學與工業生態（含參訪）約 25%'],
      n: '第三節做期末考複習。\n範圍是第七到第十一章、第十六章，還有兩次參訪的場域。\n權重大致是這樣。\n大氣化學最重，大約三成五。\n包含光化學、臭氧、氫氧自由基跟酸雨。\n粒狀物與二次有機氣膠大約兩成。\n水處理應用與工業廢水大約兩成。\n綠色化學與工業生態，包含兩次參訪，大約兩成五。\n題型有單選、簡答、反應式書寫，還有一題工廠情境分析。' },
    { t: 'Exam 2 必背清單（一）大氣', s: '第三節', b: ['對流層遞減率約 6.5 °C/km', '乾淨雨水理論 pH ≒ 5.6；酸雨定義 pH < 5.0', '•OH 由 O(¹D) + H₂O 生成', 'Chapman 機制；Cl 觸媒淨反應 O₃ + O → 2O₂', 'VOCs 讓 O₃ 累積的關鍵：RO₂• + NO → RO• + NO₂'],
      n: '這一頁是大氣部分的必背清單。\n對流層的環境遞減率大約每公里六點五度。\n乾淨雨水的理論酸鹼值大約五點六，酸雨定義是小於五點零。\n氫氧自由基由激發態氧原子跟水生成。\n平流層的查普曼機制要會寫。\n氯的觸媒循環淨反應是臭氧加氧原子變兩個氧分子。\n最後這一條是本學期大氣部分最重要的一條。\n過氧自由基把一氧化氮氧化成二氧化氮，而不消耗臭氧。\n這就是臭氧得以累積的關鍵。' },
    { t: 'Exam 2 必背清單（二）粒狀物與設備', s: '第三節', b: ['三模態界線：0.1 µm 與 2.5 µm', '累積模態壽命最長、可長程傳輸、深入肺泡', '二次氣膠三類：硫酸鹽、硝酸鹽、SOA', '旋風 5–50 µm；ESP 與袋式對次微米有效', 'SCR 與 FGD 反應式'],
      n: '這一頁是粒狀物跟控制設備的必背清單。\n三個模態的界線是零點一微米跟二點五微米。\n累積模態壽命最長，可以長程傳輸，也最能深入肺泡。\n二次氣膠有三類，硫酸鹽、硝酸鹽跟二次有機氣膠。\n控制設備方面，旋風集塵器適用五到五十微米。\n靜電集塵器跟袋式集塵器對次微米粒子有效。\n最後兩個反應式一定要會寫。\n選擇性催化還原，還有石灰石濕式脫硫。' },
    { t: 'Exam 2 必背清單（三）製漿與工業生態', s: '第三節', b: ['白液 NaOH + Na₂S；HS⁻ 裂解 β-O-4 醚鍵', '苛化：Na₂CO₃ + Ca(OH)₂ → 2NaOH + CaCO₃', '石灰窯：CaCO₃ → CaO + CO₂', 'TRS 種類與極低嗅覺閾值', 'ECF vs TCF 的差異與取捨'],
      n: '這一頁是製漿與工業生態的必背清單。\n白液的成分是氫氧化鈉加硫化鈉。\n關鍵物種是硫氫根離子，它裂解木質素的醚鍵。\n苛化跟石灰窯這兩個反應式一定要會寫。\n總還原硫的種類要記得，還有它們極低的嗅覺閾值。\n最後是無元素氯跟全無氯製程的差異與取捨。\n這些內容都會出現在工廠情境分析題裡。\n請大家把兩次參訪的筆記拿出來再看一次。' },
    { t: '參訪口頭報告與對比角度', s: '第三節', b: ['每組 8 分鐘 + 2 分鐘問答', '必備：物質流圖、估算、可改善節點、與污水廠對比', '對比角度：規模、物質流導向、能源型態、社會介面', '評分：化學 40%、觀察與對比 25%、可執行 20%、表達 15%'],
      n: '最後進行第二次參訪的口頭報告。\n每組八分鐘加兩分鐘問答。\n必備內容是自畫物質流圖、一項估算、一個可改善的循環節點，還有跟東華污水廠的對比。\n我給大家四個對比角度。\n第一是規模，處理量跟能源使用的數量級差異。\n第二是物質流導向，污水廠是移除導向，紙廠是循環導向。\n第三是能源型態，一個以曝氣耗能為主，一個以自產蒸汽為主。\n第四是社會介面，一個在校園內幾乎無感，一個必須面對社區異味議題。' },
    { t: '本週小結', s: '小結', b: ['三層防線：知識、來源、一致性', '三種錯誤型態：單位數量級、化學不成立、來源幻覺', '反應式三檢：原子守恆、電荷守恆、方向合理', '下週 Exam 2；第 18 週線上成果發表'],
      n: '今天的重點收攏成三句話。\n第一，查證有三層防線：知識、來源、一致性。\n而知識防線就是這學期十五週的價值所在。\n第二，三種常見錯誤型態是單位與數量級、化學不成立、還有來源幻覺與過時資訊。\n第三，對任何反應式做三檢，原子守恆、電荷守恆、方向合理，三十秒就能攔下大部分幻覺。\n下週是期末考，範圍跟必背清單都已經公告。\n第十八週是線上的期末成果發表，請各組把時間空下來。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '本課程主張面對 AI 的三層防線，<b>不包括</b>下列何者？', o: ['知識防線：以自身化學判斷力辨識明顯錯誤', '來源防線：所有事實回到一手來源', '一致性防線：檢查輸出內部數字是否自洽', '權威防線：以模型知名度判斷可信度'], a: 3, e: '模型知名度與輸出正確性無關。三層防線為知識、來源、一致性；其中知識防線是其他兩層的前提——沒有化學判斷力，就不知道該去查什麼。' },
    { q: '某 AI 輸出宣稱「某市郊河川氨氮濃度為 500 mg/L，屬輕度污染」。最應優先質疑的是？', o: ['氨氮不能用 mg/L 表示', '數量級不合理：500 mg/L 屬原生污水等級，且與「輕度污染」的判斷自相矛盾', '氨氮不存在於河川中', '應改用 ppb 表示'], a: 1, e: '一般河川氨氮多在 0.1–數 mg/L；500 mg/L 是未處理污水或高濃度工業廢水的等級。此處同時犯了數量級錯誤與內部不一致（濃度極高卻稱輕度污染）。' },
    { q: '「以 N 計」與「以 NO₃⁻ 計」的換算比值約為多少？（N ＝ 14、NO₃⁻ ＝ 62）', o: ['1.0', '約 4.43', '約 2.0', '約 62'], a: 1, e: '62/14 ≒ 4.43。10 mg NO₃⁻-N/L 相當於約 44.3 mg NO₃⁻/L。混用兩種表示法是環境數據最常見的錯誤之一，判讀時務必看清標示。' },
    { q: '對 AI 提供的化學反應式做「三檢」，指的是？', o: ['字體、格式、排版', '原子守恆、電荷守恆、方向合理（熱力學可行）', '中文、英文、符號', '溫度、壓力、濃度'], a: 1, e: '原子守恆檢查是否配平；電荷守恆檢查離子式兩側總電荷；方向合理檢查該反應在給定條件下熱力學是否可行（如好氧環境不會大量產甲烷）。' },
    { q: '下列何者<b>最可能</b>是 AI 幻覺文獻的徵兆？', o: ['作者為知名學者且期刊存在', '標題與需求完美貼合、DOI 格式正確卻無法連上、卷期與年份對不上', '文獻年份較舊', '文獻為中文期刊'], a: 1, e: '幻覺文獻常「看起來太完美」：組合了真實作者、真實期刊與看似合理的 DOI，但實際上不存在。唯一可靠的驗證是實際連上 DOI 或出版社頁面。' },
    { q: '報告中引用法規限值時，最必要的做法是？', o: ['寫出限值數字即可', '到主管機關網站確認現行版本與修正日期，並在報告中標註擷取日期', '引用 AI 給的版本並註明「AI 提供」', '引用維基百科即可'], a: 1, e: '法規會修正，AI 訓練資料有時間截點且不會主動告知。標註現行版本與擷取日期是專業報告的基本要求，也是本課程 AI 倫理規範的具體實踐。' },
    { q: '關於 Exam 2 範圍，下列敘述何者<b>正確</b>？', o: ['只考大氣化學', '涵蓋 Ch7–Ch11、Ch16 與兩次參訪場域，並含一題工廠情境分析', '不含任何反應式書寫', '完全不涉及 Exam 1 的內容'], a: 1, e: 'Exam 2 以大氣化學為主（約 35%），並含粒狀物與 SOA、水處理應用與工業廢水、綠色化學與工業生態（含兩次參訪），題型包含反應式書寫與工廠情境分析。' },
    { q: '比較 NDHU 污水廠與製漿廠時，以工業生態學觀點最核心的差異是？', o: ['一個在室內、一個在室外', '污水廠以「移除污染物」為導向，製漿廠則以「化學品與能源循環」為導向', '兩者完全相同', '差異僅在規模大小'], a: 1, e: '污水廠的目標是把污染物自水相移除（轉入污泥），能源以曝氣消耗為主；製漿廠則建立了黑液回收與化學品循環，並自產蒸汽電力。兩者的物質流拓撲結構本質不同。' },
    { q: '若 AI 敘述「平流層臭氧與都市光化學臭氧由相同機制生成」，此錯誤屬於哪一類？', o: ['單位錯誤', '化學不成立（混淆兩個完全不同的生成機制）', '來源幻覺', '過時資訊'], a: 1, e: '平流層 O₃ 由 O₂ 光解（λ<242 nm）經 Chapman 機制生成；對流層 O₃ 則由 NO₂ 光解配合 VOCs／RO₂• 循環生成。兩者波長條件、前驅物與環境意義完全不同。' }
  ],
  links: [

  hw: 'AI 模組活動 III 查證紀錄表，課後 7 日內上傳；參訪 II 口頭報告（本週第三節）；Exam 2 自我檢核；完成本週線上練習。'

  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 7–11 章與第 16 章；並複習兩次參訪場域筆記',

VIEWS.currentWeek = function () {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var found = 0;
  STORE.d.plan.forEach(function (r) {
    var d = U.parseDate(r.date);
    if (d && d.getTime() <= today.getTime() + 6 * 864e5) {
      if (d.getTime() <= today.getTime() + 6 * 864e5 && d.getTime() >= today.getTime() - 0) found = found || r.week;
    }
  });
  // 取「日期 <= 今天+6天」中最大的一週（即本週或最近已開始的一週）
  var best = 0;
  STORE.d.plan.forEach(function (r) {
    var d = U.parseDate(r.date);
    if (d && d.getTime() <= today.getTime() + 6 * 864e5) best = r.week;
  });
  return best;
};

    h += '<div class="alert info">尚未匯入學生名單。請先到「學生名單」分頁貼上匯入，再到「教室日誌」點名，本表就會自動出現。</div>';
  } else if (!weeks.length) {
    h += '<div class="alert info">目前沒有任何點名資料。請到「教室日誌」分頁選擇週次——進入該週時系統會預設全員出席，即視為已點名。</div>';
  } else {
    h += '<div class="tblwrap"><table class="t"><thead><tr><th>座號</th><th>班級</th><th>姓名</th>' +
      weeks.map(function (w) { return '<th>W' + w + '</th>'; }).join('') +
      '<th>出席率</th></tr></thead><tbody>' +
      ss.map(function (s) {
        var st = STORE.studentAtt(s.id);
        return '<tr><td>' + U.esc(s.seat) + '</td><td>' + U.esc(s.cls) + '</td><td>' + U.esc(s.name) + '</td>' +
          weeks.map(function (w) {
            var v = STORE.logOf(w).att[s.id] || 'none';
            return '<td style="text-align:center">' + CONFIG.ATT_SYMBOL[v] + '</td>';
          }).join('') +
          '<td class="num">' + (st.counted ? U.pct(st.present, st.counted) : '—') + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<p class="hint">符號：● 出席　✕ 缺席　假 請假　— 未點名。個人出席率＝出席次數 ÷ 該生有點名的週數。</p>' +
      '<div class="btnrow"><button class="btn ghost sm" onclick="ACT.exportAttCSV()">⬇ 匯出出席 CSV</button></div>';
  }
  h += '</div>';

  /* 3. 練習得分表 + 成績代碼匯入 */
  h += '<div class="card"><h2><span class="eyebrow">04 / SCORES</span>練習得分表<span class="pill gray">自動連動練習成績</span></h2>';
  var scoreWeeks = [];
  STORE.d.scores.forEach(function (r) { if (scoreWeeks.indexOf(r.week) < 0) scoreWeeks.push(r.week); });
  scoreWeeks.sort(function (a, b) { return a - b; });
  if (!ss.length) {
    h += '<div class="alert info">尚未匯入學生名單，無法對應成績。</div>';
  } else if (!scoreWeeks.length) {
    h += '<div class="alert info">尚無練習成績。學生於練習頁交卷後會產生「成績代碼」，請貼到下方匯入框整批匯入（一行一筆）。</div>';
  } else {
    h += '<div class="tblwrap"><table class="t"><thead><tr><th>座號</th><th>姓名</th>' +
      scoreWeeks.map(function (w) { return '<th>W' + w + '</th>'; }).join('') + '<th>平均</th></tr></thead><tbody>' +
      ss.map(function (s) {
        var vals = [];
        var tds = scoreWeeks.map(function (w) {
          var v = STORE.scoreOfStudent(s, w);
          if (v !== null) vals.push(v);
          return '<td class="num">' + (v === null ? '—' : v) + '</td>';
        }).join('');
        var avg = vals.length ? Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) : null;
        return '<tr><td>' + U.esc(s.seat) + '</td><td>' + U.esc(s.name) + '</td>' + tds +
          '<td class="num"><b>' + (avg === null ? '—' : avg) + '</b></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint">同一學生同一週有多筆時取<b>最高分</b>。</p>' +
      '<div class="btnrow"><button class="btn ghost sm" onclick="ACT.exportScoreCSV()">⬇ 匯出成績 CSV</button></div>';
  }
  if (STORE.d.pending.length) {
    h += '<div class="alert red">有 ' + STORE.d.pending.length + ' 筆成績代碼對應不到名單（待處理）：' +
      STORE.d.pending.map(function (p, i) {
        return '<div style="margin-top:4px">W' + p.week + '　座號 ' + U.esc(p.seat) + '　' + U.esc(p.name) + '　' + p.score + ' 分' +
          ' <button class="btn sm ghost" onclick="ACT.dropPending(' + i + ')">移除</button></div>';
      }).join('') + '</div>';
  }
  h += '<hr class="divider"><label class="f">成績代碼整批匯入（一行一筆，可直接貼上多行）</label>' +
    '<textarea id="scoreBox" placeholder="例：eyJ2IjoxLCJ3ZWVrIjoxMywic2VhdCI6IjAxIiwibmFtZSI6IuW8teWwj+aYjiIsInNjb3JlIjo5MH0="></textarea>' +
    '<div class="btnrow"><button class="btn" onclick="ACT.importScores()">📥 匯入成績代碼</button>' +
    '<button class="btn ghost" onclick="document.getElementById(\'scoreBox\').value=\'\'">清空</button></div>' +
    '<div id="scoreMsg"></div></div>';

  /* 5. 成績完成度 */
  h += '<div class="card"><h2><span class="eyebrow">05 / GRADING</span>成績完成度' +
    '<a class="pill teal" href="#/admin/grades" style="text-decoration:none">前往成績結算 →</a></h2>';
  if (!ss.length) {
    h += '<div class="alert info">尚未匯入學生名單，成績結算尚無法開始。</div>';
  } else {
    var comp = GRADE.completeness();
    var done = comp.filter(function (c) { return c.filled >= c.total; }).length;
    h += '<div class="stats" style="margin-bottom:10px">' +
      '<div class="stat"><div class="k">已完成的評分項目</div><div class="v">' + done + ' / ' + comp.length + '</div><div class="u">全班都有分數的欄位數</div></div>' +
      '<div class="stat t2"><div class="k">撲滿帳本筆數</div><div class="v">' + STORE.d.bank.length + '<span class="u"> 筆</span></div></div>' +
      '<div class="stat t3"><div class="k">權重合計</div><div class="v">' + GRADE.weightSum() + '<span class="u"> %</span></div></div>' +
      '<div class="stat t4"><div class="k">學期總成績平均</div><div class="v">' +
      U.round1(ss.reduce(function (a, s) { return a + GRADE.row(s).total1; }, 0) / ss.length) + '</div></div>' +
      '</div>' +
      '<div class="tblwrap"><table class="t"><thead><tr><th>評分項目</th><th style="width:110px">型式</th>' +
      '<th style="width:120px">已填人數</th><th style="width:90px">完成率</th></tr></thead><tbody>' +
      comp.map(function (c) {
        var full = c.filled >= c.total;
        return '<tr><td>' + U.esc(c.name) + '</td>' +
          '<td>' + (c.auto ? '<span class="pill gray">自動</span>' : '<span class="pill teal">手動</span>') + '</td>' +
          '<td class="num">' + c.filled + ' / ' + c.total + '</td>' +
          '<td class="num">' + (full ? '<span class="pill green">100%</span>' : U.pct(c.filled, c.total)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint">自動欄若顯示未滿，代表該生還沒有點名紀錄或練習成績；手動欄未滿代表還沒登記分數。</p>';
  }
  h += '</div>';

  /* 6. 快速連結 */
  h += '<div class="card"><h2><span class="eyebrow">06 / LINKS</span>快速連結（可複製給學生）</h2>' +
    VIEWS.copyRow('學生入口', U.urlFor('#/student')) +
    '<hr class="divider"><p class="hint">各週練習網址一覽：</p>' +
    STORE.d.plan.filter(function (r) { return CONTENT[r.week] && CONTENT[r.week].quiz && CONTENT[r.week].quiz.length; })
      .map(function (r) { return VIEWS.copyRow('W' + r.week + ' 練習', U.urlFor('#/practice/' + r.week)); }).join('') +
    '</div>';

  return h;
};

VIEWS.ro = function (k, v) {

/* =========================================================================
 * 分頁四：課程內容（週次總表）
 * ========================================================================= */
VIEWS.contentTab = function () {
  var h = '<div class="card"><h2><span class="eyebrow">01 / CONTENT</span>課程內容（點選週次進入教材、簡報與練習）</h2>' +
    '<p class="hint">學生可用網址直接進入：<code>#/week/N</code>（課程內容）、<code>#/practice/N</code>（練習）、<code>#/student</code>（學生入口）。' +
    '學生視角不會看到管理分頁。</p><div class="weekgrid">';
  STORE.d.plan.forEach(function (r) {
    h += VIEWS.weekCard(r);
  });
  h += '</div></div>';

  /* 20 分鐘動手做活動一覽（教授版） */
  var acts = [];
  STORE.d.plan.forEach(function (r) { if (CONTENT[r.week] && CONTENT[r.week].activity) acts.push(r.week); });
  h += '<div class="card"><h2><span class="eyebrow">02 / HANDS-ON</span>每週 20 分鐘動手做' +
    '<span class="pill gold">' + acts.length + ' 個活動</span></h2>' +
    '<p class="hint">全部材料取自廢棄品／農廢／廚餘／家庭常備，零花費；每個活動的化學連結逐條對應該週學習目標。點週次展開完整內容（學生在 <code>#/week/N</code> 也看得到同一份）。</p>' +
    '<div class="tblwrap"><table class="t"><thead><tr><th style="width:70px">週次</th><th>活動名稱</th>' +
    '<th style="width:110px">綠色化學原則</th><th style="width:90px">化學連結</th></tr></thead><tbody>' +
    acts.map(function (w) {
      var A = CONTENT[w].activity;
      return '<tr><td style="text-align:center"><b>W' + w + '</b></td>' +
        '<td>🧪 ' + U.esc(A.name) + '</td>' +
        '<td style="text-align:center">' + (A.green || []).map(function (g) { return g.p; }).join('、') + '</td>' +
        '<td style="text-align:center">' + (A.chem || []).length + ' 條</td></tr>';
    }).join('') + '</tbody></table></div>';
  if (Object.keys(ACTIVITY_NONE).length) {
    h += '<p class="hint" style="margin-top:10px">無活動週：' +
      Object.keys(ACTIVITY_NONE).map(function (k) { return 'W' + k; }).join('、') +
      '（考試週與假日週，各週頁面已註明原因）。</p>';
  }
  h += '</div>';
  acts.forEach(function (w) {
    h += '<details style="margin:10px 0"><summary style="cursor:pointer;font-weight:800;color:var(--navy);padding:8px 4px">' +
      '第 ' + w + ' 週　🧪 ' + U.esc(CONTENT[w].activity.name) + '</summary>' + VIEWS.activity(w) + '</details>';
  });
  return h;
};

VIEWS.weekCard = function (r) {
  var C = CONTENT[r.week];
  var cls = C ? (C.type === 'holiday' ? ' holiday' : (C.type === 'exam' ? ' exam' : '')) : '';
  var tag = C ? (C.type === 'holiday' ? '<span class="pill gold">放假</span>' :
    (C.type === 'exam' ? '<span class="pill red">考試</span>' : '<span class="pill green">教學週</span>')) :
    '<span class="pill gray">未建教材</span>';
  return '<a class="wk' + cls + '" href="#/week/' + r.week + '">' +
    '<div class="n">WEEK ' + r.week + '　' + tag + '</div>' +
    '<div class="tt">' + U.esc((C && C.title) ? C.title.slice(0, 34) : (r.topic || '（未填主題）').slice(0, 34)) + '</div>' +
    '<div class="dt">' + U.esc(r.date || '未填日期') + '　·　' + (parseFloat(r.hours) || 0) + ' 小時</div>' +
    (C && C.activity ? '<div class="dt" style="margin-top:4px;color:#9A6B00">🧪 ' + U.esc(C.activity.name) + '</div>' : '') +
    '</a>';
};

/* =========================================================================
 * 動手做活動區塊（教授版「課程內容」與學生 #/week/N 共用）
 * ========================================================================= */
VIEWS.srcCls = function (src) {
  return src === '農廢' ? ' class="s2"' : (src === '廚餘' ? ' class="s3"' : (src === '廢棄品' ? '' : ' class="s4"'));
};
VIEWS.activity = function (n) {
  var C = CONTENT[n];
  if (!C) return '';
  if (!C.activity) {
    return C.activityNone
      ? '<div class="card"><h2><span class="eyebrow">HANDS-ON</span>🧪 20 分鐘動手做</h2>' +
        '<div class="actnone">本週不安排動手做。' + U.esc(C.activityNone) + '</div></div>'
      : '';
  }
  var A = C.activity, goals = C.goals || [];
  var h = '<div class="card"><h2><span class="eyebrow">HANDS-ON</span>🧪 20 分鐘動手做' +
    '<span class="pill gold">零花費材料</span></h2><div class="act">' +
    '<div class="asub">WEEK ' + n + ' · HANDS-ON ACTIVITY</div>' +
    '<h3>' + U.esc(A.name) + '<span class="amin">' + (A.minutes || 20) + ' 分鐘</span></h3>';

  h += '<h4>① 材料（全部取自廢棄品／農廢／廚餘／家庭常備，零花費）</h4><div class="mats">' +
    (A.materials || []).map(function (m) {
      return '<span class="mat">' + U.esc(m.item) + '<em' + VIEWS.srcCls(m.source) + '>' + U.esc(m.source) + '</em></span>';
    }).join('') + '</div>';

  h += '<h4>② 步驟時間軸</h4><div class="tl">' +
    (A.steps || []).map(function (s) {
      return '<div class="tli"><b>' + U.esc(s.t) + '</b>' + U.esc(s.s) + '</div>';
    }).join('') + '</div>';

  h += '<h4>③ 化學連結（逐條對應本週學習目標）</h4>' +
    (A.chem || []).map(function (c) {
      var lab = c.g > 0 ? ('目標 ' + c.g) : '核心機制';
      var tip = (c.g > 0 && goals[c.g - 1]) ? String(goals[c.g - 1]).replace(/<[^>]+>/g, '') : '';
      return '<div class="chemli"><span class="gtag" title="' + U.attr(tip) + '">' + lab + '</span>' +
        U.esc(c.t) + '</div>';
    }).join('');

  h += '<h4>④ 綠色化學原則對照</h4><div>' +
    (A.green || []).map(function (g) {
      return '<span class="gp"><b>原則 ' + g.p + '</b>' + U.esc(g.why) + '</span>';
    }).join('') + '</div>';

  h += '<h4>⑤ 安全注意</h4><div class="safe"><ul>' +
    (A.safety || []).map(function (s) { return '<li>' + U.esc(s) + '</li>'; }).join('') + '</ul></div>';

  h += '<h4>⑥ 觀察紀錄與思考題</h4><div class="obs"><ol>' +
    (A.observe || []).map(function (s) { return '<li>' + U.esc(s) + '</li>'; }).join('') + '</ol></div>';

  h += '</div></div>';
  return h;
};

/* =========================================================================
 * 分頁五：教室日誌
 * ========================================================================= */
VIEWS.log = function () {
  var w = VIEWS.logWeek || 1;
  if (w > STORE.d.course.totalWeeks) w = STORE.d.course.totalWeeks;
  VIEWS.logWeek = w;
  STORE.ensureWeekDefault(w);           // 進入某週：尚未建立者一律預設出席
  var row = STORE.planRow(w), L = STORE.logOf(w), ss = STORE.d.students;
  var cnt = STORE.weekCount(w), tc = STORE.teacherCount(), T = tc.T;
  var M = ss.length, N = cnt.present, IN = cnt.inClass;
  var cls = STORE.classAtt();

  var h = '<div class="card"><h2><span class="eyebrow">01 / CLASS LOG</span>教室日誌</h2>' +
    '<div class="grid g3">' +
    '<div class="field"><label class="f">週次</label><select onchange="ACT.gotoLogWeek(this.value)">' +
    STORE.d.plan.map(function (r) {
      return '<option value="' + r.week + '"' + (r.week === w ? ' selected' : '') + '>第 ' + r.week + ' 週</option>';
    }).join('') + '</select></div>' +
    VIEWS.ro('日期（自課程規劃表）', row.date || '未填') +
    VIEWS.ro('時數', (parseFloat(row.hours) || 0) + ' 小時') +
    '</div>' +
    VIEWS.ro('主題（自課程規劃表）', row.topic || '未填') +
    '<div class="btnrow"><button class="btn" onclick="ACT.allPresent()">✅ 全到</button>' +
    '<button class="btn danger" onclick="ACT.clearWeek()">🧹 清除本週</button></div>';

  if (!ss.length) {
    h += '<div class="alert info">尚未匯入學生名單，請先到「學生名單」分頁匯入。</div>';
  } else {
    h += '<div class="attgrid">' + ss.map(function (s) {
      var st = L.att[s.id] || 'none';
      return '<button class="attbtn" data-s="' + st + '" onclick="ACT.cycle(\'' + s.id + '\')" ' +
        'title="' + U.attr(CONFIG.ATT_LABEL[st] || st) + '（點一下換下一個狀態）">' +
        '<span class="sq">' + (CONFIG.ATT_SYMBOL[st] || '?') + '</span>' +
        '<span class="nm">' + U.esc(s.name || '（未命名）') + '</span>' +
        '<span class="st">' + U.esc(CONFIG.ATT_SHORT[st] || st) + '</span>' +
        '<span class="seat">' + U.esc(s.seat) + '</span></button>';
    }).join('') + '</div>' +
      '<div class="attlegend">' +
      ['present', 'late1', 'late2', 'absent', 'leave', 'none'].map(function (k) {
        var col = { present: 'var(--green)', late1: '#E8B004', late2: '#D97706', absent: 'var(--danger)', leave: '#5B7C95', none: '#B9C4CC' }[k];
        return '<span><i style="background:' + col + '"></i>' + CONFIG.ATT_SYMBOL[k] + '　' + U.esc(CONFIG.ATT_LABEL[k]) +
          (typeof CONFIG.ATT_WEIGHT[k] === 'number' && k !== 'none' ? '（係數 ' + CONFIG.ATT_WEIGHT[k] + '）' : '') + '</span>';
      }).join('') + '</div>' +
      '<p class="hint">點一下依序循環：出席 → 遲到/早退≤20分 → 遲到/早退>20分（或早退未告知） → 缺席 → 請假 → 出席。' +
      '進入某週時系統預設全員出席（＝視為已點名）；按「清除本週」後全部回到未點名。' +
      '括號內的係數用於「成績結算」分頁的出席原始分計算。</p>';

    /* 請假者的假別註記 */
    var lv = ss.filter(function (s) { return L.att[s.id] === 'leave'; });
    if (lv.length) {
      h += '<hr class="divider"><label class="f">請假假別註記（' + lv.length + ' 位）</label><div class="leavesel">' +
        lv.map(function (s) {
          return '<div class="lv"><b>' + U.esc(s.name || '（未命名）') + '</b>' +
            '<select onchange="ACT.setLeaveKind(\'' + s.id + '\',this.value)">' +
            ['<option value="">（未註記）</option>'].concat(CONFIG.LEAVE_KINDS.map(function (k) {
              return '<option value="' + U.attr(k) + '"' + (L.leaveKind[s.id] === k ? ' selected' : '') + '>' + U.esc(k) + '</option>';
            })).join('') + '</select></div>';
        }).join('') + '</div>' +
        '<p class="hint">未依 SOP 請假的次數，請到「成績結算」分頁的「未依 SOP 請假」欄登記（每次總成績 −' +
        (GRADE.W().sopPenalty) + ' 分）。</p>';
    }
  }
  h += '</div>';

  /* 摘要列 */
  h += '<div class="card"><h2><span class="eyebrow">02 / SUMMARY</span>本週摘要與材料費</h2>' +
    '<div class="banner">本週上課人數 <b>' + IN + '</b> 人／共 ' + M + ' 人' +
    '（出席 ' + cnt.present + '、遲到/早退≤20分 ' + cnt.late1 + '、遲到/早退>20分 ' + cnt.late2 +
    '、缺席 ' + cnt.absent + '、請假 ' + cnt.leave + '）' +
    '　→　加上授課教師 ' + T + ' 位＝材料費 <b>' + (IN + T) + '</b> 份</div>';
  if (!tc.filled) h += '<div class="alert red">請先到總覽基本資料填指導老師姓名（目前兩欄皆空，T 暫以 2 計）</div>';
  if (cnt.none > 0) h += '<div class="alert red">還有 ' + cnt.none + ' 位未點名，這週的數字先不算數</div>';
  h += '<div class="stats" style="margin-top:12px">' +
    '<div class="stat"><div class="k">本週出席率</div><div class="v">' + U.pct(N, M) + '</div><div class="u">出席 ÷ 總報名人數</div></div>' +
    '<div class="stat t2"><div class="k">全班累計出席率</div><div class="v">' + U.pct(cls.present, cls.denom) + '</div><div class="u">請假與缺席都算分母</div></div>' +
    '<div class="stat t3"><div class="k">已完成點名週數</div><div class="v">' + cls.weeks + '<span class="u"> 週</span></div></div>' +
    '<div class="stat t4"><div class="k">材料費份數</div><div class="v">' + (IN + T) + '<span class="u"> 份</span></div></div>' +
    '</div>' +
    '<p class="hint">上課人數＝出席＋兩級遲到/早退（人有到就有領材料）；出席率的定義維持不變（分母含請假與缺席）。</p>' +
    '<div class="alert warn" style="margin-top:12px"><b>' + U.esc(CONFIG.MATERIAL_FORMULA) + '</b>' +
    '　（本課程單價：' + (STORE.d.course.materialUnitPrice || 250) + ' 元，可於「備份與設定」調整）</div>' +
    '</div>';

  /* 課程紀錄 */
  h += '<div class="card"><h2><span class="eyebrow">03 / RECORD</span>本週課程紀錄（成果報告書・參 的素材）</h2>' +
    '<div class="field"><label class="f">課程紀錄文字（逐週各自儲存）</label>' +
    '<textarea style="min-height:130px" oninput="ACT.setRecord(\'text\',this.value)" placeholder="本週上課實況、學生反應、特殊事件、與綠色化學／花蓮在地的連結…">' +
    U.esc(L.record.text) + '</textarea></div>' +
    '<div class="grid g2">' +
    '<div class="field"><label class="f">照片檔名</label><input type="text" value="' + U.attr(L.record.photo) + '" ' +
    'oninput="ACT.setRecord(\'photo\',this.value)" placeholder="例：20261005-水化學實作-01.jpg"></div>' +
    '<div class="field"><label class="f">圖說（含日期與地點）</label><input type="text" value="' + U.attr(L.record.caption) + '" ' +
    'oninput="ACT.setRecord(\'caption\',this.value)" placeholder="例：圖 1　水質檢測實作（2026/10/05，環境學院 A124）"></div>' +
    '</div>' +
    '<div class="btnrow"><button class="btn teal" onclick="ACT.printRecords()">🖨 列印課程紀錄（參）</button></div></div>';

  /* 照片牆（影像存 IndexedDB，每週最多 5 張） */
  var pn = L.photos.length, PM = CONFIG.PHOTO.MAX_PER_WEEK;
  h += '<div class="card"><h2><span class="eyebrow">04 / PHOTOS</span>本週照片牆' +
    '<span class="pill ' + (pn >= PM ? 'red' : 'teal') + '">' + pn + ' / ' + PM + ' 張</span></h2>' +
    '<p class="hint">選檔後自動壓縮（最長邊 ' + CONFIG.PHOTO.MAX_EDGE + 'px、JPEG 品質 ' + CONFIG.PHOTO.QUALITY +
    '）並存入瀏覽器的 IndexedDB（<code>' + CONFIG.PHOTO.DB + '</code>）；' +
    '每週上限 ' + PM + ' 張，超出會被擋下。圖說請依 APA 原則寫「說明（日期，地點）」。</p>' +
    '<div class="pdrop">📷 每週 0–' + PM + ' 張　·　可一次多選　·　影像不會寫進 localStorage，容量不會爆掉</div>' +
    '<input type="file" id="photoFile" accept="image/*" multiple style="display:none" onchange="ACT.addPhotos(this)">' +
    '<div class="btnrow">' +
    '<button class="btn"' + (pn >= PM ? ' disabled style="opacity:.5;cursor:not-allowed"' : '') +
    ' onclick="document.getElementById(\'photoFile\').click()">＋ 選擇照片（還可加 ' + Math.max(0, PM - pn) + ' 張）</button>' +
    '<button class="btn ghost" onclick="ACT.reloadPhotos()">🔄 重新載入縮圖</button>' +
    '</div>' +
    '<div class="photowall" id="photowall">' +
    (pn ? '<div class="hint">載入中…</div>' : '<div class="hint">本週尚未上傳照片。</div>') +
    '</div></div>';
  return h;
};

/* 照片牆縮圖：非同步從 IndexedDB 取回後填入 #photowall */
VIEWS.renderPhotos = function () {
  var box = document.getElementById('photowall');
  if (!box) return;
  var w = VIEWS.logWeek || 1, L = STORE.logOf(w);
  if (!L.photos.length) { box.innerHTML = '<div class="hint">本週尚未上傳照片。</div>'; return; }
  PHOTO.getMany(L.photos.map(function (p) { return p.k; })).then(function (arr) {
    var map = {};
    arr.forEach(function (o) { map[o.k] = o.v; });
    box.innerHTML = L.photos.map(function (p, i) {
      var url = map[p.k] || '';
      var kb = url ? (PHOTO.bytesOf(url) / 1024).toFixed(0) + ' KB' : '影像遺失';
      return '<div class="pcard">' +
        (url ? '<img class="ph" src="' + url + '" alt="' + U.attr(p.cap || ('第 ' + w + ' 週照片 ' + (i + 1))) + '">'
             : '<div class="ph" style="display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:12.5px">影像遺失</div>') +
        '<div class="pb">' +
        '<div class="pm"><span>圖 ' + (i + 1) + '　<code>' + U.esc(p.k) + '</code></span><span>' + kb + '</span></div>' +
        '<input type="text" value="' + U.attr(p.cap || '') + '" placeholder="圖 ' + (i + 1) + '　說明（日期，地點）" ' +
        'oninput="ACT.setPhotoCap(' + i + ',this.value)">' +
        '<div class="btnrow" style="margin-top:7px">' +
        '<button class="btn sm danger" onclick="ACT.delPhoto(' + i + ')">🗑 刪除</button></div>' +
        '</div></div>';
    }).join('');
  }, function (e) {
    box.innerHTML = '<div class="alert red">照片讀取失敗：' + U.esc(e && e.message ? e.message : String(e)) + '</div>';
  });
};

/* =========================================================================
 * 分頁六：成績結算（僅教授版）
 * ========================================================================= */
VIEWS.grades = function () {
  var ss = STORE.d.students, W = GRADE.W();
  var h = '<div class="card"><h2><span class="eyebrow">01 / GRADES</span>學期成績結算' +
    '<span class="pill teal">' + ss.length + ' 位</span>' +
    (GRADE.weightSum() === 100 ? '<span class="pill green">權重合計 100%</span>'
                               : '<span class="pill red">權重合計 ' + GRADE.weightSum() + '%（不是 100，請到備份與設定調整）</span>') +
    '</h2>' +
    '<div class="alert info"><b>計算式</b>：學期總成績 ＝ Σ（各項 0–100 分 × 權重） ＋ 分數撲滿加分 − 未依 SOP 請假扣分，下限 0。<br>' +
    '平時 ' + (W.att + W.disc + W.ai) + '%（出席 ' + W.att + '、討論及 Zuvio 雲端回饋 ' + W.disc + '、AI 翻轉及 AI 模組 ' + W.ai + '）' +
    '＋期中考 ' + W.mid + '%＋期末考 ' + W.fin + '%' +
    '＋參訪報告 ' + (W.v1 + W.v2 + W.v3) + '%（書面 ' + W.v1 + '＋組間互評 ' + W.v2 + '＋組內互評 ' + W.v3 + '）' +
    '＋行動報告 ' + (W.a1 + W.a2 + W.a3) + '%（' + W.a1 + '＋' + W.a2 + '＋' + W.a3 + '）。<br>' +
    '<b>分數撲滿</b>為額外加分：累計點數封頂 ' + W.bankCap + ' 點，÷ ' + W.bankDiv + ' ＝ 加分，至多 +' + W.bonusMax + ' 分。' +
    '<b>未依 SOP 請假</b>每次總成績 −' + W.sopPenalty + ' 分。</div>' +
    '<p class="hint">灰底欄位為<b>自動計算</b>（出席由教室日誌、AI 由練習得分表），可直接輸入數字<b>覆寫</b>（覆寫後底色轉金黃）；' +
    '清空該欄即回到自動值。所有輸入即時存檔。</p>';

  if (!ss.length) {
    h += '<div class="alert info">尚未匯入學生名單。請先到「學生名單」分頁貼上匯入。</div></div>';
    return h;
  }

  /* --- 主表 --- */
  h += '<div class="tblwrap"><table class="g"><thead>' +
    '<tr><th rowspan="2" style="min-width:150px">學生</th>' +
    CONFIG.GRADE_COLS.map(function (c) { return '<th>' + U.esc(c.name) + '</th>'; }).join('') +
    '<th>撲滿<br>點數</th><th>撲滿<br>加分</th><th>SOP<br>違規</th>' +
    '<th rowspan="2">總成績<br>(一位小數)</th><th rowspan="2">總成績<br>(四捨五入)</th></tr>' +
    '<tr>' + CONFIG.GRADE_COLS.map(function (c) {
      return '<th class="wgt">' + W[c.w] + '%' + (c.auto ? ' 自動' : '') + '</th>';
    }).join('') +
    '<th class="wgt">上限 ' + W.bankCap + '</th><th class="wgt">最多 +' + W.bonusMax + '</th><th class="wgt">每次 −' + W.sopPenalty + '</th></tr>' +
    '</thead><tbody>';

  var totals = {}, tcount = {}, sumTot = 0;
  h += ss.map(function (s, i) {
    var g = STORE.gradeOf(s.id), R = GRADE.row(s), att = STORE.studentAtt(s.id);
    sumTot += R.total1;
    var tds = CONFIG.GRADE_COLS.map(function (c) {
      var manual = g[c.k], auto = c.auto ? GRADE.autoVal(s, c.k) : null;
      var shown = (manual === null || typeof manual === 'undefined') ? '' : manual;
      var v = R.parts[c.k];
      if (v !== null && typeof v !== 'undefined') { totals[c.k] = (totals[c.k] || 0) + v; tcount[c.k] = (tcount[c.k] || 0) + 1; }
      var ph = c.auto ? (auto === null ? '無資料 0' : String(auto)) : '—';
      var tip = c.auto
        ? (c.k === 'att'
            ? '自動值＝Σ狀態係數 ÷ 已點名 ' + att.counted + ' 週 × 100；請假 ' + att.leaves + ' 次、遲到 ' + att.lates + ' 次、缺席 ' + att.absents + ' 次'
            : '自動值＝練習得分表個人平均')
        : '手動輸入 0–100';
      return '<td' + (c.auto ? ' class="auto"' : '') + ' title="' + U.attr(tip) + '">' +
        '<input type="number" min="0" max="100" step="0.1" value="' + U.attr(shown) + '" placeholder="' + U.attr(ph) + '"' +
        (shown !== '' && c.auto ? ' class="ov"' : '') +
        ' onchange="ACT.setGrade(\'' + s.id + '\',\'' + c.k + '\',this.value)"></td>';
    }).join('');
    return '<tr><td class="name">' + U.esc(s.seat ? s.seat + '　' : '') + U.esc(s.name || '（未命名）') +
      (att.leaves ? '<br><span class="gnote">請假 ' + att.leaves + ' 次</span>' : '') + '</td>' +
      tds +
      '<td class="auto" title="撲滿帳本累計，封頂 ' + W.bankCap + ' 點">' + R.bankPts +
      (R.bankPts > W.bankCap ? '<br><span class="gnote">計 ' + R.bankCapped + '</span>' : '') + '</td>' +
      '<td class="auto"><b>+' + R.bonus + '</b></td>' +
      '<td><input type="number" min="0" step="1" value="' + (g.sop || 0) + '" style="width:52px"' +
      ' onchange="ACT.setGrade(\'' + s.id + '\',\'sop\',this.value)"></td>' +
      '<td class="tot">' + R.total1.toFixed(1) + '</td>' +
      '<td class="tot">' + R.totalInt + '</td></tr>';
  }).join('');

  h += '</tbody><tfoot><tr><td class="name">全班平均</td>' +
    CONFIG.GRADE_COLS.map(function (c) {
      return '<td>' + (tcount[c.k] ? U.round1(totals[c.k] / tcount[c.k]) : '—') + '</td>';
    }).join('') +
    '<td>—</td><td>—</td><td>—</td>' +
    '<td>' + (ss.length ? U.round1(sumTot / ss.length).toFixed(1) : '—') + '</td><td>—</td></tr></tfoot></table></div>' +
    '<div class="btnrow">' +
    '<button class="btn navy" onclick="ACT.exportGradeCSV()">⬇ 匯出成績總表 CSV</button>' +
    '<button class="btn teal" onclick="ACT.printGrades()">🖨 列印成績總表（A4 橫式）</button>' +
    '<button class="btn ghost" onclick="ACT.clearOverrides()">↩ 清除全部自動欄覆寫</button>' +
    '</div></div>';

  /* --- 分數撲滿帳本 --- */
  h += '<div class="card"><h2><span class="eyebrow">02 / POINT BANK</span>分數撲滿帳本' +
    '<span class="pill gold">共 ' + STORE.d.bank.length + ' 筆</span></h2>' +
    '<div class="alert warn"><b>點數規則</b>：' + CONFIG.BANK_RULES.map(function (r) { return U.esc(r); }).join('　·　') +
    '。累計封頂 ' + W.bankCap + ' 點，÷ ' + W.bankDiv + ' 換算為加分，至多 +' + W.bonusMax + ' 分。</div>' +
    '<div class="grid g4">' +
    '<div class="field"><label class="f">日期</label><input type="text" id="bkDate" value="' + U.attr(U.today()) + '" placeholder="YYYY/MM/DD"></div>' +
    '<div class="field"><label class="f">學生</label><select id="bkStu">' +
    ss.map(function (s) { return '<option value="' + U.attr(s.id) + '">' + U.esc((s.seat ? s.seat + ' ' : '') + (s.name || '（未命名）')) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field"><label class="f">事由</label><input type="text" id="bkWhy" placeholder="例：口述詳答（碳酸系統）"></div>' +
    '<div class="field"><label class="f">點數</label><input type="number" id="bkPt" step="1" value="1"></div>' +
    '</div><div class="btnrow"><button class="btn" onclick="ACT.addBank()">＋ 新增一筆</button></div>';

  if (!STORE.d.bank.length) {
    h += '<div class="alert info">帳本目前是空的。上課時當場登記，成績結算的撲滿加分就會自動更新。</div>';
  } else {
    var byStu = {};
    STORE.d.bank.forEach(function (r) { byStu[r.sid] = (byStu[r.sid] || 0) + (parseFloat(r.pt) || 0); });
    h += '<div class="banklist"><table class="t"><thead><tr><th style="width:120px">日期</th><th style="width:160px">學生</th>' +
      '<th>事由</th><th style="width:70px">點數</th><th style="width:60px">刪除</th></tr></thead><tbody>' +
      STORE.d.bank.slice().reverse().map(function (r) {
        var s = ss.filter(function (x) { return x.id === r.sid; })[0];
        var idx = STORE.d.bank.indexOf(r);
        return '<tr><td>' + U.esc(r.date) + '</td>' +
          '<td>' + U.esc(s ? ((s.seat ? s.seat + ' ' : '') + s.name) : '（已刪除的學生）') + '</td>' +
          '<td>' + U.esc(r.why) + '</td><td class="num">' + r.pt + '</td>' +
          '<td style="text-align:center"><button class="btn sm danger" onclick="ACT.delBank(' + idx + ')">✕</button></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint" style="margin-top:10px">各生累計：' +
      ss.map(function (s) {
        var p = byStu[s.id] || 0;
        return U.esc(s.name || '（未命名）') + ' ' + p + ' 點（+' + GRADE.bonusOf(s.id) + '）';
      }).join('　·　') + '</p>' +
      '<div class="btnrow"><button class="btn ghost sm" onclick="ACT.exportBankCSV()">⬇ 匯出撲滿帳本 CSV</button></div>';
  }
  h += '</div>';
  return h;
};

/* =========================================================================
 * 分頁七：備份與設定
 * ========================================================================= */
VIEWS.backup = function () {
  var c = STORE.d.course;
  var kb = (STORE.usageBytes() / 1024).toFixed(1);

  /* 成績權重 */
  var W = GRADE.W();
  var wlist = [

  h += '<div class="card"><h2><span class="eyebrow">02 / WEIGHTS</span>學期成績權重' +
    (GRADE.weightSum() === 100 ? '<span class="pill green">合計 100%</span>'

    '<p class="hint">預設依教學計畫表：平時 26（9＋6＋11）＋期中 25＋期末 25＋參訪 12（3＋4＋5）＋行動 12（3＋4＋5）＝ 100。' +
    '改動後「成績結算」分頁與課程範本會立即套用新權重。</p>' +
    '<div class="grid g4">' +
    wlist.map(function (x) {
      return '<div class="field"><label class="f">' + U.esc(x.n) + '（%）</label>' +
        '<input type="number" min="0" step="0.5" value="' + W[x.k] + '" onchange="ACT.setWeight(\'' + x.k + '\',this.value)"></div>';
    }).join('') +
    '<div class="field"><label class="f">撲滿點數上限</label><input type="number" min="0" step="1" value="' + W.bankCap +
    '" onchange="ACT.setWeight(\'bankCap\',this.value)"></div>' +
    '<div class="field"><label class="f">點數換算除數</label><input type="number" min="1" step="1" value="' + W.bankDiv +
    '" onchange="ACT.setWeight(\'bankDiv\',this.value)"></div>' +
    '<div class="field"><label class="f">撲滿加分上限</label><input type="number" min="0" step="1" value="' + W.bonusMax +
    '" onchange="ACT.setWeight(\'bonusMax\',this.value)"></div>' +

  h += '<div class="card"><h2><span class="eyebrow">03 / BACKUP</span>備份與還原</h2>' +

    '<button class="btn" onclick="ACT.exportBackup()">⬇ 匯出完整備份（JSON）</button>' +

    '<span class="pill teal">' + pc + ' 張／' + pw + ' 週</span></h2>' +

    '<div class="stats" style="margin-bottom:10px">' +
    '<div class="stat"><div class="k">照片總張數</div><div class="v">' + pc + '<span class="u"> 張</span></div></div>' +
    '<div class="stat t2"><div class="k">有照片的週數</div><div class="v">' + pw + '<span class="u"> 週</span></div></div>' +
    '<div class="stat t3"><div class="k">IndexedDB 用量</div><div class="v" id="photoUsage" style="font-size:19px">計算中…</div>' +
    '<div class="u">壓縮後約略值</div></div>' +
    '<div class="stat t4"><div class="k">每週上限</div><div class="v">' + CONFIG.PHOTO.MAX_PER_WEEK + '<span class="u"> 張</span></div></div>' +
    '</div>' +
    '<div class="btnrow">' +
    '<button class="btn" onclick="ACT.exportPhotos()">⬇ 匯出照片備份（JSON）</button>' +
    '<button class="btn teal" onclick="document.getElementById(\'impPhoto\').click()">📂 匯入照片備份</button>' +
    '<button class="btn danger" onclick="ACT.clearPhotos()">🗑 清除全部照片</button>' +
    '</div>' +
    '<input type="file" id="impPhoto" accept="application/json,.json" style="display:none" onchange="ACT.importPhotoFile(this)">' +
    '</div>';

  h += '<div class="card"><h2><span class="eyebrow">05 / STATUS</span>儲存狀態</h2><div class="stats">' +
    '<div class="stat"><div class="k">localStorage 用量</div><div class="v">' + kb + '<span class="u"> KB</span></div>' +
    '<div class="u">key：' + CONFIG.STORAGE_KEY + '</div></div>' +
    '<div class="stat t2"><div class="k">最後儲存時間</div><div class="v" style="font-size:17px">' + U.esc(STORE.d.lastSaved || '—') + '</div></div>' +
    '<div class="stat t3"><div class="k">schemaVersion</div><div class="v">' + STORE.d.schemaVersion + '</div></div>' +
    '<div class="stat t4"><div class="k">資料筆數</div><div class="v" style="font-size:17px">學生 ' + STORE.d.students.length +
    '／成績 ' + STORE.d.scores.length + '／撲滿 ' + STORE.d.bank.length + '</div></div>' +
    '</div></div>';
  return h;
};
VIEWS.inp = function (label, key, val) {
  return '<div class="field"><label class="f">' + U.esc(label) + '</label>' +
    '<input type="text" value="' + U.attr(val) + '" oninput="ACT.setCourse(\'' + key + '\',this.value)"></div>';
};

/* =========================================================================
 * 學生視角：週次課程內容 #/week/N
 * ========================================================================= */
VIEWS.week = function (n) {
  var C = CONTENT[n], row = STORE.planRow(n);
  var h = '<div class="wrap">';
  h += '<div class="card"><div class="sechead">WEEK ' + n + '</div>' +
    '<h2 style="font-size:23px">' + U.esc(C ? C.title : (row.topic || '（本週尚未建立教材）')) + '</h2>' +
    '<p class="hint">' + U.esc(row.date || '未填日期') + '　·　' + (parseFloat(row.hours) || 0) + ' 小時　·　' +
    U.esc(STORE.d.course.place) + '　·　' + U.esc(STORE.d.course.classTime) + '</p>';

  if (!C) {
    h += '<div class="alert info">本週教材尚未建立。若你是老師，可在 CONTENT 區新增 <code>CONTENT[' + n + ']</code> 物件。</div></div></div>';
    return h;
  }

  if (C.type === 'holiday') {
    h += '</div><div class="card" style="border-left:6px solid var(--gold)">' +
      '<h2>🎌 ' + U.esc(C.title) + '</h2><p>' + C.note + '</p></div>' +
      VIEWS.activity(n) + VIEWS.weekNav(n) + '</div>';
    return h;
  }

  h += '<div class="grid g2" style="margin-top:10px">' +
    '<div><div class="sechead">本週目標</div><ul>' + (C.goals || []).map(function (g) { return '<li>' + g + '</li>'; }).join('') + '</ul></div>' +
    '<div><div class="sechead">對應課本章節</div><p>' + U.esc(C.chapters || '') + '</p>' +
    '<p class="hint">' + U.esc(C.reading || '') + '</p></div></div></div>';

  if (C.type === 'exam') {
    h += '<div class="card"><h2><span class="eyebrow">01 / SCOPE</span>考試範圍</h2><ol>' +
      (C.scope || []).map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>';
    h += '<div class="card" style="border-left:6px solid var(--danger)"><h2><span class="eyebrow">02 / NOTICE</span>應考須知</h2><ol>' +
      (C.notice || []).map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></div>';
    h += '<div class="card"><h2><span class="eyebrow">03 / MOCK</span>模擬題練習</h2>' +
      '<p>本週練習為 <b>模擬題</b>（' + (C.quiz || []).length + ' 題），格式與正式考試相近，建議在無參考資料的情況下限時完成。</p>' +
      '<div class="btnrow"><a class="btn" href="#/practice/' + n + '">✏ 前往模擬題練習</a></div>' +
      VIEWS.copyRow('練習網址', U.urlFor('#/practice/' + n)) + '</div>';
    h += VIEWS.activity(n) + VIEWS.weekNav(n) + '</div>';
    return h;
  }

  /* 20 分鐘動手做（放在教材重點之前，讓學生先看到當週要動手的東西） */
  h += VIEWS.activity(n);

  /* 教材重點卡 */
  h += '<div class="card"><h2><span class="eyebrow">01 / KEY POINTS</span>教材重點（原創編寫）' +
    '<span class="pill green">' + C.cards.length + ' 張</span></h2><div class="mcards">' +
    C.cards.map(function (c, i) {
      return '<div class="mcard"><div class="no">POINT ' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</div>' +
        '<h3>' + U.esc(c.h) + '</h3><div>' + c.b + '</div>' +
        (c.local ? '<div class="local">🌿 ' + c.local + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';

  /* 簡報播放器 */
  h += '<div class="card"><h2><span class="eyebrow">02 / SLIDES</span>三節課簡報' +
    '<span class="pill teal">' + C.slides.length + ' 張</span></h2>' +
    '<div id="deck"></div>' +
    '<p class="hint">操作：← → 鍵切換投影片，或用下方按鈕。每張皆附備忘稿逐字稿（可切換顯示）。</p></div>';

  /* 練習 */
  h += '<div class="card"><h2><span class="eyebrow">03 / PRACTICE</span>學生練習</h2>' +
    '<p>本週共 <b>' + C.quiz.length + '</b> 題原創題目，交卷後即時評分並附解析，並產生「成績代碼」回報給老師。</p>' +
    '<div class="btnrow"><a class="btn" href="#/practice/' + n + '">✏ 開始本週練習</a></div>' +
    VIEWS.copyRow('練習網址', U.urlFor('#/practice/' + n)) + '</div>';

  /* 學習單／連結 */
  if (C.links && C.links.length) {
    h += '<div class="card"><h2><span class="eyebrow">04 / WORKSHEET</span>學習單與延伸資源</h2><ul>' +
      C.links.map(function (l) {
        return '<li style="margin:.4em 0">' + (l.href ?
          '<a href="' + U.attr(l.href) + '" target="_blank" rel="noopener">' + U.esc(l.label) + '</a>' :
          U.esc(l.label)) + '</li>';
      }).join('') + '</ul>' +
      '<p class="hint">學習單為既有檔案，請放在與本系統相同的資料夾中即可開啟。<b>任何 API 金鑰、帳號密碼一律不得寫入學習單或程式碼。</b></p></div>';
  }

  /* 作業提醒 */
  if (C.hw) {
    h += '<div class="card" style="border-left:6px solid var(--moss)"><h2><span class="eyebrow">05 / HOMEWORK</span>作業提醒</h2>' +
      '<p>' + U.esc(C.hw) + '</p></div>';
  }

  h += VIEWS.weekNav(n) + '</div>';
  return h;
};

VIEWS.weekNav = function (n) {
  var total = STORE.d.course.totalWeeks;
  return '<div class="card"><div class="btnrow" style="margin:0">' +
    (n > 1 ? '<a class="btn ghost" href="#/week/' + (n - 1) + '">← 第 ' + (n - 1) + ' 週</a>' : '') +
    '<a class="btn navy" href="#/student">🏠 回學生入口</a>' +
    (n < total ? '<a class="btn ghost" href="#/week/' + (n + 1) + '">第 ' + (n + 1) + ' 週 →</a>' : '') +
    '<button class="btn teal" onclick="window.print()">🖨 列印本頁</button>' +
    '</div></div>';
};

/* ---------- 簡報播放器 ---------- */
VIEWS.deck = { week: 0, i: 0, notes: true };
VIEWS.renderDeck = function () {
  var box = document.getElementById('deck');
  if (!box) return;
  var C = CONTENT[VIEWS.deck.week];
  if (!C || !C.slides) return;
  var i = Math.max(0, Math.min(VIEWS.deck.i, C.slides.length - 1));
  VIEWS.deck.i = i;
  var s = C.slides[i];
  box.innerHTML = '<div class="deck">' +
    '<div class="slide' + (s.cover ? ' cover' : '') + '">' +
    '<div class="eyebrow">' + U.esc(s.s || '') + '　·　第 ' + VIEWS.deck.week + ' 週</div>' +
    '<h3>' + U.esc(s.t) + '</h3>' +
    '<ul>' + (s.b || []).map(function (b) { return '<li>' + U.esc(b) + '</li>'; }).join('') + '</ul>' +
    '</div>' +
    '<div class="deckbar">' +
    '<button class="btn sm ghost" onclick="ACT.slide(-1)">← 上一頁</button>' +
    '<button class="btn sm ghost" onclick="ACT.slide(1)">下一頁 →</button>' +
    '<span class="pg">' + (i + 1) + ' / ' + C.slides.length + '</span>' +
    '<button class="btn sm" onclick="ACT.toggleNotes()">' + (VIEWS.deck.notes ? '隱藏' : '顯示') + '逐字稿</button>' +
    '<button class="btn sm teal" onclick="ACT.printDeck()">🖨 列印全部投影片＋逐字稿</button>' +
    '</div>' +
    (VIEWS.deck.notes ? '<div class="notes"><span class="lab">備忘稿逐字稿（第一人稱口語）</span>' +
      String(s.n || '').split('\n').map(function (p) { return '<p>' + U.esc(p) + '</p>'; }).join('') + '</div>' : '') +
    '</div>';
};

/* =========================================================================
 * 學生視角：練習頁 #/practice/N
 * ========================================================================= */
VIEWS.practiceState = { week: 0, answers: {}, done: false, result: null };
VIEWS.practice = function (n) {
  var C = CONTENT[n], row = STORE.planRow(n);
  var h = '<div class="wrap">';
  if (!C || !C.quiz || !C.quiz.length) {
    h += '<div class="card"><h2>第 ' + n + ' 週　無練習</h2>' +
      '<p>本週' + (C && C.type === 'holiday' ? '為放假週' : '尚未建立練習題') + '，沒有線上練習。</p>' +
      '<div class="btnrow"><a class="btn navy" href="#/student">🏠 回學生入口</a></div></div></div>';
    return h;
  }
  if (VIEWS.practiceState.week !== n) {
    VIEWS.practiceState = { week: n, answers: {}, done: false, result: null };
  }
  var P = VIEWS.practiceState;

  h += '<div class="card"><div class="sechead">WEEK ' + n + ' · PRACTICE</div>' +
    '<h2 style="font-size:22px">' + U.esc(C.title) + '</h2>' +
    '<p class="hint">' + U.esc(row.date || '') + '　·　共 ' + C.quiz.length + ' 題　·　可重複練習，紀錄取最高分</p>' +
    '<div class="grid g2">' +
    '<div class="field"><label class="f">座號（必填）</label><input type="text" id="pSeat" value="' + U.attr(P.seat || '') + '" placeholder="例：01"></div>' +
    '<div class="field"><label class="f">姓名（必填）</label><input type="text" id="pName" value="' + U.attr(P.name || '') + '" placeholder="例：王小明"></div>' +
    '</div></div>';

  C.quiz.forEach(function (q, i) {
    var picked = P.answers[i];
    h += '<div class="qbox"><div class="qh"><span class="n">' + (i + 1) + '</span>' + q.q + '</div>';
    q.o.forEach(function (o, j) {
      var cls = '';
      if (P.done) {
        if (j === q.a) cls = ' correct';
        else if (picked === j) cls = ' wrong';
      }
      h += '<label class="opt' + cls + '"><input type="radio" name="q' + i + '" value="' + j + '"' +
        (picked === j ? ' checked' : '') + (P.done ? ' disabled' : '') +
        ' onchange="ACT.pick(' + i + ',' + j + ')">' + o + '</label>';
    });
    if (P.done) {
      h += '<div class="expl"><b>' + (picked === q.a ? '✅ 答對' : (picked === undefined ? '⬜ 未作答' : '❌ 答錯')) +
        '｜正解：' + String.fromCharCode(65 + q.a) + '</b><br>' + q.e + '</div>';
    }
    h += '</div>';
  });

  if (!P.done) {
    h += '<div class="card"><div class="btnrow" style="margin:0">' +
      '<button class="btn block" onclick="ACT.submitQuiz(' + n + ')">📤 交卷並評分</button></div>' +
      '<div id="quizMsg"></div></div>';
  } else {
    var r = P.result;
    h += '<div class="card"><div class="scorebox"><div>第 ' + n + ' 週練習成績</div>' +
      '<div class="big">' + r.score + '</div><div>' + r.right + ' / ' + C.quiz.length + ' 題正確</div>' +
      '<div style="margin-top:8px">' + U.esc(r.msg) + '</div></div>' +
      '<hr class="divider"><label class="f">成績代碼（請複製後貼到老師指定的回報處：Zuvio／Line）</label>' +
      '<textarea class="codebox" id="codeBox" readonly>' + U.esc(r.code) + '</textarea>' +
      '<div class="btnrow"><button class="btn" onclick="U.copy(document.getElementById(\'codeBox\').value,\'成績代碼已複製\')">📋 一鍵複製成績代碼</button>' +
      '<button class="btn ghost" onclick="ACT.retry(' + n + ')">🔁 再練習一次</button>' +
      '<a class="btn navy" href="#/week/' + n + '">← 回本週課程內容</a>' +
      '<a class="btn teal" href="#/student">🏠 學生入口</a></div>' +
      '<p class="hint">同機瀏覽器已自動記錄一份成績；若老師使用另一台電腦，請務必把上面的成績代碼回報。</p></div>';
  }
  h += '</div>';
  return h;
};

/* =========================================================================
 * 學生入口 #/student

VIEWS.student = function () {

/* =========================================================================
 * 【區塊 6／6】ACT（互動行為）＋ ROUTER（hash 路由）＋ 啟動

var ACT = {

  /* ---------- 課程基本資料 ---------- */
  setCourse: function (key, val, rerender) {
    STORE.d.course[key] = val;
    STORE.save(true);
    if (rerender) ROUTER.render();

  setWeeks: function (el) {
    var n = parseInt(el.value, 10);
    if (isNaN(n) || n < CONFIG.WEEK_MIN || n > CONFIG.WEEK_MAX) {
      alert('總週數必須是 ' + CONFIG.WEEK_MIN + '–' + CONFIG.WEEK_MAX + ' 之間的整數。');
      el.value = STORE.d.course.totalWeeks; return;

    STORE.syncPlanLength();

  importRoster: function () {
    var box = document.getElementById('pasteBox');

    res.added.forEach(function (r) { STORE.d.students.push(r); });

  delStu: function (i) {
    var s = STORE.d.students[i];

    STORE.d.students.push({ id: U.uid(), seat: '', cls: '', name: '', note: '' });

  popStu: function () {
    if (!STORE.d.students.length) { U.toast('名單已經是空的'); return; }

      '<table><thead><tr><th style="width:10%">序號</th><th style="width:12%">座號</th><th style="width:20%">班級</th>' +
      '<th style="width:22%">姓名</th><th>備註</th><th style="width:18%">簽名</th></tr></thead><tbody>' +

  /* ---------- 課程規劃表 ---------- */

  exportPlanCSV: function () {

      '<table><thead><tr><th style="width:7%">週次</th><th style="width:14%">日期</th><th>課程內容</th>' +
      '<th style="width:9%">時數</th><th style="width:12%">任課教師</th><th style="width:16%">備註</th></tr></thead><tbody>' +
      STORE.d.plan.map(function (r) {

  // 授課時數表：只列「有填日期或有點名紀錄」的週次；合計為實際加總
  printHours: function () {

      '　｜　任課教師：' + U.esc(c.teacher) + '</div>' +
      '<table><thead><tr><th style="width:8%">週次</th><th style="width:16%">日期</th><th>授課內容</th>' +
      '<th style="width:12%">時數</th><th style="width:14%">任課教師</th><th style="width:12%">點名紀錄</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td class="c">' + r.week + '</td><td class="c">' + U.esc(r.date) + '</td><td>' + U.esc(r.topic) +

      '<div class="sign"><div>任課教師簽章</div><div>系主任簽章</div><div>核銷單位</div></div>';
