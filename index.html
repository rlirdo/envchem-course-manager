<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>環境化學課程管理系統｜國立東華大學</title>
<meta name="description" content="國立東華大學 環境化學（NRES20050）課程管理系統：學生名單、課程規劃、教材簡報、線上練習與教室日誌。">
<style>
/* =========================================================================
   環境化學課程管理系統 — 樣式表
   配色：森綠 #2E7D5B / 霧綠 #5FA98A / 青藍 #1C7293 / 陽光金 #FFB300 / 深藍 #0B1F3A
   ========================================================================= */
:root{
  --green:#2E7D5B; --moss:#5FA98A; --teal:#1C7293; --gold:#FFB300; --navy:#0B1F3A;
  --bg:#F5F9FA; --ink:#1E293B; --muted:#64748B; --line:#DCE5E9; --card:#FFFFFF;
  --danger:#C0392B; --danger-bg:#FDECEA; --ok:#2E7D5B; --warn-bg:#FFF8E6;
  --radius:14px; --shadow:0 2px 10px rgba(11,31,58,.07); --shadow-l:0 6px 24px rgba(11,31,58,.12);
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;font-size:15.5px;
     -webkit-text-size-adjust:100%;}
a{color:var(--teal);}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.35;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink);}

/* ---------- 版面骨架 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 64px;}
.topbar{background:linear-gradient(120deg,var(--navy) 0%,#123A5C 45%,var(--green) 100%);color:#fff;
        box-shadow:var(--shadow-l);position:relative;overflow:hidden;}
.topbar::after{content:"";position:absolute;right:-90px;top:-120px;width:320px;height:320px;border-radius:50%;
        background:radial-gradient(circle at 40% 40%,rgba(95,169,138,.42),rgba(95,169,138,0) 68%);pointer-events:none;}
.topbar .inner{max-width:1180px;margin:0 auto;padding:18px 16px 14px;position:relative;z-index:1;}
.brandrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.logo{width:46px;height:46px;flex:0 0 auto;}
.brandtxt h1{font-size:21px;margin:0;letter-spacing:.5px;font-weight:800;}
.brandtxt .sub{font-size:12.5px;opacity:.9;letter-spacing:1.2px;font-style:italic;}
.brandmeta{margin-left:auto;font-size:12.5px;text-align:right;opacity:.95;}
.chips{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
      padding:2px 11px;border-radius:999px;font-size:12px;}
.chip.gold{background:rgba(255,179,0,.24);border-color:rgba(255,179,0,.55);}

/* ---------- 分頁導覽 ---------- */
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 1px 6px rgba(11,31,58,.06);}
nav.tabs .inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px;}
nav.tabs a{padding:13px 15px;font-size:14.5px;font-weight:700;color:var(--muted);text-decoration:none;
      border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
nav.tabs a:hover{color:var(--green);background:#F2F8F5;}
nav.tabs a.on{color:var(--green);border-bottom-color:var(--green);}
nav.tabs a .ico{font-size:15px;}

/* ---------- 卡片 / 區塊 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:18px 20px;margin:16px 0;}
.card>h2{font-size:19px;color:var(--navy);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.card>h2 .eyebrow{font-size:11.5px;letter-spacing:2px;color:var(--teal);font-weight:800;}
.sechead{font-size:11.5px;letter-spacing:2.4px;color:var(--teal);font-weight:800;text-transform:uppercase;margin-bottom:2px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.hint{color:var(--muted);font-size:13px;}
.divider{height:1px;background:var(--line);margin:16px 0;border:0;}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:0;border-radius:9px;
     padding:8px 15px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(11,31,58,.14);}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(1px);}
.btn.teal{background:var(--teal);} .btn.gold{background:var(--gold);color:#4A3200;}
.btn.navy{background:var(--navy);} .btn.danger{background:var(--danger);}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--moss);}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px;}
.btn.block{width:100%;justify-content:center;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;}

/* ---------- 表單 ---------- */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px;}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:7px 10px;border:1.4px solid var(--line);border-radius:8px;background:#fff;}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--moss);box-shadow:0 0 0 3px rgba(95,169,138,.2);}
textarea{min-height:90px;resize:vertical;line-height:1.6;}
.field{margin-bottom:10px;}

/* ---------- 表格 ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px;}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle;}
table.t th{background:#EDF4F1;color:var(--navy);font-weight:800;font-size:13px;white-space:nowrap;position:sticky;top:0;}
table.t tbody tr:nth-child(even){background:#FAFCFC;}
table.t td input,table.t td select{padding:5px 7px;font-size:13.5px;}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.t tfoot td{font-weight:800;background:#EDF4F1;color:var(--navy);}
.mini{font-size:12.5px;}

/* ---------- 狀態徽章 ---------- */
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700;}
.pill.green{background:#E3F1EA;color:var(--green);}
.pill.gold{background:#FFF3D6;color:#8A5A00;}
.pill.teal{background:#E2EFF4;color:var(--teal);}
.pill.gray{background:#EEF2F4;color:var(--muted);}
.pill.red{background:var(--danger-bg);color:var(--danger);}
.alert{border-radius:10px;padding:10px 13px;font-size:13.5px;margin:10px 0;}
.alert.red{background:var(--danger-bg);color:var(--danger);border-left:4px solid var(--danger);font-weight:700;}
.alert.warn{background:var(--warn-bg);color:#7A5200;border-left:4px solid var(--gold);}
.alert.info{background:#EAF3F7;color:#13506B;border-left:4px solid var(--teal);}
.alert.ok{background:#E8F5EE;color:#1F5C41;border-left:4px solid var(--green);}
.red{color:var(--danger);font-weight:700;}

/* ---------- 統計方塊 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.stat{background:#fff;border:1px solid var(--line);border-left:5px solid var(--moss);border-radius:11px;padding:11px 14px;}
.stat .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;}
.stat .v{font-size:24px;font-weight:800;color:var(--navy);line-height:1.25;font-variant-numeric:tabular-nums;}
.stat .u{font-size:12.5px;color:var(--muted);}
.stat.t2{border-left-color:var(--teal);} .stat.t3{border-left-color:var(--gold);} .stat.t4{border-left-color:var(--navy);}

/* ---------- 出席按鈕 ---------- */
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-top:12px;}
.attbtn{display:flex;align-items:center;gap:8px;border:1.6px solid var(--line);background:#fff;border-radius:11px;
        padding:8px 11px;cursor:pointer;text-align:left;font-size:14px;}
.attbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;}
.attbtn .sq{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        font-size:14px;font-weight:800;color:#fff;flex:0 0 auto;}
.attbtn .seat{font-size:11.5px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.attbtn .st{font-size:11px;font-weight:800;flex:0 0 auto;letter-spacing:.3px;}
.attbtn[data-s=present]{border-color:var(--moss);background:#F1F9F5;}
.attbtn[data-s=present] .sq{background:var(--green);} .attbtn[data-s=present] .st{color:var(--green);}
.attbtn[data-s=late1]{border-color:#EFD27A;background:#FFFCF0;}
.attbtn[data-s=late1] .sq{background:#E8B004;color:#3A2A00;} .attbtn[data-s=late1] .st{color:#8A6400;}
.attbtn[data-s=late2]{border-color:#F0B183;background:#FFF6EF;}
.attbtn[data-s=late2] .sq{background:#D97706;} .attbtn[data-s=late2] .st{color:#9A4E00;}
.attbtn[data-s=absent]{border-color:#E9A9A2;background:#FDF2F1;}
.attbtn[data-s=absent] .sq{background:var(--danger);} .attbtn[data-s=absent] .st{color:var(--danger);}
.attbtn[data-s=leave]{border-color:#A8BCCB;background:#F3F6F9;}
.attbtn[data-s=leave] .sq{background:#5B7C95;} .attbtn[data-s=leave] .st{color:#41637C;}
.attbtn[data-s=none]{border-style:dashed;}
.attbtn[data-s=none] .sq{background:#B9C4CC;} .attbtn[data-s=none] .st{color:var(--muted);}
.attlegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;}
.attlegend span{display:inline-flex;align-items:center;gap:5px;}
.attlegend i{width:14px;height:14px;border-radius:5px;display:inline-block;font-style:normal;}
.leavesel{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
.leavesel .lv{display:flex;align-items:center;gap:6px;background:#F3F6F9;border:1px solid #CBD8E2;border-radius:9px;padding:5px 9px;font-size:13px;}
.leavesel .lv b{flex:0 0 auto;} .leavesel .lv select{padding:3px 6px;font-size:13px;}

/* ---------- 照片牆（教室日誌） ---------- */
.photowall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px;}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.pcard .ph{width:100%;height:132px;object-fit:cover;display:block;background:#EEF3F5;}
.pcard .pb{padding:8px 10px;}
.pcard .pb input{font-size:12.5px;padding:5px 7px;}
.pcard .pm{font-size:11.5px;color:var(--muted);margin:5px 0 6px;display:flex;justify-content:space-between;gap:6px;}
.pdrop{border:2px dashed var(--moss);border-radius:12px;padding:16px;text-align:center;background:#F5FBF8;color:#2C6B52;font-size:13.5px;}

/* ---------- 成績結算 ---------- */
table.g{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px;}
table.g th,table.g td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap;}
table.g thead th{background:#EDF4F1;color:var(--navy);font-weight:800;font-size:12px;position:sticky;top:0;z-index:2;}
table.g thead th.wgt{font-size:11px;font-weight:700;color:var(--teal);background:#E4EFF4;}
table.g td.name{text-align:left;font-weight:700;position:sticky;left:0;background:#fff;z-index:1;}
table.g tbody tr:nth-child(even) td.name{background:#FAFCFC;}
table.g td.auto{background:#F1F5F7;}
table.g td.tot{background:#EAF5EF;font-weight:800;color:var(--navy);}
table.g input{width:62px;padding:3px 5px;font-size:12.5px;text-align:right;border-radius:6px;}
table.g input.ov{border-color:var(--gold);background:#FFFCF0;font-weight:700;}
table.g tfoot td{background:#EDF4F1;font-weight:800;}
.gnote{font-size:12px;color:var(--muted);}
.banklist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;}

/* ---------- 動手做活動卡 ---------- */
.act{border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:14px;background:linear-gradient(160deg,#FFFDF5 0%,#FFFFFF 60%);
     padding:16px 18px;margin:14px 0;box-shadow:var(--shadow);}
.act h3{font-size:18px;color:var(--navy);margin:0 0 4px;}
.act .amin{display:inline-block;background:var(--gold);color:#4A3200;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;margin-left:6px;}
.act .asub{font-size:11.5px;letter-spacing:2px;color:#9A6B00;font-weight:800;}
.act h4{font-size:14px;color:var(--teal);margin:14px 0 6px;letter-spacing:.5px;}
.mats{display:flex;flex-wrap:wrap;gap:7px;}
.mat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;}
.mat em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--moss);border-radius:5px;padding:1px 6px;margin-left:6px;}
.mat em.s2{background:var(--gold);color:#4A3200;} .mat em.s3{background:var(--teal);} .mat em.s4{background:#7E8AA0;}
.tl{border-left:2px solid var(--moss);margin-left:8px;padding-left:14px;}
.tl .tli{position:relative;margin:0 0 10px;font-size:13.8px;}
.tl .tli::before{content:"";position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--moss);border:2px solid #fff;box-shadow:0 0 0 1px var(--moss);}
.tl .tli b{color:var(--teal);margin-right:6px;font-variant-numeric:tabular-nums;}
.chemli{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13.8px;line-height:1.75;}
.chemli .gtag{display:inline-block;background:#E3F1EA;color:var(--green);border-radius:6px;padding:0 7px;font-size:11.5px;font-weight:800;margin-right:7px;}
.gp{display:inline-flex;align-items:center;gap:6px;background:#E8F5EE;border:1px solid #BFE0CD;border-radius:9px;padding:4px 10px;font-size:12.8px;margin:0 6px 6px 0;}
.gp b{background:var(--green);color:#fff;border-radius:5px;padding:0 6px;font-size:11.5px;}
.safe{background:#FDF2F1;border-left:4px solid var(--danger);border-radius:9px;padding:9px 13px;font-size:13.3px;}
.safe ul,.obs ul{margin:.2em 0;padding-left:1.15em;} .safe li,.obs li{margin:.3em 0;}
.obs{background:#EAF3F7;border-left:4px solid var(--teal);border-radius:9px;padding:9px 13px;font-size:13.5px;}
.actnone{background:#FFF8E6;border-left:4px solid var(--gold);border-radius:9px;padding:10px 13px;font-size:13.5px;color:#7A5200;}

/* ---------- 教材卡 ---------- */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
.mcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow);
       border-top:4px solid var(--moss);}
.mcard:nth-child(4n+2){border-top-color:var(--teal);}
.mcard:nth-child(4n+3){border-top-color:var(--gold);}
.mcard:nth-child(4n+4){border-top-color:var(--navy);}
.mcard h3{font-size:16px;color:var(--navy);margin-bottom:6px;}
.mcard .no{font-size:11.5px;font-weight:800;color:var(--teal);letter-spacing:1.6px;}
.mcard p{margin:.5em 0;font-size:14.3px;}
.mcard .local{margin-top:9px;background:#F2F8F5;border-left:3px solid var(--moss);border-radius:7px;
       padding:7px 10px;font-size:13.2px;color:#22503C;}
.fx{font-family:"Cambria Math","Times New Roman",serif;font-size:1.03em;}
.eq{background:#F7FAFB;border:1px dashed var(--line);border-radius:8px;padding:8px 11px;margin:8px 0;
    font-family:"Cambria Math","Times New Roman",serif;font-size:15px;overflow-x:auto;}

/* ---------- 簡報播放器 ---------- */
.deck{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow-l);}
.slide{background:linear-gradient(160deg,#FFFFFF 0%,#F5F9FA 100%);padding:24px 26px;min-height:330px;}
.slide.cover{background:linear-gradient(135deg,var(--navy) 0%,#12405F 55%,var(--green) 100%);color:#fff;}
.slide.cover h3{color:#fff;font-size:26px;}
.slide.cover .eyebrow{color:#BFE3D2;}
.slide .eyebrow{font-size:11.5px;letter-spacing:2.4px;color:var(--teal);font-weight:800;}
.slide h3{font-size:22px;color:var(--navy);margin:4px 0 12px;}
.slide ul{margin:0;padding-left:1.2em;}
.slide li{margin:.45em 0;font-size:15px;}
.deckbar{display:flex;align-items:center;gap:9px;background:#EDF4F1;padding:9px 13px;border-top:1px solid var(--line);
      flex-wrap:wrap;}
.deckbar .pg{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;font-size:14px;}
.notes{background:#0B1F3A;color:#DCE9F2;padding:14px 18px;font-size:14px;line-height:1.9;}
.notes .lab{font-size:11.5px;letter-spacing:2px;color:var(--gold);font-weight:800;display:block;margin-bottom:6px;}
.notes p{margin:0 0 .35em;}

/* ---------- 練習 ---------- */
.qbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow);}
.qbox .qh{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:15.5px;}
.qbox .qh .n{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--teal);color:#fff;
      align-items:center;justify-content:center;font-size:13.5px;margin-right:8px;}
.opt{display:block;border:1.4px solid var(--line);border-radius:9px;padding:7px 11px;margin:6px 0;cursor:pointer;font-size:14.3px;}
.opt:hover{background:#F4F9F7;}
.opt input{margin-right:8px;}
.opt.correct{border-color:var(--moss);background:#EFF8F3;}
.opt.wrong{border-color:#E9A9A2;background:#FDF2F1;}
.expl{margin-top:9px;background:#F7FAFB;border-left:4px solid var(--teal);border-radius:8px;padding:8px 12px;font-size:13.8px;}
.scorebox{background:linear-gradient(135deg,var(--navy),var(--green));color:#fff;border-radius:14px;padding:18px 22px;text-align:center;}
.scorebox .big{font-size:46px;font-weight:800;line-height:1.1;}
.codebox{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;}

/* ---------- 週次卡片格 ---------- */
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.wk{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    text-decoration:none;color:var(--ink);box-shadow:var(--shadow);border-left:5px solid var(--moss);}
.wk:hover{box-shadow:var(--shadow-l);transform:translateY(-1px);}
.wk .n{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:1.4px;}
.wk .tt{font-size:14.5px;font-weight:700;margin:3px 0;color:var(--navy);}
.wk .dt{font-size:12.5px;color:var(--muted);}
.wk.holiday{border-left-color:var(--gold);background:#FFFDF6;}
.wk.exam{border-left-color:var(--danger);background:#FEF7F6;}

/* ---------- 其他 ---------- */
.toast{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;
       box-shadow:var(--shadow-l);font-size:14px;z-index:99;opacity:0;transform:translateY(10px);
       transition:.25s;pointer-events:none;max-width:80vw;}
.toast.show{opacity:1;transform:none;}
.copyrow{display:flex;gap:6px;align-items:center;margin:5px 0;font-size:13px;}
.copyrow code{background:#EEF3F5;border-radius:6px;padding:2px 7px;word-break:break-all;flex:1;font-size:12.5px;}
.footer{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 12px;}
.banner{background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;}
.tag{display:inline-block;background:#EDF4F1;color:var(--green);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:5px;}

@media (max-width:860px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .brandmeta{margin-left:0;text-align:left;width:100%;}
}
@media (max-width:600px){

  $: function (sel, root) { return (root || document).querySelector(sel); },

  // HTML escape：所有使用者輸入進畫面前都要過這一關
  esc: function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  today: function () { var d = new Date(); return U.fmtDate(d); },
  fmtDate: function (d) {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate());
  },
  parseDate: function (s) {
    if (!s) return null;
    var m = String(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  },
  nowStamp: function () {
    var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return U.fmtDate(d) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  },
  // UTF-8 安全的 base64（成績代碼用）
  b64enc: function (str) { return btoa(unescape(encodeURIComponent(str))); },
  b64dec: function (str) { return decodeURIComponent(escape(atob(str))); },
  toast: function (msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(U._tt);
    U._tt = setTimeout(function () { el.classList.remove('show'); }, 2200);
  },
  // CSV：每個欄位加引號，內部引號跳脫；輸出時前置 UTF-8 BOM
  csv: function (rows) {
    return rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');

  download: function (filename, text, mime) {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });

    a.href = URL.createObjectURL(blob); a.download = filename;

  // 匯出 CSV（一律加 UTF-8 BOM，Excel 才不會亂碼）
  downloadCSV: function (filename, rows) {

    var done = function () { U.toast(okMsg || '已複製'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { U.copyFallback(text, done); });

  },
  copyFallback: function (text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { U.toast('請手動複製'); }

/* =========================================================================

 * {
 *   schemaVersion: 2,
 *   course: {...},                                  // 基本資料
 *   students: [{id, seat, cls, name, note}],
 *   plan:     [{week, date, topic, hours, teacher, note}],
 *   log:      { "1": { att:{studentId:'present'|'late1'|'late2'|'absent'|'leave'},

 *                      record:{ text, photo, caption },
 *                      photos:[{k:'w1_1', cap:'圖說'}] } },     // v2：影像存 IndexedDB
 *   scores:   [ {week, seat, name, score, ts, detail, src} ],
 *   pending:  [ {week, seat, name, score, ts} ],     // 匯入但對不到名單的成績
 *   grades:   { studentId: {att,disc,ai,mid,fin,v1,v2,v3,a1,a2,a3,sop} },  // v2：手動欄／覆寫
 *   bank:     [ {id, date, sid, why, pt} ],          // v2：分數撲滿帳本
 *   gradeW:   {…CONFIG.GRADE 的可調權重副本},        // v2
 *   lastSaved: '2026/08/22 10:00:00'
 * }
 * ========================================================================= */
var STORE = {
  d: null,

  blank: function () {
    return {
      schemaVersion: CONFIG.SCHEMA_VERSION,
      course: JSON.parse(JSON.stringify(DATA.course)),
      students: [],                       // 預設為空，不放任何個資
      plan: STORE.buildPlan(DATA.course.totalWeeks),
      log: {},
      scores: [],
      pending: [],
      grades: {},
      bank: [],
      gradeW: JSON.parse(JSON.stringify(CONFIG.GRADE)),
      lastSaved: ''

  },

  // 依總週數產生規劃表列；1–18 週套用 §2 預填
  buildPlan: function (total) {
    var rows = [], i, pre;
    for (i = 1; i <= total; i++) {
      pre = DATA.planPrefill.filter(function (p) { return p.week === i; })[0];
      rows.push(pre
        ? { week: i, date: pre.date, topic: pre.topic, hours: pre.hours, teacher: pre.teacher, note: pre.note }
        : { week: i, date: '', topic: '', hours: CONFIG.DEFAULT_HOURS, teacher: '楊悠娟', note: '' });
    }
    return rows;
  },

  load: function () {
    var raw = null;
    try { raw = localStorage.getItem(CONFIG.STORAGE_KEY); } catch (e) { raw = null; }
    if (!raw) { STORE.d = STORE.blank(); STORE.save(true); return STORE.d; }
    try {
      var obj = JSON.parse(raw);
      STORE.d = STORE.migrate(obj);
    } catch (e) {
      console.warn('ecm_data 解析失敗，改用空白資料', e);
      STORE.d = STORE.blank();
    }
    return STORE.d;
  },

  // 版本遷移 + 欄位補齊
  //   v1 → v2：出席三態代碼原樣沿用（present/absent/leave 皆為五態的合法子集，統計不變）；
  //            補上 leaveKind / photos / grades / bank / gradeW / course.taEmail。
  migrate: function (o) {
    var b = STORE.blank();
    if (!o || typeof o !== 'object') return b;
    var from = parseInt(o.schemaVersion, 10) || 1;
    o.course = Object.assign({}, b.course, o.course || {});
    o.students = Array.isArray(o.students) ? o.students : [];
    o.students.forEach(function (s) {
      if (!s.id) s.id = U.uid();
      s.seat = s.seat == null ? '' : String(s.seat);
      s.cls = s.cls == null ? '' : String(s.cls);
      s.name = s.name == null ? '' : String(s.name);
      s.note = s.note == null ? '' : String(s.note);
    });
    o.plan = Array.isArray(o.plan) ? o.plan : b.plan;
    o.log = (o.log && typeof o.log === 'object') ? o.log : {};
    o.scores = Array.isArray(o.scores) ? o.scores : [];
    o.pending = Array.isArray(o.pending) ? o.pending : [];

    /* --- v2 新增結構（缺什麼補什麼，既有值一律不動） --- */
    Object.keys(o.log).forEach(function (k) {
      var L = o.log[k];
      if (!L || typeof L !== 'object') { delete o.log[k]; return; }
      if (!L.att || typeof L.att !== 'object') L.att = {};
      if (!L.leaveKind || typeof L.leaveKind !== 'object') L.leaveKind = {};
      if (!L.record || typeof L.record !== 'object') L.record = { text: '', photo: '', caption: '' };
      if (!Array.isArray(L.photos)) L.photos = [];
      // 未知的出席代碼（理論上不會有）保留原值，不丟資料，只在統計時以 0 計
    });
    o.grades = (o.grades && typeof o.grades === 'object') ? o.grades : {};
    Object.keys(o.grades).forEach(function (sid) { o.grades[sid] = STORE.normGrade(o.grades[sid]); });
    o.bank = Array.isArray(o.bank) ? o.bank : [];
    o.bank.forEach(function (r) {
      if (!r.id) r.id = U.uid();
      r.pt = parseFloat(r.pt) || 0;
      r.date = r.date || ''; r.sid = r.sid || ''; r.why = r.why || '';
    });
    o.gradeW = Object.assign({}, CONFIG.GRADE, o.gradeW || {});

    o.lastSaved = o.lastSaved || '';
    o.schemaVersion = CONFIG.SCHEMA_VERSION;
    if (from < 2) { try { console.info('ecm_data 已由 schemaVersion ' + from + ' 遷移至 2（資料無損）'); } catch (e) {} }
    STORE.syncPlanLength(o);
    return o;
  },

  // 成績列的欄位正規化：手動欄可為 null（未填）；sop 為非負整數
  normGrade: function (g) {
    var out = { sop: 0 };
    if (!g || typeof g !== 'object') g = {};
    CONFIG.GRADE_COLS.forEach(function (c) {
      var v = g[c.k];
      out[c.k] = (v === '' || v === null || typeof v === 'undefined' || isNaN(parseFloat(v))) ? null : parseFloat(v);
    });
    out.sop = Math.max(0, parseInt(g.sop, 10) || 0);
    return out;
  },

  // 讓 plan 列數 == totalWeeks（增列補預填、減列直接截斷）
  syncPlanLength: function (o) {
    o = o || STORE.d;
    var n = Math.max(CONFIG.WEEK_MIN, Math.min(CONFIG.WEEK_MAX, parseInt(o.course.totalWeeks, 10) || 1));
    o.course.totalWeeks = n;
    if (o.plan.length > n) { o.plan = o.plan.slice(0, n); }
    while (o.plan.length < n) {
      var i = o.plan.length + 1;
      var pre = DATA.planPrefill.filter(function (p) { return p.week === i; })[0];
      o.plan.push(pre
        ? { week: i, date: pre.date, topic: pre.topic, hours: pre.hours, teacher: pre.teacher, note: pre.note }
        : { week: i, date: '', topic: '', hours: CONFIG.DEFAULT_HOURS, teacher: '楊悠娟', note: '' });
    }
    o.plan.forEach(function (r, idx) { r.week = idx + 1; });
    return o;
  },

  save: function (silent) {
    STORE.d.lastSaved = U.nowStamp();
    try {
      localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STORE.d));
      if (!silent) U.toast('已儲存 ' + STORE.d.lastSaved.slice(11));
      return true;
    } catch (e) {
      alert('儲存失敗：' + e.message + '\n（可能是瀏覽器儲存空間已滿或處於無痕模式）');
      return false;
    }
  },

  usageBytes: function () {
    try { return (localStorage.getItem(CONFIG.STORAGE_KEY) || '').length * 2; } catch (e) { return 0; }
  },

  reset: function () {
    STORE.d = STORE.blank();
    STORE.save(true);
  },

  /* ----- 週次相關查詢 ----- */
  planRow: function (w) { return STORE.d.plan[w - 1] || { week: w, date: '', topic: '', hours: 0, teacher: '', note: '' }; },
  logOf: function (w) {
    var k = String(w);
    if (!STORE.d.log[k]) STORE.d.log[k] = { att: {}, init: false, record: { text: '', photo: '', caption: '' } };
    var L = STORE.d.log[k];
    if (!L.att) L.att = {};
    if (!L.leaveKind) L.leaveKind = {};
    if (!L.record) L.record = { text: '', photo: '', caption: '' };
    if (!Array.isArray(L.photos)) L.photos = [];
    return L;
  },
  // 該週是否「有點名過」＝ 至少一位學生有狀態
  weekHasLog: function (w) {
    var L = STORE.d.log[String(w)];
    if (!L || !L.att) return false;
    var ids = STORE.d.students.map(function (s) { return s.id; });
    return ids.some(function (id) { return !!L.att[id]; });
  },
  // 該週是否「點名完成」＝ 全體學生都有狀態（未完成則統計不算數）
  weekComplete: function (w) {
    var L = STORE.d.log[String(w)];
    if (!L || !L.att) return false;
    var ss = STORE.d.students;
    if (!ss.length) return false;
    return ss.every(function (s) { return !!L.att[s.id]; });
  },
  loggedWeeks: function () {
    var out = [], i;
    for (i = 1; i <= STORE.d.course.totalWeeks; i++) { if (STORE.weekHasLog(i)) out.push(i); }
    return out;
  },
  // 進入某週：尚未建立紀錄的學生一律預設「出席」（＝視為已點名）
  ensureWeekDefault: function (w) {
    var L = STORE.logOf(w);
    if (L.init) return false;            // 已初始化過（含「清除本週」後）就不再自動補預設
    if (!STORE.d.students.length) return false;
    STORE.d.students.forEach(function (s) { L.att[s.id] = 'present'; });
    L.init = true;
    STORE.save(true);
    return true;
  },
  weekCount: function (w) {
    var L = STORE.logOf(w);
    var c = { present: 0, late1: 0, late2: 0, absent: 0, leave: 0, none: 0 };
    STORE.d.students.forEach(function (s) {
      var st = L.att[s.id] || 'none';
      c[st] = (c[st] || 0) + 1;
    });
    // 上課人數＝出席＋兩級遲到（材料費核算用）
    c.inClass = CONFIG.ATT_INCLASS.reduce(function (a, k) { return a + (c[k] || 0); }, 0);
    return c;
  },
  // 出席狀態係數（未知代碼一律 0，不會壞掉）
  attW: function (st) { var v = CONFIG.ATT_WEIGHT[st]; return typeof v === 'number' ? v : 0; },
  // 實際授課教師人數 T：總覽指導老師 1／2 實際填寫人數；兩欄皆空暫以 2 計
  teacherCount: function () {
    var c = STORE.d.course;
    var n = 0;
    if ((c.advisor1 || '').trim()) n++;
    if ((c.advisor2 || '').trim()) n++;
    return { T: n > 0 ? n : 2, filled: n > 0 };
  },
  /* ----- 出席統計 ----- */
  // 個人出席率＝該生出席次數 ÷ 該生有狀態的週數
  studentAtt: function (sid) {
    var p = 0, tot = 0, wsum = 0, leaves = 0, lates = 0, abs = 0;
    STORE.loggedWeeks().forEach(function (w) {
      var st = STORE.logOf(w).att[sid];
      if (!st) return;
      tot++;
      wsum += STORE.attW(st);
      if (st === 'present') p++;
      if (st === 'late1' || st === 'late2') lates++;
      if (st === 'leave') leaves++;
      if (st === 'absent') abs++;
    });
    return {
      present: p, counted: tot, rate: tot ? p / tot : 0,
      wsum: wsum, leaves: leaves, lates: lates, absents: abs,
      // 出席原始分＝Σ狀態係數 ÷ 已點名週數 × 100（規格 §3）
      raw: tot ? U.round1(wsum / tot * 100) : null
    };
  },
  // 全班出席率＝Σ出席人數 ÷（總報名人數 × 已完成點名週數）；請假與缺席都在分母
  classAtt: function () {
    var present = 0, weeks = 0, N = STORE.d.students.length;
    STORE.loggedWeeks().forEach(function (w) {
      if (!STORE.weekComplete(w)) return;   // 未點完的週不算數
      weeks++;
      var c = STORE.weekCount(w);
      present += c.present;
    });
    return { present: present, weeks: weeks, denom: N * weeks, rate: (N * weeks) ? present / (N * weeks) : 0 };
  },
  /* ----- 成績 ----- */
  // 同一學生同一週取最高分
  bestScore: function (week, seat, name) {
    var best = null;
    STORE.d.scores.forEach(function (r) {
      if (r.week !== week) return;
      var same = (seat && r.seat && String(r.seat) === String(seat)) ||
                 (!seat && !r.seat) || (r.name && name && r.name === name);
      if (!same) return;
      if (best === null || r.score > best) best = r.score;
    });
    return best;
  },
  scoreOfStudent: function (stu, week) {
    var best = null;
    STORE.d.scores.forEach(function (r) {
      if (r.week !== week) return;
      var hit = (r.seat && stu.seat && String(r.seat) === String(stu.seat)) || (r.name && r.name === stu.name);
      if (!hit) return;
      if (best === null || r.score > best) best = r.score;
    });
    return best;
  },
  addScore: function (rec) {
    // 完全相同的一筆（同週同座號同姓名同分數同時間）不重複寫入
    var dup = STORE.d.scores.some(function (r) {
      return r.week === rec.week && r.seat === rec.seat && r.name === rec.name &&
             r.score === rec.score && r.ts === rec.ts;
    });
    if (!dup) STORE.d.scores.push(rec);
    return !dup;
  },
  matchStudent: function (seat, name) {
    var ss = STORE.d.students, i;
    for (i = 0; i < ss.length; i++) {
      if (seat && ss[i].seat && String(ss[i].seat) === String(seat) && (!name || ss[i].name === name)) return ss[i];
    }
    for (i = 0; i < ss.length; i++) { if (name && ss[i].name === name) return ss[i]; }
    for (i = 0; i < ss.length; i++) { if (seat && ss[i].seat && String(ss[i].seat) === String(seat)) return ss[i]; }
    return null;
  },

  /* ----- v2：成績結算 ----- */
  gradeOf: function (sid) {
    if (!STORE.d.grades[sid]) STORE.d.grades[sid] = STORE.normGrade(null);
    return STORE.d.grades[sid];
  },
  // 該生練習得分平均（AI 翻轉與模組的自動值來源）
  practiceAvg: function (stu) {
    var ws = [], vals = [];
    STORE.d.scores.forEach(function (r) { if (ws.indexOf(r.week) < 0) ws.push(r.week); });
    ws.forEach(function (w) {
      var v = STORE.scoreOfStudent(stu, w);
      if (v !== null) vals.push(v);
    });
    if (!vals.length) return null;
    return U.round1(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
  },
  // 撲滿：該生累計點數（未封頂）
  bankPoints: function (sid) {
    var t = 0;
    STORE.d.bank.forEach(function (r) { if (r.sid === sid) t += (parseFloat(r.pt) || 0); });
    return t;
  }
};

/* =========================================================================
 * GRADE — 學期成績結算（規格 §3）
 * -------------------------------------------------------------------------
 * 總成績 ＝ Σ(各項 0–100 分 × 權重%/100) ＋ 撲滿加分 − SOP 扣分，下限 0。
 * 權重預設：出席 9、討論與 Zuvio 6、AI 11、期中 25、期末 25、
 *           參訪 3+4+5 ＝ 12、行動 3+4+5 ＝ 12　→ 合計 100。
 * 撲滿：個人累計點數（封頂 200）÷ 20 ＝ 加分（至多 +10）。
 * SOP：未依 SOP 請假每次總成績 −2。
 * ========================================================================= */
var GRADE = {
  W: function () { return Object.assign({}, CONFIG.GRADE, STORE.d.gradeW || {}); },

  // 自動值（未覆寫時採用）
  autoVal: function (stu, key) {
    if (key === 'att') return STORE.studentAtt(stu.id).raw;      // 可能為 null（尚無點名）
    if (key === 'ai') return STORE.practiceAvg(stu);              // 可能為 null（尚無練習）
    return null;
  },
  // 實際採用值：有手動值（含覆寫）用手動，否則用自動
  valOf: function (stu, key) {
    var g = STORE.gradeOf(stu.id);
    var m = g[key];
    if (m !== null && typeof m !== 'undefined') return m;
    return GRADE.autoVal(stu, key);
  },
  bonusOf: function (sid) {
    var W = GRADE.W();
    var pts = Math.min(STORE.bankPoints(sid), W.bankCap);
    return Math.min(W.bonusMax, U.round1(pts / W.bankDiv));
  },

  // 回傳整列計算結果
  row: function (stu) {
    var W = GRADE.W(), g = STORE.gradeOf(stu.id), sum = 0, parts = {}, missing = [];
    CONFIG.GRADE_COLS.forEach(function (c) {
      var v = GRADE.valOf(stu, c.k);
      parts[c.k] = v;
      if (v === null || typeof v === 'undefined') { missing.push(c.k); v = 0; }
      sum += (parseFloat(v) || 0) * (parseFloat(W[c.w]) || 0) / 100;
    });
    var pts = STORE.bankPoints(stu.id);
    var bonus = GRADE.bonusOf(stu.id);
    var sop = Math.max(0, parseInt(g.sop, 10) || 0);
    var penalty = sop * (parseFloat(W.sopPenalty) || 0);
    var total = sum + bonus - penalty;
    if (total < 0) total = 0;
    return {
      parts: parts, missing: missing, weighted: U.round1(sum),
      bankPts: pts, bankCapped: Math.min(pts, W.bankCap), bonus: bonus,
      sop: sop, penalty: penalty,
      total1: U.round1(total), totalInt: Math.round(total)
    };
  },

  // 權重合計（應為 100；不是 100 時畫面提示）
  weightSum: function () {
    var W = GRADE.W(), t = 0;
    CONFIG.GRADE_COLS.forEach(function (c) { t += parseFloat(W[c.w]) || 0; });
    return U.round1(t);
  },

  // 完成度：各手動欄已填人數 / 總人數
  completeness: function () {
    var ss = STORE.d.students, out = [];
    CONFIG.GRADE_COLS.forEach(function (c) {
      var n = 0;
      ss.forEach(function (s) {
        var v = GRADE.valOf(s, c.k);
        if (v !== null && typeof v !== 'undefined') n++;
      });
      out.push({ k: c.k, name: c.name, filled: n, total: ss.length, auto: !!c.auto });
    });
    return out;
  }
};

/* =========================================================================
 * PHOTO — 教室日誌照片（影像存 IndexedDB，中繼資料存 ecm_data）
 * -------------------------------------------------------------------------
 * db：ecm_photos ／ store：photos ／ key：w{week}_{n}
 * 前端壓縮：最長邊 1280px、JPEG 品質 0.8。每週上限 5 張。
 * ========================================================================= */
var PHOTO = {
  _db: null,
  open: function () {
    return new Promise(function (res, rej) {
      if (PHOTO._db) { res(PHOTO._db); return; }
      if (!window.indexedDB) { rej(new Error('此瀏覽器不支援 IndexedDB，無法儲存照片')); return; }
      var rq = indexedDB.open(CONFIG.PHOTO.DB, CONFIG.PHOTO.DB_VERSION);
      rq.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(CONFIG.PHOTO.STORE)) db.createObjectStore(CONFIG.PHOTO.STORE);
      };
      rq.onsuccess = function () { PHOTO._db = rq.result; res(PHOTO._db); };
      rq.onerror = function () { rej(rq.error || new Error('IndexedDB 開啟失敗')); };
    });
  },
  _tx: function (mode, fn) {
    return PHOTO.open().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(CONFIG.PHOTO.STORE, mode);
        var st = tx.objectStore(CONFIG.PHOTO.STORE);
        var rq = fn(st);
        tx.oncomplete = function () { res(rq ? rq.result : undefined); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    });
  },
  put: function (key, dataURL) { return PHOTO._tx('readwrite', function (st) { return st.put(dataURL, key); }); },
  get: function (key) { return PHOTO._tx('readonly', function (st) { return st.get(key); }); },
  del: function (key) { return PHOTO._tx('readwrite', function (st) { return st.delete(key); }); },
  allKeys: function () { return PHOTO._tx('readonly', function (st) { return st.getAllKeys(); }); },
  getMany: function (keys) {
    return Promise.all(keys.map(function (k) {
      return PHOTO.get(k).then(function (v) { return { k: k, v: v || '' }; },
                              function () { return { k: k, v: '' }; });
    }));
  },
  // 產生下一個未使用的 key（同週內遞增，刪除後不重用避免覆蓋）
  nextKey: function (week, used) {
    var n = 1;
    while (used.indexOf('w' + week + '_' + n) >= 0) n++;
    return 'w' + week + '_' + n;
  },
  // 讀檔 → 等比縮到最長邊 MAX_EDGE → JPEG(QUALITY) dataURL
  compress: function (file) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type || '')) { rej(new Error('「' + file.name + '」不是影像檔')); return; }
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('讀取「' + file.name + '」失敗')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error('「' + file.name + '」無法解碼為影像')); };
        img.onload = function () {
          var m = CONFIG.PHOTO.MAX_EDGE;
          var sc = Math.min(1, m / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);      // 透明 PNG 轉 JPEG 的底色
          ctx.drawImage(img, 0, 0, w, h);
          try { res({ url: cv.toDataURL('image/jpeg', CONFIG.PHOTO.QUALITY), w: w, h: h }); }
          catch (e) { rej(e); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  },
  // dataURL 的約略位元組數
  bytesOf: function (url) {
    var i = String(url || '').indexOf(',');
    if (i < 0) return 0;
    return Math.round((url.length - i - 1) * 3 / 4);
  }
};

/* =========================================================================
 * ROSTER — 學生名單貼上匯入解析（SPEC §4，規則逐字實作）
 * -------------------------------------------------------------------------
 * 1. 一行一位學生。
 * 2. 先用 Tab、半形逗號、全形逗號、頓號切；切完只有一段時，才改用空白切
 *    （空白含全形空白）。
 * 3. 第一個非空白列若含「座號／學號／編號／班級／姓名／名字／備註」任一字樣
 *    → 視為標題列整列略過。
 * 4. 空白切分路徑：開頭純數字→座號；接著某段以「班」結尾→班級；
 *    剩下全部併回姓名。（「01 Yosi Takun」→ 座號 01、姓名 Yosi Takun、班級空）
 * 5. 重複（同班級同姓名）跳過。
 * ========================================================================= */
var ROSTER = {
  HEADER_WORDS: ['座號', '學號', '編號', '班級', '姓名', '名字', '備註'],
  DELIM: /[\t,，、]/,
  SPACE: /[\s　]+/,

  isHeader: function (line) {
    return ROSTER.HEADER_WORDS.some(function (w) { return line.indexOf(w) >= 0; });
  },

  // 把切好的欄位指派到 座號／班級／姓名／備註
  // bySpace = true 時，套用「剩下全部併回姓名」規則
  assign: function (parts, bySpace) {
    var i = 0, seat = '', cls = '', name = '', note = '';
    if (parts.length && /^\d+$/.test(parts[0])) { seat = parts[0]; i = 1; }
    var rest = parts.slice(i);
    if (bySpace) {
      // 空白路徑：以「班」結尾的段當班級，剩下全部併回姓名
      if (rest.length > 1 && /班$/.test(rest[0])) { cls = rest.shift(); }
      name = rest.join(' ');
    } else {
      // 分隔符路徑：按位置對應（座號)班級 姓名 備註…）
      if (rest.length === 1) { name = rest[0]; }
      else if (rest.length >= 2) { cls = rest[0]; name = rest[1]; note = rest.slice(2).join(' '); }
    }
    return { seat: seat, cls: cls, name: name.trim(), note: note.trim() };
  },

  parseLine: function (line) {
    var parts = line.split(ROSTER.DELIM).map(function (s) { return s.trim(); })
                    .filter(function (s) { return s !== ''; });
    var bySpace = false;
    if (parts.length <= 1) {                 // 切完只有一段 → 才改用空白切
      bySpace = true;
      parts = line.split(ROSTER.SPACE).map(function (s) { return s.trim(); })

    }
    if (!parts.length) return null;
    var r = ROSTER.assign(parts, bySpace);
    if (!r.name) return null;
    return r;
  },

  // 回傳 {added:[], addedCount, dupCount, headerSkipped, blank, messages:[]}
  parse: function (text, existing) {
    existing = existing || [];
    var lines = String(text || '').split(/\r?\n/);
    var res = { added: [], addedCount: 0, dupCount: 0, headerSkipped: false, invalid: 0, messages: [] };
    var seen = {};
    existing.forEach(function (s) { seen[(s.cls || '') + '␀' + (s.name || '')] = true; });

    var firstNonBlankIdx = -1, i;
    for (i = 0; i < lines.length; i++) { if (lines[i].trim() !== '') { firstNonBlankIdx = i; break; } }

    for (i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (line === '') continue;
      if (i === firstNonBlankIdx && ROSTER.isHeader(line)) {
        res.headerSkipped = true;
        res.messages.push('第 1 列看起來像標題列，已略過');
        continue;
      }
      var r = ROSTER.parseLine(line);
      if (!r) { res.invalid++; continue; }
      var key = (r.cls || '') + '␀' + r.name;
      if (seen[key]) { res.dupCount++; continue; }
      seen[key] = true;
      r.id = U.uid();
      res.added.push(r);
    }
    res.addedCount = res.added.length;
    res.messages.push('匯入 ' + res.addedCount + ' 位');
    if (res.dupCount > 0) res.messages.push('略過 ' + res.dupCount + ' 位重複');
    if (res.invalid > 0) res.messages.push('無法辨識 ' + res.invalid + ' 列');
    return res;
  }
};

    { t: '滯留時間決定問題的尺度', s: '第一節', b: ['τ = M / F（存量除以通量）', '水氣 τ ≈ 10 天 → 分布極不均', 'CO₂ τ ≈ 百年 → 全球均勻混合', '區域問題 vs 全球問題的分水嶺'],
      n: '這一頁只有一個公式，但非常重要。\n滯留時間等於存量除以通量。\n水氣在大氣中的滯留時間大約只有十天，所以它的分布極不均勻。\n二氧化碳的有效滯留時間可以到百年尺度，所以它能全球均勻混合。\n這個簡單的比值告訴我們一件事。\n一個污染物是區域問題還是全球問題，主要由滯留時間決定。\n不是由毒性決定。\n所以細懸浮微粒是區域管制，二氧化碳必須國際談判。' },
    { t: '人類圈：線性物質流的問題', s: '第二節', b: ['自然圈層：封閉迴圈', '人類圈：開採 → 製造 → 使用 → 拋棄', '把高濃度礦體攤平成低濃度廢棄物 = 製造熵', '工業生態學：讓廢棄物成為別人的原料'],
      n: '第二節我們進入人類圈。\n人類圈最鮮明的化學特徵是線性的物質流。\n開採、製造、使用、拋棄，一條直線走到底。\n可是自然圈層的物質流大致上是封閉迴圈。\n碳、氮、磷最後都會回到起點。\n我們不斷把高濃度的礦體攤平成低濃度的廢棄物。\n在熱力學上，這等於在製造熵，而且非常難逆轉。\n工業生態學的解方是把工廠群模仿成生態系。\n讓某一廠的廢棄物，變成另一廠的原料。' },
    { t: '從末端管制到源頭設計', s: '第二節', b: ['末端處理：污染已產生，再花錢處理', '源頭設計：一開始就不要產生', '綠色化學＝把環境成本內化到反應式裡', '成本論證：處理費、法遵成本、品牌風險'],
      n: '這一頁是綠色化學的核心轉向。\n傳統的污染防治是末端管制。\n污染已經產生了，我們再蓋一座處理廠去處理它。\n綠色化學的想法完全不同。\n它把問題往前推到設計階段，一開始就不要產生。\n用一句話說，綠色化學就是把環境成本內化到反應式裡面。\n這不只是道德訴求，也是成本論證。\n處理費、法規遵循成本、還有品牌風險，都是真金白銀。' },
    { t: '綠色化學十二原則：四層記法', s: '第二節', b: ['源頭：預防廢棄物、原子經濟、可再生原料', '選材：低毒試劑與溶劑、水或超臨界 CO₂', '製程：觸媒取代計量試劑、常溫常壓、即時監測', '終端：可降解設計、避免保護基、降低事故風險'],
      n: '十二原則不必死背，我教大家壓縮成四層。\n第一層是源頭，包含預防廢棄物、提高原子經濟性、使用可再生原料。\n第二層是選材，選低毒性的試劑與溶劑，盡量用水或超臨界二氧化碳。\n第三層是製程，用觸媒取代計量試劑，盡量在常溫常壓下操作，並且即時監測避免失控。\n第四層是終端，產品要設計成可降解，避免使用保護基，並且降低事故風險。\n考試最常出的是第一層的原子經濟性，跟第三層的觸媒觀念。' },
    { t: '原子經濟性與 E-factor', s: '第二節', b: ['AE = 目標產物分子量 ÷ 反應物分子量總和 × 100%', 'Wittig 路徑：磷變成廢棄物，AE 常 < 25%', '複分解觸媒路徑：AE 可 > 80%', 'E-factor = 每公斤產品產生幾公斤廢棄物', '製藥業 E-factor 常達 25 到 100'],
      n: '這一頁請大家務必抄下來，是考試的常客。\n原子經濟性等於目標產物的分子量，除以全部反應物分子量的總和，再乘以一百。\n我用維蒂希反應當例子。\n它的磷原子最後變成三苯基氧化膦被丟掉，原子經濟性常常低於百分之二十五。\n如果改用烯烴複分解的觸媒路徑，原子經濟性可以拉到百分之八十以上。\n另一個互補指標是 E 因子，指每生產一公斤產品會產生幾公斤廢棄物。\n大宗化學品大約一到五，製藥業卻常常高達二十五到一百。\n原子經濟性看理論，E 因子看現實，兩個要一起讀。' },
    { t: '普化複習：濃度單位不能錯', s: '第三節', b: ['稀水溶液：1 ppm ≒ 1 mg/L；1 ppb ≒ 1 µg/L', 'mol/L = (mg/L) ÷ 1000 ÷ 分子量', '空氣中 ppm 是體積比，不是質量比', 'µg/m³ = ppm × M × 1000 ÷ 24.45（25 °C）', '注意「以 N 計」「以 P 計」'],
      n: '第三節我們回到普通化學。\n環境數據最容易出錯的地方就是單位。\n在稀水溶液裡，一個 ppm 大約等於一毫克每公升，因為水的密度接近一公斤每公升。\n要換成莫耳濃度，把毫克每公升除以一千再除以分子量。\n請特別注意，空氣中的 ppm 是體積比，不是質量比。\n要換成微克每立方公尺，必須用理想氣體定律，在攝氏二十五度用二十四點四五這個莫耳體積。\n最後提醒，看到以氮計、以磷計的寫法，指的是其中氮或磷的質量。' },
    { t: '普化複習：平衡、pH 與海洋酸化', s: '第三節', b: ['K_w = [H⁺][OH⁻] = 1.0×10⁻¹⁴（25 °C）', 'Henderson–Hasselbalch：pH = pKa + log([A⁻]/[HA])', 'CO₂ 上升 → H₂CO₃* 增加 → H⁺ 增加 → pH 下降', 'CO₃²⁻ 被消耗 → 碳酸鈣殼體難形成'],
      n: '這一頁複習酸鹼平衡，因為水化學幾乎所有題目都建立在它上面。\n第一式是水的離子積，在攝氏二十五度是一乘十的負十四次方。\n第二式是亨德森哈索巴赫方程式，用來算緩衝溶液的酸鹼度。\n下面我用勒沙特列原理解釋海洋酸化。\n大氣二氧化碳分壓上升，溶入海水的碳酸增加。\n平衡右移產生更多氫離子，海水酸鹼度就下降。\n同時碳酸根被消耗掉，貝殼與珊瑚的碳酸鈣就更難形成。\n第五、六週我們會完整推導這個系統。' },
    { t: 'AI 課程倫理規範 I', s: '第三節', b: ['可揭露：作業附「AI 使用聲明」', '可查證：數據、法條、文獻必須回到原始出處', '不可代考：紙筆測驗與口頭報告禁用', 'AI 幻覺文獻出現在報告 → 該題零分', '原則：AI 是助教，不是替身'],
      n: '這一頁是本課程的人工智慧使用規範，請大家務必記住。\n第一條是可揭露。\n只要作業用了人工智慧，就要在文末寫明用了哪個工具、做了什麼、你怎麼驗證。\n第二條是可查證。\n人工智慧給的每一個數據、法規條號、文獻，都必須回到原始出處確認。\n找不到出處的一律不得引用。\n如果報告裡出現人工智慧幻覺產生的假文獻，那一題以零分計算。\n第三條是不可代考，紙筆測驗與口頭報告一律禁止使用。\n一句話總結，人工智慧可以當你的助教，不能當你的替身。' },
    { t: '本週小結與作業', s: '小結', b: ['四個提問：變成什麼、去哪裡、留多久、害到誰', '五大圈層的重點在界面通量', '綠色化學＝源頭設計＋原子經濟性', '作業：完成本週線上練習；閱讀 11E Ch1'],
      n: '我把今天的重點收攏成三句話。\n第一，環境化學問四個問題：變成什麼、去到哪裡、留多久、對誰有害。\n第二，五大圈層的重點不在圈層本身，而在界面上的物質通量。\n第三，綠色化學的核心是源頭設計，最好用的量化指標是原子經濟性。\n作業有兩項。\n第一，完成本週的線上練習，交卷後把成績代碼貼到指定回報處。\n第二，閱讀課本第一章，下週我們接著談工業生態學。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '下列何者<b>最能</b>描述環境化學與傳統分析化學的根本差異？', o: ['環境化學只做定性、不做定量', '環境化學處理的是開放系統，必須同時考慮平衡與動力學', '環境化學不使用儀器分析', '環境化學只研究有機污染物'], a: 1, e: '環境樣品的溫度、光照、pH、氧化還原電位與微生物族群都隨時間變動，屬於開放系統；因此除了熱力學平衡，還必須考慮反應速率與傳輸速率。定性／定量、儀器使用並非本質差異。' },
    { q: '某物質在大氣中的存量為 3.0×10¹² kg，年通量為 3.0×10¹¹ kg/yr，其滯留時間約為多少？', o: ['0.1 年', '1 年', '10 年', '100 年'], a: 2, e: 'τ = M / F = 3.0×10¹² ÷ 3.0×10¹¹ = 10 年。滯留時間愈長，物質愈能在全球均勻混合，問題尺度也愈接近全球性。' },
    { q: '關於碳在環境中的氧化態，下列敘述何者<b>正確</b>？', o: ['CH₄ 中碳為 +4，CO₂ 中碳為 −4', 'CO₂ 中碳為 +4，醣類中碳平均為 0，CH₄ 中碳為 −4', '三者的碳氧化態相同', '醣類中碳為 +2，甲烷中碳為 0'], a: 1, e: 'CO₂ 中氧為 −2 共兩個，碳必為 +4；C₆H₁₂O₆ 可視為 (CH₂O)ₙ，碳平均氧化態為 0；CH₄ 中氫為 +1 共四個，碳為 −4。碳循環本質即碳在 +4 至 −4 之間的氧化還原。' },
    { q: '水中硝酸鹽濃度為 31 mg NO₃⁻/L（NO₃⁻ 分子量 62），換算為莫耳濃度約為？', o: ['5.0×10⁻⁴ M', '3.1×10⁻² M', '5.0×10⁻² M', '3.1×10⁻⁵ M'], a: 0, e: '31 mg/L = 0.031 g/L；0.031 ÷ 62 = 5.0×10⁻⁴ mol/L。環境數據換算務必先統一質量單位再除以分子量。' },
    { q: '關於原子經濟性（atom economy）的計算，下列何者<b>正確</b>？', o: ['以實際產率除以理論產率', '以目標產物分子量除以全部反應物分子量總和', '以廢棄物質量除以產品質量', '以觸媒用量除以基質用量'], a: 1, e: '原子經濟性是理論性的質量利用率指標，只看化學計量式：目標產物分子量 ÷ 反應物分子量總和 ×100%。選項 (A) 是產率、(C) 是 E-factor 的定義、(D) 與原子經濟性無關。' },
    { q: '下列哪一項<b>不屬於</b>綠色化學所強調的「源頭設計」思維？', o: ['提高反應的原子經濟性', '以觸媒取代計量試劑', '在排放口加裝更高效率的洗滌塔', '選用可再生原料取代石化原料'], a: 2, e: '在排放口加裝洗滌塔屬於典型的末端管制（end-of-pipe），污染已經產生後才處理。綠色化學的核心是在設計階段就避免污染生成，(A)(B)(D) 都屬源頭策略。' },
    { q: '空氣中某污染物濃度為 0.5 ppm（體積比），分子量 64（如 SO₂），在 25 °C、1 atm 下約相當於多少 µg/m³？', o: ['約 13 µg/m³', '約 131 µg/m³', '約 1310 µg/m³', '約 32 µg/m³'], a: 2, e: 'µg/m³ = ppm × M × 1000 ÷ 24.45 = 0.5 × 64 × 1000 ÷ 24.45 ≒ 1309 µg/m³。切記空氣中的 ppm 為體積比，換算必須經過莫耳體積。' },
    { q: '依本課程的 AI 使用倫理規範，下列做法何者<b>違反</b>規定？', o: ['在報告文末寫明使用了哪個 AI 工具與用途', '把 AI 提供的文獻逐一回查原始出處後才引用', '直接引用 AI 產生但查無出處的期刊文獻', '用 AI 協助整理程式碼並自行驗證輸出'], a: 2, e: '規範第二條「可查證」明訂：AI 提供的數據、法條、文獻皆須回到原始出處確認，查無出處者不得引用；若幻覺文獻出現在報告中，該題以零分計。' },
    { q: '海洋酸化的化學機制，下列敘述何者<b>正確</b>？', o: ['CO₂ 溶入海水後使 pH 上升、CO₃²⁻ 增加', 'CO₂ 溶入海水產生 H⁺ 使 pH 下降，並消耗 CO₃²⁻', '海洋酸化是因為海水中 NaCl 濃度上升', '海洋酸化與大氣 CO₂ 分壓無關'], a: 1, e: 'CO₂(aq) + H₂O ⇌ H₂CO₃* ⇌ H⁺ + HCO₃⁻ ⇌ 2H⁺ + CO₃²⁻。大氣 CO₂ 分壓上升使平衡右移、[H⁺] 增加而 pH 下降；同時新增的 H⁺ 與既有 CO₃²⁻ 結合成 HCO₃⁻，使碳酸根減少，碳酸鈣殼體更難形成。' },
    { q: '工業生態學（industrial ecology）的核心主張是？', o: ['把工廠遷離人口稠密區以降低暴露', '讓工廠群像生態系一樣互相利用彼此的副產物與廢棄物', '以更嚴格的排放標準取代技術改良', '全面停止化學工業活動'], a: 1, e: '工業生態學把人類圈的線性物質流（開採—製造—使用—拋棄）改造成類似自然生態系的循環：某廠的廢棄物成為另一廠的原料，藉此降低資源投入與廢棄物產出。' }
  ],
  hw: 'AI 翻轉：課前預習 11E Ch1；課後於 Zuvio 完成反思一則（150 字內），並完成本週線上練習。'
};

CONTENT[2] = {
  type: 'teach',
  title: '永續化學、綠色化學 II（工業生態與綠色化學）｜有機基礎複習｜分組說明',
  chapters: '11E Ch1（中譯 Ch1）、Ch16 人類圈與工業生態／綠色化學（無中譯）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 16 章（無中譯本對應章）、第 1 章（中譯本第 1 章）',
  goals: [
    '能用「物質流分析」描述一個產業鏈，並指出可循環的節點。',
    '能比較計量試劑與觸媒路徑在原子經濟性、E-factor 與能耗上的差異。',
    '能辨識常見官能基，並預測其在環境中的極性、溶解度與降解傾向。',
    '能判讀 log K<sub>ow</sub> 並推論污染物的生物累積潛勢。',
    '能組成期末行動小組並訂出可執行的題目範圍。'
  ],
  cards: [
    { h: '工業生態學：把工廠群當成生態系', b: '自然生態系裡沒有「廢棄物」這個詞，只有「別人的食物」。工業生態學把同樣邏輯搬到人類圈：<b>一廠的副產物成為另一廠的原料</b>。<br>丹麥 Kalundborg 是最常被引用的原型：發電廠的廢蒸汽供給煉油廠與市鎮供暖，脫硫產生的石膏（CaSO<sub>4</sub>·2H<sub>2</sub>O）供給石膏板廠，酵母廠的殘渣做成飼料。整個園區的物質流從線性變成網狀。<br>從化學看，這個做法的價值在於<b>避免「稀釋」</b>：物質一旦被稀釋到低濃度，再回收就要付出巨大的能量代價（分離熵）。', local: '花蓮連結：中華紙漿花蓮廠的黑液回收鍋爐把製漿廢液燒回蒸汽與化學品，本身就是工業生態的在地實例，第 15 週我們會現場驗證。' },
    { h: '觸媒 vs 計量試劑：綠色化學最有效的一招', b: '計量（stoichiometric）試劑用一次就變成廢棄物；觸媒可以循環數千次。以醇氧化成酮為例：<div class="eq">傳統：3 R<sub>2</sub>CHOH + 2 CrO<sub>3</sub> + 3 H<sub>2</sub>SO<sub>4</sub> <span class="fx">→</span> 3 R<sub>2</sub>C=O + Cr<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> + 6 H<sub>2</sub>O<br>綠色：R<sub>2</sub>CHOH + ½ O<sub>2</sub> <span class="fx">--觸媒--&gt;</span> R<sub>2</sub>C=O + H<sub>2</sub>O</div>前者每做一莫耳酮就產生含 Cr(III) 的重金屬污泥；後者的副產物只有水，且氧化劑是空氣。<b>觸媒不只降低活化能，更改變了「廢棄物的化學組成」</b>，這是綠色化學最有效的槓桿。' },
    { h: '溶劑選擇：常被忽略的最大宗排放', b: '在多數精細化工製程中，溶劑佔全部投入質量的 <b>50–80%</b>，也因此是 E-factor 的主要來源。溶劑選擇的優先順序大致是：<br>水 &gt; 乙醇／乙酸乙酯等生質可得溶劑 &gt; 超臨界 CO<sub>2</sub> &gt; 一般極性非質子溶劑 &gt; 氯化溶劑（如 CH<sub>2</sub>Cl<sub>2</sub>、CHCl<sub>3</sub>）。<br>氯化溶劑之所以排在最後，是因為它們同時具備<b>高揮發性、低生物降解性、地下水移動性強、且部分具肝毒性與致癌性</b>。超臨界 CO<sub>2</sub>（T<sub>c</sub>＝31 °C、P<sub>c</sub>＝73.8 bar）則能在洩壓後直接氣化回收，殘留溶劑幾乎為零。' },
    { h: '可再生原料與生質精煉', b: '石化路線的碳來自地層（fossil carbon），使用後淨增加大氣 CO<sub>2</sub>；生質路線的碳來自當季光合作用（biogenic carbon），理論上碳中性。<br>生質精煉（biorefinery）常見平台分子包括：乳酸（→聚乳酸 PLA）、糠醛與 5-HMF（由 C5／C6 糖脫水而得）、丁二酸、甘油（生質柴油副產物）。<div class="eq">葡萄糖 <span class="fx">→</span> 乳酸 <span class="fx">→</span> 丙交酯 <span class="fx">→</span> 聚乳酸（PLA）</div>但要注意：<b>可再生 ≠ 一定綠色</b>。若原料來自砍伐雨林的棕櫚油、或製程耗用大量化石能源與水，整體生命週期未必較佳。這就是必須做生命週期評估（LCA）的原因。', local: '花蓮連結：稻稈、鳳梨葉、檳榔葉鞘等在地農業剩餘物，是可討論的生質原料，但收集半徑與含水率往往才是成敗關鍵。' },
    { h: '有機複習 I：官能基決定環境行為', b: '看到一個有機污染物的結構，先看官能基就能猜出它的環境行為：<br>• <b>–OH、–COOH、–NH<sub>2</sub></b>：可形成氫鍵 → 水溶性高、易被微生物利用 → 通常較快降解。<br>• <b>–Cl、–F（芳香環上）</b>：鍵能高、電子雲改變 → 抗微生物攻擊 → 持久性強。C–F 鍵能約 485 kJ/mol，是有機化學中最強的單鍵之一，這正是 PFAS 難以分解的根本原因。<br>• <b>芳香環、稠環</b>：疏水、平面、可嵌入生物膜 → 易生物累積（如 PAHs）。<br>• <b>–NO<sub>2</sub></b>：強拉電子 → 使苯環對親電取代鈍化，也常伴隨較高毒性。' },
    { h: '有機複習 II：log K<sub>ow</sub> 與生物累積', b: '辛醇／水分配係數 K<sub>ow</sub> 是環境有機化學最常用的一個數字：<div class="eq">K<sub>ow</sub> ＝ C<sub>辛醇</sub> / C<sub>水</sub>　；　常以 log K<sub>ow</sub> 表示</div>經驗判讀：<br>• log K<sub>ow</sub> &lt; 1：高水溶性，隨水移動，易穿透至地下水（如甲醇、丙酮）。<br>• 1–3：中等，常見於一般農藥與藥物。<br>• 3–5：疏水，開始明顯吸附於有機質與沉積物。<br>• &gt; 5：高生物累積潛勢，常見於 PCBs、DDT、多環芳香烴。<br>另一個常搭配的是 K<sub>oc</sub>（有機碳吸附係數），可由 log K<sub>oc</sub> ≒ 0.82 log K<sub>ow</sub> + 0.14 之類的經驗式估算，用來預測污染物在土壤中的移動速度。' },
    { h: '生命週期評估（LCA）的四個步驟', b: 'LCA 是判斷「到底哪個方案比較綠」的標準方法，依 ISO 14040 分四步：<br>① <b>目標與範疇界定</b>：功能單位是什麼？（例如「運送 1 公升飲料」而不是「一個瓶子」）系統邊界到哪裡？<br>② <b>盤查分析（LCI）</b>：把每個階段的能源、原料、排放列成清單。<br>③ <b>衝擊評估（LCIA）</b>：把清單換算成溫室效應、酸化、優養化、毒性等衝擊類別。<br>④ <b>詮釋</b>：做敏感度分析，指出結論在哪些假設下會翻轉。<br>最常見的錯誤是<b>功能單位設錯</b>：拿「一個玻璃瓶 vs 一個寶特瓶」比較是沒有意義的，必須比較「送達同樣體積飲料並回收 N 次」的整體情境。' },
    { h: '期末行動與分組說明', b: '本課程的期末成果不是文獻回顧報告，而是<b>一份可執行的行動方案</b>。<br>• <b>組成</b>：4–5 人一組，於第 2 週結束前完成分組登記。<br>• <b>題目範圍</b>：必須落在花蓮（或東華校園）的真實場域，且能連結到本學期的化學內容。例如校內生活污水的磷回收、實驗室廢液減量、校園雨水回收的水質評估、農業剩餘物的資源化。<br>• <b>時程</b>：W3 題目初擬 → W7 計畫書 → W12 期中檢核 → W18 成果發表與同儕互評。<br>• <b>評分重點</b>：問題定義是否具體、化學論證是否正確、資料是否可查證、方案是否真的可執行（而非口號）。' }
  ],
  slides: [
    { t: '環境化學　第 2 週', s: '封面', cover: true, b: ['永續化學與綠色化學 II｜工業生態學', '有機基礎複習｜分組說明', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n上週我們建立了環境化學的框架，也談了綠色化學的十二原則。\n今天第一節我們把綠色化學往上拉到系統層次，談工業生態學。\n第二節做有機化學的基礎複習，重點放在官能基與分配係數。\n第三節說明期末行動的分組方式與時程。\n請大家把上週的筆記翻出來，我們接著走。' },
    { t: '生態系裡沒有廢棄物', s: '第一節', b: ['自然界：一個生物的排泄物是另一個的食物', '工業生態學：把園區設計成物質網', 'Kalundborg：廢蒸汽、石膏、酵母渣的交換', '化學意義：避免「稀釋」帶來的分離熵'],
      n: '請大家先想一件事。\n在自然生態系裡，其實沒有廢棄物這個詞。\n一個生物的排泄物，就是另一個生物的食物。\n工業生態學就是把這個邏輯搬到人類圈。\n丹麥的卡倫堡是最常被引用的原型。\n發電廠的廢蒸汽供給煉油廠跟市鎮供暖。\n脫硫產生的石膏送去做石膏板。\n酵母廠的殘渣變成飼料。\n從化學看，這樣做最大的價值是避免稀釋。\n物質一旦被稀釋到低濃度，要再回收就要付出巨大的能量代價。' },
    { t: '觸媒取代計量試劑', s: '第一節', b: ['計量試劑：用一次就變廢棄物', '鉻酸氧化 → 產生 Cr(III) 重金屬污泥', '觸媒空氣氧化 → 副產物只有水', '觸媒改變的不只是速率，是廢棄物的化學組成'],
      n: '這一頁是綠色化學最有效的一招。\n計量試劑的意思是，用一莫耳基質就要消耗一莫耳以上的試劑。\n用完之後試劑就變成廢棄物。\n以醇氧化成酮為例，傳統做法用鉻酸。\n每做一莫耳酮，就產生含三價鉻的重金屬污泥。\n綠色的做法是用觸媒配合空氣中的氧氣。\n副產物只有水。\n請注意這裡的關鍵。\n觸媒改變的不只是反應速率，更改變了廢棄物的化學組成。\n這才是它真正的價值。' },
    { t: '溶劑：被忽略的最大宗', s: '第一節', b: ['精細化工中溶劑佔投入質量 50–80%', '優先序：水 > 生質溶劑 > 超臨界 CO₂ > 極性非質子 > 氯化溶劑', '氯化溶劑：易揮發、難降解、地下水移動性強', '超臨界 CO₂：31 °C、73.8 bar，洩壓即回收'],
      n: '很多人以為綠色化學只看反應物，其實溶劑才是大宗。\n在多數精細化工製程裡，溶劑佔了全部投入質量的五成到八成。\n所以它也是 E 因子的主要來源。\n溶劑選擇的優先順序大致是這樣。\n水最好，其次是乙醇、乙酸乙酯這類生質可得的溶劑。\n再來是超臨界二氧化碳。\n一般極性非質子溶劑再次之。\n氯化溶劑排在最後。\n因為它們同時具備高揮發性、難生物降解、在地下水中移動性強，而且部分有肝毒性與致癌性。' },
    { t: '可再生原料與生質精煉', s: '第一節', b: ['化石碳 vs 生質碳：淨排放的差別', '平台分子：乳酸、糠醛、5-HMF、丁二酸、甘油', '葡萄糖 → 乳酸 → 丙交酯 → 聚乳酸', '可再生 ≠ 一定綠色，要看生命週期'],
      n: '接下來談原料。\n石化路線的碳來自地層，燒掉之後淨增加大氣二氧化碳。\n生質路線的碳來自當季的光合作用，理論上是碳中性。\n生質精煉常見的平台分子有乳酸、糠醛、羥甲基糠醛、丁二酸跟甘油。\n以聚乳酸為例，路徑是葡萄糖發酵成乳酸，再脫水成丙交酯，最後開環聚合。\n但我要特別提醒一件事。\n可再生不等於一定綠色。\n如果原料來自砍伐雨林，或製程耗用大量化石能源與水，整體未必比較好。\n所以我們才需要生命週期評估。' },
    { t: '官能基決定環境行為', s: '第二節', b: ['–OH、–COOH、–NH₂：水溶性高、易降解', 'C–F 鍵能約 485 kJ/mol → PFAS 極難分解', '芳香環、稠環：疏水、平面 → 易生物累積', '–NO₂：強拉電子，常伴隨較高毒性'],
      n: '第二節進入有機複習。\n我要教大家一個很實用的直覺。\n看到一個有機污染物的結構，先看官能基，就能猜出它的環境行為。\n有羥基、羧基、胺基的，可以形成氫鍵，水溶性高，微生物也比較願意吃，通常降解得快。\n芳香環上接氯或氟的就麻煩了。\n碳氟鍵的鍵能大約是四百八十五千焦耳每莫耳。\n這是有機化學中最強的單鍵之一。\n這正是全氟烷基物質這麼難分解的根本原因。\n稠環化合物疏水又平面，容易嵌進生物膜，所以容易累積。' },
    { t: 'log K_ow 怎麼讀', s: '第二節', b: ['K_ow = 辛醇相濃度 ÷ 水相濃度', '< 1：高水溶性，易到地下水', '3–5：明顯吸附於有機質與沉積物', '> 5：高生物累積潛勢（PCBs、DDT）', 'log K_oc ≒ 0.82 log K_ow + 0.14'],
      n: '這一頁的數字請務必記住，考試一定會用到。\n辛醇水分配係數，就是物質在辛醇相跟水相的濃度比。\n通常取對數來表示。\n對數值小於一，代表高水溶性，會跟著水跑，容易穿透到地下水。\n一到三是中等，一般農藥跟藥物大多落在這裡。\n三到五開始明顯吸附在有機質跟沉積物上。\n大於五就是高生物累積潛勢，多氯聯苯跟滴滴涕都在這一區。\n另外還有一個有機碳吸附係數，可以用經驗式從辛醇水分配係數估算。\n它用來預測污染物在土壤中跑多快。' },
    { t: '生命週期評估的四個步驟', s: '第二節', b: ['① 目標與範疇：功能單位、系統邊界', '② 盤查分析 LCI：能源、原料、排放清單', '③ 衝擊評估 LCIA：溫室、酸化、優養化、毒性', '④ 詮釋：敏感度分析', '常見錯誤：功能單位設錯'],
      n: '要判斷哪個方案比較綠，就要做生命週期評估。\n依照國際標準，它分成四個步驟。\n第一步是界定目標與範疇，最重要的是功能單位。\n第二步是盤查分析，把每個階段的能源、原料、排放列成清單。\n第三步是衝擊評估，把清單換算成溫室效應、酸化、優養化、毒性這些類別。\n第四步是詮釋，要做敏感度分析，說清楚結論在哪些假設下會翻轉。\n我要強調最常見的錯誤，就是功能單位設錯。\n比較一個玻璃瓶跟一個寶特瓶是沒有意義的。\n要比的是送達同樣體積飲料並回收幾次的整體情境。' },
    { t: '案例演練：手搖杯要用哪種容器', s: '第二節', b: ['功能單位：提供 700 mL 冷飲一次', '選項：一次性 PP 杯、PLA 杯、自備不鏽鋼杯', 'PLA 需工業堆肥條件才降解', '不鏽鋼杯的損益平衡點在使用次數'],
      n: '我們做一個小演練。\n題目是手搖杯到底要用哪一種容器。\n先設功能單位，就是提供一次七百毫升的冷飲。\n選項有三個，一次性聚丙烯杯、聚乳酸杯，還有自備不鏽鋼杯。\n很多人直覺選聚乳酸，因為它是生質來源。\n可是聚乳酸需要工業堆肥的高溫與菌相才會降解。\n丟進一般垃圾或海洋，它跟塑膠差不多。\n不鏽鋼杯的製造衝擊很高，但可以重複使用。\n所以關鍵是損益平衡點在第幾次。\n這個問題沒有標準答案，但一定要用數字論證。' },
    { t: '期末行動：不是報告，是方案', s: '第三節', b: ['4–5 人一組，本週結束前完成登記', '題目必須落在花蓮或東華校園的真實場域', '例：磷回收、實驗室廢液減量、雨水回收水質', '時程：W3 初擬 → W7 計畫書 → W12 檢核 → W18 發表'],
      n: '第三節說明期末行動。\n請注意，本課程的期末成果不是文獻回顧報告。\n我要的是一份可以執行的行動方案。\n分組是四到五人一組，這週結束前要完成登記。\n題目一定要落在花蓮或東華校園的真實場域。\n而且要能連結到這學期的化學內容。\n舉幾個例子，校內生活污水的磷回收、實驗室廢液減量、校園雨水回收的水質評估、農業剩餘物的資源化。\n時程是第三週題目初擬，第七週交計畫書，第十二週期中檢核，第十八週成果發表。' },
    { t: '期末行動的評分重點', s: '第三節', b: ['問題定義是否具體（有數字、有邊界）', '化學論證是否正確（反應式、質量平衡）', '資料是否可查證（來源、年份、單位）', '方案是否真的可執行，不是口號', '同儕互評佔一定比例'],
      n: '這一頁講評分重點，請大家先看清楚再選題。\n第一，問題定義要具體。\n要有數字、有邊界，不能只寫我們想改善校園環境。\n第二，化學論證要正確。\n該有的反應式、質量平衡、單位換算都要對。\n第三，資料要可查證。\n每個數字都要有來源、年份跟單位。\n第四，方案要真的可執行，不是口號。\n最後提醒，第十八週會有同儕互評，佔一定比例。\n所以組內分工要清楚。' },
    { t: '本週小結與作業', s: '小結', b: ['工業生態學＝把線性物質流改成網狀', '觸媒與溶劑是綠色化學最有效的兩個槓桿', 'log K_ow 是判斷環境宿命的第一個數字', '作業：完成分組登記；本週線上練習'],
      n: '我把今天收攏成三句話。\n第一，工業生態學就是把人類圈的線性物質流，改造成網狀的循環。\n第二，觸媒與溶劑是綠色化學最有效的兩個槓桿，因為它們直接改變廢棄物的組成與數量。\n第三，看到一個有機污染物，先問它的辛醇水分配係數，這是判斷環境宿命的第一個數字。\n作業有兩項。\n第一，這週結束前完成分組登記。\n第二，完成本週的線上練習。\n下週我們進入能源、廢棄物與毒物。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '工業生態學認為「避免稀釋」很重要，其化學／熱力學理由是？', o: ['稀釋會使反應速率變快，不易控制', '物質被稀釋後再分離回收需要付出很大的能量代價', '稀釋會改變物質的分子量', '稀釋一定會提高毒性'], a: 1, e: '把高濃度物質攤平成低濃度是熵增過程；要逆轉回高濃度必須輸入功（分離能）。因此工業生態強調在物質仍具高濃度時就交換利用，而非排放後再處理。' },
    { q: '以 CrO₃／H₂SO₄ 氧化二級醇的傳統路線，相較觸媒／空氣氧化路線，最主要的環境缺點是？', o: ['反應太慢', '產生含 Cr(III) 的重金屬污泥', '需要極低溫', '產物不同'], a: 1, e: '鉻酸為計量氧化劑，反應後鉻被還原成 Cr(III) 進入廢液成為重金屬污泥；觸媒／O₂ 路線的副產物僅為水。觸媒改變的正是「廢棄物的化學組成」。' },
    { q: '關於超臨界 CO₂ 作為綠色溶劑，下列敘述何者<b>錯誤</b>？', o: ['臨界溫度約 31 °C、臨界壓力約 73.8 bar', '洩壓後可直接氣化與產物分離，殘留溶劑極少', '因為需要高壓設備，投資成本較高', '它是強極性溶劑，可完全取代水'], a: 3, e: '超臨界 CO₂ 屬非極性至弱極性溶劑，對非極性物質溶解力佳，但無法取代水處理離子性或高極性物質；常需添加共溶劑。其餘敘述皆正確。' },
    { q: 'PFAS（全氟／多氟烷基物質）在環境中極難分解的<b>主要化學原因</b>是？', o: ['分子量太大', 'C–F 鍵能高（約 485 kJ/mol），微生物與化學氧化難以攻擊', '完全不溶於水', '它們是無機化合物'], a: 1, e: 'C–F 是有機化學中最強的單鍵之一，且氟的強電負度使碳帶正電、抗親核攻擊，因此對生物降解與一般化學氧化都極為穩定，形成「永久化學物質」。' },
    { q: '某有機污染物 log K_ow ＝ 6.5，下列推論何者<b>最合理</b>？', o: ['高水溶性，容易穿透至地下水', '高疏水性，易吸附於沉積物並在食物鏈中生物累積', '極易被微生物快速礦化', '在大氣中滯留時間必然很短'], a: 1, e: 'log K_ow > 5 屬高疏水性，會強烈分配到有機質、脂肪與沉積物中，具高生物累積潛勢（如 PCBs、DDT）。水溶性反而低。' },
    { q: '進行生命週期評估時，「功能單位」設定錯誤最可能造成什麼後果？', o: ['盤查資料量變少', '不同方案間的比較失去意義', '衝擊類別無法計算', '敏感度分析不需要做'], a: 1, e: 'LCA 的一切比較都建立在同一個功能單位上（例如「送達 1 公升飲料並回收 N 次」）。功能單位設錯，等於在比較兩件不同的事，結論自然無效。' },
    { q: '下列何者<b>不是</b>綠色化學中「溶劑選擇」的合理優先順序考量？', o: ['優先使用水或生質可得溶劑', '盡量避免氯化溶劑', '以是否具有刺鼻氣味作為唯一判準', '考慮溶劑可否回收與其揮發性'], a: 2, e: '氣味與毒性、持久性沒有可靠對應（例如無味的 CO 極毒）。溶劑選擇應依毒性、生物降解性、揮發性、可回收性與生命週期衝擊綜合判斷。' },
    { q: '關於「可再生原料」的敘述，下列何者<b>最正確</b>？', o: ['只要來自生物質，環境衝擊必然低於石化路線', '生質碳來自當季光合作用，理論上碳中性，但仍須以 LCA 檢視整體衝擊', '生質塑膠在任何環境條件下都會快速降解', '可再生原料不需考慮土地利用問題'], a: 1, e: '生質碳理論上碳中性，但若涉及森林砍伐、大量化石能源投入、水足跡或與糧食競爭，整體衝擊可能反而更高；PLA 亦需工業堆肥條件才能有效降解。' },
    { q: '某反應 A（M＝100）+ B（M＝50）→ P（M＝120）+ W（M＝30），其原子經濟性為？', o: ['60%', '80%', '75%', '40%'], a: 1, e: 'AE ＝ 120 ÷ (100+50) × 100% ＝ 80%。副產物 W 佔去的 30 即為理論上不可避免的質量損失。' }

  cards: [
    { h: '能源的三個比較指標', b: '談能源不能只談「乾不乾淨」，至少要看三個數字：<br>① <b>能量密度</b>（MJ/kg）：氫氣約 120、汽油約 44、無煙煤約 30、乾木材約 16、鋰電池（單體）約 0.6–0.9（整套電池系統含外殼、冷卻與管理電路後約再打六折）。氫氣質量能量密度最高，但體積能量密度極低，這正是儲氫困難的原因。<br>② <b>EROI</b>（能源投資報酬率）＝產出能量／投入能量。傳統油田曾高達 100:1，現今頁岩油約 5–15:1，玉米乙醇常低於 2:1。<b>EROI 低於約 5:1 的能源難以支撐複雜社會</b>。<br>③ <b>碳強度</b>（g CO<sub>2</sub>e/kWh）：燃煤約 820、天然氣約 490、太陽光電約 40–50、風力約 11–12、核能約 12。' },
    { h: '燃燒化學與它的副產物', b: '理想燃燒只產生 CO<sub>2</sub> 與 H<sub>2</sub>O，但真實鍋爐從來不理想：<div class="eq">完全燃燒：C<sub>x</sub>H<sub>y</sub> + (x + y/4) O<sub>2</sub> <span class="fx">→</span> x CO<sub>2</sub> + (y/2) H<sub>2</sub>O<br>不完全燃燒：2 C + O<sub>2</sub> <span class="fx">→</span> 2 CO<br>燃料硫：S + O<sub>2</sub> <span class="fx">→</span> SO<sub>2</sub><br>熱式 NO<sub>x</sub>：N<sub>2</sub> + O<sub>2</sub> <span class="fx">→</span> 2 NO（需 &gt; 1300 °C）</div>請特別注意：<b>NO<sub>x</sub> 大多不是燃料帶進來的，而是空氣中的 N<sub>2</sub> 在高溫下被氧化</b>（Zeldovich 機制）。所以降低 NO<sub>x</sub> 的策略是「降低火焰峰值溫度」（低氮燃燒器、煙氣再循環），而不是換燃料。這個觀念第 12–13 週還會用到。' },
    { h: '有害廢棄物的四大特性', b: '判定一批廢棄物是否「有害」，國際上多以四項特性檢視：<br>① <b>易燃性（ignitability）</b>：閃火點低於 60 °C 的液體（如丙酮、甲苯）。<br>② <b>反應性（reactivity）</b>：遇水劇烈反應（Na、CaC<sub>2</sub>）、易爆（過氧化物、疊氮化物）、遇酸釋出有毒氣體（含氰、含硫化物）。<br>③ <b>腐蝕性（corrosivity）</b>：pH ≤ 2 或 ≥ 12.5，或對鋼材腐蝕速率超過標準。<br>④ <b>毒性（toxicity）</b>：以浸出試驗（如 TCLP）判定重金屬等是否會從固化廢棄物中溶出。<br><b>實驗室最常見的錯誤是把「相容性」忘掉</b>：漂白水（NaClO）與酸混合會放出 Cl<sub>2</sub>；與含氨清潔劑混合會生成氯胺。廢液桶絕不可混裝。', local: '花蓮連結：東華校內各系實驗室廢液分類桶（有機、含鹵、重金屬、酸鹼）就是這四特性的實務展現，期末行動可從此切入。' },
    { h: '廢棄物管理的優先順序', b: '廢棄物階層（waste hierarchy）由上而下：<b>避免產生 &gt; 減量 &gt; 再使用 &gt; 再生利用 &gt; 能源回收 &gt; 最終處置</b>。<br>化學上要注意的是，愈往下走，物質的<b>資訊含量</b>愈低：焚化把有機分子的結構資訊全部歸零，只剩熱值；掩埋則把物質鎖在一個難以再利用的低濃度基質中。<br>因此「再生利用」聽起來不錯，但若回收過程需要大量能量與溶劑（例如混合塑膠的化學回收），有時能源回收反而總衝擊較低。<b>這又回到 LCA：階層是原則，不是絕對命令。</b>' },
    { h: '毒物化學 I：劑量決定毒性', b: '毒理學的第一定律是「劑量造就毒物」。同一物質在不同劑量下可能是必需營養素，也可能是致命毒物（如硒、銅、鐵）。<br>劑量–反應曲線通常呈 S 形，關鍵參數：<br>• <b>LD<sub>50</sub></b>：使半數試驗動物死亡的單次劑量（mg/kg 體重），數值愈小愈毒。<br>• <b>NOAEL</b>：未觀察到不良效應的最高劑量。<br>• <b>RfD／ADI</b>：由 NOAEL 除以不確定係數（種間 10 × 個體差異 10 ＝ 100）而得的每日可接受攝取量。<br>限制：LD<sub>50</sub> 只反映急性致死，對慢性、致癌、內分泌干擾幾乎沒有預測力；<b>內分泌干擾物甚至可能呈非單調劑量反應</b>，低劑量效應反而更明顯。' },
    { h: '毒物化學 II：動力學相與動態相', b: '外來物質（xenobiotics）進入人體後分成兩個階段：<br><b>動力學相（kinetic phase）</b>＝ADME：吸收（absorption）、分布（distribution）、代謝（metabolism）、排泄（excretion）。肝臟的第一相反應由細胞色素 P450 進行氧化，第二相以葡萄糖醛酸、硫酸或麩胱甘肽接合，提高水溶性以利排出。<br><b>動態相（dynamic phase）</b>＝毒物或其代謝物與受體、酵素、DNA 作用產生效應。<br>關鍵陷阱：<b>代謝不一定解毒</b>。苯經 P450 氧化成環氧化物後才具骨髓毒性；多環芳香烴（如苯并[a]芘）也是經代謝活化成二醇環氧化物才與 DNA 形成加成物。這稱為<b>代謝活化（bioactivation）</b>。' },
    { h: '毒物化學 III：重金屬的作用機制', b: '重金屬毒性大多可歸納成三種化學機制：<br>① <b>與硫醇基（–SH）結合</b>：Hg<sup>2+</sup>、Pb<sup>2+</sup>、Cd<sup>2+</sup> 與酵素活性中心的半胱氨酸結合，使酵素失活。這也是螯合治療（如 BAL、DMSA 帶 –SH）的設計依據。<br>② <b>離子模擬（ionic mimicry）</b>：Pb<sup>2+</sup> 取代 Ca<sup>2+</sup> 進入骨骼與神經傳導路徑；Cd<sup>2+</sup> 取代 Zn<sup>2+</sup> 干擾鋅指蛋白。<br>③ <b>催化氧化壓力</b>：Fe<sup>2+</sup>、Cu<sup>+</sup> 經 Fenton 反應產生氫氧自由基<div class="eq">Fe<sup>2+</sup> + H<sub>2</sub>O<sub>2</sub> <span class="fx">→</span> Fe<sup>3+</sup> + OH<sup>−</sup> + <span class="fx">•</span>OH</div>形態（speciation）比總量更重要：甲基汞（CH<sub>3</sub>Hg<sup>+</sup>）可穿越血腦障壁與胎盤，毒性遠高於無機汞；Cr(VI) 為致癌物而 Cr(III) 是微量必需元素。' },
    { h: '生物累積與生物放大', b: '兩個常被混用的名詞要分清楚：<br>• <b>生物累積（bioaccumulation）</b>：單一生物體內濃度隨時間高於環境濃度。<br>• <b>生物放大（biomagnification）</b>：濃度沿食物鏈逐級上升。<br>能被放大的物質通常同時符合三個條件：<b>疏水（log K<sub>ow</sub> &gt; 5）、抗代謝、半衰期長</b>。甲基汞是特例——它水溶性不低，但與蛋白質硫醇基強烈結合且排除極慢，因此在海洋食物鏈可放大百萬倍以上，這正是大型掠食性魚類需限制攝食的原因。' },
    { h: '期末行動討論 I：把題目變小、變準', b: '第一次討論的唯一任務是<b>把題目縮小到可以量測</b>。請用以下句型改寫你們的題目：<div class="eq">「在（場域）中，（對象物質／流量）目前為（數值或未知），我們打算用（方法）在（期間）內量測／改善它，成功的判準是（指標）。」</div>反例：「我們想改善校園的環境永續。」（無場域、無物質、無指標）<br>正例：「在東華理工學院實驗室，每月產生的含鹵有機廢液約 X 公升，我們打算以溶劑替代與回收蒸餾評估減量潛勢，判準是含鹵廢液佔總廢液比例下降。」<br>本節課請各組完成一頁 A4：題目、場域、關鍵化學、可量測指標、可能困難。' }
  ],
  slides: [
    { t: '環境化學　第 3 週', s: '封面', cover: true, b: ['人類圈：能源、廢棄物、毒物', '期末行動討論 I', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n今天是總論的最後一週。\n我們要一次談完人類圈的三大主題：能源、廢棄物、還有毒物。\n這三件事看起來很分散，但其實有一條主線把它們串起來。\n那就是人類圈的物質流與能量流，最後都要在生物體內結帳。\n第三節我們做期末行動的第一次討論。\n請各組坐在一起。' },
    { t: '比較能源的三把尺', s: '第一節', b: ['能量密度：氫 120、汽油 44、煤 30、木材 16 MJ/kg', 'EROI＝產出能量 ÷ 投入能量', '傳統油田曾 100:1；玉米乙醇常 < 2:1', '碳強度：煤 820、天然氣 490、風力 11 g CO₂e/kWh'],
      n: '談能源不能只談乾不乾淨。\n我給大家三把尺。\n第一把是能量密度。\n氫氣的質量能量密度最高，大約每公斤一百二十百萬焦耳。\n汽油約四十四，煤約三十，乾木材約十六。\n但請注意，氫氣的體積能量密度極低，這才是儲氫困難的真正原因。\n第二把尺是能源投資報酬率，就是產出能量除以投入能量。\n傳統油田曾經高達一百比一，玉米乙醇卻常低於二比一。\n第三把尺是碳強度，燃煤大約八百二十克二氧化碳當量每度電，風力只有十一。' },
    { t: '燃燒化學：理想與現實', s: '第一節', b: ['完全燃燒：CₓH_y + (x+y/4) O₂ → x CO₂ + (y/2) H₂O', '不完全燃燒 → CO、未燃碳氫、煤煙', '燃料硫 → SO₂', '熱式 NOₓ：N₂ + O₂ → 2 NO，需超過 1300 °C'],
      n: '這一頁是全學期會反覆用到的燃燒化學。\n理想的完全燃燒只產生二氧化碳跟水。\n但真實的鍋爐從來不理想。\n氧氣不足就會產生一氧化碳、未燃碳氫，還有煤煙。\n燃料裡的硫會變成二氧化硫。\n最後這一條請特別注意。\n氮氧化物大多不是燃料帶進來的。\n它是空氣中的氮氣在超過攝氏一千三百度的高溫下被氧化。\n這叫做熱式氮氧化物，機制是澤爾多維奇機制。' },
    { t: '所以 NOₓ 要怎麼降', s: '第一節', b: ['既然來自空氣中的 N₂，換燃料沒用', '策略：降低火焰峰值溫度', '低氮燃燒器、分段燃燒、煙氣再循環', '後處理：選擇性催化還原 SCR（NH₃ + NO → N₂ + H₂O）'],
      n: '接續上一頁的邏輯。\n既然氮氧化物主要來自空氣中的氮氣，那換用低氮燃料是沒有用的。\n正確的策略是降低火焰的峰值溫度。\n實務上有低氮燃燒器、分段燃燒、還有煙氣再循環。\n如果前端做不到，就要靠後處理。\n最常用的是選擇性催化還原。\n噴入氨或尿素，在觸媒上把一氧化氮還原成氮氣跟水。\n這個反應式請記起來，期中考很可能會出。' },
    { t: '有害廢棄物的四大特性', s: '第二節', b: ['易燃性：閃火點低於 60 °C', '反應性：遇水劇烈、易爆、遇酸放毒氣', '腐蝕性：pH ≤ 2 或 ≥ 12.5', '毒性：以浸出試驗判定重金屬溶出'],
      n: '第二節談廢棄物。\n判定一批廢棄物是不是有害，國際上大致看四個特性。\n第一是易燃性，閃火點低於攝氏六十度的液體。\n像丙酮、甲苯都屬於這一類。\n第二是反應性，包含遇水劇烈反應、容易爆炸、還有遇酸釋出有毒氣體。\n第三是腐蝕性，酸鹼值小於等於二或大於等於十二點五。\n第四是毒性，用浸出試驗判斷重金屬會不會從固化的廢棄物裡溶出來。' },
    { t: '實驗室最常見的錯誤：相容性', s: '第二節', b: ['漂白水 + 酸 → Cl₂', '漂白水 + 含氨清潔劑 → 氯胺', '廢液桶絕不可混裝', '分類：有機、含鹵、重金屬、酸鹼'],
      n: '這一頁跟大家的實驗課直接相關。\n實驗室最常犯的錯誤不是不知道毒性，而是忘記相容性。\n漂白水加酸會放出氯氣。\n漂白水加含氨的清潔劑會生成氯胺，一樣有毒。\n所以廢液桶絕對不可以混裝。\n本系的分類是有機、含鹵、重金屬、酸鹼四大類。\n請大家倒廢液前一定要先看標籤。\n這件事沒有僥倖的空間。' },
    { t: '廢棄物階層與它的限制', s: '第二節', b: ['避免 > 減量 > 再使用 > 再生 > 能源回收 > 處置', '愈往下，物質的資訊含量愈低', '焚化把分子結構歸零，只剩熱值', '階層是原則，不是絕對命令，仍要看 LCA'],
      n: '廢棄物管理有一個階層。\n由上而下是避免產生、減量、再使用、再生利用、能源回收、最終處置。\n我用化學的角度解釋為什麼是這個順序。\n愈往下走，物質的資訊含量愈低。\n焚化等於把有機分子的結構資訊全部歸零，只剩下熱值。\n掩埋則是把物質鎖在一個難以再利用的低濃度基質裡。\n但我要提醒，這個階層是原則，不是絕對命令。\n如果化學回收要耗掉大量能量與溶劑，有時能源回收的總衝擊反而比較低。' },
    { t: '劑量造就毒物', s: '第三節', b: ['同一物質可以是必需營養素也可以是毒物（Se、Cu、Fe）', 'LD₅₀：半數致死劑量，愈小愈毒', 'NOAEL：未觀察到不良效應的最高劑量', 'RfD ＝ NOAEL ÷ 不確定係數（常用 100）'],
      n: '第三節進入毒物化學。\n毒理學的第一定律是劑量造就毒物。\n同一個物質，在不同劑量下可以是必需營養素，也可以是致命毒物。\n硒、銅、鐵都是很好的例子。\n劑量反應曲線通常是 S 形。\n半數致死劑量指的是讓一半試驗動物死亡的單次劑量，數值愈小代表愈毒。\n未觀察到不良效應劑量，就是還沒看到不良效應的最高劑量。\n把它除以不確定係數，通常是一百，就得到每日可接受攝取量。' },
    { t: 'LD₅₀ 的限制', s: '第三節', b: ['只反映急性致死，不預測慢性效應', '對致癌、致突變、內分泌干擾幾乎無預測力', '內分泌干擾物可能呈非單調劑量反應', '低劑量效應有時反而更明顯'],
      n: '不過我要提醒大家，半數致死劑量有很嚴重的限制。\n它只反映急性致死。\n對慢性毒性、致癌、致突變、內分泌干擾幾乎沒有預測力。\n更麻煩的是，內分泌干擾物可能呈現非單調的劑量反應曲線。\n也就是說，低劑量的效應有時候反而比中劑量更明顯。\n因為它模擬的是荷爾蒙，而荷爾蒙本來就在極低濃度作用。\n所以看到一個化學品的半數致死劑量很高，不代表它安全。' },
    { t: '動力學相與動態相', s: '第三節', b: ['動力學相 ADME：吸收、分布、代謝、排泄', '肝第一相：P450 氧化；第二相：接合提高水溶性', '動態相：與受體、酵素、DNA 作用', '陷阱：代謝不一定解毒'],
      n: '外來物質進到人體之後分成兩個階段。\n第一個是動力學相，也就是吸收、分布、代謝、排泄。\n肝臟的第一相反應由細胞色素 P450 進行氧化。\n第二相再用葡萄糖醛酸、硫酸或麩胱甘肽接合，提高水溶性，方便排出去。\n第二個階段是動態相，毒物或代謝物跟受體、酵素、去氧核醣核酸作用，產生效應。\n這裡有個很重要的陷阱。\n代謝不一定是解毒。\n苯要先被氧化成環氧化物，才會產生骨髓毒性。' },
    { t: '重金屬的三種毒性機制', s: '第三節', b: ['① 與硫醇基 –SH 結合，使酵素失活', '② 離子模擬：Pb²⁺ 取代 Ca²⁺、Cd²⁺ 取代 Zn²⁺', '③ Fenton 反應產生 •OH，造成氧化壓力', '形態比總量重要：CH₃Hg⁺ vs Hg²⁺、Cr(VI) vs Cr(III)'],
      n: '重金屬的毒性大致可以歸納成三種化學機制。\n第一種是跟硫醇基結合。\n汞離子、鉛離子、鎘離子會跟酵素活性中心的半胱氨酸結合，讓酵素失去活性。\n螯合治療的藥物也帶硫醇基，就是根據這個原理設計的。\n第二種是離子模擬。\n鉛取代鈣進入骨骼跟神經傳導，鎘取代鋅干擾鋅指蛋白。\n第三種是催化氧化壓力，二價鐵透過芬頓反應產生氫氧自由基。\n最後請記住一句話，形態比總量重要。\n甲基汞可以穿過血腦障壁跟胎盤，毒性遠高於無機汞。' },
    { t: '生物累積 vs 生物放大', s: '第三節', b: ['生物累積：單一生物體內濃度高於環境', '生物放大：沿食物鏈逐級上升', '可被放大者：疏水、抗代謝、半衰期長', '甲基汞是特例：靠與蛋白質硫醇強結合而放大'],
      n: '這兩個名詞常被混用，請分清楚。\n生物累積講的是單一生物體內的濃度，隨時間高於環境濃度。\n生物放大講的是濃度沿著食物鏈一級一級往上升。\n能夠被放大的物質通常同時符合三個條件。\n疏水，辛醇水分配係數對數大於五。\n抗代謝。\n還有半衰期長。\n甲基汞是個特例。\n它的水溶性不算低，但因為跟蛋白質硫醇基強烈結合，排除極慢，所以在海洋食物鏈可以放大一百萬倍以上。' },
    { t: '期末行動討論 I：把題目變小', s: '第三節', b: ['句型：在（場域），（物質／流量）目前為（數值），我們用（方法）在（期間）量測／改善，判準是（指標）', '反例：我們想改善校園的環境永續', '正例：實驗室含鹵有機廢液的減量潛勢評估', '本節產出：一頁 A4（題目、場域、化學、指標、困難）'],
      n: '最後是期末行動的第一次討論。\n這節課的唯一任務，就是把題目縮小到可以量測。\n請用投影片上的句型改寫你們的題目。\n在某個場域中，某個物質或流量目前是多少，我們打算用什麼方法，在多久內量測或改善它，成功的判準是什麼指標。\n反例是我們想改善校園的環境永續。\n沒有場域、沒有物質、沒有指標，這種題目做不下去。\n正例是評估理工學院實驗室含鹵有機廢液的減量潛勢。\n請各組在下課前交出一頁 A4。' },
    { t: '本週小結與作業', s: '小結', b: ['能源看三把尺：能量密度、EROI、碳強度', 'NOₓ 來自空氣的 N₂，要降溫不是換燃料', '毒性看形態不看總量；代謝不一定解毒', '作業：各組繳交一頁題目說明；本週線上練習'],
      n: '今天的重點收攏成三句話。\n第一，比較能源要用三把尺：能量密度、能源投資報酬率、碳強度。\n第二，氮氧化物主要來自空氣中的氮氣，所以降低峰值溫度才有效。\n第三，毒性要看化學形態，不是看總量；而且代謝不一定是解毒。\n作業有兩項。\n第一，各組把今天寫的一頁題目說明整理好上傳。\n第二，完成本週的線上練習。\n下週是教師節放假，我們第五週再見。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '某生質燃料的 EROI 約為 1.5:1，這代表什麼？', o: ['每投入 1 單位能量可淨得 1.5 單位能量', '產出能量僅為投入能量的 1.5 倍，淨能量很小，難以支撐複雜社會', 'EROI 愈低代表碳排愈低', 'EROI 與能量密度是同一個概念'], a: 1, e: 'EROI＝產出／投入。1.5:1 表示每投入 1 單位只能拿回 1.5 單位，淨能量僅 0.5。文獻多認為 EROI 低於約 5:1 的能源難以支撐現代複雜社會的基礎設施。' },
    { q: '燃煤電廠排放的 NOₓ 主要來源為何？降低策略應為？', o: ['主要來自燃料中的氮；應改用低氮燃料', '主要來自空氣中的 N₂ 高溫氧化；應降低火焰峰值溫度', '主要來自水蒸氣；應降低含水率', '主要來自灰分；應加強除塵'], a: 1, e: '高溫（>1300 °C）下空氣中的 N₂ 經 Zeldovich 機制氧化生成熱式 NOₓ，通常是主要來源。因此策略為降低峰值溫度（低氮燃燒器、分段燃燒、煙氣再循環），必要時再以 SCR 後處理。' },
    { q: '下列哪一項<b>不屬於</b>有害廢棄物的四大判定特性？', o: ['易燃性', '反應性', '腐蝕性', '揮發性'], a: 3, e: '四大特性為易燃性、反應性、腐蝕性、毒性。揮發性雖然影響暴露途徑與逸散，但不是獨立的判定特性（高揮發性液體通常已因閃火點低而落入易燃性）。' },
    { q: '實驗室中將次氯酸鈉漂白水誤倒入含鹽酸的廢液桶，最主要的立即危害是？', o: ['產生大量氫氣而爆炸', '放出氯氣（Cl₂）造成呼吸道傷害', '溫度下降導致結晶', '產生無害的食鹽水'], a: 1, e: 'NaClO + 2HCl → NaCl + Cl₂↑ + H₂O。氯氣為刺激性有毒氣體，會嚴重傷害呼吸道。若混入含氨清潔劑則生成氯胺，同樣有毒。廢液嚴禁混裝。' },
    { q: '關於 LD₅₀ 的敘述，何者<b>正確</b>？', o: ['數值愈大代表毒性愈強', '可用來預測長期致癌風險', '反映急性致死毒性，對慢性與內分泌效應預測力有限', 'LD₅₀ 高的物質必定安全無虞'], a: 2, e: 'LD₅₀ 是使半數試驗動物死亡的單次劑量，數值愈小愈毒。它只描述急性致死，對慢性毒性、致癌、致突變與內分泌干擾幾乎無預測力。' },
    { q: '苯（benzene）造成骨髓毒性的過程說明了什麼概念？', o: ['代謝一定是解毒過程', '代謝活化：經 P450 氧化後才產生具毒性的代謝物', '苯本身即為最終致毒物質，無需代謝', '第二相接合反應會提高毒性'], a: 1, e: '苯須先經肝臟 P450 氧化為環氧化物等活性中間物，才展現骨髓毒性；苯并[a]芘也須代謝成二醇環氧化物才與 DNA 形成加成物。此即 bioactivation（代謝活化）。' },
    { q: '關於汞的形態與毒性，下列敘述何者<b>正確</b>？', o: ['無機 Hg²⁺ 比甲基汞更容易通過血腦障壁', '甲基汞（CH₃Hg⁺）可穿越血腦障壁與胎盤，在食物鏈中顯著放大', '甲基汞不會在魚體內累積', '汞的毒性只與總汞濃度有關，與形態無關'], a: 1, e: '甲基汞具親脂性與可經胺基酸轉運蛋白偽裝運輸的特性，能穿越血腦障壁與胎盤；且與蛋白質 –SH 強結合、排除慢，在海洋食物鏈可放大數十萬至百萬倍。形態遠比總量重要。' },
    { q: '下列何者<b>最符合</b>「生物放大（biomagnification）」的定義？', o: ['某污染物在單一生物體內濃度隨暴露時間上升', '某污染物濃度沿食物鏈由生產者向頂級消費者逐級上升', '某污染物在水中的溶解度隨溫度上升', '某污染物在土壤中吸附量隨有機質增加'], a: 1, e: '生物放大專指沿食物鏈逐級升高；單一個體內隨時間累積稱為生物累積。可被放大的物質通常疏水（log K_ow > 5）、抗代謝且半衰期長。' },
    { q: '依廢棄物階層（waste hierarchy），下列排序何者<b>正確</b>？', o: ['最終處置 > 能源回收 > 再生利用 > 減量', '避免產生 > 減量 > 再使用 > 再生利用 > 能源回收 > 最終處置', '再生利用 > 避免產生 > 減量 > 再使用', '能源回收 > 避免產生 > 最終處置 > 減量'], a: 1, e: '階層由上而下為避免產生、減量、再使用、再生利用、能源回收、最終處置。愈往下物質的資訊含量愈低。但實務上仍須以 LCA 檢驗，例如高耗能的化學回收未必優於能源回收。' },
    { q: 'Fenton 反應 Fe²⁺ + H₂O₂ → Fe³⁺ + OH⁻ + •OH 在毒理學上的意義是？', o: ['說明鐵可作為營養素被吸收', '說明過渡金屬可催化產生高活性自由基造成氧化壓力', '說明鐵可與硫醇基結合', '說明鐵可取代鈣進入骨骼'], a: 1, e: '游離的 Fe²⁺／Cu⁺ 能催化過氧化氫產生氫氧自由基（•OH），其氧化能力極強，可破壞脂質、蛋白質與 DNA，形成氧化壓力，是重金屬毒性的三大機制之一。' }
