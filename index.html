  cards: [
    { h: '水為什麼這麼奇怪', b: '水分子鍵角約 104.5°、O–H 鍵具強極性，使每個水分子最多能形成四個氫鍵。由此衍生一連串「異常」：<br>• <b>沸點異常高</b>：同族 H<sub>2</sub>S 沸點 −60 °C，H<sub>2</sub>O 卻是 100 °C。<br>• <b>比熱容極大</b>（4.18 J g<sup>−1</sup> K<sup>−1</sup>）：使水體成為氣候的緩衝器，也讓沿海溫差小於內陸。<br>• <b>汽化熱大</b>（約 2260 kJ/kg）：蒸發散熱是地球最重要的能量再分配機制。<br>• <b>4 °C 時密度最大</b>：冰浮在水面，湖泊底層在冬季不致結凍，水生生物得以越冬。<br>• <b>介電常數高</b>（約 78）：能有效削弱離子間庫侖引力，因而是優異的離子溶劑。<br>這些性質不是背誦題，而是後面所有現象（分層、溶氧、溶解度）的物理基礎。' },
    { h: '亨利定律：氣體怎麼進到水裡', b: '氣體在水中的溶解度與其分壓成正比：<div class="eq">C ＝ K<sub>H</sub> · P<sub>gas</sub></div>兩個關鍵推論：<br>① <b>溫度上升，K<sub>H</sub> 下降</b>（氣體溶解為放熱過程）。25 °C 純水的飽和溶氧約 8.3 mg/L，但 5 °C 時可達約 12.8 mg/L。這就是熱污染直接傷害水體的原因——不必加任何毒物，只要升溫就足以讓魚缺氧。<br>② <b>鹽度上升，溶解度下降</b>（鹽析效應）。海水的飽和溶氧約比淡水低 20%。<br>請注意 CO<sub>2</sub> 是例外中的重要者：它溶解後會進一步水合成 H<sub>2</sub>CO<sub>3</sub>，實際「溶解量」遠高於單純物理溶解，因此必須用碳酸系統來處理。', local: '花蓮連結：夏季午後的溪流、以及水產養殖池的清晨，都是溶氧最低的時刻，這正是溫度與呼吸作用疊加的結果。' },
    { h: '碳酸系統：環境水化學的骨幹', b: '把 CO<sub>2</sub> 加到水裡，會依序建立三個平衡：<div class="eq">CO<sub>2</sub>(g) ⇌ CO<sub>2</sub>(aq) + H<sub>2</sub>O ⇌ H<sub>2</sub>CO<sub>3</sub><sup>*</sup><br>H<sub>2</sub>CO<sub>3</sub><sup>*</sup> ⇌ H<sup>+</sup> + HCO<sub>3</sub><sup>−</sup>　　pK<sub>a1</sub> ≒ 6.35<br>HCO<sub>3</sub><sup>−</sup> ⇌ H<sup>+</sup> + CO<sub>3</sub><sup>2−</sup>　　pK<sub>a2</sub> ≒ 10.33</div>物種分布的判讀非常直觀：<br>• pH &lt; 6.35：以 H<sub>2</sub>CO<sub>3</sub><sup>*</sup> 為主<br>• 6.35 &lt; pH &lt; 10.33：以 HCO<sub>3</sub><sup>−</sup> 為主（<b>絕大多數天然水體落在這一區</b>）<br>• pH &gt; 10.33：以 CO<sub>3</sub><sup>2−</sup> 為主<br>在 pH ＝ pK<sub>a</sub> 處，兩物種各佔一半。天然水 pH 多在 6.5–8.5，因此 HCO<sub>3</sub><sup>−</sup> 是主角。' },
    { h: '鹼度不是 pH', b: '這是初學者最常混淆的概念。<b>pH 是強度（intensity），鹼度是容量（capacity）</b>。<br>總鹼度定義為水中可中和強酸的能力，主要貢獻者：<div class="eq">Alk ＝ [HCO<sub>3</sub><sup>−</sup>] + 2[CO<sub>3</sub><sup>2−</sup>] + [OH<sup>−</sup>] − [H<sup>+</sup>]</div>單位常表示為 mg/L as CaCO<sub>3</sub>（把所有中和能力折算成碳酸鈣當量，1 meq/L ＝ 50 mg/L as CaCO<sub>3</sub>）。<br>兩杯水可以同樣是 pH 7，但一杯鹼度 200 mg/L as CaCO<sub>3</sub>、另一杯只有 5。前者加一點酸幾乎不動，後者立刻掉到 pH 4。<b>酸雨對台灣東部溪流的傷害之所以較小，正因為中央山脈的岩性提供了較高的鹼度。</b>' },
    { h: '酸度、緩衝與 CO<sub>2</sub> 逸散', b: '與鹼度對稱的是酸度（acidity），指水中可中和強鹼的能力，主要來自 H<sub>2</sub>CO<sub>3</sub><sup>*</sup>、有機酸與可水解金屬（如 Fe<sup>3+</sup>、Al<sup>3+</sup>）。<br>礦場酸性排水（AMD）是最典型的極端案例：<div class="eq">FeS<sub>2</sub> + 7/2 O<sub>2</sub> + H<sub>2</sub>O <span class="fx">→</span> Fe<sup>2+</sup> + 2 SO<sub>4</sub><sup>2−</sup> + 2 H<sup>+</sup><br>Fe<sup>3+</sup> + 3 H<sub>2</sub>O <span class="fx">→</span> Fe(OH)<sub>3</sub>(s) + 3 H<sup>+</sup></div>黃鐵礦氧化不但直接產酸，Fe<sup>3+</sup> 水解還會再產酸，形成自我加速的惡性循環，pH 可降到 2–3。<br>反過來，<b>藻類大量光合作用會消耗 CO<sub>2</sub>，使 pH 在午後升到 9 以上</b>，這也是優養化水體常見的日夜 pH 擺盪。' },
    { h: '溶氧：水體健康的第一指標', b: '溶氧（DO）是判斷水體健康最快的指標。經驗判準：<br>• DO &gt; 6 mg/L：良好，多數魚類可存活。<br>• 4–6 mg/L：勉強，敏感物種（鮭鱒）已受壓。<br>• &lt; 2 mg/L：缺氧（hypoxia），底棲生物大量死亡。<br>DO 被消耗的兩個主要途徑：<b>好氧微生物分解有機物</b>（BOD）與<b>硝化作用</b>：<div class="eq">NH<sub>4</sub><sup>+</sup> + 2 O<sub>2</sub> <span class="fx">→</span> NO<sub>3</sub><sup>−</sup> + 2 H<sup>+</sup> + H<sub>2</sub>O</div>注意硝化作用不只耗氧，還會產酸——每氧化 1 mol 銨產生 2 mol H<sup>+</sup>。所以高氨氮廢水既是耗氧源也是酸源，這在第 9 週污水處理會再談。' },
    { h: '湖泊分層與翻轉', b: '溫帶與亞熱帶較深的湖／水庫在夏季會形成三層：<b>表水層（epilimnion）</b>受風混合、溫暖且富氧；<b>斜溫層（thermocline）</b>溫度陡降形成密度屏障；<b>深水層（hypolimnion）</b>低溫、與大氣隔絕，若上方沉降的有機物多，溶氧會被耗盡而轉為厭氧。<br>厭氧的深水層會依序發生一連串還原反應：NO<sub>3</sub><sup>−</sup> → N<sub>2</sub>、Mn(IV) → Mn(II)、Fe(III) → Fe(II)、SO<sub>4</sub><sup>2−</sup> → H<sub>2</sub>S、最後 CO<sub>2</sub> → CH<sub>4</sub>。因此深水層的 Fe<sup>2+</sup>、Mn<sup>2+</sup>、H<sub>2</sub>S 濃度會明顯上升，並在<b>秋季翻轉（turnover）</b>時一次帶到表層，造成取水口的臭味與色度問題。', local: '花蓮連結：花蓮的水庫規模不大，但鯉魚潭與部分農塘在夏季仍會出現明顯分層與底層缺氧，可作為期末行動的採樣場域。' },
    { h: '從水質數據看故事', b: '拿到一份水質報告，建議依這個順序讀：<br>① <b>DO 與溫度</b>：先判斷有沒有缺氧壓力。<br>② <b>pH 與鹼度</b>：判斷緩衝能力與可能的酸源。<br>③ <b>導電度</b>：快速估總溶解固體（TDS ≒ 0.55–0.7 × EC<sub>µS/cm</sub>）。<br>④ <b>氮磷</b>：判斷優養化風險；一般以 N:P 質量比約 7:1（莫耳比 16:1）判斷限制因子，淡水多為磷限制。<br>⑤ <b>離子平衡檢核</b>：陽離子當量總和應約等於陰離子當量總和，誤差超過 5% 表示分析可能有問題。<br>最後這一步是專業與業餘的分水嶺——<b>先檢核數據自洽性，再談解釋</b>。' }
  ],
  slides: [
    { t: '環境化學　第 5 週', s: '封面', cover: true, b: ['水圈—水化學 I', '水分子、水中氣體、碳酸系統與鹼度', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n放假一週，今天我們正式進入水圈。\n接下來三週都在水裡，這是本課程份量最重的一塊。\n今天第一節談水分子本身，還有氣體怎麼進到水裡。\n第二節處理碳酸系統跟鹼度，這是環境水化學的骨幹。\n第三節談溶氧、湖泊分層，並且教大家怎麼讀一份水質報告。\n請大家把計算機準備好。' },
    { t: '水分子：104.5 度與四個氫鍵', s: '第一節', b: ['鍵角 104.5°、O–H 強極性', '每個水分子最多形成四個氫鍵', '沸點異常高：H₂S −60 °C vs H₂O 100 °C', '介電常數約 78 → 優異的離子溶劑'],
      n: '我們從水分子本身開始。\n水的鍵角大約是一百零四點五度，氧氫鍵有很強的極性。\n因為氧上有兩對孤對電子，所以每個水分子最多可以形成四個氫鍵。\n這件事造成一連串的異常。\n最有名的是沸點。\n同一族的硫化氫沸點是負六十度，水卻是一百度。\n差了一百六十度，全都是氫鍵撐起來的。\n另外水的介電常數大約七十八，可以把離子間的庫侖引力削弱到原來的七十八分之一。\n這就是水為什麼是優異的離子溶劑。' },
    { t: '比熱、汽化熱與 4 °C 密度最大', s: '第一節', b: ['比熱 4.18 J g⁻¹ K⁻¹ → 氣候緩衝器', '汽化熱約 2260 kJ/kg → 地球能量再分配', '4 °C 密度最大 → 冰浮在水面', '湖底不結凍，水生生物得以越冬'],
      n: '這一頁繼續講水的異常性質，但重點在環境意義。\n水的比熱是四點一八，非常大。\n所以水體是氣候的緩衝器，沿海的日夜溫差比內陸小很多。\n汽化熱大約每公斤兩千兩百六十千焦耳。\n蒸發散熱是地球上最重要的能量再分配機制。\n最後這一項最特別，水在攝氏四度時密度最大。\n所以冰會浮在水面上。\n如果冰會沉，湖泊會從底部往上結凍，水生生物根本無法越冬。\n這個看似小小的異常，撐起了整個溫帶水域的生態。' },
    { t: '亨利定律與溶氧', s: '第一節', b: ['C = K_H · P_gas', '溫度上升 → 溶解度下降（放熱過程）', '25 °C 飽和溶氧約 8.3 mg/L；5 °C 約 12.8 mg/L', '鹽度上升 → 溶解度下降（鹽析）', '熱污染不必加毒物就能讓魚缺氧'],
      n: '氣體怎麼進到水裡，用亨利定律。\n溶解濃度等於亨利常數乘以該氣體的分壓。\n有兩個推論非常重要。\n第一，溫度上升溶解度下降，因為氣體溶解是放熱過程。\n攝氏二十五度純水的飽和溶氧大約是八點三毫克每公升。\n但攝氏五度可以到十二點八。\n這就是熱污染直接傷害水體的原因。\n不必加任何毒物，只要升溫就足以讓魚缺氧。\n第二，鹽度上升溶解度也下降，這叫鹽析效應。\n海水的飽和溶氧比淡水低大約兩成。' },
    { t: '碳酸系統的三段平衡', s: '第二節', b: ['CO₂(g) ⇌ CO₂(aq) ⇌ H₂CO₃*', 'H₂CO₃* ⇌ H⁺ + HCO₃⁻，pKa1 ≒ 6.35', 'HCO₃⁻ ⇌ H⁺ + CO₃²⁻，pKa2 ≒ 10.33', '天然水 pH 6.5–8.5 → HCO₃⁻ 是主角'],
      n: '第二節進入碳酸系統，這是環境水化學的骨幹。\n二氧化碳溶進水裡會建立三段平衡。\n第一段是氣體溶解與水合，形成我們寫成星號碳酸的總量。\n第二段解離出氫離子跟碳酸氫根，酸解離常數的負對數大約六點三五。\n第三段再解離出碳酸根，負對數大約十點三三。\n判讀方式非常直觀。\n酸鹼值小於六點三五，以碳酸為主。\n介於六點三五到十點三三之間，以碳酸氫根為主。\n天然水的酸鹼值大多在六點五到八點五，所以碳酸氫根是主角。' },
    { t: '物種分布圖怎麼看', s: '第二節', b: ['pH = pKa 時，兩物種各佔一半', 'pH 每偏離 pKa 一單位，比例變 10 倍', '海水 pH ≈ 8.1 → HCO₃⁻ 約 88%、CO₃²⁻ 約 11%', '海洋酸化 → CO₃²⁻ 比例下降'],
      n: '這一頁教大家看物種分布圖。\n最重要的一條規則是，酸鹼值等於酸解離常數負對數的時候，兩個物種剛好各佔一半。\n每偏離一個酸鹼值單位，比例就差十倍。\n以海水為例，酸鹼值大約八點一。\n碳酸氫根大約佔八成八，碳酸根大約一成一。\n當大氣二氧化碳上升、海水酸鹼值下降，碳酸根的比例就會跟著下降。\n這正是海洋酸化威脅珊瑚跟貝類的化學原因。\n不是酸把殼溶掉，而是建材變少了。' },
    { t: '鹼度是容量，pH 是強度', s: '第二節', b: ['Alk = [HCO₃⁻] + 2[CO₃²⁻] + [OH⁻] − [H⁺]', '常以 mg/L as CaCO₃ 表示；1 meq/L = 50 mg/L', '同樣 pH 7，鹼度 200 與鹼度 5 抗酸能力天差地遠', '中央山脈岩性提供較高鹼度'],
      n: '這一頁是初學者最容易混淆的地方，請特別注意。\n酸鹼值是強度，鹼度是容量。\n鹼度指的是水中可以中和強酸的能力。\n主要貢獻者是碳酸氫根，碳酸根要乘以二，因為它可以接兩個氫離子。\n單位通常寫成以碳酸鈣計的毫克每公升。\n一個毫當量每公升等於五十毫克每公升。\n舉例來說，兩杯水都是酸鹼值七。\n一杯鹼度兩百，一杯鹼度五。\n加一點酸，前者幾乎不動，後者馬上掉到四。' },
    { t: '酸度與礦場酸性排水', s: '第二節', b: ['酸度：可中和強鹼的能力', 'FeS₂ + 7/2 O₂ + H₂O → Fe²⁺ + 2SO₄²⁻ + 2H⁺', 'Fe³⁺ + 3H₂O → Fe(OH)₃(s) + 3H⁺', '自我加速的產酸循環，pH 可降到 2–3'],
      n: '跟鹼度對稱的是酸度。\n酸度指的是水中可以中和強鹼的能力。\n來源包含碳酸、有機酸，還有會水解的金屬離子。\n最典型的極端案例是礦場酸性排水。\n黃鐵礦被氧化，直接放出氫離子跟硫酸根。\n更麻煩的是三價鐵的水解，又再放出三個氫離子。\n這形成一個自我加速的惡性循環。\n酸鹼值可以降到二到三。\n而且低酸鹼值又會溶出更多重金屬，讓問題雪上加霜。' },
    { t: '藻類會把 pH 拉高', s: '第二節', b: ['光合作用消耗 CO₂ → H⁺ 減少 → pH 上升', '優養化水體午後 pH 可達 9 以上', '夜間呼吸作用又把 pH 拉回', '日夜擺盪本身就是優養化的診斷訊號'],
      n: '這一頁很有意思。\n藻類大量光合作用的時候會消耗二氧化碳。\n二氧化碳被拿走，平衡往左移，氫離子減少，酸鹼值就上升。\n所以優養化的水體在午後，酸鹼值可以升到九以上。\n到了晚上藻類不行光合作用，只剩呼吸作用釋出二氧化碳。\n酸鹼值又被拉回來。\n所以我要提醒大家一件事。\n酸鹼值的日夜擺盪幅度本身，就是優養化的診斷訊號。\n只量一次是看不出來的。' },
    { t: '溶氧：水體健康的第一指標', s: '第三節', b: ['> 6 mg/L 良好；4–6 敏感物種受壓；< 2 缺氧', '耗氧途徑一：有機物好氧分解（BOD）', '耗氧途徑二：硝化 NH₄⁺ + 2O₂ → NO₃⁻ + 2H⁺ + H₂O', '硝化不只耗氧，還產酸'],
      n: '第三節我們談溶氧。\n溶氧是判斷水體健康最快的指標。\n大於六毫克每公升算良好，多數魚類可以存活。\n四到六之間，鮭鱒這類敏感物種已經受壓。\n低於二就是缺氧，底棲生物會大量死亡。\n溶氧被消耗有兩個主要途徑。\n第一個是好氧微生物分解有機物，我們用生化需氧量來衡量。\n第二個是硝化作用。\n請看這個反應式，每氧化一莫耳銨要消耗兩莫耳氧，還產生兩莫耳氫離子。\n所以高氨氮廢水既是耗氧源，也是酸源。' },
    { t: '湖泊分層：夏天的三明治', s: '第三節', b: ['表水層：受風混合、溫暖、富氧', '斜溫層：溫度陡降，形成密度屏障', '深水層：與大氣隔絕，可能耗盡溶氧', '厭氧序列：NO₃⁻ → Mn(IV) → Fe(III) → SO₄²⁻ → CO₂'],
      n: '這一頁講湖泊分層。\n夏天比較深的湖或水庫會分成三層，像三明治一樣。\n最上面是表水層，被風吹得很均勻，溫暖而且富含氧氣。\n中間是斜溫層，溫度陡降形成密度屏障，上下換不了。\n最下面是深水層，跟大氣完全隔絕。\n如果上面沉下來的有機物很多，溶氧就會被耗光。\n一旦缺氧，微生物會依序改用其他電子接受者。\n先用硝酸根，再用四價錳、三價鐵，然後是硫酸根，最後才是二氧化碳產甲烷。' },
    { t: '秋季翻轉與取水口的惡夢', s: '第三節', b: ['深水層累積 Fe²⁺、Mn²⁺、H₂S', '秋季表水降溫 → 密度屏障消失 → 全湖混合', '一次把還原態物質帶到表層', '結果：臭味、色度、加氯需求量暴增'],
      n: '接續上一頁。\n深水層在整個夏天累積了大量的二價鐵、二價錳，還有硫化氫。\n到了秋天，表層水降溫，密度差消失，一場強風就會讓全湖混合。\n這叫做翻轉。\n翻轉會把底層累積的還原態物質一次帶到表層。\n對自來水廠來說這是惡夢。\n因為錳會產生黑水，硫化氫有臭味，而且這些還原性物質會大量消耗加氯量。\n所以水庫的取水深度通常可以調整，就是為了因應這件事。' },
    { t: '怎麼讀一份水質報告', s: '第三節', b: ['① DO 與溫度：先看有沒有缺氧壓力', '② pH 與鹼度：緩衝能力與酸源', '③ 導電度：TDS ≒ 0.55–0.7 × EC', '④ 氮磷：N:P 莫耳比 16:1 判斷限制因子', '⑤ 離子平衡檢核：誤差 > 5% 就要懷疑數據'],
      n: '最後我教大家一個實用技巧，怎麼讀一份水質報告。\n第一步看溶氧跟溫度，先判斷有沒有缺氧壓力。\n第二步看酸鹼值跟鹼度，判斷緩衝能力跟可能的酸源。\n第三步看導電度，可以快速估算總溶解固體。\n第四步看氮跟磷，用莫耳比十六比一判斷限制因子，淡水大多是磷限制。\n第五步最重要，做離子平衡檢核。\n陽離子的當量總和應該約等於陰離子的當量總和。\n誤差超過百分之五就要懷疑分析出了問題。\n先檢核數據自洽性再談解釋，這是專業跟業餘的分水嶺。' },
    { t: '本週小結與作業', s: '小結', b: ['水的異常性質來自氫鍵，是後續一切現象的基礎', '碳酸系統：pKa1 6.35、pKa2 10.33', '鹼度是容量、pH 是強度', '作業：本週線上練習；預習 Ch2 後半段'],
      n: '今天的重點收攏成三句話。\n第一，水的所有異常性質都來自氫鍵，這是後面所有現象的物理基礎。\n第二，碳酸系統的兩個酸解離常數，六點三五跟十點三三，請務必背起來。\n第三，鹼度是容量、酸鹼值是強度，兩者絕對不能混為一談。\n作業有兩項。\n第一，完成本週線上練習，注意有計算題。\n第二，預習第二章後半，下週我們談硬度、錯合與螯合。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '水在 4 °C 時密度最大，此性質最重要的環境意義是？', o: ['使水的沸點升高', '使冰浮於水面，湖泊底層冬季不致完全結凍', '使水成為良好的離子溶劑', '使水的比熱增大'], a: 1, e: '4 °C 密度最大導致冰的密度小於液態水而浮於表面，形成隔熱層；若冰會下沉，湖泊將由底部向上結凍，水生生物無法越冬。' },
    { q: '關於亨利定律與水中溶氧，下列敘述何者<b>正確</b>？', o: ['水溫上升，飽和溶氧上升', '水溫上升，飽和溶氧下降；鹽度上升亦使溶氧下降', '鹽度上升會使溶氧上升', '溶氧與大氣氧分壓無關'], a: 1, e: '氣體溶解為放熱過程，溫度上升則 K_H 下降；鹽析效應使溶解度隨鹽度增加而下降（海水飽和溶氧約較淡水低 20%）。溶氧與氧分壓成正比。' },
    { q: '某天然水體 pH ＝ 8.0，碳酸系統中<b>主要</b>物種為何？（pKa1 ≒ 6.35、pKa2 ≒ 10.33）', o: ['H₂CO₃*', 'HCO₃⁻', 'CO₃²⁻', 'OH⁻'], a: 1, e: 'pH 介於 pKa1 與 pKa2 之間時以 HCO₃⁻ 為主。pH 8.0 距 pKa1 約 1.65 單位、距 pKa2 約 2.33 單位，兩側物種皆遠低於 HCO₃⁻。' },
    { q: '兩杯水皆為 pH 7.0，A 杯鹼度 200 mg/L as CaCO₃、B 杯鹼度 5 mg/L as CaCO₃。加入等量少量強酸後：', o: ['兩杯 pH 下降幅度相同', 'A 杯 pH 下降幅度明顯小於 B 杯', 'B 杯 pH 反而上升', '無法比較，因為初始 pH 相同'], a: 1, e: 'pH 是強度、鹼度是容量。鹼度高者具有較大的酸中和容量（主要來自 HCO₃⁻），加酸後 pH 變化小；鹼度低的水體對酸沉降極為敏感。' },
    { q: '黃鐵礦氧化造成礦場酸性排水，下列何者<b>不是</b>其產酸機制？', o: ['FeS₂ 氧化直接釋出 H⁺', 'Fe³⁺ 水解生成 Fe(OH)₃ 並釋出 H⁺', 'Fe²⁺ 被氧化為 Fe³⁺ 後再參與氧化 FeS₂', 'CaCO₃ 溶解釋出 H⁺'], a: 3, e: 'CaCO₃ 溶解是消耗酸（提供鹼度）的反應，常被用作 AMD 的中和處理材料。其餘三項構成 AMD 自我加速的產酸循環。' },
    { q: '硝化作用 NH₄⁺ + 2O₂ → NO₃⁻ + 2H⁺ + H₂O 對水體的雙重影響為？', o: ['產氧並產鹼', '耗氧並產酸（消耗鹼度）', '耗氧並產鹼', '不影響溶氧也不影響 pH'], a: 1, e: '每氧化 1 mol NH₄⁺ 需 2 mol O₂ 並產生 2 mol H⁺。因此高氨氮廢水同時是耗氧源與酸源，污水廠設計時必須同時考慮曝氣量與鹼度補充。' },
    { q: '夏季分層湖泊的深水層（hypolimnion）轉為厭氧後，微生物使用電子接受者的<b>典型順序</b>為？', o: ['SO₄²⁻ → NO₃⁻ → Fe(III) → CO₂', 'NO₃⁻ → Mn(IV) → Fe(III) → SO₄²⁻ → CO₂', 'CO₂ → SO₄²⁻ → NO₃⁻ → O₂', 'Fe(III) → O₂ → NO₃⁻ → SO₄²⁻'], a: 1, e: '微生物依可獲得的自由能由高至低依序使用電子接受者：O₂ → NO₃⁻ → Mn(IV) → Fe(III) → SO₄²⁻ → CO₂（產甲烷）。此序列也決定了沉積物剖面的化學分帶。' },
    { q: '秋季湖泊翻轉（turnover）對自來水處理造成困擾的主要原因是？', o: ['表層藻類大量繁殖', '深水層累積的 Fe²⁺、Mn²⁺、H₂S 被帶到表層，造成色度、臭味與加氯需求上升', '水溫過高使管線膨脹', '鹼度突然歸零'], a: 1, e: '分層期間深水層長期厭氧，累積還原態物質；翻轉時全湖混合將其帶至取水深度，造成黑水（Mn）、臭味（H₂S）與氯需求量暴增。' },
    { q: '判讀水質報告時進行「離子平衡檢核」的目的是？', o: ['計算硬度', '確認陽離子與陰離子當量和是否相符，以檢驗分析數據的可信度', '推估溶氧', '判斷限制營養鹽'], a: 1, e: '在完整分析的水樣中，主要陽離子當量總和應約等於主要陰離子當量總和。誤差超過約 5% 表示可能漏測某離子或分析有誤，應先釐清再做解釋。' },
    { q: '優養化水體常出現午後 pH 高於 9、清晨 pH 接近 7 的日夜擺盪，其主因為？', o: ['日夜溫差改變 K_w', '白天藻類光合作用消耗 CO₂ 使 pH 上升，夜間呼吸作用釋出 CO₂ 使 pH 下降', '白天降雨稀釋', '底泥白天釋出鹼度'], a: 1, e: '光合作用移除 CO₂，碳酸平衡左移、[H⁺] 下降；夜間僅有呼吸作用釋出 CO₂ 使 pH 回落。擺盪幅度大小本身即為優養化程度的診斷指標。' }
  ],
  hw: 'AI 翻轉：課前預習 11E Ch2 2.9–2.18 節；課後於 Zuvio 上傳一則「校園水體觀察」照片與 100 字說明；完成本週線上練習。'
};

CONTENT[6] = {
  type: 'teach',
  title: '水圈—水化學 II：硬度、金屬錯合與螯合、物種濃度計算、腐植質',
  chapters: '11E Ch2 水圈與水化學 2.9–2.18（中譯 Ch2）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 2 章 2.9–2.18 節（中譯本第 2 章）',
  goals: [
    '能計算總硬度、暫時硬度與永久硬度，並寫出石灰軟化的反應式。',
    '能區分單牙與多牙配位基，並用螯合效應解釋 EDTA 的強結合力。',
    '能使用條件穩定常數與 α 係數，計算特定 pH 下的金屬物種分布。',
    '能說明螯合劑如何提高重金屬的移動性與生物可利用性。',
    '能描述腐植質的結構特徵與其在金屬錯合、光化學中的角色。'
  ],
  cards: [
    { h: '硬度：從水垢到肥皂沫', b: '硬度指水中二價（含以上）陽離子的總量，主要是 Ca<sup>2+</sup> 與 Mg<sup>2+</sup>，習慣折算成 mg/L as CaCO<sub>3</sub>：<div class="eq">總硬度 ＝ 2.5 × [Ca<sup>2+</sup>]<sub>mg/L</sub> + 4.1 × [Mg<sup>2+</sup>]<sub>mg/L</sub></div>（係數來自 100/40.08 與 100/24.31）<br>• <b>暫時硬度（碳酸鹽硬度）</b>：與 HCO<sub>3</sub><sup>−</sup> 相伴，加熱即沉澱：<div class="eq">Ca<sup>2+</sup> + 2 HCO<sub>3</sub><sup>−</sup> <span class="fx">--Δ--&gt;</span> CaCO<sub>3</sub>(s) + CO<sub>2</sub> + H<sub>2</sub>O</div>這就是熱水器與鍋爐水垢的來源，也是為什麼硬水區的熱交換效率會逐年下降。<br>• <b>永久硬度（非碳酸鹽硬度）</b>：與 SO<sub>4</sub><sup>2−</sup>、Cl<sup>−</sup> 相伴，加熱不會走。<br>硬水讓肥皂（脂肪酸鈉）生成不溶的鈣皂而失效，這正是合成清潔劑（含聚磷酸鹽助洗劑）當年大量取代肥皂的原因——也埋下了優養化的伏筆。', local: '花蓮連結：花蓮多數地下水源流經石灰岩與大理岩地層，硬度與鹼度都偏高，這既是水垢的來源，也是溪流耐酸的本錢。' },
    { h: '石灰－蘇打軟化法', b: '傳統的化學軟化用石灰處理暫時硬度、用蘇打處理永久硬度：<div class="eq">Ca(HCO<sub>3</sub>)<sub>2</sub> + Ca(OH)<sub>2</sub> <span class="fx">→</span> 2 CaCO<sub>3</sub>(s) + 2 H<sub>2</sub>O<br>Mg(HCO<sub>3</sub>)<sub>2</sub> + 2 Ca(OH)<sub>2</sub> <span class="fx">→</span> Mg(OH)<sub>2</sub>(s) + 2 CaCO<sub>3</sub>(s) + 2 H<sub>2</sub>O<br>CaSO<sub>4</sub> + Na<sub>2</sub>CO<sub>3</sub> <span class="fx">→</span> CaCO<sub>3</sub>(s) + Na<sub>2</sub>SO<sub>4</sub></div>注意鎂要在較高 pH（約 11）才會以 Mg(OH)<sub>2</sub> 沉澱，因此除鎂的加藥量遠高於除鈣。軟化後必須<b>再碳酸化（recarbonation）</b>，通入 CO<sub>2</sub> 把 pH 降回中性，否則出水會在配水管中繼續沉澱。<br>從綠色化學看，離子交換與奈米過濾雖然免加藥，但會產生高鹽度再生廢液；<b>沒有一種軟化法是零外部性的</b>，這正是需要 LCA 的地方。' },
    { h: '錯合與配位基', b: '金屬離子在水中從不「裸奔」，它永遠被配位基包圍——最基本的配位基就是水本身（如 Fe(H<sub>2</sub>O)<sub>6</sub><sup>3+</sup>）。<br>• <b>單牙（monodentate）</b>：只用一個原子配位，如 Cl<sup>−</sup>、NH<sub>3</sub>、H<sub>2</sub>O。<br>• <b>多牙（polydentate）</b>／<b>螯合劑（chelating agent）</b>：一個分子提供多個配位原子，形成環狀結構，如乙二胺（2 牙）、NTA（4 牙）、EDTA（6 牙）。<br>配位原子通常是 N、O、S 這類具孤對電子者。依 <b>HSAB 原理</b>，硬酸（Fe<sup>3+</sup>、Al<sup>3+</sup>、Ca<sup>2+</sup>）偏好硬鹼（O 配位，如羧基、酚基）；軟酸（Hg<sup>2+</sup>、Cd<sup>2+</sup>、Ag<sup>+</sup>）偏好軟鹼（S 配位，如硫醇）。<b>這一條原理可以解釋大半的環境金屬行為</b>：為什麼汞跟硫化物綁在一起、為什麼鐵跟腐植質的羧基結合。' },
    { h: '螯合效應：為什麼多牙這麼強', b: '比較兩個反應：<div class="eq">Ni<sup>2+</sup> + 6 NH<sub>3</sub> <span class="fx">→</span> Ni(NH<sub>3</sub>)<sub>6</sub><sup>2+</sup>　　log K ≒ 8.6<br>Ni<sup>2+</sup> + 3 en <span class="fx">→</span> Ni(en)<sub>3</sub><sup>2+</sup>　　log K ≒ 18.3</div>同樣是六個氮配位，螯合物卻穩定十個數量級。原因是<b>熵</b>：單牙路徑是 7 個粒子變 1 個（Δ<i>S</i> 為負），螯合路徑是 4 個粒子變 4 個、且釋放出 6 個水分子（Δ<i>S</i> 為正）。<br>這就是螯合效應（chelate effect）。它也解釋了為什麼 EDTA（6 牙）幾乎能綁住所有二價、三價金屬，log K 動輒 16–25。' },
    { h: '條件穩定常數與 α 係數', b: 'EDTA 的實用問題在於：它的六個配位點裡有四個是羧基、兩個是胺基，全部都會被質子化。所以在酸性條件下，「有效的 Y<sup>4−</sup>」其實很少。<br>定義 α<sub>Y(H)</sub> ＝ [Y<sup>4−</sup>] / C<sub>EDTA,總</sub>，則<div class="eq">K′<sub>MY</sub> ＝ α<sub>Y(H)</sub> · K<sub>MY</sub>　（條件穩定常數）</div>經驗數字：pH 2 時 α ≒ 10<sup>−13.5</sup>、pH 6 時 ≒ 10<sup>−4.6</sup>、pH 10 時 ≒ 10<sup>−0.45</sup>。<br>所以同一支 EDTA，在 pH 10 滴定 Ca<sup>2+</sup> 沒問題（K′ 仍夠大），在 pH 2 卻只能滴定 Fe<sup>3+</sup>（原始 K 極大）。<b>這就是水質分析中「硬度滴定必須在 pH 10 緩衝液中進行」的化學理由</b>，不是規定，是熱力學。' },
    { h: '物種濃度計算的標準流程', b: '面對「某 pH 下金屬有多少是游離態」的題目，流程固定：<br>① 列出<b>質量平衡</b>：C<sub>M</sub> ＝ [M] + [ML] + [ML<sub>2</sub>] + …；C<sub>L</sub> ＝ [L] + [HL] + [ML] + …<br>② 列出<b>各平衡式</b>與常數（β 值、K<sub>a</sub> 值）。<br>③ 用 α 係數把「總配位基」換成「有效配位基」。<br>④ 解聯立（多半可用「過量配位基近似」簡化：[L] ≒ C<sub>L</sub>）。<br>⑤ <b>回頭檢查近似是否成立</b>。<br>範例：C<sub>Cu</sub> ＝ 1×10<sup>−5</sup> M、C<sub>EDTA</sub> ＝ 1×10<sup>−3</sup> M、pH 6（α ≒ 10<sup>−4.6</sup>）、log K<sub>CuY</sub> ＝ 18.8。則 K′ ＝ 10<sup>18.8−4.6</sup> ＝ 10<sup>14.2</sup>；[Cu<sup>2+</sup>] ≒ C<sub>Cu</sub> / (K′·C<sub>EDTA</sub>) ＝ 10<sup>−5</sup>/(10<sup>14.2</sup>×10<sup>−3</sup>) ≒ 10<sup>−16.2</sup> M。<b>游離銅幾乎不存在</b>——這正是螯合劑改變金屬生物毒性的關鍵。' },
    { h: '螯合劑的兩面刃：NTA 與鉛', b: '螯合劑在水處理與清潔劑中很有用，但在環境中會產生反效果：<b>它把原本被固定在沉積物、管垢中的重金屬重新溶出</b>。<div class="eq">PbCO<sub>3</sub>(s) + NTA<sup>3−</sup> <span class="fx">→</span> Pb(NTA)<sup>−</sup> + CO<sub>3</sub><sup>2−</sup></div>原本溶解度極低的碳酸鉛，因為生成穩定的螯合物，平衡被拉往右邊而大量溶出。<br>後果有二：① 鉛在水中的<b>移動性</b>大增，可隨水流傳輸更遠；② 生物可利用性改變——雖然多數螯合態金屬較難被細胞吸收（毒性反而降低），但一旦環境條件改變（pH 下降、螯合劑被生物降解），金屬會再度釋出。<br>這是環境化學很重要的一課：<b>「固定」與「移動」之間只隔著一個配位基。</b>' },
    { h: '聚磷酸鹽與優養化的因果鏈', b: '合成清潔劑曾大量使用三聚磷酸鈉（STPP, Na<sub>5</sub>P<sub>3</sub>O<sub>10</sub>）作為助洗劑，功能是螯合 Ca<sup>2+</sup>／Mg<sup>2+</sup> 以免生成鈣皂。但聚磷酸鹽在水中會水解：<div class="eq">P<sub>3</sub>O<sub>10</sub><sup>5−</sup> + 2 H<sub>2</sub>O <span class="fx">→</span> 3 PO<sub>4</sub><sup>3−</sup> + 4 H<sup>+</sup></div>水解後的正磷酸鹽正是藻類最容易利用的形式。<br>因果鏈是：硬水 → 需要助洗劑 → 聚磷酸鹽 → 水解成正磷酸鹽 → 磷限制解除 → 藻華 → 死亡分解耗氧 → 底層缺氧 → 底泥在厭氧下釋出更多磷（<b>內部負荷</b>）→ 惡性循環。<br>這也說明為何許多國家後來限制清潔劑含磷，並改用沸石、檸檬酸鹽等替代助洗劑——<b>綠色化學的成功案例之一</b>。' },
    { h: '腐植質：天然界最重要的配位基', b: '腐植質（humic substances）是動植物殘體經微生物與化學作用形成的高分子混合物，依溶解行為分為腐植酸（酸不溶）、黃酸（fulvic acid，全 pH 可溶）與腐黑物。<br>結構特徵：大量<b>羧基（–COOH）</b>與<b>酚羥基（–OH）</b>，因此帶負電、能強力錯合金屬；同時含芳香環與醌類結構，具光敏性。<br>三個環境角色：<br>① <b>金屬載體</b>：與 Fe<sup>3+</sup>、Al<sup>3+</sup>、Cu<sup>2+</sup> 形成可溶錯合物，使金屬在水中移動。<br>② <b>光敏劑</b>：吸光後產生單態氧、氫氧自由基等活性物種，驅動污染物的間接光解。<br>③ <b>消毒副產物前驅物</b>：加氯時與 HOCl 反應生成三鹵甲烷（THMs）與鹵乙酸（HAAs），這是自來水處理必須先除去有機物（NOM）的原因，第 9 週會再談。' }
  ],
  slides: [
    { t: '環境化學　第 6 週', s: '封面', cover: true, b: ['水圈—水化學 II', '硬度、錯合與螯合、物種計算、腐植質', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n上週我們處理了水分子、溶氧跟碳酸系統。\n今天要進到水中的金屬。\n第一節談硬度跟軟化，這是最貼近生活的部分。\n第二節談錯合與螯合，這是本章最有理論深度的一段。\n第三節做物種濃度計算，並且介紹腐植質。\n這一週的計算題比較多，請大家跟著我一步一步算。' },
    { t: '硬度怎麼算', s: '第一節', b: ['硬度 = 水中二價以上陽離子總量，主要 Ca²⁺、Mg²⁺', '折算式：2.5×[Ca²⁺] + 4.1×[Mg²⁺]（mg/L as CaCO₃）', '暫時硬度：與 HCO₃⁻ 相伴，加熱即沉澱', '永久硬度：與 SO₄²⁻、Cl⁻ 相伴，加熱不走'],
      n: '我們從硬度開始。\n硬度指的是水中二價以上陽離子的總量，主要就是鈣跟鎂。\n習慣上折算成以碳酸鈣計的毫克每公升。\n係數二點五來自一百除以四十點零八，四點一來自一百除以二十四點三一。\n硬度分兩種。\n暫時硬度跟碳酸氫根相伴，加熱就會沉澱出來。\n這就是熱水器水垢的來源。\n永久硬度跟硫酸根、氯離子相伴，加熱不會走，要用化學方法處理。' },
    { t: '水垢的化學與熱水器', s: '第一節', b: ['Ca²⁺ + 2HCO₃⁻ --Δ--> CaCO₃(s) + CO₂ + H₂O', '加熱驅走 CO₂ → 平衡右移 → 沉澱', '水垢導熱係數只有金屬的百分之一量級', '硬水區熱交換效率逐年下降'],
      n: '這一頁解釋為什麼熱水器會結垢。\n加熱會把二氧化碳趕走。\n二氧化碳一走，平衡就往右移，碳酸鈣就沉澱出來。\n這件事在工程上很嚴重。\n水垢的導熱係數只有金屬的百分之一量級。\n所以只要結一層薄薄的垢，鍋爐的燃料消耗就會明顯上升。\n換句話說，水垢不只是清潔問題，它是能源問題。\n這也是為什麼工業鍋爐一定要做水質前處理。' },
    { t: '石灰－蘇打軟化法', s: '第一節', b: ['Ca(HCO₃)₂ + Ca(OH)₂ → 2CaCO₃(s) + 2H₂O', 'Mg 需 pH 約 11 才以 Mg(OH)₂ 沉澱', 'CaSO₄ + Na₂CO₃ → CaCO₃(s) + Na₂SO₄', '軟化後必須再碳酸化，把 pH 降回中性'],
      n: '傳統的化學軟化叫石灰蘇打法。\n用石灰處理暫時硬度，用蘇打處理永久硬度。\n請注意第一個反應很有意思。\n我們加鈣進去，反而把鈣除掉了。\n因為石灰提供氫氧根，把碳酸氫根轉成碳酸根，一起沉澱。\n鎂比較麻煩，要到酸鹼值大約十一才會沉澱成氫氧化鎂。\n所以除鎂的加藥量遠高於除鈣。\n最後一定要再碳酸化，把酸鹼值降回中性。\n不然出水會在配水管裡繼續沉澱。' },
    { t: '沒有零外部性的軟化法', s: '第一節', b: ['石灰蘇打：產生大量污泥', '離子交換：產生高鹽度再生廢液', '奈米過濾／逆滲透：產生濃排水、耗電', '結論：要用 LCA 比較，不能只看出水水質'],
      n: '這一頁我想給大家一個綠色化學的提醒。\n沒有任何一種軟化方法是零外部性的。\n石灰蘇打法會產生大量污泥，要清運處理。\n離子交換不用加藥，但再生的時候會產生高鹽度廢液。\n奈米過濾跟逆滲透水質最好，但有濃排水，而且耗電。\n所以我們不能只看出水水質就說某個方法比較環保。\n一定要拉出系統邊界，用生命週期評估來比較。\n這就是第二週講的觀念，在這裡實際應用。' },
    { t: '金屬在水中從不裸奔', s: '第二節', b: ['最基本的配位基就是水：Fe(H₂O)₆³⁺', '單牙：Cl⁻、NH₃、H₂O', '多牙／螯合劑：乙二胺 2 牙、NTA 4 牙、EDTA 6 牙', '配位原子多為 N、O、S'],
      n: '第二節進入錯合化學。\n請大家記住一句話，金屬離子在水中從來不會裸奔。\n它永遠被配位基包圍著。\n最基本的配位基就是水本身。\n我們寫三價鐵離子，實際上是六個水分子配位的錯離子。\n配位基分兩類。\n只用一個原子配位的叫單牙，像氯離子、氨、水。\n一個分子提供多個配位原子的叫多牙，也就是螯合劑。\n乙二胺是兩牙，氮川三乙酸是四牙，乙二胺四乙酸是六牙。' },
    { t: 'HSAB：硬碰硬、軟配軟', s: '第二節', b: ['硬酸：Fe³⁺、Al³⁺、Ca²⁺ → 偏好 O 配位（羧基、酚基）', '軟酸：Hg²⁺、Cd²⁺、Ag⁺ → 偏好 S 配位（硫醇、硫化物）', '解釋：汞為何與硫化物綁在一起', '解釋：鐵為何與腐植質羧基結合'],
      n: '這一頁的原理非常好用，叫硬軟酸鹼原理。\n口訣是硬碰硬、軟配軟。\n硬酸像三價鐵、三價鋁、二價鈣，體積小、電荷密度高，偏好跟氧配位。\n所以它們喜歡羧基跟酚基。\n軟酸像二價汞、二價鎘、一價銀，體積大、可極化，偏好跟硫配位。\n這一條原理可以解釋大半的環境金屬行為。\n為什麼汞在厭氧沉積物裡會跟硫化物綁在一起。\n為什麼鐵會跟腐植質的羧基結合。\n答案都在這裡。' },
    { t: '螯合效應是熵的勝利', s: '第二節', b: ['Ni²⁺ + 6NH₃ → Ni(NH₃)₆²⁺，log K ≒ 8.6', 'Ni²⁺ + 3en → Ni(en)₃²⁺，log K ≒ 18.3', '同樣六個 N 配位，差十個數量級', '原因：粒子數增加，ΔS 為正'],
      n: '這一頁是本章最漂亮的一段。\n請看這兩個反應。\n同樣是六個氮原子配位到鎳離子上。\n用六個氨分子，穩定常數對數是八點六。\n用三個乙二胺分子，卻是十八點三。\n差了將近十個數量級。\n為什麼？\n答案是熵。\n單牙路徑是七個粒子變成一個，熵大幅下降。\n螯合路徑是四個粒子變成四個，而且還釋放出六個水分子，熵是增加的。\n所以螯合效應本質上是熵的勝利。' },
    { t: '條件穩定常數：EDTA 的實用問題', s: '第二節', b: ["K′_MY = α_Y(H) · K_MY", 'pH 2：α ≒ 10⁻¹³·⁵；pH 6：≒ 10⁻⁴·⁶；pH 10：≒ 10⁻⁰·⁴⁵', 'pH 10 可滴定 Ca²⁺；pH 2 只能滴定 Fe³⁺', '硬度滴定用 pH 10 緩衝液是熱力學要求，不是規定'],
      n: '這一頁請大家務必理解，實驗課會直接用到。\nEDTA 有六個配位點，四個羧基兩個胺基，全部都會被質子化。\n所以在酸性條件下，真正有效的完全去質子態其實很少。\n我們定義一個阿爾法係數，代表有效物種佔總量的比例。\n把它乘上原始穩定常數，就得到條件穩定常數。\n請看數字。\n酸鹼值二的時候，阿爾法只有十的負十三點五次方。\n酸鹼值十的時候，接近十的負零點四五次方。\n所以硬度滴定一定要在酸鹼值十的緩衝液裡做。\n這不是規定，這是熱力學。' },
    { t: '物種濃度計算五步驟', s: '第三節', b: ['① 列質量平衡', '② 列各平衡式與常數', '③ 用 α 係數換成有效配位基', '④ 解聯立（常用過量配位基近似）', '⑤ 回頭檢查近似是否成立'],
      n: '第三節我們做計算。\n面對某個酸鹼值下金屬有多少是游離態這種題目，流程是固定的。\n第一步列質量平衡，把總金屬跟總配位基寫出來。\n第二步列出各個平衡式跟常數。\n第三步用阿爾法係數，把總配位基換成有效配位基。\n第四步解聯立，通常可以用過量配位基近似來簡化。\n第五步最容易被忘記，回頭檢查近似是不是成立。\n如果算出來的游離配位基跟總量差不多，近似才有效。' },
    { t: '算一題：銅在 EDTA 中還剩多少', s: '第三節', b: ['C_Cu = 1×10⁻⁵ M、C_EDTA = 1×10⁻³ M、pH 6', 'log K_CuY = 18.8，α ≒ 10⁻⁴·⁶', "K′ = 10^(18.8−4.6) = 10^14.2", '[Cu²⁺] ≒ 10⁻⁵ ÷ (10^14.2 × 10⁻³) ≒ 10⁻¹⁶·² M'],
      n: '我們實際算一題。\n總銅濃度是十的負五次方莫耳每公升。\nEDTA 總量是十的負三次方，過量很多。\n酸鹼值是六，所以阿爾法大約十的負四點六次方。\n銅跟 EDTA 的穩定常數對數是十八點八。\n條件穩定常數就是十八點八減四點六，等於十四點二。\n代入公式，游離銅離子濃度大約是十的負十六點二次方莫耳每公升。\n這個數字幾乎等於不存在。\n所以我們說螯合劑徹底改變了金屬的化學面貌。' },
    { t: '螯合劑的兩面刃', s: '第三節', b: ['PbCO₃(s) + NTA³⁻ → Pb(NTA)⁻ + CO₃²⁻', '原本固定在沉積物、管垢中的重金屬被溶出', '移動性大增，可傳輸更遠', '條件改變（pH 降、螯合劑降解）→ 金屬再釋出'],
      n: '但螯合劑有另一面。\n請看這個反應。\n碳酸鉛原本溶解度極低，牢牢固定在沉積物或管垢裡。\n可是加入氮川三乙酸之後，生成很穩定的螯合物，平衡被拉往右邊。\n鉛就大量溶出來了。\n後果有兩個。\n第一，鉛的移動性大增，可以隨水流傳輸更遠。\n第二，一旦條件改變，比如酸鹼值下降，或螯合劑被微生物降解，金屬又會再釋出。\n請記住這句話，固定與移動之間，只隔著一個配位基。' },
    { t: '聚磷酸鹽與優養化的因果鏈', s: '第三節', b: ['STPP 螯合 Ca²⁺、Mg²⁺，避免生成鈣皂', 'P₃O₁₀⁵⁻ + 2H₂O → 3PO₄³⁻ + 4H⁺', '正磷酸鹽是藻類最容易利用的形式', '藻華 → 缺氧 → 底泥厭氧釋磷（內部負荷）'],
      n: '這一頁把硬度跟優養化串起來。\n合成清潔劑曾經大量使用三聚磷酸鈉當助洗劑。\n它的功能就是螯合鈣鎂，避免生成鈣皂。\n可是聚磷酸鹽在水裡會水解成正磷酸鹽。\n而正磷酸鹽正是藻類最容易利用的形式。\n因果鏈是這樣的。\n硬水需要助洗劑，助洗劑水解出磷，磷限制被解除，藻華爆發。\n藻類死亡分解耗氧，底層缺氧，底泥在厭氧下又釋出更多磷。\n這叫內部負荷，是一個惡性循環。' },
    { t: '腐植質：天然界最重要的配位基', s: '第三節', b: ['腐植酸、黃酸、腐黑物：依溶解行為分類', '結構特徵：大量 –COOH 與酚 –OH', '角色一：金屬載體（Fe³⁺、Al³⁺、Cu²⁺）', '角色二：光敏劑，產生 •OH、¹O₂', '角色三：消毒副產物前驅物 → THMs、HAAs'],
      n: '最後介紹腐植質。\n它是動植物殘體經過微生物跟化學作用形成的高分子混合物。\n依溶解行為分成腐植酸、黃酸跟腐黑物。\n結構上最重要的特徵是大量的羧基跟酚羥基。\n所以它帶負電，能夠強力錯合金屬。\n它在環境中有三個角色。\n第一是金屬載體，讓鐵鋁銅在水中移動。\n第二是光敏劑，吸光之後產生活性氧物種，驅動污染物的間接光解。\n第三個角色最麻煩，它是消毒副產物的前驅物。\n加氯的時候會生成三鹵甲烷跟鹵乙酸。' },
    { t: '本週小結與作業', s: '小結', b: ['硬度、水垢、軟化：生活與工程的化學', '螯合效應＝熵的勝利；條件穩定常數＝實用的修正', '螯合劑是兩面刃：固定與移動只差一個配位基', '作業：本週線上練習（含計算題）'],
      n: '今天的重點收攏成三句話。\n第一，硬度不只是生活困擾，它牽動能源效率跟水處理成本。\n第二，螯合效應本質上是熵的勝利，而條件穩定常數是把理論拉回現實的修正。\n第三，螯合劑是兩面刃，固定與移動之間只隔著一個配位基。\n作業有兩項。\n第一，完成本週線上練習，裡面有計算題，請務必動筆算。\n第二，預習第三章，下週我們進入氧化還原，會用到能斯特方程式。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '某水樣 Ca²⁺ ＝ 40 mg/L、Mg²⁺ ＝ 12 mg/L，其總硬度約為多少 mg/L as CaCO₃？', o: ['約 52', '約 100', '約 149', '約 200'], a: 2, e: '總硬度 ＝ 2.5×40 + 4.1×12 ＝ 100 + 49.2 ≒ 149 mg/L as CaCO₃。係數分別由 100/40.08 與 100/24.31 而來。' },
    { q: '關於暫時硬度，下列敘述何者<b>正確</b>？', o: ['與 SO₄²⁻ 相伴，加熱不會沉澱', '與 HCO₃⁻ 相伴，加熱時放出 CO₂ 並沉澱 CaCO₃', '只能以離子交換去除', '與硬度無關，屬於鹼度的一部分'], a: 1, e: 'Ca²⁺ + 2HCO₃⁻ --Δ--> CaCO₃(s) + CO₂ + H₂O。加熱驅離 CO₂ 使平衡右移而沉澱，這正是熱水器與鍋爐水垢的來源。' },
    { q: '石灰－蘇打軟化法中，去除鎂硬度為何需較高的加藥量？', o: ['因為鎂的原子量較大', '因為 Mg(OH)₂ 需 pH 約 11 才有效沉澱，須額外加石灰提高 pH', '因為鎂不與碳酸根反應', '因為鎂會催化碳酸鈣再溶解'], a: 1, e: 'Mg(OH)₂ 的溶解度使其須在較高 pH（約 11）才會有效沉澱，故除鎂需額外石灰把 pH 拉高；相對地 CaCO₃ 在 pH 9.5 附近即可沉澱。' },
    { q: 'Ni²⁺ 與 6 NH₃ 的 log K ≒ 8.6，而與 3 個乙二胺（en）的 log K ≒ 18.3。此差異的主要熱力學原因為？', o: ['乙二胺的鍵能較強', '螯合效應：反應後粒子數增加，熵變為正', '氨的分子量較小', '乙二胺是軟鹼、氨是硬鹼'], a: 1, e: '兩者配位原子皆為 6 個 N，焓變相近。差異來自熵：單牙路徑 7 粒子→1 粒子（ΔS<0），螯合路徑 4 粒子→4 粒子且釋出 6 個水分子（ΔS>0）。' },
    { q: '依 HSAB 原理，下列配對何者<b>最穩定</b>？', o: ['Hg²⁺ 與 F⁻', 'Hg²⁺ 與 RS⁻（硫醇根）', 'Al³⁺ 與 S²⁻', 'Fe³⁺ 與 I⁻'], a: 1, e: 'Hg²⁺ 為軟酸，偏好與軟鹼（含硫配位基）結合，這正是汞在厭氧沉積物中與硫化物結合、以及螯合治療使用含 –SH 藥物的原因。Al³⁺、Fe³⁺ 為硬酸，偏好 O、F 配位。' },
    { q: '硬度的 EDTA 滴定必須在 pH 10 緩衝液中進行，其化學理由是？', o: ['pH 10 時指示劑顏色較鮮明，與熱力學無關', 'pH 10 時 α_Y(H) 較大，條件穩定常數 K′ 才足以使反應完全', 'pH 10 可避免 CaCO₃ 沉澱', 'EDTA 只在鹼性下才溶解'], a: 1, e: 'EDTA 的配位點在酸性下被質子化，有效 Y⁴⁻ 極少。α_Y(H) 在 pH 2 約 10⁻¹³·⁵、pH 10 約 10⁻⁰·⁴⁵。只有 pH 夠高時 K′ ＝ α·K 才大到足以完全反應。' },
    { q: 'C_Cu ＝ 1×10⁻⁵ M、C_EDTA ＝ 1×10⁻³ M、pH 6（α ≒ 10⁻⁴·⁶）、log K_CuY ＝ 18.8。游離 [Cu²⁺] 約為？', o: ['約 10⁻⁵ M', '約 10⁻⁹ M', '約 10⁻¹⁶ M', '約 10⁻³ M'], a: 2, e: "K′ ＝ 10^(18.8−4.6) ＝ 10^14.2；在 EDTA 過量下 [Cu²⁺] ≒ C_Cu/(K′·C_EDTA) ＝ 10⁻⁵/(10^14.2×10⁻³) ≒ 10⁻¹⁶·² M。游離銅幾乎不存在。" },
    { q: 'NTA 等螯合劑進入環境後，對沉積物中的 PbCO₃ 可能造成什麼影響？', o: ['使其更難溶解，降低鉛的移動性', '生成穩定的可溶螯合物，使鉛溶出並提高移動性', '將 Pb²⁺ 氧化為 Pb⁴⁺', '完全無影響'], a: 1, e: 'PbCO₃(s) + NTA³⁻ → Pb(NTA)⁻ + CO₃²⁻。生成穩定可溶錯合物使溶解平衡右移，鉛從固相釋出、移動性大增；若日後螯合劑被降解或 pH 改變，金屬可能再釋出。' },
    { q: '聚磷酸鹽（如 STPP）作為清潔劑助洗劑，最終導致優養化的關鍵化學步驟是？', o: ['聚磷酸鹽直接被藻類吸收', '聚磷酸鹽水解為正磷酸鹽 PO₄³⁻，成為藻類最易利用的磷源', '聚磷酸鹽提高水體 pH', '聚磷酸鹽降低水體溶氧'], a: 1, e: 'P₃O₁₀⁵⁻ + 2H₂O → 3PO₄³⁻ + 4H⁺。水解產生的正磷酸鹽解除淡水系統常見的磷限制，引發藻華，繼而耗氧並造成底泥厭氧釋磷的內部負荷。' },
    { q: '腐植質在自來水處理中被視為必須去除的對象，主要原因是？', o: ['它會提高水的硬度', '它是消毒副產物（THMs、HAAs）的前驅物', '它會使水的導電度過高', '它會直接造成急性中毒'], a: 1, e: '腐植質富含酚類與活化芳香環結構，加氯時與 HOCl 反應生成三鹵甲烷與鹵乙酸等消毒副產物。因此現代淨水程序強調先以混凝／過濾去除天然有機物（NOM）再消毒。' }
  ],

CONTENT[7] = {
  type: 'teach',
  title: '水圈—水化學 III：氧化還原、pE 與 pE–pH 圖、腐蝕｜期末行動討論 II',
  chapters: '11E Ch3 水化學中的氧化還原（中譯 Ch3）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 3 章（中譯本第 3 章）',
  goals: [
    '能以半反應法平衡水中的氧化還原反應。',
    '能運用能斯特方程式計算電位，並在 pE 與 E<sub>h</sub> 間換算。',

  cards: [
    { h: '氧化還原的記帳法', b: '環境反應動輒十幾個原子，硬平衡會出錯。請固定用<b>半反應法</b>：<br>① 分成氧化半反應與還原半反應。<br>② 各自平衡主元素。<br>③ 用 H<sub>2</sub>O 平衡 O，用 H<sup>+</sup> 平衡 H。<br>④ 用 e<sup>−</sup> 平衡電荷。<br>⑤ 乘倍數使電子數相等後相加。<br>⑥ 若為鹼性條件，兩邊各加等量 OH<sup>−</sup> 把 H<sup>+</sup> 中和成水。<br>練習：把 Fe<sup>2+</sup> 被溶氧氧化寫出來——<div class="eq">4 Fe<sup>2+</sup> + O<sub>2</sub> + 10 H<sub>2</sub>O <span class="fx">→</span> 4 Fe(OH)<sub>3</sub>(s) + 8 H<sup>+</sup></div>注意這個反應<b>會產酸</b>，這正是含鐵地下水曝氣後 pH 下降、且生成紅褐色沉澱的原因。' },
    { h: 'pE：把電子當成質子來看', b: '就像 pH 描述質子活度，pE 描述<b>電子活度</b>：<div class="eq">pE ＝ −log{e<sup>−</sup>}　；　pE ＝ E<sub>h</sub>(V) / 0.0591（25 °C）</div>pE 高＝電子很少＝氧化性強（如充氧表層水，pE ≒ +13）；pE 低＝電子很多＝還原性強（如厭氧底泥，pE ≒ −4）。<br>使用 pE 的好處是它與 pH 同尺度，可以直接畫在同一張圖上，也讓「水體是氧化態還是還原態」變成一個可比較的數字。<br>提醒：天然水常處於<b>非平衡</b>狀態（不同氧化還原對算出的 pE 不一致），因此實測的 ORP 只能當作半定量指標，不宜直接當熱力學 pE 使用。' },
    { h: '能斯特方程式', b: '對半反應 <span class="fx">a</span>Ox + <span class="fx">n</span>e<sup>−</sup> ⇌ <span class="fx">b</span>Red：<div class="eq">E ＝ E° − (0.0591/n) · log([Red]<sup>b</sup>/[Ox]<sup>a</sup>)　（25 °C）<br>對應 pE ＝ pE° − (1/n) · log([Red]<sup>b</sup>/[Ox]<sup>a</sup>)</div>三個必須記住的推論：<br>① 濃度差十倍，單電子反應的電位只差 59 mV——<b>電位對濃度非常不敏感</b>，這也是為什麼濃度電池電壓都很小。<br>② 只要半反應中出現 H<sup>+</sup>，電位就與 pH 有關；每消耗一個 H<sup>+</sup>（對單電子），E 隨 pH 上升下降 59 mV。<br>③ 平衡時 E ＝ 0，可得 log K ＝ nE°<sub>cell</sub>/0.0591，把電化學與平衡常數連起來。' },
    { h: '水的穩定範圍', b: '水本身就會被氧化或還原，這決定了環境中 pE 的上下界：<div class="eq">上界（水被氧化）：O<sub>2</sub> + 4H<sup>+</sup> + 4e<sup>−</sup> ⇌ 2H<sub>2</sub>O　pE ＝ 20.75 − pH<br>下界（水被還原）：2H<sup>+</sup> + 2e<sup>−</sup> ⇌ H<sub>2</sub>　pE ＝ −pH</div>在 pE–pH 圖上，這兩條斜率皆為 −1 的平行線之間，就是<b>水的穩定區</b>。任何位於上界之上的氧化劑會把水氧化放氧，位於下界之下的還原劑會把水還原放氫。<br>實際天然水的範圍更窄：受到動力學限制與溶氧供應限制，一般落在 pE −5 到 +13、pH 4 到 9 的方框內。<b>先畫這個框，再談任何物種的穩定性，是判讀 pE–pH 圖的第一步。</b>' },
    { h: 'pE–pH 圖怎麼讀', b: '以鐵系統為例，圖上會出現幾種界線：<br>• <b>水平線</b>：只涉及電子、不涉及 H<sup>+</sup>（如 Fe<sup>3+</sup>/Fe<sup>2+</sup>）。<br>• <b>垂直線</b>：只涉及 H<sup>+</sup>、不涉及電子（如 Fe<sup>3+</sup> 水解成 Fe(OH)<sub>3</sub>）。<br>• <b>斜線</b>：兩者都涉及（如 Fe(OH)<sub>3</sub> + 3H<sup>+</sup> + e<sup>−</sup> ⇌ Fe<sup>2+</sup> + 3H<sub>2</sub>O，斜率 −3）。<br>環境詮釋：氧化且中性偏鹼的表層水中，鐵以 Fe(OH)<sub>3</sub>(s) 沉澱固定；一旦底泥轉為還原（pE 下降），鐵被還原成可溶的 Fe<sup>2+</sup> 而釋出，同時把原本吸附在氫氧化鐵表面的<b>磷酸鹽與砷</b>一起放出來。<br><b>孟加拉地下水砷污染的核心機制正是這件事</b>——不是有人倒了砷，而是氧化還原條件改變讓天然的砷從鐵氧化物上鬆脫。' },
    { h: '沉積物的氧化還原分帶', b: '把一根柱狀沉積物剖開，由上而下會看到教科書般的分帶，順序由電子接受者可提供的自由能決定：<div class="eq">O<sub>2</sub> &gt; NO<sub>3</sub><sup>−</sup> &gt; Mn(IV) &gt; Fe(III) &gt; SO<sub>4</sub><sup>2−</sup> &gt; CO<sub>2</sub></div>對應的指標現象：<br>• 好氧層（數 mm）：黃棕色，Fe(III) 氧化物。<br>• 硝酸還原層：NO<sub>3</sub><sup>−</sup> 消失、出現 N<sub>2</sub>／N<sub>2</sub>O。<br>• 鐵錳還原層：灰色，孔隙水 Fe<sup>2+</sup>、Mn<sup>2+</sup> 上升。<br>• 硫酸還原層：黑色（FeS）、有硫化氫臭味。<br>• 產甲烷層：氣泡。<br>知道分帶就能<b>用顏色和氣味現場判斷氧化還原狀態</b>，這是野外採樣非常實用的技能。', local: '花蓮連結：花蓮溪口與美崙溪感潮段的底泥常可見到明顯的黑色硫化物層，是課堂觀察分帶的好樣點（採樣須注意安全與許可）。' },
    { h: '腐蝕：金屬的自發還原', b: '腐蝕本質上是金屬回到熱力學上更穩定的氧化態，是一個原電池：<div class="eq">陽極：Fe <span class="fx">→</span> Fe<sup>2+</sup> + 2e<sup>−</sup><br>陰極（充氧中性水）：O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>−</sup> <span class="fx">→</span> 4 OH<sup>−</sup><br>陰極（酸性缺氧）：2H<sup>+</sup> + 2e<sup>−</sup> <span class="fx">→</span> H<sub>2</sub></div>加速腐蝕的因素：低 pH、高氯離子（破壞鈍化膜、造成孔蝕）、高導電度、異種金屬接觸（電偶腐蝕）、氧濃差電池（縫隙腐蝕）。<br>防蝕四招：<br>① <b>塗層／襯裡</b>（隔絕）；② <b>陰極保護</b>（犧牲陽極用 Zn、Mg，或外加電流）；③ <b>緩蝕劑</b>（磷酸鹽、矽酸鹽形成保護膜；早期用鉻酸鹽，因毒性已淘汰）；④ <b>材質選擇</b>（不鏽鋼靠 Cr<sub>2</sub>O<sub>3</sub> 鈍化膜）。<br>自來水管網的<b>朗格利爾指數（LSI）</b>就是用來調控水質使其略呈結垢傾向，讓管壁形成薄層碳酸鈣保護膜。' },
    { h: '光化學與微生物的角色', b: '天然水中的氧化還原不只靠熱力學，還有兩個重要驅動者：<br><b>① 光化學</b>：腐植質、硝酸鹽與亞硝酸鹽吸光後產生活性物種：<div class="eq">NO<sub>3</sub><sup>−</sup> + h<span class="fx">ν</span> <span class="fx">→</span> NO<sub>2</sub><span class="fx">•</span> + O<span class="fx">•−</span> <span class="fx">→</span>（+H<sup>+</sup>）<span class="fx">•</span>OH</div>氫氧自由基幾乎與所有有機物反應（k ≒ 10<sup>9</sup>–10<sup>10</sup> M<sup>−1</sup>s<sup>−1</sup>），是天然水的「自淨主力」，也是高級氧化程序（AOPs）的設計基礎。<br><b>② 微生物</b>：微生物是氧化還原反應的<b>觸媒</b>，它們不改變熱力學可行性，只改變速率。例如 Fe<sup>2+</sup> 在 pH 3 的化學氧化極慢，但氧化亞鐵硫桿菌可加速數十萬倍——這既是礦場酸性排水的加速器，也是生物冶金的工具。' },
    { h: '期末行動討論 II：計畫書要有數字', b: '第二次討論的任務是把題目變成<b>可執行的計畫書</b>（W7 結束前繳交，2–3 頁）。必備七項：<br>① 問題敘述與場域（含現況數值或估算）<br>② 關鍵化學（反應式、物種、可能干擾）<br>③ 方法（採樣點、頻率、分析項目、儀器或替代方案）<br>④ 可量測指標與成功判準<br>⑤ 時程與分工<br>⑥ 風險與安全（化學品、場域、許可）<br>⑦ 資料來源清單（含年份與單位；若使用 AI 協助，附 AI 使用聲明）<br>常見退件原因：沒有現況數值、指標無法量測、方法需要買不到的儀器、以及<b>沒有做過一次「試算」就寫進計畫書</b>。請務必先用手邊數據做一次粗估。' }
  ],
  slides: [
    { t: '環境化學　第 7 週', s: '封面', cover: true, b: ['水圈—水化學 III：氧化還原', 'pE、能斯特方程式、pE–pH 圖、腐蝕', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n今天是水化學的第三部分，也是水圈的理論高峰。\n我們要談氧化還原。\n第一節建立記帳法跟 pE 這個概念。\n第二節處理能斯特方程式跟 pE 對 pH 圖。\n第三節談腐蝕、光化學，還有期末行動的第二次討論。\n這一週的內容如果掌握了，後面的水處理跟大氣化學都會輕鬆很多。' },
    { t: '半反應法六步驟', s: '第一節', b: ['① 拆成氧化半反應與還原半反應', '② 平衡主元素', '③ H₂O 平衡 O，H⁺ 平衡 H', '④ e⁻ 平衡電荷', '⑤ 乘倍數使電子相等後相加', '⑥ 鹼性條件：兩邊加 OH⁻ 中和 H⁺'],
      n: '環境反應動輒十幾個原子，用眼睛硬平衡一定會錯。\n請大家固定用半反應法。\n第一步拆成氧化半反應跟還原半反應。\n第二步各自平衡主元素。\n第三步用水平衡氧，用氫離子平衡氫。\n第四步用電子平衡電荷。\n第五步乘上適當倍數，讓兩邊電子數相等再相加。\n如果題目是鹼性條件，第六步再兩邊各加等量氫氧根，把氫離子中和成水。\n這六步一輩子都夠用。' },
    { t: '練習：二價鐵被溶氧氧化', s: '第一節', b: ['4Fe²⁺ + O₂ + 10H₂O → 4Fe(OH)₃(s) + 8H⁺', '產物是紅褐色沉澱', '這個反應會產酸', '含鐵地下水曝氣後 pH 下降'],
      n: '我們用半反應法練一題。\n二價鐵被溶氧氧化。\n答案是四個二價鐵加一個氧分子加十個水，生成四個氫氧化鐵沉澱跟八個氫離子。\n請注意兩件事。\n第一，產物是紅褐色的沉澱，這就是地下水鐵管口常見的鏽色。\n第二，右邊有八個氫離子，所以這個反應會產酸。\n這解釋了為什麼含鐵地下水曝氣之後，酸鹼值會下降。\n如果原水鹼度不夠，酸鹼值會掉得很明顯。' },
    { t: 'pE：把電子當成質子來看', s: '第一節', b: ['pE = −log{e⁻}；pE = E_h(V) / 0.0591（25 °C）', 'pE 高 = 電子少 = 氧化性強（表層水 ≒ +13）', 'pE 低 = 電子多 = 還原性強（厭氧底泥 ≒ −4）', '注意：天然水常處於非平衡，ORP 只能半定量'],
      n: '接下來介紹一個很優雅的概念，pE。\n就像酸鹼值描述質子活度，pE 描述電子活度。\n它等於負的電子活度對數。\n也可以直接從氧化還原電位換算，在攝氏二十五度除以零點零五九一。\npE 高代表電子很少，氧化性強，充氧的表層水大約正十三。\npE 低代表電子很多，還原性強，厭氧底泥大約負四。\n用 pE 的好處是它跟酸鹼值同尺度，可以畫在同一張圖上。\n但我要提醒，天然水常處於非平衡狀態，實測的氧化還原電位只能當半定量指標。' },
    { t: '能斯特方程式與三個推論', s: '第二節', b: ['E = E° − (0.0591/n)·log([Red]/[Ox])', '① 濃度差十倍，單電子只差 59 mV', '② 半反應有 H⁺ → 電位與 pH 有關', '③ 平衡時 log K = nE°_cell / 0.0591'],
      n: '第二節從能斯特方程式開始。\n公式本身大家在普化都學過。\n我要強調的是三個推論。\n第一，濃度差十倍，單電子反應的電位只差五十九毫伏特。\n所以電位對濃度其實非常不敏感，濃度電池的電壓都很小。\n第二，只要半反應裡出現氫離子，電位就跟酸鹼值有關。\n這是畫 pE 對 pH 圖的前提。\n第三，平衡的時候電池電位等於零，可以推出平衡常數對數等於電子數乘以標準電位除以零點零五九一。\n這條式子把電化學跟平衡常數連了起來。' },
    { t: '水的穩定範圍', s: '第二節', b: ['上界：O₂ + 4H⁺ + 4e⁻ ⇌ 2H₂O，pE = 20.75 − pH', '下界：2H⁺ + 2e⁻ ⇌ H₂，pE = −pH', '兩條斜率 −1 的平行線之間即水的穩定區', '實際天然水更窄：pE −5 到 +13、pH 4 到 9'],
      n: '在畫任何 pE 對 pH 圖之前，一定要先畫這兩條線。\n上界是水被氧化放出氧氣，pE 等於二十點七五減酸鹼值。\n下界是水被還原放出氫氣，pE 等於負的酸鹼值。\n兩條線的斜率都是負一，互相平行。\n中間那一條帶，就是水的穩定區。\n任何跑到上界之上的氧化劑，會把水氧化。\n跑到下界之下的還原劑，會把水還原。\n實際的天然水範圍更窄，大約在 pE 負五到正十三、酸鹼值四到九的方框裡。' },
    { t: 'pE–pH 圖的三種線', s: '第二節', b: ['水平線：只涉及電子（Fe³⁺/Fe²⁺）', '垂直線：只涉及 H⁺（Fe³⁺ 水解成 Fe(OH)₃）', '斜線：兩者都涉及，斜率由係數比決定', '例：Fe(OH)₃ + 3H⁺ + e⁻ ⇌ Fe²⁺ + 3H₂O，斜率 −3'],
      n: '這一頁教大家判讀 pE 對 pH 圖。\n圖上只有三種線。\n水平線代表只涉及電子、不涉及氫離子，像三價鐵跟二價鐵之間。\n垂直線代表只涉及氫離子、不涉及電子，像三價鐵水解成氫氧化鐵。\n斜線代表兩者都涉及，斜率等於氫離子係數除以電子係數再取負號。\n舉例來說，氫氧化鐵加三個氫離子加一個電子，變成二價鐵加三個水。\n這條線的斜率就是負三。\n看懂這三種線，任何 pE 對 pH 圖都難不倒你。' },
    { t: '孟加拉砷污染的化學', s: '第二節', b: ['氧化條件：Fe(OH)₃(s) 固定，砷吸附在其表面', '還原條件：Fe(III) → Fe²⁺ 溶出', '吸附的 As 與 PO₄³⁻ 一起被釋放', '不是有人倒砷，是氧化還原條件改變'],
      n: '這一頁是 pE 對 pH 圖最重要的環境應用。\n在氧化、中性偏鹼的條件下，鐵以氫氧化鐵沉澱存在。\n它的表面積很大，會把砷跟磷酸鹽牢牢吸附住。\n可是當環境轉為還原，pE 下降。\n三價鐵被還原成可溶的二價鐵，沉澱溶掉了。\n原本吸附在上面的砷跟磷酸鹽也就一起釋放出來。\n孟加拉地下水砷污染的核心機制正是這件事。\n不是有人倒了砷，而是打井取水改變了地下的氧化還原條件。\n這是環境化學最沉重也最重要的案例之一。' },
    { t: '沉積物的氧化還原分帶', s: '第三節', b: ['熱力學順序：O₂ > NO₃⁻ > Mn(IV) > Fe(III) > SO₄²⁻ > CO₂', '好氧層：黃棕色', '鐵錳還原層：灰色，孔隙水 Fe²⁺ 上升', '硫酸還原層：黑色 FeS、硫化氫臭味', '產甲烷層：氣泡'],
      n: '第三節先講一個很實用的野外技能。\n把一根柱狀沉積物剖開，由上而下會看到教科書般的分帶。\n順序由電子接受者可提供的自由能決定。\n氧氣最好用，然後是硝酸根、四價錳、三價鐵、硫酸根，最後才是二氧化碳。\n對應的顏色也很清楚。\n最上面好氧層是黃棕色，因為是三價鐵氧化物。\n中間鐵錳還原層轉成灰色。\n再往下硫酸還原層是黑色，那是硫化亞鐵，而且會有臭味。\n最底下產甲烷層會冒氣泡。\n所以用眼睛跟鼻子就能現場判斷氧化還原狀態。' },
    { t: '腐蝕是一個原電池', s: '第三節', b: ['陽極：Fe → Fe²⁺ + 2e⁻', '陰極（充氧中性）：O₂ + 2H₂O + 4e⁻ → 4OH⁻', '陰極（酸性缺氧）：2H⁺ + 2e⁻ → H₂', '加速因素：低 pH、高 Cl⁻、異種金屬、氧濃差'],
      n: '接下來談腐蝕。\n腐蝕本質上就是金屬回到熱力學上更穩定的氧化態。\n它是一個自發的原電池。\n陽極是鐵溶解出二價鐵離子，放出電子。\n陰極要看環境。\n在充氧的中性水裡，是氧氣得電子變成氫氧根。\n在酸性缺氧的環境，是氫離子得電子放出氫氣。\n加速腐蝕的因素有低酸鹼值、高氯離子、異種金屬接觸，還有氧濃差電池。\n氯離子特別麻煩，它會破壞鈍化膜造成孔蝕。' },
    { t: '防蝕四招與朗格利爾指數', s: '第三節', b: ['① 塗層／襯裡：隔絕', '② 陰極保護：犧牲陽極（Zn、Mg）或外加電流', '③ 緩蝕劑：磷酸鹽、矽酸鹽（鉻酸鹽已因毒性淘汰）', '④ 材質：不鏽鋼靠 Cr₂O₃ 鈍化膜', 'LSI：調水質使管壁形成薄層 CaCO₃ 保護膜'],
      n: '防蝕大致有四招。\n第一是塗層或襯裡，用物理隔絕。\n第二是陰極保護，用鋅或鎂當犧牲陽極，或是外加電流。\n第三是加緩蝕劑，現在多用磷酸鹽跟矽酸鹽形成保護膜。\n早期用鉻酸鹽效果很好，但因為六價鉻的毒性已經淘汰，這也是綠色化學的案例。\n第四是材質選擇，不鏽鋼靠的是表面那層氧化鉻鈍化膜。\n自來水管網還有一招，用朗格利爾指數調控水質。\n讓水略呈結垢傾向，在管壁形成薄薄一層碳酸鈣保護膜。' },
    { t: '光化學：天然水的自淨主力', s: '第三節', b: ['NO₃⁻ + hν → … → •OH', '腐植質吸光產生 ¹O₂、•OH 等活性物種', '•OH 與幾乎所有有機物反應，k ≒ 10⁹–10¹⁰ M⁻¹s⁻¹', '高級氧化程序 AOPs 的設計基礎'],
      n: '天然水的氧化還原不是只靠熱力學慢慢走。\n光化學是很重要的驅動者。\n硝酸鹽吸光之後會經過一連串步驟產生氫氧自由基。\n腐植質吸光也會產生單態氧跟氫氧自由基這類活性物種。\n氫氧自由基幾乎跟所有有機物反應，速率常數高達十的九次方到十次方。\n所以它是天然水的自淨主力。\n我們在水處理上把這個原理放大，就是高級氧化程序。\n用臭氧加雙氧水、紫外光加雙氧水、或是芬頓反應來製造氫氧自由基。' },
    { t: '微生物是觸媒，不是熱力學', s: '第三節', b: ['微生物只改變速率，不改變反應可行性', 'Fe²⁺ 在 pH 3 化學氧化極慢', '氧化亞鐵硫桿菌可加速數十萬倍', '既是 AMD 的加速器，也是生物冶金的工具'],
      n: '這一頁的觀念很重要，常常被誤解。\n微生物是氧化還原反應的觸媒。\n它們只改變反應速率，不改變熱力學可行性。\n舉例來說，二價鐵在酸鹼值三的環境中，化學氧化速率極慢。\n但氧化亞鐵硫桿菌可以把它加速數十萬倍。\n所以同一個菌，在礦場是酸性排水的加速器。\n在冶金廠卻是生物浸礦的工具。\n化學上是同一件事，差別只在我們想不想要它發生。' },
    { t: '期末行動討論 II：計畫書七項', s: '第三節', b: ['① 問題與場域（含現況數值）　② 關鍵化學', '③ 方法（採樣、分析）　④ 指標與判準', '⑤ 時程與分工　⑥ 風險與安全', '⑦ 資料來源＋AI 使用聲明', '退件原因：沒有現況數值、指標無法量測、沒做過試算'],
      n: '最後是期末行動的第二次討論。\n這週結束前要繳交計畫書，兩到三頁。\n必備七項請看投影片。\n問題與場域要有現況數值，關鍵化學要有反應式。\n方法要寫清楚採樣點、頻率、分析項目。\n指標要能量測，時程分工要具體。\n風險與安全一定要寫，包含化學品、場域跟許可。\n最後附資料來源，有用人工智慧就要附使用聲明。\n最常見的退件原因是沒有現況數值、指標無法量測，還有沒有先做過一次試算。\n請務必先用手邊的數據粗估一次。' },
    { t: '本週小結與作業', s: '小結', b: ['半反應法六步驟，一輩子夠用', 'pE 是電子的 pH；先畫水的穩定區再談物種', '氧化還原條件改變 → 金屬與吸附物一起釋出', '作業：計畫書；本週線上練習'],
      n: '今天的重點收攏成三句話。\n第一，半反應法六步驟請練熟，這是一輩子夠用的工具。\npE 是電子的酸鹼值，判讀任何 pE 對 pH 圖之前，一定先畫水的穩定區。\n第三，氧化還原條件一改變，金屬跟吸附在上面的砷、磷都會一起釋出。\n這是孟加拉砷污染的核心機制，也是所有底泥管理必須考慮的事。\n作業有兩項。\n第一，各組繳交期末行動計畫書。\n第二，完成本週線上練習。\n下週是光復節補假，我們第九週見。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '在酸性條件下平衡半反應 MnO₄⁻ → Mn²⁺，下列何者<b>正確</b>？', o: ['MnO₄⁻ + 4H⁺ + 3e⁻ → Mn²⁺ + 2H₂O', 'MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O', 'MnO₄⁻ + 8OH⁻ + 5e⁻ → Mn²⁺ + 4H₂O', 'MnO₄⁻ + 2H⁺ + 5e⁻ → Mn²⁺ + H₂O'], a: 1, e: 'Mn 由 +7 降到 +2 需 5 個電子；左邊 4 個 O 以 4 個 H₂O 平衡於右，故需 8 個 H⁺。檢查電荷：左 −1+8−5 ＝ +2 ＝ 右，正確。' },
    { q: '4Fe²⁺ + O₂ + 10H₂O → 4Fe(OH)₃(s) + 8H⁺ 對水質的影響為？', o: ['產鹼並生成白色沉澱', '產酸並生成紅褐色沉澱', '不改變 pH', '消耗 H⁺ 使 pH 上升'], a: 1, e: '反應右側產生 8 個 H⁺，會消耗鹼度使 pH 下降；Fe(OH)₃ 為紅褐色膠羽狀沉澱。這是含鐵地下水曝氣除鐵時必須同時注意鹼度的原因。' },

    { q: 'pE–pH 圖中水的穩定上界方程式 pE ＝ 20.75 − pH，其對應的半反應為？', o: ['2H⁺ + 2e⁻ ⇌ H₂', 'O₂ + 4H⁺ + 4e⁻ ⇌ 2H₂O', 'Fe³⁺ + e⁻ ⇌ Fe²⁺', 'SO₄²⁻ + 10H⁺ + 8e⁻ ⇌ H₂S + 4H₂O'], a: 1, e: '上界代表水被氧化放出 O₂ 的極限，對應 O₂/H₂O 對；下界 pE ＝ −pH 對應 H⁺/H₂ 對。兩線斜率皆為 −1，其間為水的穩定區。' },
    { q: 'pE–pH 圖上一條<b>垂直線</b>代表該界線所對應的反應：', o: ['只涉及電子轉移，不涉及 H⁺', '只涉及 H⁺（酸鹼／水解），不涉及電子轉移', '同時涉及電子與 H⁺', '不涉及任何物種變化'], a: 1, e: '垂直線表示界線位置只與 pH 有關而與 pE 無關，即純酸鹼或水解反應（如 Fe³⁺ + 3H₂O ⇌ Fe(OH)₃ + 3H⁺）。水平線為純電子轉移，斜線則兩者兼具。' },
    { q: '南亞地區地下水砷污染的<b>主要成因機制</b>為？', o: ['工廠直接排放含砷廢水', '含水層轉為還原環境，Fe(III) 氧化物被還原溶解，其表面吸附的 As 隨之釋出', '農藥中的砷淋洗至地下水', '地下水過度抽取造成海水入侵'], a: 1, e: '砷本為天然存在並吸附於鐵氧化物表面。大量抽水與有機質輸入使含水層 pE 下降，Fe(III) 還原溶解後，吸附態砷（及磷酸鹽）一併釋入孔隙水，造成大規模污染。' },
    { q: '沉積物中微生物利用電子接受者的熱力學順序，下列何者<b>正確</b>？', o: ['CO₂ > SO₄²⁻ > Fe(III) > NO₃⁻ > O₂', 'O₂ > NO₃⁻ > Mn(IV) > Fe(III) > SO₄²⁻ > CO₂', 'NO₃⁻ > O₂ > CO₂ > SO₄²⁻', 'Fe(III) > O₂ > SO₄²⁻ > NO₃⁻'], a: 1, e: '依可獲得自由能由大至小排列。對應的野外指標：好氧層黃棕色、鐵錳還原層灰色、硫酸還原層黑色（FeS）並有硫化氫味、產甲烷層冒氣泡。' },
    { q: '在充氧的中性水中，鐵管腐蝕的<b>陰極反應</b>為？', o: ['Fe → Fe²⁺ + 2e⁻', 'O₂ + 2H₂O + 4e⁻ → 4OH⁻', '2H⁺ + 2e⁻ → H₂', 'Fe²⁺ → Fe³⁺ + e⁻'], a: 1, e: '陽極為鐵溶解（Fe → Fe²⁺ + 2e⁻）；在充氧中性水中陰極為氧的還原生成 OH⁻。酸性缺氧時陰極才轉為 H⁺ 還原放出 H₂。' },
    { q: '自來水管網使用朗格利爾指數（LSI）調控水質的目的是？', o: ['使水呈明顯溶解性以清除舊管垢', '使水略呈結垢傾向，在管壁形成薄層 CaCO₃ 保護膜', '提高水中氯離子以殺菌', '降低水的鹼度以節省藥劑'], a: 1, e: 'LSI 略大於 0 表示水對 CaCO₃ 呈過飽和，可在管壁形成極薄保護膜以抑制腐蝕；LSI 明顯為負則具侵蝕性，會溶出鐵、鉛、銅等管材金屬。' },
    { q: '關於微生物在環境氧化還原反應中的角色，下列敘述何者<b>正確</b>？', o: ['微生物可使熱力學上不可行的反應變為可行', '微生物是觸媒，只改變反應速率而不改變熱力學可行性', '微生物只在好氧環境中作用', '微生物對 Fe²⁺ 氧化速率沒有影響'], a: 1, e: '微生物提供酵素降低活化能，可將反應加速數個數量級（如 Acidithiobacillus 對 Fe²⁺ 的氧化），但 ΔG 為負才可能發生。此觸媒角色同時解釋了 AMD 的加速與生物冶金的應用。' }

  cards: [
    { h: '水污染物的八大類', b: '看到一份水質報告，先把項目歸類，思考才會有結構：<br>① <b>耗氧有機物</b>：BOD、COD、TOC。<br>② <b>營養鹽</b>：NH<sub>4</sub><sup>+</sup>-N、NO<sub>3</sub><sup>−</sup>-N、TP。<br>③ <b>病原</b>：大腸桿菌群、腸病毒。<br>④ <b>重金屬與類金屬</b>：Cd、Pb、Hg、Cr、As。<br>⑤ <b>無機鹽與陰離子</b>：Cl<sup>−</sup>、SO<sub>4</sub><sup>2−</sup>、F<sup>−</sup>、CN<sup>−</sup>。<br>⑥ <b>有機微污染物</b>：農藥、PAHs、PCBs、酚類。<br>⑦ <b>新興污染物</b>：藥品與個人保健用品（PPCPs）、內分泌干擾物、微塑膠、PFAS。<br>⑧ <b>物理性</b>：懸浮固體、濁度、色度、熱污染。<br>每一類的「處理邏輯」都不同：耗氧有機物靠生物處理、重金屬靠化學沉澱或吸附、微污染物靠活性碳或高級氧化。<b>分類即是處理策略的第一步。</b>' },
    { h: 'BOD、COD、TOC 三兄弟', b: '三者都在測「有機物有多少」，但方法與意義不同：<br>• <b>BOD<sub>5</sub></b>：在 20 °C 培養 5 天，量微生物消耗的溶氧（mg O<sub>2</sub>/L）。優點是最貼近真實河川的耗氧衝擊；缺點是要等 5 天，且對有毒廢水會失真。<br>• <b>COD</b>：用強氧化劑（重鉻酸鉀／硫酸，加熱迴流 2 h）把有機物氧化。快速、重現性好；缺點是連難生物降解的物質也一起氧化，且傳統法產生 Cr(VI) 與 Hg 的有害廢液。<br>• <b>TOC</b>：直接測碳，燃燒後測 CO<sub>2</sub>。最快（數分鐘）、最不產生有害廢液，是<b>綠色分析化學</b>的方向。<br>經驗關係：一般都市污水 COD/BOD<sub>5</sub> ≒ 1.5–2.5；<b>比值大於 3 通常表示含大量難生物降解物質，直接進生物處理會失敗</b>。這個判斷在實務上非常關鍵。' },
    { h: '優養化：從限制因子談起', b: 'Redfield 比（C:N:P ＝ 106:16:1 莫耳比）告訴我們藻類的元素需求。當環境中某元素相對不足，它就是<b>限制因子</b>：<br>• 一般<b>淡水</b>：磷限制（因固氮藍綠菌可補氮，磷卻無氣態來源）。<br>• 一般<b>海水／河口</b>：氮限制。<br>判準：水中 N:P 質量比 &gt; 約 15–20 → 磷限制；&lt; 約 5–7 → 氮限制。<br>控制策略因此不同：淡水湖庫削減磷最有效（一單位磷可長出約 100 單位藻類乾重）；河口則需同時削減氮。<br><b>陷阱</b>：底泥在厭氧時釋出磷（內部負荷），因此就算外部負荷已削減，湖泊仍可能多年無法恢復——這叫做<b>生態遲滯（hysteresis）</b>。' },
    { h: '都市污水處理的三級流程', b: '<b>一級（物理）</b>：攔污柵 → 沉砂池 → 初沉池。去除約 50–60% SS、25–35% BOD。<br><b>二級（生物）</b>：活性污泥法為主。曝氣池讓微生物把溶解性有機物同化與礦化，二沉池分離污泥並迴流。<div class="eq">有機物 + O<sub>2</sub> + N + P <span class="fx">--微生物--&gt;</span> CO<sub>2</sub> + H<sub>2</sub>O + 新細胞（C<sub>5</sub>H<sub>7</sub>NO<sub>2</sub>）</div>去除約 85–95% BOD。關鍵操作參數是<b>污泥齡（SRT）</b>與<b>F/M 比</b>。<br><b>三級（高級）</b>：除氮除磷、砂濾、活性碳、薄膜、消毒。<br>污泥線：濃縮 → 厭氧消化（產沼氣 CH<sub>4</sub>）→ 脫水 → 資源化。<b>厭氧消化產生的沼氣可回收發電，是污水廠邁向能源自給的關鍵</b>，也是工業生態學的實例。' },
    { h: '生物除氮：硝化與脫硝', b: '除氮分兩段，條件完全相反，這是設計上的核心挑戰：<br><b>硝化（好氧、自營）</b>：<div class="eq">NH<sub>4</sub><sup>+</sup> + 1.5 O<sub>2</sub> <span class="fx">→</span> NO<sub>2</sub><sup>−</sup> + 2H<sup>+</sup> + H<sub>2</sub>O<br>NO<sub>2</sub><sup>−</sup> + 0.5 O<sub>2</sub> <span class="fx">→</span> NO<sub>3</sub><sup>−</sup></div>硝化菌生長慢（世代時間長），因此<b>污泥齡必須夠長</b>（通常 &gt; 10 天），且每氧化 1 g NH<sub>4</sub><sup>+</sup>-N 約消耗 4.6 g O<sub>2</sub> 與 7.1 g 鹼度（as CaCO<sub>3</sub>）。鹼度不足時 pH 會崩掉、硝化停擺。<br><b>脫硝（缺氧、異營）</b>：<div class="eq">NO<sub>3</sub><sup>−</sup> + 有機碳 <span class="fx">→</span> N<sub>2</sub>↑ + CO<sub>2</sub> + OH<sup>−</sup></div>需要碳源（可用進流污水或外加甲醇），並可回收約一半的鹼度。<br>所以典型的 A/O、A²/O 流程都是<b>「缺氧在前、好氧在後、內回流」</b>——把碳源留給脫硝用。<br>⚠ 另須注意：脫硝的中間產物包含 N<sub>2</sub>O（一氧化二氮，全球暖化潛勢約為 CO<sub>2</sub> 的三百倍）；缺氧控制不當或碳源不足時會逸散，生物除氮並非永遠只排出乾淨的 N<sub>2</sub>。' },
    { h: '生物除磷與化學除磷', b: '<b>生物除磷（EBPR）</b>：讓聚磷菌（PAOs）經歷厭氧／好氧交替。厭氧階段吸收揮發性脂肪酸並釋磷，好氧階段<b>過量攝取</b>磷成為多磷酸鹽顆粒，最後隨剩餘污泥排出。優點是不加藥、污泥可資源化；缺點是操作敏感，進流碳源不足即失敗。<br><b>化學除磷</b>：<div class="eq">Al<sup>3+</sup> + PO<sub>4</sub><sup>3−</sup> <span class="fx">→</span> AlPO<sub>4</sub>(s)<br>Fe<sup>3+</sup> + PO<sub>4</sub><sup>3−</sup> <span class="fx">→</span> FePO<sub>4</sub>(s)</div>穩定可靠，但增加污泥量與藥劑成本。<br><b>綠色化學的第三條路：磷回收</b>。以鎂鹽在鹼性下結晶出鳥糞石：<div class="eq">Mg<sup>2+</sup> + NH<sub>4</sub><sup>+</sup> + PO<sub>4</sub><sup>3−</sup> + 6H<sub>2</sub>O <span class="fx">→</span> MgNH<sub>4</sub>PO<sub>4</sub>·6H<sub>2</sub>O(s)</div>同時回收氮與磷，產物可直接作緩效肥料。磷是不可再生的礦產資源，<b>把污水從「處理對象」變成「磷礦」，正是本課程期末行動最推薦的題目方向之一</b>。', local: '花蓮連結：東華校內污水廠的污泥與上澄液，即為評估鳥糞石結晶回收的現成場域。' },
    { h: '消毒與消毒副產物的兩難', b: '消毒是水處理中拯救最多生命的一步，但也帶來新的化學問題：<br>• <b>加氯</b>：Cl<sub>2</sub> + H<sub>2</sub>O → HOCl + H<sup>+</sup> + Cl<sup>−</sup>；HOCl ⇌ H<sup>+</sup> + OCl<sup>−</sup>（pK<sub>a</sub> ≒ 7.5）。殺菌主力是<b>未解離的 HOCl</b>，理論上 pH 愈低效果愈好——但實務上為避免管網腐蝕與鉛銅溶出，操作多折衷在 pH 6.5–7.5。優點是有餘氯可保護配水管網。<br>• <b>副產物</b>：與腐植質反應生成三鹵甲烷（THMs）、鹵乙酸（HAAs）；若原水含溴，會生成毒性更高的溴化物種。<br>• <b>臭氧</b>：氧化力強、無味，但無殘留保護；含溴原水會生成<b>溴酸鹽（BrO<sub>3</sub><sup>−</sup>）</b>，屬可能致癌物。<br>• <b>紫外線</b>：物理性破壞核酸，不產生化學副產物，但對某些病毒需高劑量且無殘留。<br>現行策略是<b>「先除前驅物，再選低副產物消毒法，最後補少量餘氯」</b>——這是典型的源頭設計思維。' },
    { h: '新興污染物：低濃度不等於低風險', b: 'PPCPs、內分泌干擾物、微塑膠、PFAS 的共同特徵是<b>濃度極低（ng/L–µg/L）但生物效應明顯</b>。<br>• 傳統活性污泥對它們的去除率差異極大：布洛芬可 &gt; 90%，卡馬西平常 &lt; 20%。<br>• 抗生素殘留的關鍵風險不是急毒性，而是<b>抗藥性基因的篩選與傳播</b>。<br>• 乙炔雌二醇（EE2）在 ng/L 等級即可造成魚類雌性化。<br>處理選項：活性碳吸附、臭氧／高級氧化、薄膜（NF/RO）。但每一項都增加能耗與濃排水問題。<br><b>因此最有效的仍是源頭管理</b>：藥品回收制度、限制不必要添加、以及「可降解設計」（設計成使用後易水解的分子），這正是綠色化學第十原則的實踐。' },
    { h: '參訪行前準備：NDHU 污水廠', b: '<b>時間</b>：W10（11/9）15:10–17:00，校內集合後統一步行前往。<br><b>安全</b>：務必長褲、包鞋（禁拖鞋涼鞋）、綁長髮；現場禁飲食、禁觸摸設備與液面；聞到異味立即回報；有呼吸道疾病者事先告知。<br><b>觀察清單（請先寫下預測，現場再對照）</b>：<br>① 進流水的外觀、氣味、格柵攔下的物質。<br>② 曝氣池的顏色、泡沫型態、有無絲狀菌徵兆。<br>③ 二沉池的界面高度與上澄液清澈度。<br>④ 污泥處理線的去向（是否有厭氧消化、沼氣如何利用）。<br>⑤ 放流水的外觀與監測項目、放流去處。<br>⑥ 現場的<b>能耗來源</b>——曝氣通常佔全廠用電 50% 以上。<br><b>報告</b>：W12 口頭報告 8 分鐘／組，須包含一張自己畫的流程圖與一項「若我是廠長會先改什麼」的建議（附化學論證）。' }

  slides: [
    { t: '環境化學　第 9 週', s: '封面', cover: true, b: ['水污染及水處理 I', 'NDHU 污水廠參訪行前準備', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n放假一週，今天我們從水化學進入水污染與水處理。\n這是把前面所有理論拿出來用的一週。\n第一節談污染物分類跟指標。\n第二節走完整個污水處理流程，重點在除氮除磷。\n第三節談消毒、新興污染物，還有下週參訪的行前準備。\n請大家特別注意，下週要走出教室，安全事項一定要聽清楚。' },
    { t: '先分類，再思考', s: '第一節', b: ['耗氧有機物、營養鹽、病原、重金屬', '無機鹽、有機微污染物、新興污染物、物理性', '每一類的處理邏輯完全不同', '分類即是處理策略的第一步'],
      n: '拿到一份水質報告，第一件事是分類。\n我把水污染物分成八大類。\n耗氧有機物、營養鹽、病原、重金屬與類金屬。\n無機鹽與陰離子、有機微污染物、新興污染物，還有物理性項目。\n為什麼要分類？\n因為每一類的處理邏輯完全不同。\n耗氧有機物靠生物處理。\n重金屬靠化學沉澱或吸附。\n微污染物要靠活性碳或高級氧化。\n分類本身就是處理策略的第一步。' },
    { t: 'BOD、COD、TOC 怎麼選', s: '第一節', b: ['BOD₅：20 °C 培養 5 天，量耗氧；最貼近真實衝擊', 'COD：重鉻酸鉀迴流 2 小時；快但產生 Cr(VI) 廢液', 'TOC：燃燒測 CO₂，數分鐘且無有害廢液', 'COD/BOD₅ > 3 → 難生物降解，生物處理會失敗'],
      n: '這三個指標都在測有機物有多少，但意義不同。\n生化需氧量是在攝氏二十度培養五天，量微生物消耗的溶氧。\n它最貼近真實河川的耗氧衝擊，但要等五天，而且遇到有毒廢水會失真。\n化學需氧量用重鉻酸鉀加熱迴流兩小時。\n快、重現性好，但連難降解的物質也一起氧化，而且會產生六價鉻跟汞的有害廢液。\n總有機碳直接燃燒測二氧化碳，幾分鐘就好，也不產生有害廢液。\n這是綠色分析化學的方向。\n最後這個判準請記住，化學需氧量除以生化需氧量大於三，代表難生物降解。' },
    { t: '優養化：先找限制因子', s: '第一節', b: ['Redfield 比 C:N:P = 106:16:1（莫耳）', '淡水多為磷限制；海水與河口多為氮限制', 'N:P 質量比 > 15–20 → 磷限制；< 5–7 → 氮限制', '陷阱：底泥厭氧釋磷造成內部負荷與生態遲滯'],
      n: '談優養化一定要先找限制因子。\n藻類的元素需求大致符合雷德菲爾德比，碳氮磷是一百零六比十六比一。\n淡水系統通常是磷限制。\n因為固氮藍綠菌可以從空氣補氮，但磷沒有氣態來源。\n海水跟河口則多半是氮限制。\n判準是看水中氮磷質量比。\n大於十五到二十是磷限制，小於五到七是氮限制。\n最後這個陷阱很重要。\n底泥在厭氧的時候會釋出磷，這叫內部負荷。\n所以就算外部負荷已經削減，湖泊還是可能好幾年恢復不了。' },
    { t: '都市污水處理三級流程', s: '第二節', b: ['一級物理：攔污柵、沉砂池、初沉池', '二級生物：曝氣池 + 二沉池（活性污泥法）', '三級高級：除氮除磷、砂濾、活性碳、消毒', '污泥線：濃縮 → 厭氧消化 → 脫水 → 資源化'],
      n: '第二節我們走完整個污水處理流程。\n一級是物理處理，包含攔污柵、沉砂池跟初沉池。\n大概去除五到六成的懸浮固體，兩三成的生化需氧量。\n二級是生物處理，主流是活性污泥法。\n曝氣池讓微生物把溶解性有機物吃掉，二沉池把污泥分離出來再迴流。\n這一段可以去除八成五到九成五的生化需氧量。\n三級是高級處理，做除氮除磷、砂濾、活性碳跟消毒。\n另外還有一條污泥線，濃縮、厭氧消化、脫水，最後資源化。' },
    { t: '活性污泥的核心方程式', s: '第二節', b: ['有機物 + O₂ + N + P → CO₂ + H₂O + 新細胞 C₅H₇NO₂', '關鍵參數：污泥齡 SRT、F/M 比、溶氧', '污泥膨化：絲狀菌過度生長，沉降變差', '厭氧消化產沼氣 → 回收發電，邁向能源自給'],
      n: '活性污泥法的核心就這一條方程式。\n有機物加氧氣，還要有氮跟磷，被微生物轉成二氧化碳、水，還有新的細胞。\n細胞的經驗式我們常寫成碳五氫七氮氧二。\n請注意這件事的意義。\n生物處理不是把有機物消滅，是把它從溶解態變成可沉降的污泥。\n所以污泥怎麼處理才是真正的問題。\n關鍵操作參數是污泥齡跟食微比。\n如果操作不當，絲狀菌會過度生長造成污泥膨化，沉降就變差。\n厭氧消化產生的沼氣可以回收發電，這是污水廠邁向能源自給的關鍵。' },
    { t: '硝化：好氧、慢、耗鹼', s: '第二節', b: ['NH₄⁺ + 1.5O₂ → NO₂⁻ + 2H⁺ + H₂O', 'NO₂⁻ + 0.5O₂ → NO₃⁻', '每 1 g NH₄⁺-N 耗 4.6 g O₂、7.1 g 鹼度 as CaCO₃', '硝化菌生長慢 → 污泥齡須 > 10 天'],
      n: '除氮分兩段，第一段是硝化。\n它是好氧的，而且由自營菌進行。\n第一步把銨氧化成亞硝酸根，同時放出兩個氫離子。\n第二步再氧化成硝酸根。\n請記住這兩個數字，考試很愛出。\n每氧化一克銨態氮，要消耗四點六克氧，還有七點一克以碳酸鈣計的鹼度。\n所以鹼度不夠的時候，酸鹼值會崩掉，硝化就停擺。\n另外硝化菌生長很慢，所以污泥齡必須夠長，通常要超過十天。' },
    { t: '脫硝：缺氧、要碳源、回收鹼度', s: '第二節', b: ['NO₃⁻ + 有機碳 → N₂↑ + CO₂ + OH⁻', '需要碳源：進流污水或外加甲醇', '可回收約一半的鹼度', 'A/O、A²/O：缺氧在前、好氧在後、內回流'],
      n: '第二段是脫硝，條件跟硝化完全相反。\n它需要缺氧環境，而且由異營菌進行，所以要有碳源。\n產物是氮氣，直接跑掉，這是唯一能把氮真正移出系統的方式。\n而且它會產生氫氧根，可以回收大約一半的鹼度。\n因為需要碳源，所以典型的流程設計都是缺氧在前、好氧在後，再把硝化液內回流。\n這樣可以把進流污水裡免費的碳源留給脫硝用。\n如果順序反過來，碳源在好氧池就被吃光了，脫硝還要另外花錢買甲醇。' },
    { t: '生物除磷與化學除磷', s: '第二節', b: ['EBPR：厭氧釋磷、好氧過量攝取，隨剩餘污泥排出', '化學除磷：Al³⁺ 或 Fe³⁺ + PO₄³⁻ → 沉澱', '化學法穩定但增加污泥量與藥劑成本', 'EBPR 不加藥但操作敏感，碳源不足即失敗'],
      n: '除磷有兩條路。\n生物除磷讓聚磷菌經歷厭氧跟好氧交替。\n厭氧階段它吸收揮發性脂肪酸並釋出磷。\n好氧階段它會過量攝取磷，存成多磷酸鹽顆粒。\n最後隨著剩餘污泥排出去。\n優點是不用加藥，污泥還可以資源化。\n缺點是操作很敏感，進流碳源不足就失敗。\n化學除磷用鋁鹽或鐵鹽把磷沉澱下來。\n穩定可靠，但會增加污泥量跟藥劑成本。' },
    { t: '第三條路：把污水當磷礦', s: '第二節', b: ['Mg²⁺ + NH₄⁺ + PO₄³⁻ + 6H₂O → MgNH₄PO₄·6H₂O(s)', '鳥糞石結晶：同時回收氮與磷', '產物可直接作為緩效肥料', '磷是不可再生礦產 → 回收才是根本解'],
      n: '但我想給大家看第三條路，這是綠色化學的思維。\n磷是不可再生的礦產資源，全球高品位磷礦有限。\n所以與其把磷沉澱成污泥丟掉，不如把它回收。\n方法是加鎂鹽，在鹼性條件下結晶出鳥糞石。\n它同時把氮跟磷抓下來，產物可以直接當緩效肥料。\n請看這個轉念。\n污水從處理對象，變成了磷礦。\n東華校內污水廠的污泥上澄液就是現成的評估場域。\n這是我最推薦的期末行動題目方向之一。' },
    { t: '消毒的兩難', s: '第三節', b: ['Cl₂ + H₂O → HOCl + H⁺ + Cl⁻；HOCl 的 pKa ≒ 7.5', '殺菌主力是未解離的 HOCl → pH 愈低愈有效', '副產物：THMs、HAAs；含溴原水更毒', '臭氧強但無殘留、含溴會生成溴酸鹽', '策略：先除前驅物 → 選低副產物法 → 補少量餘氯'],
      n: '第三節先談消毒。\n消毒是水處理中拯救最多生命的一步，但它也帶來新的化學問題。\n加氯之後產生次氯酸，它的酸解離常數負對數大約七點五。\n殺菌主力是未解離的次氯酸，所以酸鹼值愈低效果愈好。\n但次氯酸會跟腐植質反應，生成三鹵甲烷跟鹵乙酸。\n如果原水含溴，會生成毒性更高的溴化物種。\n臭氧氧化力強又沒有臭味，但沒有殘留保護，而且含溴原水會生成溴酸鹽。\n現行策略是先除前驅物，再選低副產物的消毒法，最後補少量餘氯。' },
    { t: '新興污染物：低濃度不等於低風險', s: '第三節', b: ['濃度 ng/L–µg/L，但生物效應明顯', '活性污泥去除率：布洛芬 > 90%、卡馬西平 < 20%', '抗生素的關鍵風險是抗藥性基因的篩選', 'EE2 在 ng/L 等級即造成魚類雌性化'],
      n: '接下來談新興污染物。\n包含藥品與個人保健用品、內分泌干擾物、微塑膠，還有全氟化合物。\n它們的共同特徵是濃度極低，只有奈克到微克每公升。\n但生物效應非常明顯。\n傳統活性污泥對它們的去除率差異很大。\n布洛芬可以去除九成以上，卡馬西平卻常常低於兩成。\n抗生素的關鍵風險不是急毒性，而是篩選出抗藥性基因並傳播出去。\n乙炔雌二醇在奈克每公升的等級，就足以造成魚類雌性化。' },
    { t: '所以最有效的還是源頭', s: '第三節', b: ['末端選項：活性碳、臭氧／AOPs、NF/RO', '每一項都增加能耗與濃排水問題', '源頭：藥品回收制度、限制不必要添加', '可降解設計＝綠色化學第十原則'],
      n: '那新興污染物要怎麼處理？\n末端選項有活性碳吸附、臭氧與高級氧化，還有奈米過濾跟逆滲透。\n但每一項都增加能耗，而且產生濃排水的新問題。\n所以我要再次強調，最有效的還是源頭管理。\n建立藥品回收制度，限制不必要的添加。\n更根本的是可降解設計，把分子設計成使用完之後容易水解。\n這正是綠色化學第十原則的實踐。\n請大家回想第一週講的，源頭設計永遠優於末端處理。' },
    { t: '下週參訪：安全與觀察清單', s: '第三節', b: ['時間：11/9 15:10–17:00，校內集合步行前往', '安全：長褲、包鞋、綁長髮；禁飲食、禁觸摸', '觀察：進流外觀、曝氣池泡沫、二沉界面、污泥去向', '重點：曝氣通常佔全廠用電 50% 以上', 'W12 口頭報告 8 分鐘／組，須附自畫流程圖'],
      n: '最後是下週參訪的行前準備，請大家務必記下來。\n時間是十一月九號下午三點十分到五點，校內集合後統一步行前往。\n安全事項：一定要穿長褲、包鞋，禁止拖鞋涼鞋，長頭髮要綁起來。\n現場禁止飲食、禁止觸摸設備跟液面。\n聞到異味立刻回報，有呼吸道疾病的同學請事先告訴我。\n觀察清單請先寫下你的預測，現場再對照。\n看進流水的外觀氣味、曝氣池的顏色跟泡沫、二沉池的界面高度、還有污泥的去向。\n特別注意能耗，曝氣通常佔全廠用電五成以上。' },
    { t: '本週小結與作業', s: '小結', b: ['分類即策略；COD/BOD 比值決定能不能生物處理', '硝化耗氧耗鹼、脫硝要碳源，順序決定成本', '把污水當磷礦：鳥糞石回收', '作業：參訪預測單；本週線上練習'],
      n: '今天的重點收攏成三句話。\n第一，污染物分類本身就是處理策略，而化學需氧量除以生化需氧量的比值，決定了能不能用生物處理。\n第二，硝化耗氧又耗鹼，脫硝需要碳源，所以缺氧好氧的順序直接決定營運成本。\n第三，請大家練習把污水看成磷礦，而不只是處理對象。\n作業有兩項。\n第一，寫好參訪預測單，下週帶來現場對照。\n第二，完成本週線上練習。\n下週我們現場見，記得長褲包鞋。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '某工業廢水 COD ＝ 1200 mg/L、BOD₅ ＝ 250 mg/L，下列判斷何者<b>最合理</b>？', o: ['可生物降解性良好，直接進活性污泥即可', 'COD/BOD₅ ≒ 4.8，含大量難生物降解物質，宜先做前處理', '數據必然有誤，因為 COD 不可能大於 BOD', '該廢水不含有機物'], a: 1, e: 'COD/BOD₅ ≒ 4.8 遠大於 3，表示大部分有機物難以被微生物利用。直接進生物處理將導致去除率低與污泥中毒，宜先以高級氧化、混凝或水解酸化提升可生化性。' },
    { q: 'TOC 相較於傳統 COD 分析，在綠色化學上的主要優點是？', o: ['靈敏度較低', '不使用重鉻酸鉀與汞鹽，不產生 Cr(VI) 有害廢液，且分析時間短', '可直接得到 BOD 數值', '不需要儀器'], a: 1, e: '傳統 COD 迴流法使用重鉻酸鉀（Cr(VI)）、濃硫酸與硫酸汞，產生有害廢液。TOC 以燃燒法直接測 CO₂，數分鐘完成且無此類廢液，符合綠色分析化學原則。' },
    { q: '淡水湖泊多屬「磷限制」的主要原因是？', o: ['磷的毒性較高', '氮可由固氮藍綠菌自大氣補充，而磷沒有氣態來源', '磷在水中溶解度極高', '藻類不需要氮'], a: 1, e: '固氮藍綠菌能將 N₂ 轉為可利用態，使氮相對不虞匱乏；磷在自然界無顯著氣態循環，只能由岩石風化與外部輸入供應，因而常成為淡水系統的限制因子。' },
    { q: '硝化作用中每氧化 1 g NH₄⁺-N，約需消耗多少氧與鹼度？', o: ['1.0 g O₂、1.0 g CaCO₃', '4.6 g O₂、7.1 g CaCO₃', '7.1 g O₂、4.6 g CaCO₃', '0.5 g O₂、2.0 g CaCO₃'], a: 1, e: '完全硝化 NH₄⁺ → NO₃⁻ 需 2 mol O₂/mol N（＝4.57 g O₂/g N），並產生 2 mol H⁺/mol N，消耗鹼度約 7.14 g as CaCO₃/g N。鹼度不足將導致 pH 下降而抑制硝化菌。' },
    { q: '典型 A/O（缺氧—好氧）流程將缺氧池置於好氧池<b>之前</b>的主要理由是？', o: ['缺氧池溫度較低', '可利用進流污水中的有機碳作為脫硝碳源，節省外加甲醇', '缺氧池可去除懸浮固體', '好氧池必須先產生污泥'], a: 1, e: '脫硝為異營反應需碳源。若好氧在前，進流碳源已被氧化耗盡，脫硝必須外購甲醇。缺氧在前並將硝化液內回流，可直接使用免費碳源並回收約一半鹼度。' },
    { q: '生物除磷（EBPR）的關鍵操作條件為？', o: ['全程維持高溶氧', '厭氧與好氧交替，使聚磷菌在好氧段過量攝取磷', '加入鋁鹽沉澱磷', '維持極短的污泥齡'], a: 1, e: 'PAOs 在厭氧段吸收 VFA 並釋磷，於好氧段過量攝取磷形成多磷酸鹽顆粒，最後隨剩餘污泥排出。若進流碳源（VFA）不足或厭氧段被溶氧污染，EBPR 即失效。' },
    { q: '鳥糞石（struvite）結晶回收磷的化學式與價值為？', o: ['CaHPO₄，可作水泥原料', 'MgNH₄PO₄·6H₂O，同時回收氮磷並可作緩效肥料', 'FePO₄，可作顏料', 'AlPO₄，可作觸媒'], a: 1, e: 'Mg²⁺ + NH₄⁺ + PO₄³⁻ + 6H₂O → MgNH₄PO₄·6H₂O(s)。此法同時移除並回收氮與磷，產物是低溶解度的緩效肥料，把污水從處理對象轉為磷資源來源。' },
    { q: '加氯消毒時，pH 較低有利於殺菌的原因是？', o: ['低 pH 直接殺死細菌', 'HOCl 的 pKa ≒ 7.5，pH 低時未解離的 HOCl 比例高，其殺菌力遠強於 OCl⁻', '低 pH 使氯氣溶解度上升', '低 pH 可避免生成 THMs'], a: 1, e: 'HOCl 為電中性、易穿透細胞膜，殺菌效力約為 OCl⁻ 的數十倍。pH 低於 pKa（≒7.5）時 HOCl 佔優勢，故消毒效率較高。但低 pH 對管網腐蝕的影響須一併考量。' },
    { q: '關於消毒副產物，下列敘述何者<b>正確</b>？', o: ['臭氧完全不產生任何副產物', '含溴原水以臭氧消毒時可能生成溴酸鹽（BrO₃⁻）', '紫外線消毒會生成大量三鹵甲烷', '加氯不會產生鹵乙酸'], a: 1, e: '臭氧雖不生成 THMs，但會將 Br⁻ 氧化為 BrO₃⁻（可能致癌物）。UV 為物理性破壞核酸、不生成化學副產物但無殘留；加氯則生成 THMs 與 HAAs。' },
    { q: '面對抗生素等新興污染物，下列何者最符合綠色化學的<b>根本</b>對策？', o: ['所有污水廠加裝逆滲透', '提高放流水標準即可', '源頭管理：藥品回收制度與「使用後易降解」的分子設計', '將放流口延伸至外海稀釋'], a: 2, e: '末端處理（活性碳、AOPs、NF/RO）皆增加能耗與濃排水；稀釋不減少總量。綠色化學第十原則主張設計使用後可降解的產品，配合源頭回收制度，才是根本解。' }
  ],

  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 7 章（中譯本第 7 章）；Exam 1 範圍請一併複習第 1、2、3、6、16 章',
  goals: [
    '能在現場指認污水廠各處理單元並說出其功能與關鍵反應。',

  cards: [
    { h: '現場怎麼看：五個必看點', b: '① <b>格柵與沉砂池</b>：攔下的物質告訴你上游的行為（濕紙巾、棉棒、油脂）。沉砂池去除的是比重大的無機砂礫，保護後續泵浦與管線。<br>② <b>初沉池</b>：看表面浮渣與出水濁度，估算 SS 去除率。<br>③ <b>曝氣池</b>：顏色（健康為黃褐色）、泡沫（白色厚泡＝污泥齡太短或界面活性劑；褐色黏泡＝污泥齡太長）、溶氧計讀值（一般維持 1.5–2.5 mg/L）。<br>④ <b>二沉池</b>：污泥界面高度、上澄液清澈度、有無污泥上浮（可能是脫硝產生的 N<sub>2</sub> 氣泡把污泥頂起來）。<br>⑤ <b>污泥線與放流口</b>：污泥去哪裡？有無厭氧消化與沼氣利用？放流水的餘氯與放流去處。' },
    { h: '兩個現場可做的估算', b: '<b>① 水力停留時間（HRT）</b><div class="eq">HRT ＝ V（池容 m³）÷ Q（流量 m³/day）</div>例如曝氣池 800 m³、日處理量 2400 m³/day，HRT ＝ 0.33 day ≒ 8 小時，屬合理範圍（一般 4–8 小時；需硝化時常拉長至 10–16 小時）。<br><b>② 曝氣理論需氧量</b><div class="eq">AOR ≒ Q × [(BOD<sub>in</sub> − BOD<sub>out</sub>) × 1.0 + (NH<sub>4</sub>-N<sub>去除</sub>) × 4.6] ÷ 1000　(kg O<sub>2</sub>/day)</div>算出來再除以曝氣機的氧轉移效率（實務常 1–2 kg O<sub>2</sub>/kWh），就能粗估用電量。<br><b>這兩個數字讓你在現場能問出有水準的問題</b>，例如「請問貴廠的污泥齡多少？硝化穩定嗎？」' },
    { h: '為什麼曝氣這麼耗電', b: '氧氣在水中的溶解度低（20 °C 約 9 mg/L），而微生物需要的量卻很大，因此必須<b>持續、大量地把空氣打入水中</b>。氧氣從氣泡傳到水中的速率受限於雙膜理論：<div class="eq">N ＝ K<sub>L</sub>a · (C<sub>s</sub> − C)</div>要提高傳氧就得提高 K<sub>L</sub>a（更細的氣泡、更強的攪拌）或提高 C<sub>s</sub>（純氧、加壓），兩者都要能量。<br>結果是：<b>曝氣通常佔污水廠總用電的 50–60%</b>。所以任何節能討論都應從曝氣控制（溶氧回饋、變頻風機、細氣泡擴散盤）著手，而不是先換照明。<br>從綠色化學看，更根本的思路是<b>減少進流有機負荷</b>（源頭分流、廚餘不入下水道）與<b>改用厭氧處理回收能源</b>（高濃度廢水尤其適合）。', local: '花蓮連結：東華校園的生活污水濃度偏低、水量隨學期起伏大，正是討論「變動負荷下如何節能」的好案例。' },
    { h: '污泥不是廢棄物，是資源', b: '污水處理的本質是把污染物從水相轉移到污泥相，因此<b>污泥處理才是真正的終點</b>。<br>厭氧消化的三階段：水解 → 酸化（產生 VFA）→ 產甲烷。<div class="eq">CH<sub>3</sub>COOH <span class="fx">→</span> CH<sub>4</sub> + CO<sub>2</sub>　（乙酸發酵路徑）<br>CO<sub>2</sub> + 4H<sub>2</sub> <span class="fx">→</span> CH<sub>4</sub> + 2H<sub>2</sub>O　（氫營養路徑）</div>沼氣約含 60–70% CH<sub>4</sub>，熱值約 21–25 MJ/m³，可發電或供熱。<br>消化後的污泥（消化污泥）經脫水可作為堆肥或土壤改良材，但須注意重金屬、藥物殘留與病原的限值。<br><b>觀念轉換</b>：一座設計良好的污水廠，可以從耗能設施變成產能設施——這正是工業生態學在市政基礎設施上的實踐。' },
    { h: 'Exam 1 複習地圖（範圍與權重）', b: '<b>範圍</b>：Ch1（環境化學與圈層）、Ch2（水化學：碳酸系統、鹼度、硬度、錯合）、Ch3（氧化還原、pE–pH）、Ch6（水污染物）、Ch7（水處理）、Ch16（綠色化學）、普化與有機複習、以及本次參訪。<br><b>建議權重</b>：水化學計算（碳酸系統、鹼度、硬度、條件穩定常數、pE）約 35%；水污染與水處理（BOD/COD、硝化脫硝、除磷、消毒）約 30%；綠色化學與人類圈（原子經濟性、十二原則、LCA、能源指標）約 20%；參訪與綜合應用約 15%。<br><b>題型</b>：單選、簡答、計算、以及一題「情境分析」（給一份水質數據，請判讀並提出處理建議）。' },
    { h: '必背清單（考前一小時看這張）', b: '<b>常數</b>：K<sub>w</sub> ＝ 10<sup>−14</sup>；碳酸 pK<sub>a1</sub> ＝ 6.35、pK<sub>a2</sub> ＝ 10.33；HOCl pK<sub>a</sub> ≒ 7.5；25 °C 飽和 DO ≒ 8.3 mg/L；pE ＝ E<sub>h</sub>/0.0591。<br><b>換算</b>：硬度 ＝ 2.5[Ca] + 4.1[Mg]（mg/L as CaCO<sub>3</sub>）；1 meq/L ＝ 50 mg/L as CaCO<sub>3</sub>；空氣 µg/m³ ＝ ppm×M×1000/24.45。<br><b>係數</b>：硝化 4.6 g O<sub>2</sub>/g N、7.1 g 鹼度/g N；Redfield C:N:P ＝ 106:16:1。<br><b>水的穩定線</b>：上界 pE ＝ 20.75 − pH；下界 pE ＝ −pH。<br><b>判準</b>：COD/BOD &gt; 3 難生物降解；log K<sub>ow</sub> &gt; 5 高生物累積。' },
    { h: '最常見的五個失分點', b: '① <b>單位沒統一</b>：mg/L 與 mol/L 混用，或忘記「以 N 計」。<br>② <b>鹼度與 pH 混淆</b>：被問「加酸後 pH 變化」卻只看初始 pH。<br>③ <b>半反應沒平衡電荷</b>：只平衡原子就交卷。<br>④ <b>pE–pH 圖忘了先畫水的穩定區</b>，答出水中不可能存在的物種。<br>⑤ <b>只寫結論不寫論證</b>：計算題請務必寫出公式與代入過程，本課程<b>過程分佔多數</b>。<br>另外提醒：情境分析題沒有唯一答案，評分看的是「數據引用是否正確、化學推論是否成立、建議是否可執行」。' },
    { h: '參訪報告要求（W12 口頭報告）', b: '<b>形式</b>：每組 8 分鐘＋2 分鐘問答，投影片不超過 10 張。<br><b>必備內容</b>：<br>① 一張<b>自己畫</b>的流程圖（不得直接使用廠方簡報圖），標出各單元與主要反應。<br>② 一項現場觀察與你的化學解釋（例如泡沫型態 → 污泥齡推論）。<br>③ 一個估算（HRT 或需氧量或能耗），寫出假設與來源。<br>④ 一項「若我是廠長會先改什麼」的建議，附化學論證與粗略成本／效益方向。<br>⑤ 資料來源與 AI 使用聲明。<br><b>評分</b>：化學正確性 40%、觀察深度 25%、可執行性 20%、表達 15%。' }
  ],
  slides: [
    { t: '環境化學　第 10 週', s: '封面', cover: true, b: ['參訪 I：NDHU 污水廠', 'Exam 1 複習', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n今天是走出教室的一週。\n下午三點十分我們到污水廠現場。\n在出發之前，這一節我先把現場要看什麼講清楚。\n然後我們做兩個現場可以用的估算。\n最後半節課做期中考的複習地圖。\n請大家確認自己穿的是長褲跟包鞋。\n沒有的同學請先告訴我，我會另外安排。' },
    { t: '現場五個必看點', s: '第一節', b: ['① 格柵與沉砂池：攔下的東西反映上游行為', '② 初沉池：浮渣與出水濁度', '③ 曝氣池：顏色、泡沫、溶氧讀值', '④ 二沉池：污泥界面、上澄液、有無污泥上浮', '⑤ 污泥線與放流口：污泥去哪、有無沼氣'],
      n: '現場人多、聲音大，所以請先把這五個必看點記起來。\n第一是格柵跟沉砂池。\n攔下來的東西會告訴你上游的行為，濕紙巾、棉棒、油脂。\n第二是初沉池，看表面浮渣跟出水濁度。\n第三是曝氣池，這是全廠的心臟。\n看顏色、看泡沫、看溶氧計讀值。\n第四是二沉池，看污泥界面高度跟上澄液清不清澈。\n第五是污泥線跟放流口，問清楚污泥去哪裡、有沒有沼氣利用。' },
    { t: '從泡沫讀出污泥齡', s: '第一節', b: ['健康曝氣池：黃褐色、泡沫少而易破', '白色厚泡：污泥齡太短或界面活性劑', '褐色黏稠泡：污泥齡太長、可能有 Nocardia', '溶氧一般維持 1.5–2.5 mg/L'],
      n: '這一頁是很實用的現場技能。\n健康的曝氣池是黃褐色的，泡沫少而且容易破。\n如果看到白色的厚泡沫，通常代表污泥齡太短。\n微生物還沒長好，或是進流有大量界面活性劑。\n如果看到褐色黏稠、像慕斯一樣的泡沫，通常是污泥齡太長。\n可能有放線菌類的絲狀菌。\n溶氧一般維持在一點五到二點五毫克每公升。\n太低硝化會停，太高浪費電。\n所以我們光看泡沫顏色，就能對操作狀態做初步判斷。' },
    { t: '估算一：水力停留時間', s: '第一節', b: ['HRT = 池容 V ÷ 日流量 Q', '例：800 m³ ÷ 2400 m³/day = 0.33 day ≒ 8 小時', '一般曝氣池 4–8 小時', '需硝化時常拉長到 10–16 小時'],
      n: '第一個現場可做的估算是水力停留時間。\n就是池子的容積除以每天的流量。\n舉個例子，曝氣池八百立方公尺，日處理量兩千四百立方公尺。\n算出來是零點三三天，也就是大約八小時。\n這在一般範圍內。\n如果這座廠要做硝化，八小時可能不太夠。\n因為硝化菌長得慢，通常要拉長到十到十六小時。\n所以現場問到停留時間，你就能判斷這座廠有沒有在做硝化。' },
    { t: '估算二：理論需氧量與電費', s: '第一節', b: ['AOR ≒ Q × [ΔBOD × 1.0 + ΔNH₄-N × 4.6] ÷ 1000 (kg O₂/day)', '再除以氧轉移效率（實務 1–2 kg O₂/kWh）', '得到粗估用電量', '有了數字，才問得出有水準的問題'],
      n: '第二個估算是理論需氧量。\n把流量乘上生化需氧量的削減量，再加上氨氮削減量乘以四點六。\n這個四點六就是上週講的硝化耗氧係數。\n算出來是每天需要幾公斤的氧。\n再除以曝氣機的氧轉移效率，實務上大概是每度電一到兩公斤氧。\n就能粗估用電量。\n我要強調，做這兩個估算的目的不是要你算得多準。\n而是讓你在現場能問出有水準的問題。\n例如請問貴廠的污泥齡多少，硝化穩定嗎。' },
    { t: '為什麼曝氣佔全廠一半以上的電', s: '第二節', b: ['氧在水中溶解度低（20 °C 約 9 mg/L）', '雙膜理論：N = K_L a · (C_s − C)', '提高 K_L a 或 C_s 都要能量', '節能應從曝氣控制著手，不是先換照明'],
      n: '第二節解釋一個關鍵事實。\n為什麼曝氣佔污水廠總用電的五到六成。\n原因是氧氣在水中的溶解度很低，攝氏二十度大約只有九毫克每公升。\n可是微生物需要的量卻很大。\n所以必須持續、大量地把空氣打進水裡。\n氧氣從氣泡傳到水中的速率受雙膜理論限制。\n要提高傳氧，就得把氣泡打得更細、攪拌更強，或是用純氧加壓。\n這兩條路都要花能量。\n所以節能討論應該從曝氣控制著手，不是先去換照明。' },
    { t: '更根本的兩條路', s: '第二節', b: ['減少進流有機負荷：源頭分流、廚餘不入下水道', '高濃度廢水改用厭氧處理，回收能源而非消耗能源', '厭氧不需曝氣，還產沼氣', '這就是綠色化學的源頭思維'],

    { q: '【模擬題】平衡下列酸性條件半反應：Cr₂O₇²⁻ → Cr³⁺，所需的電子數為？', o: ['3', '6', '12', '2'], a: 1, e: 'Cr 由 +6 降至 +3，每個 Cr 需 3 個電子，重鉻酸根含 2 個 Cr，故需 6 個電子：Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O。' },
    { q: '【模擬題】情境題：某校園池塘夏季午後 pH 達 9.3、清晨 6.9，DO 午後 14 mg/L、清晨 2 mg/L，TP ＝ 0.15 mg/L、TN ＝ 0.9 mg/L。最合理的判讀為？', o: ['水體遭受工業酸性廢水污染', '優養化：藻類日間光合作用強烈，N:P 質量比約 6 顯示可能為氮限制或氮磷共同限制', '水體處於貧養狀態', 'DO 過飽和代表水質優良，無需處理'], a: 1, e: 'pH 與 DO 的大幅日夜擺盪是藻類旺盛的典型指標（午後 DO 過飽和、清晨接近缺氧）。N:P ＝ 0.9/0.15 ＝ 6，低於 15–20，顯示氮相對不足。管理上須同時檢視外部負荷與底泥內部負荷。' },
    { q: '【模擬題】下列何者<b>最能</b>體現「綠色化學優於末端管制」的思維？', o: ['提高煙囪高度以稀釋污染物', '將計量氧化劑改為觸媒／O₂ 系統，使副產物僅為水', '在放流口增設沉澱池', '延長曝氣時間以提高去除率'], a: 1, e: '(A)(C)(D) 都是在污染已產生後的處理或稀釋。將計量試劑改為觸媒路徑，直接改變廢棄物的組成與數量，屬於源頭設計，是綠色化學的核心策略。' },
    { q: '【模擬題】某消毒方案比較：原水 TOC 偏高且含 Br⁻。下列策略何者<b>最合理</b>？', o: ['直接大量加氯以確保滅菌', '先以混凝／活性碳去除 NOM 前驅物，再以低劑量氯或 UV 消毒，並監測溴酸鹽', '改用高劑量臭氧即可完全避免副產物', '不消毒以避免副產物'], a: 1, e: '高 TOC 加氯易生成 THMs／HAAs，含 Br⁻ 又使臭氧生成溴酸鹽。合理策略是先移除前驅物（源頭），再選擇低副產物消毒法並保留少量餘氯維持配水安全。' }
  ]
};

CONTENT[12] = {
  type: 'teach',
  title: '大氣圈—大氣化學 I：大氣結構、光化學、粒狀物｜參訪口頭報告｜期末行動討論 III',
  chapters: '11E Ch8 大氣與大氣化學（中譯 Ch8）、Ch9 大氣中的粒狀物（中譯 Ch9）',
  reading: '延伸閱讀：Manahan《Environmental Chemistry》11E 第 8、9 章（中譯本第 8、9 章）',
  goals: [
    '能說明大氣分層的溫度剖面成因，並解釋逆溫如何造成污染累積。',
    '能寫出對流層中氫氧自由基的生成路徑，並說明其「大氣清潔劑」角色。',
    '能區分平流層與對流層臭氧的生成機制與環境意義。',
    '能依粒徑分類氣膠、說明其生成機制與健康效應。',
    '能比較各種粒狀物控制設備的原理與適用粒徑。'
  ],
  cards: [
    { h: '大氣為什麼分層', b: '大氣分層的依據是<b>溫度隨高度的變化方向</b>，而變化方向由「誰在吸收輻射」決定：<br>• <b>對流層</b>（0–約 12 km）：熱源在地面，故溫度隨高度下降（環境遞減率約 6.5 °C/km）。上冷下熱 → 不穩定 → 對流旺盛 → 天氣現象都在這裡。<br>• <b>平流層</b>（約 12–50 km）：臭氧吸收紫外線放熱，故溫度隨高度上升。上熱下冷 → 極穩定 → 進入平流層的物質（如火山灰、CFCs）滯留可達數年。<br>• <b>中氣層</b>（50–85 km）：無吸收體，溫度再度下降，是大氣最冷處。<br>• <b>增溫層</b>（&gt;85 km）：O<sub>2</sub>、N<sub>2</sub> 吸收極短波輻射並游離，溫度極高但氣體極稀薄。<br><b>關鍵觀念</b>：溫度剖面決定垂直混合能力，因此也決定了污染物能不能擴散出去。' },
    { h: '逆溫：污染事件的共同背景', b: '正常狀況下暖空氣在下、冷空氣在上，垂直對流可稀釋污染。<b>逆溫（inversion）</b>則相反——上暖下冷，形成一個「蓋子」。三種常見型態：<br>① <b>輻射逆溫</b>：晴朗無風的夜晚地面快速輻射冷卻，清晨最強。這是台灣冬季清晨 PM<sub>2.5</sub> 常飆高的主因。<br>② <b>沉降逆溫</b>：高壓系統下沉增溫，範圍大且持續數日。<br>③ <b>地形逆溫</b>：冷空氣沉積於盆地或谷地。<br>逆溫層高度就是<b>混合層高度</b>，污染物濃度大致與混合層高度成反比：混合層由 1000 m 降到 200 m，同樣排放量會使濃度上升約五倍。<b>所以「空品不良」往往不是排放突然增加，而是大氣不幫忙了。</b>', local: '花蓮連結：花蓮位於縱谷北端，東有海風、西有中央山脈，夜間常有明顯的地形與輻射逆溫，是討論混合層高度的良好案例。' },
    { h: '氫氧自由基：大氣的清潔劑', b: '對流層幾乎所有污染物的去除，都始於與 <span class="fx">•</span>OH 反應。它的生成路徑是：<div class="eq">O<sub>3</sub> + h<span class="fx">ν</span>（<span class="fx">λ</span> &lt; 320 nm）<span class="fx">→</span> O(<sup>1</sup>D) + O<sub>2</sub><br>O(<sup>1</sup>D) + H<sub>2</sub>O <span class="fx">→</span> 2 <span class="fx">•</span>OH</div>白天 <span class="fx">•</span>OH 濃度僅約 10<sup>6</sup> molecules/cm³（相當於 ppq 等級），但因反應極快，它決定了甲烷、CO、VOCs 的大氣壽命。<br>例如：CH<sub>4</sub> 的壽命約 9–12 年、CO 約 2 個月、多數 VOCs 只有數小時到數天。<b>某物質的大氣壽命，基本上就是「它躲得過 <span class="fx">•</span>OH 多久」</b>。<br>反過來說，CFCs 因為沒有 C–H 鍵可被 <span class="fx">•</span>OH 攫取，得以在對流層存活數十年並輸送到平流層——這正是它們破壞臭氧層的前提。' },
    { h: '好臭氧與壞臭氧', b: '同一個 O<sub>3</sub> 分子，在不同高度扮演完全相反的角色。<br><b>平流層（好）</b>：Chapman 機制<div class="eq">O<sub>2</sub> + h<span class="fx">ν</span>（<span class="fx">λ</span> &lt; 242 nm）<span class="fx">→</span> 2 O<br>O + O<sub>2</sub> + M <span class="fx">→</span> O<sub>3</sub> + M<br>O<sub>3</sub> + h<span class="fx">ν</span> <span class="fx">→</span> O<sub>2</sub> + O</div>形成吸收 UV-B 的保護層。CFCs 釋出的 Cl 原子以<b>觸媒循環</b>破壞它：<div class="eq">Cl + O<sub>3</sub> <span class="fx">→</span> ClO + O<sub>2</sub>；ClO + O <span class="fx">→</span> Cl + O<sub>2</sub></div>一個 Cl 原子可破壞上萬個 O<sub>3</sub>，且極區冰晶雲表面的非均相反應會大量釋出活性氯，這就是<b>南極臭氧洞</b>的成因。<br><span class="mini">⚠ 進階：極區低溫缺乏氧原子，主導機制其實是 ClO 二聚體循環（2ClO → Cl<sub>2</sub>O<sub>2</sub> →光解→ 2Cl + O<sub>2</sub>），與中緯度的單原子氧路徑不同。</span><br><b>對流層（壞）</b>：由 NO<sub>x</sub> 與 VOCs 在陽光下生成的二次污染物，傷害呼吸道與農作物。<b>兩者的化學完全不同，不能混為一談。</b>' },
    { h: '光化學煙霧的鏈鎖反應', b: '對流層臭氧的生成核心是 NO<sub>2</sub> 光解：<div class="eq">NO<sub>2</sub> + h<span class="fx">ν</span> <span class="fx">→</span> NO + O；O + O<sub>2</sub> + M <span class="fx">→</span> O<sub>3</sub> + M<br>O<sub>3</sub> + NO <span class="fx">→</span> NO<sub>2</sub> + O<sub>2</sub>（回收，淨零）</div>單靠 NO<sub>x</sub> 只會達成光穩態、不會累積臭氧。<b>關鍵在 VOCs</b>：VOCs 被 <span class="fx">•</span>OH 攫取後生成過氧自由基 RO<sub>2</sub><span class="fx">•</span>，它把 NO 氧化成 NO<sub>2</sub> 而<u>不消耗 O<sub>3</sub></u>：<div class="eq">RO<sub>2</sub><span class="fx">•</span> + NO <span class="fx">→</span> RO<span class="fx">•</span> + NO<sub>2</sub></div>於是 O<sub>3</sub> 得以累積。副產物 PAN（過氧乙醯硝酸酯）是強眼刺激物，且能在低溫下長程傳輸 NO<sub>x</sub>。<br><b>管制上的陷阱</b>：在 VOC 限制區削減 NO<sub>x</sub> 反而可能使 O<sub>3</sub> 上升（因為少了 NO 滴定）。因此都會區的臭氧管制必須先做<b>敏感度判斷</b>，這是很反直覺但非常重要的一課。' },
    { h: '氣膠的粒徑分布', b: '大氣粒狀物依生成機制形成三個明顯的模態：<br>• <b>核模態（&lt; 0.1 µm）</b>：氣體成核（如 H<sub>2</sub>SO<sub>4</sub> 蒸氣）新生成的粒子，數量最多但質量極小，靠布朗運動快速凝聚。<br>• <b>累積模態（0.1–2.5 µm）</b>：由核模態凝聚與蒸氣凝結而成。<b>這一區既不易沉降也不易被攔截，大氣壽命最長（數天到數週），可長程傳輸，且最能深入肺泡</b>——PM<sub>2.5</sub> 的主體。<br>• <b>粗模態（&gt; 2.5 µm）</b>：機械破碎產生（揚塵、海鹽、花粉），靠重力沉降快速移除。<br>健康效應的關鍵是<b>沉積部位</b>：PM<sub>10</sub> 多沉積於上呼吸道，PM<sub>2.5</sub> 可達肺泡，超細顆粒（&lt; 0.1 µm）甚至可能穿越肺泡進入血液循環。' },
    { h: '二次氣膠：看不見的排放', b: 'PM<sub>2.5</sub> 中往往超過一半不是「排出來的」，而是在大氣中<b>生成</b>的：<br>• <b>硫酸鹽</b>：SO<sub>2</sub> 經 <span class="fx">•</span>OH 氧化或在雲滴中被 H<sub>2</sub>O<sub>2</sub>／O<sub>3</sub> 氧化 → H<sub>2</sub>SO<sub>4</sub> → (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>。<br>• <b>硝酸鹽</b>：NO<sub>2</sub> + <span class="fx">•</span>OH → HNO<sub>3</sub> → NH<sub>4</sub>NO<sub>3</sub>（受溫濕度影響大，冬季比例高）。<br>• <b>二次有機氣膠（SOA）</b>：VOCs（含植物釋放的萜烯）氧化後生成低揮發性產物而凝結。<br>這解釋了兩個常見困惑：① 為什麼上風處沒有明顯煙囪，下風處卻有高 PM<sub>2.5</sub>；② 為什麼<b>削減 NH<sub>3</sub>（農業源）也能有效降低 PM<sub>2.5</sub></b>——因為銨是硫酸鹽與硝酸鹽成鹽的必要夥伴。' },
    { h: '粒狀物控制設備怎麼選', b: '選型的第一原則是<b>看粒徑</b>：<br>• <b>重力沉降室</b>：&gt; 50 µm，只做預處理。<br>• <b>旋風集塵器</b>：5–50 µm，靠離心力，構造簡單、耐高溫，但對 PM<sub>2.5</sub> 幾乎無效。<br>• <b>濕式洗滌塔</b>：可同時去除氣態污染物（如 SO<sub>2</sub>），但產生廢水，且能耗隨壓損上升。<br>• <b>靜電集塵器（ESP）</b>：對次微米粒子效率高（&gt; 99%），壓損低；但效率受粉塵電阻率影響大，且對高比電阻粉塵會發生反電暈。<br>• <b>袋式集塵器</b>：對細粒效率最高且穩定，但濾袋耐溫、耐濕與壓損維護是關鍵。<br><b>綠色化學視角</b>：所有末端設備都只是把污染物從氣相移到固相或水相，真正的解答仍在燃料替換、製程改善與能源效率。' },
    { h: '參訪口頭報告與期末行動討論 III', b: '<b>本週第三節</b>安排兩件事：<br>① <b>NDHU 污水廠參訪口頭報告</b>：每組 8 分鐘＋2 分鐘問答。請依 W10 公告的五項必備內容進行，特別注意「自畫流程圖」與「化學論證」。聽報告的同學須完成同儕回饋單（每組至少一則具體提問或建議）。<br>② <b>期末行動討論 III（期中檢核）</b>：各組須報告目前進度，並回答三個問題：<br>　• 你們的<b>現況數值</b>拿到了嗎？如果沒有，替代方案是什麼？<br>　• 方法有沒有做過一次<b>試跑</b>？結果與預期差多少？<br>　• 距離 W18 發表還有五週，<b>最大的風險</b>是什麼？<br>檢核後可調整題目範圍，但須在本週內提出修正版計畫書摘要（一頁）。' }
  ],

      n: '老師好，各位同學好。\n期中考結束，我們從水裡浮上來，進入大氣。\n今天第一節談大氣結構跟逆溫，這是所有空污問題的物理背景。\n第二節談光化學，包含氫氧自由基、臭氧，還有光化學煙霧。\n第三節談粒狀物，然後進行參訪口頭報告跟期末行動的期中檢核。\n大氣化學的反應式比較多，但邏輯很清楚，請跟著我走。' },
    { t: '大氣分層看誰在吸收輻射', s: '第一節', b: ['對流層：熱源在地面 → 上冷下熱 → 不穩定', '平流層：臭氧吸 UV 放熱 → 上熱下冷 → 極穩定', '中氣層：無吸收體，大氣最冷處', '增溫層：極短波游離，溫度高但極稀薄'],
      n: '大氣分層的依據是溫度隨高度的變化方向。\n而變化方向由誰在吸收輻射決定。\n對流層的熱源在地面，所以愈高愈冷。\n上冷下熱是不穩定的，所以對流旺盛，天氣現象都在這一層。\n平流層不一樣，臭氧吸收紫外線放熱，所以愈高愈熱。\n上熱下冷極度穩定，進去的東西可以待好幾年。\n中氣層沒有吸收體，溫度又降下來，是大氣最冷的地方。\n再上去的增溫層，氣體被游離，溫度很高但極稀薄。' },
    { t: '逆溫：污染事件的共同背景', s: '第一節', b: ['正常：暖在下、冷在上 → 可對流稀釋', '逆溫：上暖下冷 → 形成蓋子', '輻射逆溫（清晨最強）、沉降逆溫、地形逆溫', '濃度大致與混合層高度成反比'],
      n: '這一頁是空污最重要的物理背景。\n正常情況是暖空氣在下、冷空氣在上，可以對流稀釋污染。\n逆溫剛好相反，上暖下冷，形成一個蓋子。\n常見有三種。\n輻射逆溫發生在晴朗無風的夜晚，清晨最強。\n這是台灣冬季清晨細懸浮微粒常常飆高的主因。\n沉降逆溫來自高壓系統下沉增溫，範圍大又持續好幾天。\n地形逆溫則是冷空氣沉積在盆地或谷地。\n請記住，濃度大致跟混合層高度成反比。' },
    { t: '所以空品不良未必是排放增加', s: '第一節', b: ['混合層由 1000 m 降到 200 m', '同樣排放量，濃度上升約五倍', '排放沒變，是大氣不幫忙了', '這也是為何空品預報要看氣象'],
      n: '接續上一頁，我做一個簡單的算術。\n假設混合層高度從一千公尺降到兩百公尺。\n排放量完全沒有改變。\n但可以稀釋的體積只剩五分之一。\n所以濃度會上升大約五倍。\n這告訴我們一件很重要的事。\n空品不良往往不是排放突然增加，而是大氣不幫忙了。\n這也是為什麼空品預報必須先看氣象。\n當然，長期而言還是要削減排放，因為我們控制不了天氣。' },
    { t: '氫氧自由基：大氣的清潔劑', s: '第二節', b: ['O₃ + hν（λ < 320 nm）→ O(¹D) + O₂', 'O(¹D) + H₂O → 2 •OH', '白天濃度僅約 10⁶ molecules/cm³', '它決定了 CH₄、CO、VOCs 的大氣壽命'],
      n: '第二節進入光化學。\n對流層幾乎所有污染物的去除，都從跟氫氧自由基反應開始。\n它的生成路徑是這樣。\n臭氧吸收短波紫外線，光解產生激發態氧原子。\n激發態氧原子跟水反應，生成兩個氫氧自由基。\n它的濃度非常低，白天大約每立方公分十的六次方個分子。\n換算大約是十的負十二次方等級。\n但因為反應極快，它決定了甲烷、一氧化碳跟揮發性有機物的大氣壽命。' },
    { t: '大氣壽命就是躲得過 •OH 多久', s: '第二節', b: ['CH₄ 約 9–12 年；CO 約 2 個月；多數 VOCs 數小時到數天', 'CFCs 沒有 C–H 鍵可被攫取 → 存活數十年', '因此得以輸送到平流層', '這正是它們破壞臭氧層的前提'],
      n: '這一頁我要給大家一個很好用的直覺。\n某個物質的大氣壽命，基本上就是它躲得過氫氧自由基多久。\n甲烷有碳氫鍵可以被攫取，壽命大約九到十二年。\n一氧化碳大約兩個月。\n多數揮發性有機物只有數小時到數天。\n可是氟氯碳化物完全沒有碳氫鍵可以被攫取。\n所以它在對流層可以存活數十年。\n正因為這樣，它才有機會被輸送到平流層去。\n這就是它們破壞臭氧層的前提。' },
    { t: '好臭氧：平流層的 Chapman 機制', s: '第二節', b: ['O₂ + hν（λ < 242 nm）→ 2O', 'O + O₂ + M → O₃ + M', 'O₃ + hν → O₂ + O', '形成吸收 UV-B 的保護層'],
      n: '接下來談臭氧，這是本週最容易混淆的地方。\n同一個臭氧分子，在不同高度扮演完全相反的角色。\n先看平流層的好臭氧。\n氧分子吸收波長小於兩百四十二奈米的紫外線，光解成兩個氧原子。\n氧原子跟氧分子結合，需要第三體帶走能量，生成臭氧。\n臭氧本身又會吸收紫外線光解回去。\n這一組動態平衡叫查普曼機制。\n重點是這個循環持續吸收紫外線 B 波段，形成保護層。' },
    { t: '氯的觸媒循環與臭氧洞', s: '第二節', b: ['Cl + O₃ → ClO + O₂', 'ClO + O → Cl + O₂', '淨反應：O₃ + O → 2O₂，Cl 未被消耗', '一個 Cl 可破壞上萬個 O₃', '極區冰晶雲表面非均相反應釋出大量活性氯'],
      n: '這一頁解釋臭氧洞。\n氟氯碳化物在平流層被短波紫外線打斷，釋出氯原子。\n氯原子跟臭氧反應生成一氧化氯跟氧氣。\n一氧化氯再跟氧原子反應，把氯原子放回來。\n請注意淨反應，氯完全沒有被消耗。\n所以它是觸媒。\n一個氯原子可以破壞上萬個臭氧分子。\n南極為什麼特別嚴重？\n因為極區冬季的冰晶雲提供了表面，讓非均相反應把儲存態的氯轉成活性氯。\n春天陽光一回來，就大量破壞臭氧。' },
    { t: '壞臭氧：光化學煙霧', s: '第二節', b: ['NO₂ + hν → NO + O；O + O₂ + M → O₃ + M', 'O₃ + NO → NO₂ + O₂（回收，淨零）', '單靠 NOₓ 只會達成光穩態，不會累積', '關鍵在 VOCs'],
      n: '現在看對流層的壞臭氧。\n二氧化氮光解產生一氧化氮跟氧原子，氧原子跟氧分子結合成臭氧。\n但是臭氧又會跟一氧化氮反應，變回二氧化氮。\n請注意，這是一個封閉循環。\n單靠氮氧化物只會達成光穩態，臭氧不會累積。\n那為什麼都市會有高臭氧？\n關鍵在揮發性有機物。\n下一頁我解釋這個機制。' },
    { t: 'VOCs 如何讓臭氧累積', s: '第二節', b: ['VOC + •OH → R• → RO₂•', 'RO₂• + NO → RO• + NO₂（不消耗 O₃）', '於是 O₃ 得以累積', '副產物 PAN：強眼刺激物，可長程傳輸 NOₓ'],
      n: '這是本週最重要的一頁。\n揮發性有機物被氫氧自由基攫取氫，生成烷基自由基，再跟氧結合成過氧自由基。\n請看關鍵這一步。\n過氧自由基把一氧化氮氧化成二氧化氮。\n它做了原本臭氧在做的事，但它不消耗臭氧。\n所以臭氧就累積起來了。\n副產物裡有一個很重要的物質叫過氧乙醯硝酸酯，簡稱 PAN。\n它是強烈的眼睛刺激物。\n而且在低溫下很穩定，可以把氮氧化物長程傳輸到偏遠地區。' },
    { t: '管制的反直覺陷阱', s: '第二節', b: ['VOC 限制區：削減 NOₓ 反而可能使 O₃ 上升', '因為少了 NO 對 O₃ 的滴定', 'NOₓ 限制區：削減 NOₓ 才有效', '都會臭氧管制必須先做敏感度判斷'],
      n: '這一頁非常反直覺，但實務上極為重要。\n在都會區這類揮發性有機物限制的區域，削減氮氧化物反而可能讓臭氧上升。\n為什麼？\n因為一氧化氮本來會滴定掉一部分臭氧。\n你把氮氧化物減少了，這個滴定效果也不見了。\n在郊區跟下風處，通常是氮氧化物限制，削減氮氧化物才有效。\n所以都會區的臭氧管制必須先做敏感度判斷。\n這也是為什麼有些城市削減排放多年，臭氧卻不降反升。' },
    { t: '氣膠的三個模態', s: '第三節', b: ['核模態 < 0.1 µm：氣體成核，數量多但質量小', '累積模態 0.1–2.5 µm：壽命最長、可長程傳輸、深入肺泡', '粗模態 > 2.5 µm：機械破碎，重力快速沉降', 'PM₂.₅ 的主體就是累積模態'],
      n: '第三節談粒狀物。\n大氣粒狀物依生成機制形成三個模態。\n核模態小於零點一微米，是氣體成核新生成的，數量最多但質量極小。\n累積模態介於零點一到二點五微米。\n這一區最麻煩。\n它既不容易沉降，也不容易被攔截，大氣壽命可以到數天甚至數週。\n所以可以長程傳輸，而且最能深入肺泡。\n細懸浮微粒的主體就是這一區。\n粗模態大於二點五微米，是機械破碎產生的，靠重力很快就沉降了。' },
    { t: '二次氣膠：看不見的排放', s: '第三節', b: ['硫酸鹽：SO₂ → H₂SO₄ → (NH₄)₂SO₄', '硝酸鹽：NO₂ + •OH → HNO₃ → NH₄NO₃', '二次有機氣膠：VOCs 氧化後凝結', '削減 NH₃（農業源）也能有效降低 PM₂.₅'],
      n: '這一頁解釋一個常見的困惑。\n細懸浮微粒中往往超過一半不是排出來的，而是在大氣中生成的。\n二氧化硫被氧化成硫酸，再跟氨結合成硫酸銨。\n二氧化氮被氫氧自由基氧化成硝酸，再跟氨結合成硝酸銨。\n揮發性有機物氧化之後生成低揮發性產物，凝結成二次有機氣膠。\n所以上風處沒有煙囪，下風處還是可能有高濃度。\n而且請注意最後一點。\n削減農業來源的氨，也能有效降低細懸浮微粒。\n因為銨是成鹽的必要夥伴。' },
    { t: '控制設備怎麼選：看粒徑', s: '第三節', b: ['重力沉降室 > 50 µm；旋風 5–50 µm', '濕式洗滌塔：可兼除氣態污染物，但產生廢水', '靜電集塵器：次微米效率 > 99%，受電阻率影響', '袋式集塵器：細粒效率最高最穩定', '末端設備只是把污染從氣相移到固相或水相'],
      n: '最後談控制設備。\n選型的第一原則是看粒徑。\n重力沉降室只能處理五十微米以上，通常當預處理。\n旋風集塵器處理五到五十微米，構造簡單耐高溫，但對細懸浮微粒幾乎無效。\n濕式洗滌塔可以同時去除氣態污染物，但會產生廢水。\n靜電集塵器對次微米粒子效率超過九成九，壓損低，但受粉塵電阻率影響很大。\n袋式集塵器對細粒效率最高也最穩定。\n最後我要提醒，所有末端設備都只是把污染物從氣相移到固相或水相。\n真正的解答還是在燃料替換跟製程改善。' },
    { t: '本週小結與作業', s: '小結', b: ['逆溫＝混合層降低＝濃度上升，未必是排放增加', '•OH 決定大氣壽命；VOCs 讓 O₃ 得以累積', 'PM₂.₅ 一半以上是二次生成', '本節：參訪口頭報告＋期末行動期中檢核'],
      n: '今天的重點收攏成三句話。\n第一，逆溫讓混合層降低，濃度就上升，未必是排放增加。\n第二，氫氧自由基決定所有污染物的大氣壽命，而揮發性有機物是讓臭氧得以累積的關鍵。\n第三，細懸浮微粒有一半以上是在大氣中二次生成的。\n接下來我們進行參訪口頭報告，每組八分鐘。\n聽報告的同學請完成同儕回饋單。\n報告結束後做期末行動的期中檢核。\n以上是本週報告，謝謝老師，謝謝同學。' }
  ],
  quiz: [
    { q: '平流層溫度隨高度上升的主要原因是？', o: ['地面輻射加熱', '臭氧吸收紫外線並放出熱量', '水氣凝結釋放潛熱', '氮氣吸收紅外線'], a: 1, e: '平流層中 O₃ 吸收 UV 並將能量轉為熱，使溫度隨高度上升；此「上熱下冷」結構極為穩定，因此進入平流層的物質可滯留數年。' },
    { q: '某地混合層高度由 1000 m 降至 250 m，若排放量不變，污染物濃度大約變為原來的？', o: ['1/4 倍', '相同', '4 倍', '16 倍'], a: 2, e: '在簡化的箱型模式中，濃度與混合層高度成反比。1000/250 ＝ 4，故濃度約上升 4 倍。這說明空品惡化常來自氣象條件而非排放突增。' },
    { q: '對流層中 •OH 的主要生成途徑為？', o: ['H₂O + hν 直接光解', 'O₃ 光解生成 O(¹D)，再與 H₂O 反應生成 2 •OH', 'NO₂ 與水反應', 'CH₄ 氧化'], a: 1, e: 'O₃ + hν(λ<320 nm) → O(¹D) + O₂；O(¹D) + H₂O → 2•OH。•OH 濃度雖僅約 10⁶ molecules/cm³，卻主宰了絕大多數污染物的去除速率。' },
    { q: 'CFCs 能到達平流層破壞臭氧的關鍵原因是？', o: ['分子量大易下沉', '缺乏可被 •OH 攫取的 C–H 鍵，對流層壽命長達數十年', '極易溶於水', '會被植物吸收後釋放'], a: 1, e: '全鹵化的 CFCs 無 C–H 鍵，也不易光解或溶於水，因此躲過對流層的所有去除機制，得以緩慢輸送至平流層，被短波 UV 打斷後釋出 Cl 原子。' },
    { q: '氯觸媒破壞臭氧的循環 Cl + O₃ → ClO + O₂；ClO + O → Cl + O₂，其淨反應為？', o: ['O₃ + O → 2O₂，且 Cl 未被消耗', '2O₃ → 3O₂，Cl 被消耗', 'Cl + O₃ → ClO₃', '無淨反應'], a: 0, e: '兩式相加，ClO 與 Cl 抵消，淨反應為 O₃ + O → 2O₂。Cl 為觸媒不被消耗，故單一 Cl 原子可破壞上萬個 O₃ 分子。' },
    { q: '光化學煙霧中，若只有 NOₓ 而無 VOCs，臭氧為何無法大量累積？', o: ['NO₂ 不會光解', 'O₃ 會被 NO 滴定回 NO₂，形成封閉的光穩態循環', 'O₂ 濃度不足', '缺乏紫外線'], a: 1, e: 'NO₂ 光解生成的 O₃ 會與 NO 反應回復 NO₂，淨產量為零。VOCs 經 •OH 攫取形成 RO₂•，改由 RO₂• 將 NO 氧化為 NO₂ 而不消耗 O₃，臭氧才得以累積。' },
    { q: '在 VOC 限制（VOC-limited）的都會區削減 NOₓ，最可能的短期結果是？', o: ['O₃ 明顯下降', 'O₃ 可能不降反升，因為少了 NO 對 O₃ 的滴定', 'PM₂.₅ 立即歸零', 'O₃ 完全不變'], a: 1, e: '此為著名的臭氧管制反直覺現象。在 VOC 限制區，NOₓ 減少反而降低了 NO 滴定 O₃ 的作用，使 O₃ 上升；必須先以敏感度分析判斷屬 VOC 或 NOₓ 限制再訂策略。' },
    { q: '大氣粒狀物中「累積模態（0.1–2.5 µm）」最受關注的原因是？', o: ['質量最小，容易被忽略', '既不易重力沉降也不易被攔截，大氣壽命長、可長程傳輸，且能深入肺泡', '只在工業區出現', '不含任何化學成分'], a: 1, e: '該粒徑範圍的沉降速度極慢、慣性攔截效率低，壽命可達數天至數週；同時其空氣動力粒徑使其能沉積於肺泡，是 PM₂.₅ 健康風險的主體。' },
    { q: '為何削減農業來源的 NH₃ 也能有效降低 PM₂.₅？', o: ['NH₃ 本身就是 PM₂.₅ 的主要成分', 'NH₃ 是硫酸鹽與硝酸鹽形成銨鹽顆粒的必要夥伴，減少 NH₃ 可抑制二次無機氣膠生成', 'NH₃ 會吸收陽光', 'NH₃ 會提高混合層高度'], a: 1, e: 'H₂SO₄ 與 HNO₃ 需與 NH₃ 中和形成 (NH₄)₂SO₄、NH₄NO₃ 才成為穩定顆粒。削減 NH₃ 可直接壓抑二次無機氣膠，這也是農業與空品政策的交會點。' },
    { q: '若欲同時去除燃煤鍋爐煙氣中的 SO₂ 與部分粒狀物，下列設備何者<b>最合適</b>？', o: ['重力沉降室', '旋風集塵器', '濕式洗滌塔', '簡易擋板'], a: 2, e: '濕式洗滌塔以鹼性洗滌液同時吸收 SO₂ 並洗除顆粒；缺點是產生廢水（需後續處理）且壓損與能耗較高。若僅需高效除細粒，ESP 或袋式集塵器更佳。' }
  ],
  hw: '參訪口頭報告（本週第三節）；期末行動期中檢核並於本週內繳交修正版計畫書摘要一頁；預習 11E Ch10、Ch11；完成本週線上練習。'
};

  ],
  cards: [
    { h: '一氧化碳：沉默的競爭者', b: 'CO 主要來自不完全燃燒（交通、生質燃燒、家庭爐具）。其毒性機制是<b>競爭性結合</b>：血紅素對 CO 的親和力約為對 O<sub>2</sub> 的 200–250 倍，形成碳氧血紅素（COHb）後不僅減少攜氧量，還使氧解離曲線左移，讓組織更難取得氧。<br>大氣中的去除主要靠 <span class="fx">•</span>OH：<div class="eq">CO + <span class="fx">•</span>OH <span class="fx">→</span> CO<sub>2</sub> + H<span class="fx">•</span></div>壽命約 1–2 個月，屬區域尺度污染物。<br>控制對策：三元觸媒轉換器（同時處理 CO、HC、NO<sub>x</sub>）需在<b>接近理論空燃比（λ ≒ 1）</b>下運作，這也是為什麼引擎冷車階段排放最高——觸媒尚未達到起燃溫度。' },
    { h: '二氧化硫與硫循環', b: 'SO<sub>2</sub> 主要來自含硫燃料燃燒與冶金。大氣中的氧化有兩條路：<br>• <b>氣相</b>：SO<sub>2</sub> + <span class="fx">•</span>OH → HSO<sub>3</sub><span class="fx">•</span> → …→ H<sub>2</sub>SO<sub>4</sub>（速率慢，天尺度）。<br>• <b>液相（雲滴中）</b>：被 H<sub>2</sub>O<sub>2</sub> 或 O<sub>3</sub> 氧化，速率快得多，且 H<sub>2</sub>O<sub>2</sub> 路徑不受 pH 限制——<b>這是酸雨形成的主力</b>。<br>控制：<br>① 燃料脫硫（源頭）。<br>② 石灰石濕式脫硫（FGD）：<div class="eq">CaCO<sub>3</sub> + SO<sub>2</sub> + ½O<sub>2</sub> + 2H<sub>2</sub>O <span class="fx">→</span> CaSO<sub>4</sub>·2H<sub>2</sub>O + CO<sub>2</sub></div>副產物石膏可作建材，是<b>工業生態的典型案例</b>。<br>③ 流體化床燃燒：在爐內直接加石灰石固硫。' },
    { h: '酸雨的化學與數字', b: '<b>純水不是 pH 7</b>：與大氣 CO<sub>2</sub> 平衡的雨水，理論 pH ≒ 5.6。因此判定酸雨的門檻常設在 pH &lt; 5.0（我國以 pH &lt; 5.0 為酸雨定義）。<br>主要酸化物種：<div class="eq">SO<sub>2</sub> <span class="fx">→</span> H<sub>2</sub>SO<sub>4</sub>（強酸，兩個 H<sup>+</sup>）<br>NO<sub>2</sub> + <span class="fx">•</span>OH <span class="fx">→</span> HNO<sub>3</sub>（強酸）</div>環境效應鏈：土壤鹽基陽離子（Ca<sup>2+</sup>、Mg<sup>2+</sup>）被淋洗 → 交換位被 H<sup>+</sup>／Al<sup>3+</sup> 佔據 → <b>Al<sup>3+</sup> 溶出傷害根系與魚鰓</b> → 森林衰退與水域生物死亡。<br>緩衝能力取決於地質：石灰岩地區幾乎不受影響，花崗岩／砂岩地區則極敏感。<br><b>台灣的特殊性</b>：海鹽氣膠提供的鹼度與長程傳輸的沙塵，都會影響雨水酸鹼判讀，因此僅看 pH 不夠，必須同時看陰陽離子組成。', local: '花蓮連結：花蓮空氣中海鹽氣膠比例高，雨水常帶較高 Na⁺、Cl⁻ 與中和能力，是討論「pH 之外還要看什麼」的好樣本。' },
    { h: '氮氧化物與氨', b: '<b>NO<sub>x</sub></b>：燃燒生成 NO（占九成以上），大氣中被 O<sub>3</sub> 或 RO<sub>2</sub><span class="fx">•</span> 氧化成 NO<sub>2</sub>，最終形成 HNO<sub>3</sub> 與硝酸鹽氣膠。它同時是<b>臭氧前驅物</b>與<b>PM<sub>2.5</sub> 前驅物</b>，是空品管制的核心。<br>控制：低氮燃燒（源頭）＋選擇性催化還原（SCR）<div class="eq">4NO + 4NH<sub>3</sub> + O<sub>2</sub> <span class="fx">→</span> 4N<sub>2</sub> + 6H<sub>2</sub>O</div>注意 SCR 若氨注入過量會造成<b>氨洩漏（ammonia slip）</b>，反而增加 PM<sub>2.5</sub> 前驅物，需精密控制。<br><b>NH<sub>3</sub></b>：大氣中<u>唯一</u>常見的鹼性氣體，主要來自畜牧糞尿與施肥。它中和 H<sub>2</sub>SO<sub>4</sub>／HNO<sub>3</sub> 形成銨鹽顆粒——<b>一方面降低雨水酸度，另一方面卻增加 PM<sub>2.5</sub></b>。這是典型的「污染物之間會互相反應」的例子，也是單一污染物管制思維的破口。' },
    { h: '大氣有機物：從萜烯到 HAPs', b: '大氣中的有機物來源分兩塊：<br>• <b>人為源（AVOCs）</b>：溶劑揮發、加油站逸散、燃燒未燃燒完全、工業製程。<br>• <b>生物源（BVOCs）</b>：植物釋放的異戊二烯（isoprene, C<sub>5</sub>H<sub>8</sub>）與單萜烯，全球排放量其實遠大於人為源。森林的「芬多精」正是這類物質。<br>反應性差異極大：以 <span class="fx">•</span>OH 反應速率常數看，甲烷極慢、烯類與芳香烴極快。因此臭氧生成潛勢（OFP／MIR）並非只看濃度，還要看<b>反應性</b>——這是 VOCs 管制優先序的科學依據。<br><b>有害空氣污染物（HAPs）</b>：苯（致白血病）、1,3-丁二烯、甲醛（致鼻咽癌）、氯乙烯（肝血管肉瘤）。它們的管制邏輯與 O<sub>3</sub>／PM 不同，是<b>以健康風險而非濃度標準</b>為核心。' },
    { h: '二次有機氣膠（SOA）的生成', b: 'BVOCs 與 AVOCs 被 <span class="fx">•</span>OH、O<sub>3</sub> 或 NO<sub>3</sub><span class="fx">•</span> 氧化後，分子中加入 –OH、–COOH、–NO<sub>3</sub> 等官能基，<b>蒸氣壓大幅下降</b>，因而凝結或分配到既有顆粒上，形成 SOA。<br>三個判斷原則：<br>① 碳數愈多、氧化程度愈高 → 蒸氣壓愈低 → 愈易成 SOA。<br>② 高 NO<sub>x</sub> 條件下生成有機硝酸酯，低 NO<sub>x</sub> 條件下走過氧化氫路徑，產物分布不同。<br>③ 濕度與既有顆粒表面積會顯著影響分配。<br>SOA 可佔都會 PM<sub>2.5</sub> 有機碳的一半以上，且<b>傳統排放清冊幾乎抓不到它</b>——因為它不是被排放的，是被生成的。這正是空品模式最大的不確定來源之一。' },
    { h: 'AI 課程倫理規範 II：查證與標註的實作', b: '第 1 週講原則，這一週講<b>操作</b>。請把以下四步當成 SOP：<br>① <b>分離事實與生成</b>：把 AI 輸出中的「數字、法規、文獻、專有名詞」全部標記出來，其餘視為草稿文字。<br>② <b>回到一手來源</b>：數據找原始統計或期刊、法規找全國法規資料庫或環境部公告、文獻找 DOI。<b>找不到 DOI 或官方頁面的一律刪除</b>。<br>③ <b>標註版本與日期</b>：資料有版本（如空氣品質標準修正日期），必須寫明擷取日期。<br>④ <b>撰寫 AI 使用聲明</b>：格式為「本作業使用〇〇（版本）協助〔用途〕。所有數據與文獻均由作者回查〔來源〕確認，錯誤由作者負責。」<br><b>本課程不禁止 AI，禁止的是不可查證的內容。</b>另外提醒：不得將他人個資、未公開資料或含機敏內容上傳至任何 AI 服務。' },
    { h: 'AI 模組活動 I：公開資料、API 與 Prompt-driven Notebook', b: '<b>目標</b>：用自然語言驅動的方式，取得一份真實的環境資料並完成基本檢查。<br><b>步驟</b>：<br>① 到環境部環境資料開放平臺找一個你關心的測站與項目（如花蓮測站的 PM<sub>2.5</sub> 小時值）。<br>② 閱讀該資料集的說明：欄位意義、單位、更新頻率、缺值代碼。<b>這一步不能用 AI 代勞</b>。<br>③ 用 AI 協助撰寫讀取與整理的程式碼（Colab／本機皆可），並要求它<u>先列出假設</u>再寫程式。<br>④ 完成四項基本檢查：資料筆數、時間連續性、缺值比例、極端值合理性。<br>⑤ 把 AI 產生的程式碼<b>逐行讀懂</b>，在學習單上用自己的話說明其中兩行。<br><b>安全提醒</b>：任何 API 金鑰、帳號密碼一律不得寫入筆記本、不得貼入對話、不得上傳到雲端硬碟或版本庫。需要金鑰的資料集本次課程一律不使用。' },
    { h: '本週學習單與交件', b: '<b>學習單</b>：「AI 模組活動 I 學習單」（見本頁下方連結），內含資料集描述、四項檢查結果、兩行程式碼的自述說明、以及 AI 使用聲明欄。<br><b>交件</b>：課後 7 日內上傳 PDF 至 Zuvio；程式碼以純文字或 .ipynb 附上（<b>不得含任何金鑰</b>）。<br><b>評分</b>：資料理解 30%、檢查完整性 30%、程式碼自述 20%、AI 聲明與可查證性 20%。<br><b>常見扣分</b>：① 沒讀資料集說明就開始寫程式；② 缺值當成 0 直接平均；③ 把 −999 之類的缺值代碼當成真實測值；④ AI 聲明寫「有使用 AI」但沒說明用途與查證方式。' }
  ],
  slides: [
    { t: '環境化學　第 13 週', s: '封面', cover: true, b: ['大氣化學 II：無機與有機空氣污染物', 'AI 倫理規範 II｜AI 模組活動 I', '國立東華大學　自然資源與環境學系'],
      n: '老師好，各位同學好。\n上週我們建立了大氣的物理背景跟光化學骨架。\n今天把個別污染物填進去。\n第一節談一氧化碳、二氧化硫跟酸雨。\n第二節談氮氧化物、氨，還有大氣有機物與二次有機氣膠。\n第三節是人工智慧倫理規範的第二部分，還有第一次人工智慧模組活動。\n請帶筆電或平板的同學把電源準備好。' },
    { t: '一氧化碳：競爭性結合', s: '第一節', b: ['來源：不完全燃燒（交通、生質燃燒、爐具）', '血紅素對 CO 親和力是 O₂ 的 200–250 倍', '不只減少攜氧，還使氧解離曲線左移', '去除：CO + •OH →（經 HOCO• 中間體）→ CO₂ + HO₂•，壽命 1–2 個月'],
      n: '先談一氧化碳。\n它主要來自不完全燃燒，交通、生質燃燒跟家庭爐具。\n它的毒性機制是競爭性結合。\n血紅素對一氧化碳的親和力，是對氧氣的兩百到兩百五十倍。\n所以形成碳氧血紅素之後，攜氧量大幅下降。\n更麻煩的是它還會讓氧解離曲線左移。\n意思是剩下那些氧氣，也更難在組織端釋放出來。\n在大氣中它靠氫氧自由基去除，壽命大約一到兩個月，屬於區域尺度污染物。' },
    { t: '三元觸媒與冷車排放', s: '第一節', b: ['三元觸媒同時處理 CO、HC、NOₓ', '必須在接近理論空燃比（λ ≒ 1）運作', '冷車階段觸媒未達起燃溫度 → 排放最高', '所以短程頻繁啟動的行程污染最嚴重'],
      n: '這一頁講控制。\n三元觸媒轉換器可以同時處理一氧化碳、碳氫化合物跟氮氧化物。\n但它有個嚴格條件，必須在接近理論空燃比的窄窗口內運作。\n所以車上要有含氧感知器持續回饋。\n另外請大家注意一件生活化的事。\n冷車剛發動的時候，觸媒還沒達到起燃溫度，幾乎沒有作用。\n所以排放最高。\n這代表短程、頻繁啟動的行程，單位里程污染反而最嚴重。' },
    { t: '二氧化硫的兩條氧化路徑', s: '第一節', b: ['氣相：SO₂ + •OH → … → H₂SO₄（慢，天尺度）', '液相：雲滴中被 H₂O₂ 或 O₃ 氧化（快得多）', 'H₂O₂ 路徑不受 pH 限制 → 酸雨形成主力', '控制：燃料脫硫、石灰石濕式脫硫、流體化床固硫'],
      n: '接下來是二氧化硫。\n它在大氣中的氧化有兩條路。\n氣相路徑靠氫氧自由基，速率慢，是天的尺度。\n液相路徑發生在雲滴裡，被雙氧水或臭氧氧化，快得多。\n特別要記住，雙氧水這條路徑不受酸鹼值限制。\n所以即使雲滴已經變酸，它還是繼續進行。\n這是酸雨形成的主力。\n控制對策有三種，燃料脫硫、石灰石濕式脫硫，還有流體化床爐內固硫。' },
    { t: '脫硫石膏：工業生態的案例', s: '第一節', b: ['CaCO₃ + SO₂ + ½O₂ + 2H₂O → CaSO₄·2H₂O + CO₂', '副產物石膏可作建材（石膏板、水泥緩凝劑）', '把污染物變成產品，而不是廢棄物', '呼應第二週的 Kalundborg 案例'],
      n: '這一頁我要特別停一下。\n石灰石濕式脫硫的產物是二水硫酸鈣，也就是石膏。\n它不是廢棄物，是可以直接賣的建材。\n可以做石膏板，也可以當水泥的緩凝劑。\n請大家回想第二週講的丹麥卡倫堡。\n那裡發電廠的脫硫石膏就是送去石膏板廠。\n這就是工業生態學的實例。\n把污染物變成產品，而不是變成另一種廢棄物。\n這也是評估防制設備時應該問的問題。' },
    { t: '酸雨：純水不是 pH 7', s: '第一節', b: ['與大氣 CO₂ 平衡的雨水，理論 pH ≒ 5.6', '我國酸雨定義：pH < 5.0', '主要酸化物種：H₂SO₄（兩個 H⁺）、HNO₃', '效應鏈：鹽基淋洗 → Al³⁺ 溶出 → 傷根系與魚鰓'],
      n: '談酸雨一定要先澄清一件事。\n純水在大氣中不是酸鹼值七。\n因為它會跟二氧化碳平衡，理論值大約是五點六。\n所以判定酸雨的門檻通常設在五點零，我國也是這樣定義。\n主要的酸化物種是硫酸跟硝酸。\n硫酸特別厲害，因為它可以放出兩個氫離子。\n環境效應是一連串的。\n土壤的鹽基陽離子被淋洗掉，交換位被氫離子跟鋁離子佔據。\n鋁離子溶出來，會傷害植物根系跟魚鰓。' },
    { t: '只看 pH 是不夠的', s: '第一節', b: ['緩衝能力取決於地質：石灰岩區幾乎不受影響', '花崗岩、砂岩區極敏感', '台灣：海鹽氣膠與長程沙塵會中和雨水', '必須同時看陰陽離子組成'],
      n: '這一頁是判讀酸雨資料的關鍵提醒。\n同樣的酸沉降量，不同地質的後果差很多。\n石灰岩地區有大量碳酸鈣可以中和，幾乎不受影響。\n花崗岩跟砂岩地區缺乏緩衝，就極為敏感。\n台灣還有一個特殊性。\n海鹽氣膠跟長程傳輸的沙塵都帶鹼性，會中和雨水。\n所以只看酸鹼值可能低估了酸沉降的量。\n必須同時看陰陽離子組成，才知道到底降了多少硫酸鹽跟硝酸鹽。' },
    { t: '氮氧化物：一個污染物、兩個角色', s: '第二節', b: ['燃燒生成 NO 佔九成以上，再氧化成 NO₂', '既是臭氧前驅物，也是 PM₂.₅ 前驅物', 'SCR：4NO + 4NH₃ + O₂ → 4N₂ + 6H₂O', '氨注入過量 → 氨洩漏，反而增加 PM₂.₅ 前驅物'],
      n: '第二節從氮氧化物開始。\n燃燒直接生成的九成以上是一氧化氮，在大氣中才被氧化成二氧化氮。\n它在空品管制上地位特殊，因為它同時是兩種污染物的前驅物。\n既是臭氧前驅物，也是細懸浮微粒前驅物。\n控制上，源頭是低氮燃燒，後處理是選擇性催化還原。\n請看這個反應式，用氨把一氧化氮還原成氮氣跟水。\n但要注意，氨注入過量會造成氨洩漏。\n跑出去的氨反而變成細懸浮微粒的前驅物，所以要精密控制。' },
    { t: '氨：大氣中唯一常見的鹼性氣體', s: '第二節', b: ['來源：畜牧糞尿、施肥', '中和 H₂SO₄、HNO₃ 形成銨鹽顆粒', '一方面降低雨水酸度', '另一方面增加 PM₂.₅', '單一污染物管制思維的破口'],
      n: '氨很值得單獨講一頁。\n它是大氣中唯一常見的鹼性氣體。\n主要來自畜牧糞尿跟施肥。\n它會中和硫酸跟硝酸，形成硫酸銨跟硝酸銨顆粒。\n請注意這件事的兩面性。\n一方面它降低了雨水的酸度，看起來是好事。\n另一方面它把氣態污染物轉成了固態顆粒，增加細懸浮微粒。\n所以這是單一污染物管制思維的破口。\n污染物之間會互相反應，必須整體來看。' },
